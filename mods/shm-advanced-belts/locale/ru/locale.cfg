[mod-name]
shm-advanced-belts=Advanced Belts

[mod-description]
shm-advanced-belts=Четыре тира конвейеров после турбо: 90, 105, 135 и 150 предм./с, с подземными конвейерами, разделителями и погрузчиками AAI. Настраиваются скорости, длина подземных конвейеров и цена погрузчиков AAI; стопки на ленте и режим полной стопки у каждого погрузчика. Чистый Space Age, с API для других модов.

