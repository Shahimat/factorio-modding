[mod-setting-name]
shm-advanced-belts-tier-enabled=__1__: включён
shm-advanced-belts-tier-speed=__1__: скорость, предм./с
shm-advanced-belts-tier-underground=__1__: длина подземного конвейера
shm-advanced-belts-aai-price-divisor=Делитель цены погрузчиков AAI
shm-advanced-belts-loader-stacking=Стопки на ленте у всех погрузчиков
shm-advanced-belts-full-stack=Режим полной стопки у погрузчиков
shm-advanced-belts-full-stack-default=Новые погрузчики ждут полную стопку

[mod-setting-description]
shm-advanced-belts-tier-enabled=Тир, его технология и погрузчик AAI существуют. Выключенный тир пропускается: следующий собирается из предыдущего.
shm-advanced-belts-tier-speed=Скорость конвейера, подземного конвейера, разделителя и погрузчика AAI этого тира. В списке только кратные 15: игра хранит скорость конвейера с шагом 1,875 предм./с.
shm-advanced-belts-tier-underground=Наибольшее расстояние под землёй, в клетках.
shm-advanced-belts-aai-price-divisor=Только в режиме «expensive» AAI Loaders: каждый ингредиент каждого рецепта погрузчика AAI делится на это число с округлением вверх. Погрузчики среди ингредиентов не делятся. 1 — цены AAI Loaders без изменений.
shm-advanced-belts-loader-stacking=Любой погрузчик кладёт на ленту стопки, размер стопки задаётся в его окне. Выключено — мод стопки не трогает, у AAI Loaders работает его собственная настройка.
shm-advanced-belts-full-stack=Погрузчик в этом режиме кладёт предметы на ленту только полными стопками. Переключается на каждом погрузчике: SHIFT + M или переключатель рядом с его окном.
shm-advanced-belts-full-stack-default=Режим погрузчика при постройке. Выключено — погрузчики кладут сразу, пока их не переключат.

[controls]
shm-advanced-belts-full-stack-toggle=Режим полной стопки погрузчика

