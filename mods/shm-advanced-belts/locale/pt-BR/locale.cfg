[mod-setting-description]
shm-advanced-belts-tier-enabled=O nível, sua tecnologia e seu carregador AAI existem. Um nível desativado é pulado: o próximo é feito a partir do anterior.
shm-advanced-belts-tier-speed=Velocidade da esteira, da esteira subterrânea, do separador e do carregador AAI do nível. Só múltiplos de 15 são oferecidos: o jogo guarda a velocidade das esteiras em passos de 1,875 itens/s.
shm-advanced-belts-tier-underground=Distância subterrânea máxima, em blocos.
shm-advanced-belts-aai-price-divisor=Só no modo "expensive" do AAI Loaders: cada ingrediente de cada receita de carregador AAI é dividido por este número, arredondando para cima. Carregadores entre os ingredientes não são divididos. 1 mantém os preços do AAI Loaders.
shm-advanced-belts-loaders-in-belt-technologies=Cada carregador AAI — do próprio AAI, deste mod e de outros mods — é desbloqueado pela tecnologia da sua esteira, sem tecnologia própria. No modo "lubricated" um carregador pode ser desbloqueado antes do lubrificante e fica parado sem ele.
shm-advanced-belts-loader-stacking=Qualquer carregador pode pôr pilhas na esteira, o tamanho da pilha é ajustado na sua janela. Desativado: o mod não mexe nas pilhas e o AAI Loaders usa sua própria configuração.
shm-advanced-belts-full-stack=Um carregador neste modo só põe itens na esteira em pilhas completas. Alterna-se em cada carregador com SHIFT + M ou um interruptor ao lado da sua janela.
shm-advanced-belts-full-stack-default=Modo dos carregadores ao serem construídos. Desativado: os carregadores põem na hora até serem alternados.

[controls]
shm-advanced-belts-full-stack-toggle=Alternar o modo de pilha completa do carregador

