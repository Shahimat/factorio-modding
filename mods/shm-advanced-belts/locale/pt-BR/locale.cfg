[mod-setting-name]
shm-advanced-belts-tier-enabled=__1__: ativado
shm-advanced-belts-tier-speed=__1__: velocidade, itens/s
shm-advanced-belts-tier-underground=__1__: comprimento da esteira subterrânea
shm-advanced-belts-aai-price-divisor=Divisor do preço dos carregadores AAI
shm-advanced-belts-loaders-in-belt-technologies=Carregadores AAI nas tecnologias de esteiras
shm-advanced-belts-loader-stacking=Pilhas na esteira para todos os carregadores
shm-advanced-belts-full-stack=Modo de pilha completa dos carregadores
