[mod-name]
shm-advanced-belts=Advanced Belts

[mod-description]
shm-advanced-belts=Quatro níveis de esteiras depois da superexpressa: 90, 105, 135 e 150 itens/s, com esteiras subterrâneas, separadores e carregadores AAI. Velocidades, comprimentos subterrâneos e preço dos carregadores AAI configuráveis; pilhas na esteira e modo de pilha completa para cada carregador. Space Age puro, com uma API para outros mods.

