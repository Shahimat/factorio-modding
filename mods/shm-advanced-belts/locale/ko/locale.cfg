[mod-setting-name]
shm-advanced-belts-tier-enabled=__1__: 활성화
shm-advanced-belts-tier-speed=__1__: 속도, 개/초
shm-advanced-belts-tier-underground=__1__: 지하 벨트 길이
shm-advanced-belts-aai-price-divisor=AAI 로더 가격 제수
shm-advanced-belts-loaders-in-belt-technologies=AAI 로더를 벨트 기술에 통합
shm-advanced-belts-loader-stacking=모든 로더의 벨트 스택
shm-advanced-belts-full-stack=로더의 가득 찬 스택 모드
shm-advanced-belts-full-stack-default=새 로더는 가득 찬 스택을 기다림

[mod-setting-description]
shm-advanced-belts-tier-enabled=이 단계와 그 기술, AAI 로더가 존재합니다. 비활성화된 단계는 건너뛰며, 다음 단계는 이전 단계로 만듭니다.
shm-advanced-belts-tier-speed=이 단계의 벨트, 지하 벨트, 분배기, AAI 로더 속도입니다. 15의 배수만 선택할 수 있습니다: 게임은 벨트 속도를 초당 1.875개 단위로 저장합니다.
shm-advanced-belts-tier-underground=최대 지하 거리(타일)입니다.
shm-advanced-belts-aai-price-divisor=AAI Loaders의 "expensive" 모드에서만: 모든 AAI 로더 레시피의 각 재료를 이 수로 나누고 올림합니다. 재료 중 로더는 나누지 않습니다. 1이면 AAI Loaders의 가격을 유지합니다.
shm-advanced-belts-loaders-in-belt-technologies=모든 AAI 로더(AAI 자체, 이 모드, 다른 모드)는 별도 기술 없이 벨트 기술과 함께 해금됩니다. "lubricated" 모드에서는 윤활유보다 먼저 해금될 수 있으며 윤활유가 없으면 작동하지 않습니다.
shm-advanced-belts-loader-stacking=모든 로더가 벨트에 스택을 놓을 수 있으며, 스택 크기는 창에서 설정합니다. 끄면 모드는 스택을 건드리지 않고 AAI Loaders가 자체 설정을 사용합니다.
shm-advanced-belts-full-stack=이 모드의 로더는 가득 찬 스택으로만 벨트에 아이템을 놓습니다. 각 로더에서 SHIFT + M 또는 창 옆의 스위치로 전환합니다.
shm-advanced-belts-full-stack-default=건설할 때 로더의 모드입니다. 끄면 전환하기 전까지 로더가 바로 놓습니다.

[controls]
shm-advanced-belts-full-stack-toggle=로더 가득 찬 스택 모드 전환

