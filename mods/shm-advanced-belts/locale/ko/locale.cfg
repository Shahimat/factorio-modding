[mod-name]
shm-advanced-belts=Advanced Belts

[mod-description]
shm-advanced-belts=터보 다음의 네 단계 벨트: 초당 90, 105, 135, 150개, 지하 벨트, 분배기, AAI 로더 포함. 게임의 모든 로더를 위한 기능도 제공: 벨트 스택, 로더별 가득 찬 스택 모드, expensive 모드에서 더 저렴한 AAI 로더, 벨트 기술에 통합된 AAI 로더. 단계를 끄고 로더 기능만 남길 수 있습니다. 순수 Space Age.

