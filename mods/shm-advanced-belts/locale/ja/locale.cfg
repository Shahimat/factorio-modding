[mod-name]
shm-advanced-belts=Advanced Belts

[mod-description]
shm-advanced-belts=ターボの先にある4段階のベルト：毎秒90、105、135、150アイテム。地下ベルト、分配器、AAIローダー付き。速度、地下距離、AAIローダーの価格を設定可能。すべてのローダーにベルトスタックと個別のフルスタックモード。純粋なSpace Ageで、他のMOD向けのAPIあり。

[entity-name]
shm-superior-transport-belt=スーペリア搬送ベルト
shm-superior-underground-belt=スーペリア地下ベルト
shm-superior-splitter=スーペリア分配器
shm-ultra-transport-belt=ウルトラ搬送ベルト
shm-ultra-underground-belt=ウルトラ地下ベルト
shm-ultra-splitter=ウルトラ分配器
shm-hyper-transport-belt=ハイパー搬送ベルト
shm-hyper-underground-belt=ハイパー地下ベルト
shm-hyper-splitter=ハイパー分配器
shm-absolute-transport-belt=アブソリュート搬送ベルト
shm-absolute-underground-belt=アブソリュート地下ベルト
shm-absolute-splitter=アブソリュート分配器

[technology-name]
shm-superior-transport-belt=スーペリア搬送ベルト
shm-ultra-transport-belt=ウルトラ搬送ベルト
shm-hyper-transport-belt=ハイパー搬送ベルト
shm-absolute-transport-belt=アブソリュート搬送ベルト

[technology-description]
shm-superior-transport-belt=ターボより高速な搬送ベルトです。
shm-ultra-transport-belt=ターボより高速な搬送ベルトです。
shm-hyper-transport-belt=ターボより高速な搬送ベルトです。
shm-absolute-transport-belt=ターボより高速な搬送ベルトです。

[shm-advanced-belts]
tier-superior=スーペリア
tier-ultra=ウルトラ
tier-hyper=ハイパー
tier-absolute=アブソリュート

[mod-setting-name]
shm-advanced-belts-tier-enabled=__1__：有効
shm-advanced-belts-tier-speed=__1__：速度（アイテム/秒）
shm-advanced-belts-tier-underground=__1__：地下ベルトの長さ
shm-advanced-belts-aai-price-divisor=AAIローダーの価格除数
shm-advanced-belts-loader-stacking=すべてのローダーのベルトスタック
shm-advanced-belts-full-stack=ローダーのフルスタックモード
shm-advanced-belts-full-stack-default=新しいローダーはフルスタックを待つ

[mod-setting-description]
shm-advanced-belts-tier-enabled=この段階、その技術、AAIローダーが存在します。無効な段階は飛ばされ、次の段階は前の段階から作られます。
shm-advanced-belts-tier-speed=この段階のベルト、地下ベルト、分配器、AAIローダーの速度です。15の倍数のみ選べます：ゲームはベルト速度を1.875アイテム/秒刻みで保存します。
shm-advanced-belts-tier-underground=地下の最大距離（タイル）です。
shm-advanced-belts-aai-price-divisor=AAI Loadersの「expensive」モードのみ：各AAIローダーのレシピの材料をこの数で割り、切り上げます。材料のローダーは割りません。1ならAAI Loadersの価格のままです。
shm-advanced-belts-loader-stacking=どのローダーもベルトにスタックを置けます。スタックの大きさはウィンドウで設定します。オフの場合、MODはスタックに触れず、AAI Loadersは独自の設定を使います。
shm-advanced-belts-full-stack=このモードのローダーはフルスタックでのみベルトにアイテムを置きます。各ローダーでSHIFT + Mまたはウィンドウ横のスイッチで切り替えます。
shm-advanced-belts-full-stack-default=建設時のローダーのモードです。オフの場合、切り替えるまですぐに置きます。

[controls]
shm-advanced-belts-full-stack-toggle=ローダーのフルスタックモードを切り替え

[gui]
shm-advanced-belts-caption=ベルトスタック
shm-advanced-belts-instant=すぐに
shm-advanced-belts-full=フルスタック
shm-advanced-belts-message-full=フルスタックを待ちます
shm-advanced-belts-message-instant=すぐに置きます
shm-advanced-belts-ghost=ゴーストは切り替えられません
