[mod-name]
shm-advanced-belts=Advanced Belts

[mod-description]
shm-advanced-belts=Чотири рівні конвеєрів після турбо: 90, 105, 135 і 150 предм./с, з підземними конвеєрами, розподільниками та завантажувачами AAI. Плюс можливості для всіх завантажувачів у грі: стоси на стрічці, режим повного стосу в кожного завантажувача, дешевші завантажувачі AAI в режимі expensive і завантажувачі AAI у технологіях конвеєрів. Рівні можна вимкнути й залишити лише можливості завантажувачів. Чистий Space Age.

