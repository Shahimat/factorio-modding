[mod-setting-description]
shm-advanced-belts-tier-enabled=Рівень, його технологія та завантажувач AAI існують. Вимкнений рівень пропускається: наступний виготовляється з попереднього.
shm-advanced-belts-tier-speed=Швидкість конвеєра, підземного конвеєра, розподільника та завантажувача AAI цього рівня. У списку лише кратні 15: гра зберігає швидкість конвеєра з кроком 1,875 предм./с.
shm-advanced-belts-tier-underground=Найбільша відстань під землею, у клітинках.
shm-advanced-belts-aai-price-divisor=Лише в режимі «expensive» AAI Loaders: кожен інгредієнт кожного рецепта завантажувача AAI ділиться на це число з округленням угору. Завантажувачі серед інгредієнтів не діляться. 1 — ціни AAI Loaders без змін.
shm-advanced-belts-loaders-in-belt-technologies=Кожен завантажувач AAI — самого AAI, цього мода та інших модів — відкривається технологією свого конвеєра, без окремої технології. У режимі «lubricated» завантажувач може відкритися раніше за мастило й без нього стоїть.
shm-advanced-belts-loader-stacking=Будь-який завантажувач кладе на стрічку стоси, розмір стосу задається в його вікні. Вимкнено — мод стоси не чіпає, в AAI Loaders працює його власне налаштування.
shm-advanced-belts-full-stack=Завантажувач у цьому режимі кладе предмети на стрічку лише повними стосами. Перемикається на кожному завантажувачі: SHIFT + M або перемикач біля його вікна.
shm-advanced-belts-full-stack-default=Режим завантажувача під час побудови. Вимкнено — завантажувачі кладуть одразу, доки їх не перемкнуть.

