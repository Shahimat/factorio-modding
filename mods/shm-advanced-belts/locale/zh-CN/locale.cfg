shm-superior-transport-belt=卓越物流学
shm-ultra-transport-belt=极限物流学
shm-hyper-transport-belt=超限物流学
shm-absolute-transport-belt=绝对物流学

[technology-description]
shm-superior-transport-belt=比超速传送带更快的传送带。
shm-ultra-transport-belt=比超速传送带更快的传送带。
shm-hyper-transport-belt=比超速传送带更快的传送带。
shm-absolute-transport-belt=比超速传送带更快的传送带。

[shm-advanced-belts]
tier-superior=卓越
tier-ultra=极限
tier-hyper=超限
tier-absolute=绝对

[mod-setting-name]
shm-advanced-belts-tier-enabled=__1__：启用
shm-advanced-belts-tier-speed=__1__：速度，物品/秒
shm-advanced-belts-tier-underground=__1__：地下传送带长度
shm-advanced-belts-aai-price-divisor=AAI装卸机价格除数
shm-advanced-belts-loaders-in-belt-technologies=AAI装卸机并入传送带科技
shm-advanced-belts-loader-stacking=所有装卸机的传送带堆叠
shm-advanced-belts-full-stack=装卸机满堆叠模式
shm-advanced-belts-full-stack-default=新装卸机等待满堆叠

[mod-setting-description]
shm-advanced-belts-tier-enabled=该等级、其科技和AAI装卸机存在。禁用的等级会被跳过：下一级由上一级制作。
shm-advanced-belts-tier-speed=该等级传送带、地下传送带、分流器和AAI装卸机的速度。只提供15的倍数：游戏以每秒1.875个物品为步长存储传送带速度。
shm-advanced-belts-tier-underground=最大地下距离，单位为格。
shm-advanced-belts-aai-price-divisor=仅在AAI Loaders的“expensive”模式下：每个AAI装卸机配方的每种原料都除以此数并向上取整。原料中的装卸机不除。1表示保持AAI Loaders的价格。
shm-advanced-belts-loaders-in-belt-technologies=每台AAI装卸机——AAI本身、本模组和其他模组的——都随其传送带的科技一起解锁，没有单独的科技。在“lubricated”模式下，装卸机可能先于润滑油解锁，没有润滑油时不工作。
shm-advanced-belts-loader-stacking=任何装卸机都能在传送带上放置堆叠，堆叠大小在其窗口中设置。关闭时模组不改动堆叠，AAI Loaders使用自己的设置。
shm-advanced-belts-full-stack=处于此模式的装卸机只以满堆叠向传送带放置物品。在每台装卸机上用SHIFT + M或窗口旁的开关切换。
shm-advanced-belts-full-stack-default=装卸机建造时的模式。关闭时装卸机立即放置，直到被切换。

[controls]
shm-advanced-belts-full-stack-toggle=切换装卸机满堆叠模式

[gui]
shm-advanced-belts-caption=传送带堆叠
shm-advanced-belts-instant=立即
shm-advanced-belts-full=满堆叠
shm-advanced-belts-message-full=等待满堆叠
shm-advanced-belts-message-instant=立即放置
shm-advanced-belts-ghost=无法切换虚影
