[mod-name]
shm-advanced-belts=Advanced Belts

[mod-description]
shm-advanced-belts=超速之后的四级传送带：每秒90、105、135和150个物品，包括地下传送带、分流器和AAI装卸机。另外为游戏中所有装卸机提供功能：传送带堆叠、逐台切换的满堆叠模式、expensive模式下更便宜的AAI装卸机，以及并入传送带科技的AAI装卸机。可以关闭各级传送带，只保留装卸机功能。纯Space Age。

