[mod-name]
shm-advanced-belts=Advanced Belts

[mod-description]
shm-advanced-belts=Cztery poziomy taśmociągów po turbo: 90, 105, 135 i 150 przedmiotów/s, z podziemnymi taśmociągami, rozdzielaczami i ładowarkami AAI. Do tego funkcje dla wszystkich ładowarek w grze: stosy na taśmie, tryb pełnego stosu dla każdej ładowarki, tańsze ładowarki AAI w trybie expensive i ładowarki AAI w technologiach taśmociągów. Poziomy można wyłączyć i zostawić tylko funkcje ładowarek. Czysty Space Age.

