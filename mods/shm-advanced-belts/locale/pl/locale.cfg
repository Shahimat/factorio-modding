[mod-setting-description]
shm-advanced-belts-tier-enabled=Poziom, jego technologia i ładowarka AAI istnieją. Wyłączony poziom jest pomijany: następny powstaje z poprzedniego.
shm-advanced-belts-tier-speed=Prędkość taśmociągu, podziemnego taśmociągu, rozdzielacza i ładowarki AAI tego poziomu. Dostępne są tylko wielokrotności 15: gra przechowuje prędkość taśmy w krokach co 1,875 przedmiotu/s.
shm-advanced-belts-tier-underground=Największa odległość pod ziemią, w polach.
shm-advanced-belts-aai-price-divisor=Tylko w trybie „expensive” AAI Loaders: każdy składnik każdego przepisu ładowarki AAI jest dzielony przez tę liczbę z zaokrągleniem w górę. Ładowarki wśród składników nie są dzielone. 1 zachowuje ceny AAI Loaders.
shm-advanced-belts-loaders-in-belt-technologies=Każda ładowarka AAI — samego AAI, tego moda i innych modów — odblokowuje się technologią swojego taśmociągu, bez osobnej technologii. W trybie „lubricated” ładowarka może odblokować się przed smarem i bez niego stoi.
shm-advanced-belts-loader-stacking=Każda ładowarka może kłaść stosy na taśmę, rozmiar stosu ustawia się w jej oknie. Wyłączone: mod nie zmienia stosów, a AAI Loaders używa własnego ustawienia.
shm-advanced-belts-full-stack=Ładowarka w tym trybie kładzie przedmioty na taśmę tylko pełnymi stosami. Przełączany na każdej ładowarce: SHIFT + M lub przełącznik obok jej okna.
shm-advanced-belts-full-stack-default=Tryb ładowarek przy budowie. Wyłączone: ładowarki kładą od razu, dopóki nie zostaną przełączone.

