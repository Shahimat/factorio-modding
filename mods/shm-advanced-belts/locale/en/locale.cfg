[mod-name]
shm-advanced-belts=Advanced Belts

[mod-description]
shm-advanced-belts=Four belt tiers beyond turbo: 90, 105, 135 and 150 items/s, with undergrounds, splitters and AAI loaders. Plus loader features for every loader in the game: belt stacking, a per-loader full stack mode, cheaper AAI loaders in the expensive mode and AAI loaders in belt technologies. Tiers can be turned off to keep only the loader features. Pure Space Age.

