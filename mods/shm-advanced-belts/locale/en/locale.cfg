[mod-setting-description]
shm-advanced-belts-tier-enabled=The tier, its technology and its AAI loader exist. A disabled tier is skipped: the next tier is made from the previous one.
shm-advanced-belts-tier-speed=Speed of the belt, underground, splitter and AAI loader of the tier. Only multiples of 15 are offered: the game stores belt speed in steps of 1.875 items/s.
shm-advanced-belts-tier-underground=Maximum underground distance in tiles.
shm-advanced-belts-aai-price-divisor=Only in the "expensive" mode of AAI Loaders: every ingredient of every AAI loader recipe is divided by this number, rounded up. Loaders among ingredients are not divided. 1 keeps the prices of AAI Loaders.
shm-advanced-belts-loaders-in-belt-technologies=Every AAI loader — of AAI itself, of this mod and of other mods — is unlocked by the technology of its belt, without a separate technology. In the "lubricated" mode a loader may unlock before lubricant and stays idle without it.
shm-advanced-belts-loader-stacking=Every loader can put stacks on belts, with the stack size set in its window. When off, the mod leaves stacking alone and AAI Loaders uses its own setting.
shm-advanced-belts-full-stack=A loader in this mode puts items on the belt only as full stacks. Switched on each loader with SHIFT + M or a switch next to its window.
shm-advanced-belts-full-stack-default=Mode of loaders when built. When off, loaders put items right away until switched.

[controls]
shm-advanced-belts-full-stack-toggle=Toggle loader full stack mode

