[mod-setting-description]
shm-advanced-belts-tier-enabled=Die Stufe, ihre Technologie und ihr AAI-Lader existieren. Eine deaktivierte Stufe wird übersprungen: Die nächste Stufe wird aus der vorherigen gebaut.
shm-advanced-belts-tier-speed=Geschwindigkeit von Fließband, unterirdischem Fließband, Teilerfließband und AAI-Lader der Stufe. Nur Vielfache von 15: Das Spiel speichert die Bandgeschwindigkeit in Schritten von 1,875 Gegenständen/s.
shm-advanced-belts-tier-underground=Maximale unterirdische Entfernung in Feldern.
shm-advanced-belts-aai-price-divisor=Nur im Modus „expensive“ von AAI Loaders: Jede Zutat jedes AAI-Lader-Rezepts wird durch diese Zahl geteilt und aufgerundet. Lader unter den Zutaten werden nicht geteilt. 1 lässt die Preise von AAI Loaders unverändert.
shm-advanced-belts-loader-stacking=Jeder Lader legt Stapel auf das Band, die Stapelgröße wird in seinem Fenster eingestellt. Aus: Der Mod lässt das Stapeln unverändert, AAI Loaders nutzt seine eigene Einstellung.
shm-advanced-belts-full-stack=Ein Lader in diesem Modus legt Gegenstände nur als volle Stapel auf das Band. Umschalten an jedem Lader mit SHIFT + M oder einem Schalter neben seinem Fenster.
shm-advanced-belts-full-stack-default=Modus der Lader beim Bau. Aus: Lader legen sofort ab, bis sie umgeschaltet werden.

[controls]
shm-advanced-belts-full-stack-toggle=Vollstapel-Modus des Laders umschalten

