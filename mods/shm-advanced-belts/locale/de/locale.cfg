[mod-name]
shm-advanced-belts=Advanced Belts

[mod-description]
shm-advanced-belts=Vier Fließband-Stufen nach Turbo: 90, 105, 135 und 150 Gegenstände/s, mit unterirdischen Fließbändern, Teilerfließbändern und AAI-Ladern. Einstellbare Geschwindigkeiten, Untergrundlängen und AAI-Laderpreise; Stapel auf dem Band und ein Vollstapel-Modus für jeden Lader. Reines Space Age, mit einer API für andere Mods.

