[mod-setting-description]
shm-advanced-belts-tier-enabled=Le niveau, sa technologie et son chargeur AAI existent. Un niveau désactivé est sauté : le suivant est fabriqué à partir du précédent.
shm-advanced-belts-tier-speed=Vitesse du convoyeur, du convoyeur souterrain, du répartiteur et du chargeur AAI du niveau. Seuls les multiples de 15 sont proposés : le jeu stocke la vitesse des convoyeurs par pas de 1,875 objet/s.
shm-advanced-belts-tier-underground=Distance souterraine maximale, en cases.
shm-advanced-belts-aai-price-divisor=Uniquement en mode « expensive » d’AAI Loaders : chaque ingrédient de chaque recette de chargeur AAI est divisé par ce nombre, arrondi au supérieur. Les chargeurs parmi les ingrédients ne sont pas divisés. 1 conserve les prix d’AAI Loaders.
shm-advanced-belts-loaders-in-belt-technologies=Chaque chargeur AAI — d’AAI lui-même, de ce mod et des autres mods — est débloqué par la technologie de son convoyeur, sans technologie séparée. En mode « lubricated », un chargeur peut être débloqué avant le lubrifiant et reste à l’arrêt sans lui.
shm-advanced-belts-loader-stacking=Chaque chargeur peut poser des piles sur le convoyeur, la taille de pile se règle dans sa fenêtre. Désactivé : le mod ne touche pas aux piles et AAI Loaders utilise son propre réglage.
shm-advanced-belts-full-stack=Un chargeur dans ce mode ne pose les objets sur le convoyeur que par piles complètes. Se bascule sur chaque chargeur avec SHIFT + M ou un interrupteur à côté de sa fenêtre.
shm-advanced-belts-full-stack-default=Mode des chargeurs à la construction. Désactivé : les chargeurs posent tout de suite tant qu’ils ne sont pas basculés.

[controls]
shm-advanced-belts-full-stack-toggle=Basculer le mode pile complète du chargeur

