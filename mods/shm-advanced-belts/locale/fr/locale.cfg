[mod-name]
shm-advanced-belts=Advanced Belts

[mod-description]
shm-advanced-belts=Quatre niveaux de convoyeurs après le turbo : 90, 105, 135 et 150 objets/s, avec convoyeurs souterrains, répartiteurs et chargeurs AAI. Vitesses, longueurs souterraines et prix des chargeurs AAI réglables ; piles sur le convoyeur et mode pile complète pour chaque chargeur. Space Age pur, avec une API pour les autres mods.

