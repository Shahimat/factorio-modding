shm-advanced-belts-tier-enabled=__1__ : activé
shm-advanced-belts-tier-speed=__1__ : vitesse, objets/s
shm-advanced-belts-tier-underground=__1__ : longueur du convoyeur souterrain
shm-advanced-belts-aai-price-divisor=Diviseur du prix des chargeurs AAI
shm-advanced-belts-loaders-in-belt-technologies=Chargeurs AAI dans les technologies des convoyeurs
