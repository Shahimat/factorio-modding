[mod-setting-description]
shm-advanced-belts-tier-enabled=El nivel, su tecnología y su cargador AAI existen. Un nivel desactivado se omite: el siguiente se fabrica a partir del anterior.
shm-advanced-belts-tier-speed=Velocidad de la cinta, la cinta subterránea, el divisor y el cargador AAI del nivel. Solo se ofrecen múltiplos de 15: el juego guarda la velocidad de las cintas en pasos de 1,875 objetos/s.
shm-advanced-belts-tier-underground=Distancia subterránea máxima, en casillas.
shm-advanced-belts-aai-price-divisor=Solo en el modo «expensive» de AAI Loaders: cada ingrediente de cada receta de cargador AAI se divide entre este número, redondeando hacia arriba. Los cargadores entre los ingredientes no se dividen. 1 mantiene los precios de AAI Loaders.
shm-advanced-belts-loaders-in-belt-technologies=Cada cargador AAI — del propio AAI, de este mod y de otros mods — se desbloquea con la tecnología de su cinta, sin tecnología propia. En el modo «lubricated» un cargador puede desbloquearse antes que el lubricante y sin él se queda parado.
shm-advanced-belts-loader-stacking=Cualquier cargador puede poner pilas en la cinta, el tamaño de pila se ajusta en su ventana. Desactivado: el mod no toca las pilas y AAI Loaders usa su propio ajuste.
shm-advanced-belts-full-stack=Un cargador en este modo solo pone objetos en la cinta en pilas completas. Se cambia en cada cargador con SHIFT + M o un interruptor junto a su ventana.
shm-advanced-belts-full-stack-default=Modo de los cargadores al construirlos. Desactivado: los cargadores ponen enseguida hasta que se cambien.

[controls]
shm-advanced-belts-full-stack-toggle=Cambiar el modo de pila completa del cargador

