[mod-setting-name]
shm-advanced-belts-tier-enabled=__1__: activado
shm-advanced-belts-tier-speed=__1__: velocidad, objetos/s
shm-advanced-belts-tier-underground=__1__: longitud de la cinta subterránea
shm-advanced-belts-aai-price-divisor=Divisor del precio de los cargadores AAI
shm-advanced-belts-loaders-in-belt-technologies=Cargadores AAI en las tecnologías de cintas
