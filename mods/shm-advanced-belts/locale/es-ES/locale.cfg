[mod-name]
shm-advanced-belts=Advanced Belts

[mod-description]
shm-advanced-belts=Cuatro niveles de cintas después de la turbo: 90, 105, 135 y 150 objetos/s, con cintas subterráneas, divisores y cargadores AAI. Velocidades, longitudes subterráneas y precio de los cargadores AAI configurables; pilas en la cinta y modo de pila completa para cada cargador. Space Age puro.

