[mod-name]
shm-k2-superior-inserters-full-hand-switcher=Krastorio2: Superior Inserters Full Hand Switcher

[mod-description]
shm-k2-superior-inserters-full-hand-switcher=Los insertadores superiores de Krastorio 2 esperan a tener la mano llena antes de soltar, como los insertadores de apilamiento. Cada insertador puede volver a soltar al momento: SHIFT + M o el interruptor junto a su ventana.

[controls]
shm-full-hand-toggle=Alternar mano llena del insertador superior

[gui]
shm-full-hand-caption=Modo de descarga
shm-full-hand-instant=Al momento
shm-full-hand-full=Mano llena
shm-full-hand-message-full=Espera la mano llena
shm-full-hand-message-instant=Suelta al momento
shm-full-hand-ghost=No se puede alternar un fantasma

[tips-and-tricks-item-name]
shm-full-hand=Mano llena del insertador superior

[tips-and-tricks-item-description]
shm-full-hand=[entity=kr-superior-inserter] Los insertadores superiores esperan a llenar la mano antes de soltar, así que ponen pilas completas en las cintas. Para que uno suelte al momento, pasa el cursor sobre él y pulsa __CONTROL__shm-full-hand-toggle__, o cambia el interruptor a la derecha de su ventana. El modo se conserva en los planos y se copia con __CONTROL__copy-entity-settings__ y __CONTROL__paste-entity-settings__.
