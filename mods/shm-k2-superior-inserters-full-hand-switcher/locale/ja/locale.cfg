[mod-name]
shm-k2-superior-inserters-full-hand-switcher=Krastorio2: Superior Inserters Full Hand Switcher

[mod-description]
shm-k2-superior-inserters-full-hand-switcher=Krastorio 2 の神速インサーターが、スタックインサーターのように手がいっぱいになるまで待ってから置くようになります。各インサーターは SHIFT + M またはウィンドウ横のスイッチで、すぐに置く動作に戻せます。

[controls]
shm-full-hand-toggle=神速インサーターの満載モード切替

[gui]
shm-full-hand-caption=投入モード
shm-full-hand-instant=即時
shm-full-hand-full=満載
shm-full-hand-message-full=満載まで待機
shm-full-hand-message-instant=すぐに置く

[tips-and-tricks-item-name]
shm-full-hand=神速インサーターの満載モード

[tips-and-tricks-item-description]
shm-full-hand=[entity=kr-superior-inserter] 神速インサーターは手がいっぱいになるまで待ってから置くため、ベルトに満杯のスタックを載せます。すぐに置かせたい場合は、インサーターにカーソルを合わせて __CONTROL__shm-full-hand-toggle__ を押すか、ウィンドウ右側のスイッチを切り替えてください。モードはブループリントに保存され、__CONTROL__copy-entity-settings__ と __CONTROL__paste-entity-settings__ でコピーできます。
