[mod-name]
shm-k2-superior-inserters-full-hand-switcher=Krastorio2: Superior Inserters Full Hand Switcher

[mod-description]
shm-k2-superior-inserters-full-hand-switcher=Os insersores superiores do Krastorio 2 esperam a mão encher antes de soltar, como os insersores de pilha. Cada insersor pode voltar a soltar na hora: SHIFT + M ou o interruptor ao lado da sua janela.

[controls]
shm-full-hand-toggle=Alternar mão cheia do insersor superior

[gui]
shm-full-hand-caption=Modo de entrega
shm-full-hand-instant=Na hora
shm-full-hand-full=Mão cheia
shm-full-hand-message-full=Espera a mão encher
shm-full-hand-message-instant=Solta na hora
shm-full-hand-ghost=Não é possível alternar um fantasma

[tips-and-tricks-item-name]
shm-full-hand=Mão cheia do insersor superior

[tips-and-tricks-item-description]
shm-full-hand=[entity=kr-superior-inserter] Os insersores superiores esperam a mão encher antes de soltar, então colocam pilhas completas nas esteiras. Para que um solte na hora, passe o cursor sobre ele e pressione __CONTROL__shm-full-hand-toggle__, ou mude o interruptor à direita da sua janela. O modo é mantido nos projetos e copiado com __CONTROL__copy-entity-settings__ e __CONTROL__paste-entity-settings__.
