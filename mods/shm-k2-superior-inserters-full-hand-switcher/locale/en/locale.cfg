[mod-name]
shm-k2-superior-inserters-full-hand-switcher=Krastorio2: Superior Inserters Full Hand Switcher

[mod-description]
shm-k2-superior-inserters-full-hand-switcher=Krastorio 2 superior inserters wait for a full hand before dropping, like stack inserters. Each inserter can be switched back to dropping right away: SHIFT + M or the switch next to its window.

[controls]
shm-full-hand-toggle=Toggle superior inserter full hand

[gui]
shm-full-hand-caption=Drop mode
shm-full-hand-instant=Instant
shm-full-hand-full=Full hand
shm-full-hand-message-full=Waits for a full hand
shm-full-hand-message-instant=Drops right away

[tips-and-tricks-item-name]
shm-full-hand=Superior inserter full hand

[tips-and-tricks-item-description]
shm-full-hand=[entity=kr-superior-inserter] Superior inserters wait until their hand is full before dropping, so they put full stacks on belts. To make one drop right away instead, hover it and press __CONTROL__shm-full-hand-toggle__, or flip the switch to the right of its window. The mode is kept in blueprints and copied with __CONTROL__copy-entity-settings__ and __CONTROL__paste-entity-settings__.
