[mod-name]
shm-k2-superior-inserters-full-hand-switcher=Krastorio2: Superior Inserters Full Hand Switcher

[mod-description]
shm-k2-superior-inserters-full-hand-switcher=Nadrzędne podajniki z Krastorio 2 czekają na pełną rękę przed odłożeniem, jak podajniki stosowe. Każdy można przełączyć z powrotem na odkładanie od razu: SHIFT + M lub przełącznik obok jego okna.

[controls]
shm-full-hand-toggle=Przełącz pełną rękę nadrzędnego podajnika

[gui]
shm-full-hand-caption=Tryb odkładania
shm-full-hand-instant=Od razu
shm-full-hand-full=Pełna ręka
shm-full-hand-message-full=Czeka na pełną rękę
shm-full-hand-message-instant=Odkłada od razu

[tips-and-tricks-item-name]
shm-full-hand=Pełna ręka nadrzędnego podajnika

[tips-and-tricks-item-description]
shm-full-hand=[entity=kr-superior-inserter] Nadrzędne podajniki czekają, aż ręka się zapełni, i dopiero wtedy odkładają, więc kładą na taśmy pełne stosy. Aby podajnik odkładał od razu, najedź na niego kursorem i naciśnij __CONTROL__shm-full-hand-toggle__ albo przełącz przełącznik po prawej stronie jego okna. Tryb jest zachowywany w planach i kopiowany przez __CONTROL__copy-entity-settings__ i __CONTROL__paste-entity-settings__.
