[mod-name]
shm-k2-superior-inserters-full-hand-switcher=Krastorio2: Superior Inserters Full Hand Switcher

[mod-description]
shm-k2-superior-inserters-full-hand-switcher=Найліпші маніпулятори Krastorio 2 чекають на повну руку перед викладанням, як стосові. Кожен можна повернути до викладання одразу: SHIFT + M або перемикач поруч із його вікном.

[controls]
shm-full-hand-toggle=Режим повної руки найліпшого маніпулятора

[gui]
shm-full-hand-caption=Режим викладання
shm-full-hand-instant=Одразу
shm-full-hand-full=Повна рука
shm-full-hand-message-full=Чекає на повну руку
shm-full-hand-message-instant=Викладає одразу

[tips-and-tricks-item-name]
shm-full-hand=Повна рука найліпшого маніпулятора

[tips-and-tricks-item-description]
shm-full-hand=[entity=kr-superior-inserter] Найліпші маніпулятори чекають, поки рука заповниться, і лише тоді викладають — на стрічку лягають повні стоси. Щоб маніпулятор викладав одразу, наведіть на нього курсор і натисніть __CONTROL__shm-full-hand-toggle__ або клацніть перемикач праворуч від його вікна. Режим зберігається в кресленнях і копіюється разом із налаштуваннями: __CONTROL__copy-entity-settings__ і __CONTROL__paste-entity-settings__.
