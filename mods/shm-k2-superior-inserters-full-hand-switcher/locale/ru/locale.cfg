[mod-name]
shm-k2-superior-inserters-full-hand-switcher=Krastorio2: Superior Inserters Full Hand Switcher

[mod-description]
shm-k2-superior-inserters-full-hand-switcher=Превосходные манипуляторы Krastorio 2 ждут полную руку перед выкладкой, как пакетные. Каждый можно вернуть к выкладке сразу: SHIFT + M или переключатель рядом с его окном.

[controls]
shm-full-hand-toggle=Режим полной руки превосходного манипулятора

[gui]
shm-full-hand-caption=Режим выкладки
shm-full-hand-instant=Сразу
shm-full-hand-full=Полная рука
shm-full-hand-message-full=Ждёт полную руку
shm-full-hand-message-instant=Выкладывает сразу

[tips-and-tricks-item-name]
shm-full-hand=Полная рука превосходного манипулятора

[tips-and-tricks-item-description]
shm-full-hand=[entity=kr-superior-inserter] Превосходные манипуляторы ждут, пока рука заполнится, и только потом выкладывают — на ленту ложатся полные стопки. Чтобы манипулятор выкладывал сразу, наведите на него курсор и нажмите __CONTROL__shm-full-hand-toggle__ или щёлкните переключатель справа от его окна. Режим сохраняется в чертежах и копируется вместе с настройками: __CONTROL__copy-entity-settings__ и __CONTROL__paste-entity-settings__.
