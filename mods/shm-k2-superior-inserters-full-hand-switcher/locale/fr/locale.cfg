[mod-name]
shm-k2-superior-inserters-full-hand-switcher=Krastorio2: Superior Inserters Full Hand Switcher

[mod-description]
shm-k2-superior-inserters-full-hand-switcher=Les bras robotisés supérieurs de Krastorio 2 attendent d'avoir la main pleine avant de déposer, comme les bras robotisés empileurs. Chaque bras peut repasser au dépôt immédiat : SHIFT + M ou l'interrupteur à côté de sa fenêtre.

[controls]
shm-full-hand-toggle=Basculer la main pleine du bras robotisé supérieur

[gui]
shm-full-hand-caption=Mode de dépôt
shm-full-hand-instant=Immédiat
shm-full-hand-full=Main pleine
shm-full-hand-message-full=Attend la main pleine
shm-full-hand-message-instant=Dépose immédiatement

[tips-and-tricks-item-name]
shm-full-hand=Main pleine du bras robotisé supérieur

[tips-and-tricks-item-description]
shm-full-hand=[entity=kr-superior-inserter] Les bras robotisés supérieurs attendent que leur main soit pleine avant de déposer, et posent ainsi des piles complètes sur les convoyeurs. Pour qu'un bras dépose immédiatement, survolez-le et appuyez sur __CONTROL__shm-full-hand-toggle__, ou basculez l'interrupteur à droite de sa fenêtre. Le mode est conservé dans les plans et copié avec __CONTROL__copy-entity-settings__ et __CONTROL__paste-entity-settings__.
