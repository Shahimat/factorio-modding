[mod-name]
shm-k2-superior-inserters-full-hand-switcher=Krastorio2: Superior Inserters Full Hand Switcher

[mod-description]
shm-k2-superior-inserters-full-hand-switcher=Die hochwertigen Greifarme von Krastorio 2 warten vor dem Ablegen auf eine volle Hand, wie Stapelgreifarme. Jeder Greifarm lässt sich wieder auf sofortiges Ablegen umschalten: SHIFT + M oder der Schalter neben seinem Fenster.

[controls]
shm-full-hand-toggle=Volle Hand des hochwertigen Greifarms umschalten

[gui]
shm-full-hand-caption=Ablegemodus
shm-full-hand-instant=Sofort
shm-full-hand-full=Volle Hand
shm-full-hand-message-full=Wartet auf volle Hand
shm-full-hand-message-instant=Legt sofort ab

[tips-and-tricks-item-name]
shm-full-hand=Volle Hand des hochwertigen Greifarms

[tips-and-tricks-item-description]
shm-full-hand=[entity=kr-superior-inserter] Hochwertige Greifarme warten, bis ihre Hand voll ist, bevor sie ablegen, und legen so volle Stapel auf Förderbänder. Damit ein Greifarm sofort ablegt, zeige auf ihn und drücke __CONTROL__shm-full-hand-toggle__ oder lege den Schalter rechts neben seinem Fenster um. Der Modus bleibt in Blaupausen erhalten und wird mit __CONTROL__copy-entity-settings__ und __CONTROL__paste-entity-settings__ übertragen.
