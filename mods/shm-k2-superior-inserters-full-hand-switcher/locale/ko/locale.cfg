[mod-name]
shm-k2-superior-inserters-full-hand-switcher=Krastorio2: Superior Inserters Full Hand Switcher

[mod-description]
shm-k2-superior-inserters-full-hand-switcher=Krastorio 2의 극고속 투입기가 묶음 투입기처럼 손이 가득 찰 때까지 기다렸다가 내려놓습니다. 각 투입기는 SHIFT + M 또는 창 옆의 스위치로 즉시 내려놓기로 되돌릴 수 있습니다.

[controls]
shm-full-hand-toggle=극고속 투입기 가득 채우기 전환

[gui]
shm-full-hand-caption=내려놓기 모드
shm-full-hand-instant=즉시
shm-full-hand-full=가득 채우기
shm-full-hand-message-full=손이 가득 찰 때까지 대기
shm-full-hand-message-instant=즉시 내려놓음

[tips-and-tricks-item-name]
shm-full-hand=극고속 투입기 가득 채우기

[tips-and-tricks-item-description]
shm-full-hand=[entity=kr-superior-inserter] 극고속 투입기는 손이 가득 찰 때까지 기다렸다가 내려놓으므로 벨트에 가득 찬 묶음을 올립니다. 즉시 내려놓게 하려면 투입기 위에 커서를 올리고 __CONTROL__shm-full-hand-toggle__를 누르거나 창 오른쪽의 스위치를 전환하세요. 모드는 청사진에 저장되며 __CONTROL__copy-entity-settings__와 __CONTROL__paste-entity-settings__로 복사됩니다.
