[mod-name]
shm-k2-superior-inserters-full-hand-switcher=Krastorio2: Superior Inserters Full Hand Switcher

[mod-description]
shm-k2-superior-inserters-full-hand-switcher=Krastorio 2 的超级机械臂会像堆叠机械臂一样，等手中装满后再放下物品。每个机械臂都可以切换回立即放下：SHIFT + M 或其窗口旁的开关。

[controls]
shm-full-hand-toggle=切换超级机械臂满手模式

[gui]
shm-full-hand-caption=放置模式
shm-full-hand-instant=立即
shm-full-hand-full=满手
shm-full-hand-message-full=等待满手
shm-full-hand-message-instant=立即放下
shm-full-hand-ghost=无法切换虚影

[tips-and-tricks-item-name]
shm-full-hand=超级机械臂满手模式

[tips-and-tricks-item-description]
shm-full-hand=[entity=kr-superior-inserter] 超级机械臂会等到手中装满后再放下物品，因此会在传送带上放置满堆叠。若要让机械臂立即放下，将鼠标悬停在其上并按 __CONTROL__shm-full-hand-toggle__，或拨动其窗口右侧的开关。该模式会保存在蓝图中，并可通过 __CONTROL__copy-entity-settings__ 和 __CONTROL__paste-entity-settings__ 复制。
