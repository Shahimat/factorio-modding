[tips-and-tricks-item-name]
shm-orbital-logistics=Orbital Logistics

[tips-and-tricks-item-description]
shm-orbital-logistics=Depósitos y carga con destino para plataformas espaciales, sobre las transferencias entre plataformas de la 2.1.\n\n• Como siempre, transportan los cohetes y las plataformas.\n• El mod solo decide si un [entity=space-platform-hub] puede entregar un objeto en la órbita donde está.\n• Todo se configura en el panel bajo la ventana del hub.\n• El bloque «Entrega en esta órbita» del panel muestra, para cada sección etiquetada, si retiene o entrega, y las excepciones.\n\n[font=default-large-bold]Función de las secciones[/font]\nUna sección es un bloque de peticiones de la ventana del hub — el que se añade con «Agregar sección». Su función es una etiqueta en el nombre del grupo:\n\n• [font=default-bold][reserve][/font] — reserva propia, nunca se entrega.\n• [font=default-bold][cargo→aquilo][/font] — carga para [planet=aquilo], retenida en el camino.\n• [font=default-bold][depot:nauvis][/font] — depósito sobre [planet=nauvis].\n\nElige función y lugares en el panel y pulsa «Aplicar». La etiqueta vale para todos los hubs con ese grupo. Sin etiqueta, la sección funciona como siempre.\n\nEn «Entrega en esta órbita»: [img=utility/status_working] entrega, [img=utility/status_yellow] retiene, [img=utility/status_blue] apagada hasta salir, [img=utility/status_inactive] el depósito toma la carga traída.\n\n[font=default-large-bold]Depósitos y tránsito[/font]\nUn depósito [font=default-bold][depot:…][/font]:\n\n• se llena desde el planeta como siempre;\n• entrega a otras plataformas en sus órbitas;\n• en otras órbitas guarda sus objetos.\n\nSi llega carga para su órbita, el depósito primero la toma hasta su propia petición y luego la reparte. Mientras haya carga traída en la órbita, se entrega esa primero.\n\n[font=default-large-bold]Carga y recogida[/font]\nLa carga [font=default-bold][cargo→…][/font]:\n\n• no se entrega por el camino — ni a plataformas ni a planetas;\n• solo se entrega sobre los planetas elegidos;\n• sin planetas elegidos, como siempre, bajo demanda.\n\n[font=default-bold]Recogida[/font]: deja vacío «Importar desde» y pon una cantidad grande — la plataforma recoge en cada órbita. En el destino el mod desmarca el grupo para poder entregar la carga, y lo vuelve a marcar al salir. En el panel esa sección aparece como «(apagada hasta salir)».\n\n[font=default-large-bold]Líneas de suministro[/font]\nUna línea de suministro es una lista de objetos para toda la cadena: depósito, lanzaderas, depósito sobre otro planeta, [entity=cargo-landing-pad].\n\n• Abrir: «Líneas de suministro…» en el panel o /shm-orbital-lines.\n• Conecta hubs y plataformas desde los paneles junto a sus ventanas.\n• Elige para cada uno función, lugares y coeficiente y pulsa «Aplicar».\n\nUn cambio en la lista llega a todos; cada uno conserva su coeficiente.\n\n[font=default-large-bold]Grupo propio del mod[/font]\nEn los hubs con etiquetas el mod mantiene su grupo [font=default-bold]⚙ Orbital Logistics — auto #…[/font] con filtros a cero — así bloquea la entrega de objetos protegidos.\n\n• No lo edites ni lo borres: mientras el mod retenga algo, vuelve solo.\n• Cuando no hay nada que retener, el mod lo quita, también de la lista de grupos.\n• Antes de quitar el mod, desactiva «Activar Orbital Logistics» en los ajustes del mapa: el mod quita sus grupos y vuelve a marcar las secciones de carga.
