[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=Depósitos y carga con destino para plataformas espaciales, sobre las transferencias vanilla entre plataformas de la 2.1. Marca una sección de peticiones directamente en el panel del hub como reserva, carga para planetas elegidos o depósito para órbitas elegidas: la reserva nunca se entrega, la carga se retiene hasta su destino y un depósito abastece a otras plataformas en sus órbitas. Las líneas de suministro mantienen una sola lista de objetos para toda una cadena de depósitos, lanzaderas y plataformas de aterrizaje.

