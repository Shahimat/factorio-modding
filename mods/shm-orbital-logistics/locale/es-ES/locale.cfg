[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=Depósitos y carga de plataformas espaciales sobre las transferencias vanilla entre plataformas. Etiqueta en el nombre de un grupo logístico: [reserve] nunca se entrega, [cargo→aquilo] se guarda hasta su destino, [depot:nauvis] abastece a otras plataformas en sus órbitas.

[mod-setting-name]
shm-orbital-logistics-enabled=Activar Orbital Logistics

[mod-setting-description]
shm-orbital-logistics-enabled=Al desactivarlo, el mod quita sus secciones de todos los hubs y vuelve a activar las secciones de carga. Desactívalo antes de quitar el mod.
