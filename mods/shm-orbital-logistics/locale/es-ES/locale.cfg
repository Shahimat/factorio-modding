shm-orbital-logistics-debug=Modo de depuración
shm-orbital-logistics-panel-position=Posición del panel de Orbital Logistics
shm-orbital-logistics-enabled=Activar Orbital Logistics

[mod-setting-description]
shm-orbital-logistics-debug=Solo en la versión de depuración: activa el comando de demo /shm-orbital-demo. No está en las versiones publicadas.
shm-orbital-logistics-panel-position=Dónde se coloca el panel de Orbital Logistics junto a la ventana del hub. Abajo y arriba, sus bloques van en fila.
shm-orbital-logistics-enabled=Al desactivarlo, el mod quita sus secciones de todos los hubs y vuelve a activar las secciones de carga. Desactívalo antes de quitar el mod.

