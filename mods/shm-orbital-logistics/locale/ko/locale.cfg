[tips-and-tricks-item-name]
shm-orbital-logistics=Orbital Logistics

[tips-and-tricks-item-description]
shm-orbital-logistics=2.1의 플랫폼 간 전송 위에서 우주 플랫폼에 창고와 목적지가 있는 화물을 더합니다.\n\n• 운송은 평소대로 로켓과 플랫폼이 합니다.\n• 모드는 [entity=space-platform-hub]가 현재 궤도에서 아이템을 내줘도 되는지만 결정합니다.\n• 모든 설정은 허브 창 아래 패널에서 합니다.\n• 패널의 «이 궤도에서 내주기» 블록은 태그가 있는 구역마다 보관 중인지 내주는지와 예외를 보여줍니다.\n\n[font=default-large-bold]구역 용도[/font]\n구역은 허브 창의 요청 블록으로, «구역 추가»로 추가하는 것입니다. 용도는 그룹 이름의 태그입니다:\n\n• [font=default-bold][reserve][/font] — 자체 비축, 절대 내주지 않음.\n• [font=default-bold][cargo→aquilo][/font] — [planet=aquilo] 화물, 도중에는 보관.\n• [font=default-bold][depot:nauvis][/font] — [planet=nauvis] 상공 창고.\n\n패널에서 용도와 장소를 고르고 «적용»을 누르세요. 그 그룹을 가진 모든 허브에 적용됩니다. 태그 없는 구역은 평소대로 작동합니다.\n\n«이 궤도에서 내주기»에서: [img=utility/status_working] 내줌, [img=utility/status_yellow] 보관, [img=utility/status_blue] 출발 전까지 꺼짐, [img=utility/status_inactive] 창고가 가져온 화물을 받는 중.\n\n[font=default-large-bold]창고와 중계[/font]\n창고 [font=default-bold][depot:…][/font]:\n\n• 평소대로 행성에서 채워짐;\n• 자기 궤도에서 다른 플랫폼에 내줌;\n• 다른 궤도에서는 아이템을 보관.\n\n그 궤도로 가는 화물이 도착하면 창고는 먼저 자기 요청량까지 받은 뒤 나눠 줍니다. 가져온 화물이 궤도에 있는 동안에는 그 화물이 먼저 나갑니다.\n\n[font=default-large-bold]화물과 수집[/font]\n화물 [font=default-bold][cargo→…][/font]:\n\n• 도중에 내주지 않음 — 플랫폼에도 행성에도;\n• 선택한 행성 상공에서만 내줌;\n• 행성을 고르지 않으면 평소대로 요청에 따라.\n\n[font=default-bold]수집[/font]: «다음에서 가져오기»를 비우고 큰 수량을 설정하면 플랫폼이 모든 궤도에서 모읍니다. 목적지에서 모드가 그룹 체크를 풀어 화물을 내줄 수 있게 하고, 출발할 때 다시 체크합니다. 패널에서 그런 구역에는 «(출발 전까지 꺼짐)»이 붙습니다.\n\n[font=default-large-bold]공급 라인[/font]\n공급 라인은 전체 체인을 위한 하나의 아이템 목록입니다: 창고, 셔틀, 다른 행성 상공의 창고, [entity=cargo-landing-pad].\n\n• 열기: 패널의 «공급 라인…» 또는 /shm-orbital-lines.\n• 허브와 착륙장을 창 옆 패널에서 연결.\n• 각 참여자의 역할, 장소, 계수를 정하고 «적용».\n\n목록 변경은 모든 참여자에게 전해지고, 계수는 각자 유지됩니다.\n\n[font=default-large-bold]모드 전용 그룹[/font]\n태그가 있는 허브에 모드는 수량 0 필터의 전용 그룹 [font=default-bold]⚙ Orbital Logistics — auto #…[/font]을 둡니다 — 이것으로 보호된 아이템을 내주지 않게 합니다.\n\n• 편집하거나 삭제하지 마세요: 모드가 무언가를 보관하는 동안 자동으로 돌아옵니다.\n• 보관할 것이 없으면 모드가 허브와 그룹 목록에서 제거합니다.\n• 모드를 제거하기 전에 맵 설정에서 «Orbital Logistics 활성화»를 끄세요: 모드가 자기 그룹을 제거하고 화물 구역의 체크를 되돌립니다.
