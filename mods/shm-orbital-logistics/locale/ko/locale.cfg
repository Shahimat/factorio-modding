[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=바닐라 2.1의 플랫폼 간 전송 위에서 우주 플랫폼에 창고와 목적지가 있는 화물을 더합니다. 허브 패널에서 바로 요청 구역을 자체 비축, 선택한 행성행 화물, 선택한 궤도의 창고로 지정하세요: 비축은 절대 내주지 않고, 화물은 목적지까지 보관하며, 창고는 자기 궤도에서 다른 플랫폼에 공급합니다. 공급 라인은 창고, 셔틀, 착륙장으로 이루어진 체인 전체에 하나의 아이템 목록을 유지합니다.

