shm-orbital-logistics-panel-position=허브 창 옆에서 Orbital Logistics 패널이 놓일 위치. 아래와 위에서는 블록이 가로로 놓입니다.
shm-orbital-logistics-enabled=끄면 모드가 모든 허브에서 자신의 섹션을 제거하고 화물 섹션을 다시 켭니다. 모드를 제거하기 전에 끄세요.

