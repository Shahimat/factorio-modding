[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=바닐라 플랫폼 간 전송 위에서 동작하는 우주 플랫폼 창고와 화물. 물류 그룹 이름에 태그를 붙입니다: [reserve]는 절대 내주지 않고, [cargo→aquilo]는 목적지까지 보관하며, [depot:nauvis]는 자기 궤도에서 다른 플랫폼에 공급합니다.

[mod-setting-name]
shm-orbital-logistics-enabled=Orbital Logistics 활성화

[mod-setting-description]
shm-orbital-logistics-enabled=끄면 모드가 모든 허브에서 자신의 섹션을 제거하고 화물 섹션을 다시 켭니다. 모드를 제거하기 전에 끄세요.
