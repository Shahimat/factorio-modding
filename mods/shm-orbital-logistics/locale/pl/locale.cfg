[tips-and-tricks-item-name]
shm-orbital-logistics=Orbital Logistics

[tips-and-tricks-item-description]
shm-orbital-logistics=Magazyny i ładunki z celem dla platform kosmicznych na bazie transferów między platformami z 2.1.\n\n• Jak zwykle wożą rakiety i platformy.\n• Mod decyduje tylko, czy [entity=space-platform-hub] może oddać przedmiot na orbicie, na której stoi.\n• Wszystko ustawia się w panelu pod oknem hubu.\n• Blok «Oddawanie na tej orbicie» w panelu pokazuje dla każdej oznaczonej sekcji, czy trzyma, czy oddaje, oraz wyjątki.\n\n[font=default-large-bold]Rola sekcji[/font]\nSekcja to blok żądań w oknie hubu — dodawany przyciskiem «Dodaj sekcję». Jej rola to znacznik w nazwie grupy:\n\n• [font=default-bold][reserve][/font] — zapas własny, nigdy nie oddawany.\n• [font=default-bold][cargo→aquilo][/font] — ładunek dla [planet=aquilo], trzymany po drodze.\n• [font=default-bold][depot:nauvis][/font] — magazyn nad [planet=nauvis].\n\nWybierz w panelu rolę i miejsca, naciśnij «Zastosuj». Znacznik działa na wszystkie huby z tą grupą. Sekcja bez znacznika działa jak zwykle.\n\nW bloku «Oddawanie na tej orbicie»: [img=utility/status_working] oddaje, [img=utility/status_yellow] trzyma, [img=utility/status_blue] wyłączona do odlotu, [img=utility/status_inactive] magazyn dobiera przywieziony ładunek.\n\n[font=default-large-bold]Magazyny i tranzyt[/font]\nMagazyn [font=default-bold][depot:…][/font]:\n\n• jest zapełniany z planety jak zwykle;\n• oddaje innym platformom na swoich orbitach;\n• na innych orbitach trzyma przedmioty.\n\nGdy na jego orbitę przyleci ładunek dla niej, magazyn najpierw dobiera go do własnego żądania, potem rozdaje. Dopóki na orbicie jest przywieziony ładunek, oddawany jest on w pierwszej kolejności.\n\n[font=default-large-bold]Ładunek i zbieranie[/font]\nŁadunek [font=default-bold][cargo→…][/font]:\n\n• nie jest oddawany po drodze — ani platformom, ani planetom;\n• jest oddawany tylko nad wybranymi planetami;\n• bez wybranych planet — jak zwykle, na żądanie.\n\n[font=default-bold]Zbieranie[/font]: zostaw puste «Importuj z» i ustaw dużą ilość — platforma zbierze na każdej orbicie. W celu mod odznacza grupę, by ładunek dało się oddać, i zaznacza ją przy odlocie. W panelu taka sekcja ma dopisek «(wyłączona do odlotu)».\n\n[font=default-large-bold]Linie zaopatrzenia[/font]\nLinia zaopatrzenia to jedna lista przedmiotów dla całego łańcucha: magazyn, wahadłowce, magazyn nad inną planetą, [entity=cargo-landing-pad].\n\n• Otwórz: «Linie zaopatrzenia…» w panelu lub /shm-orbital-lines.\n• Podłącz huby i lądowiska z paneli obok ich okien.\n• Ustaw każdemu rolę, miejsca i współczynnik, naciśnij «Zastosuj».\n\nZmiana listy trafia do wszystkich; każdy zachowuje swój współczynnik.\n\n[font=default-large-bold]Własna grupa moda[/font]\nNa hubach ze znacznikami mod trzyma swoją grupę [font=default-bold]⚙ Orbital Logistics — auto #…[/font] z zerowymi filtrami — tak blokuje oddawanie chronionych przedmiotów.\n\n• Nie edytuj jej ani nie usuwaj: dopóki mod coś trzyma, wróci sama.\n• Gdy nie ma czego trzymać, mod ją usuwa — także z listy grup.\n• Przed usunięciem moda wyłącz «Włącz Orbital Logistics» w ustawieniach mapy: mod usunie swoje grupy i zaznaczy z powrotem sekcje ładunku.
