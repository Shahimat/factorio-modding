[mod-description]
shm-orbital-logistics=Magazyny i ładunki platform kosmicznych na bazie standardowych transferów między platformami. Znacznik w nazwie grupy logistycznej: [reserve] nigdy nie jest oddawany, [cargo→aquilo] jest trzymany do celu, [depot:nauvis] zaopatruje inne platformy na swoich orbitach.

