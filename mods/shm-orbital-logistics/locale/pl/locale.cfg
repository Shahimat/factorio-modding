[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=Magazyny i ładunki platform kosmicznych na bazie standardowych transferów między platformami. Znacznik w nazwie grupy logistycznej: [reserve] nigdy nie jest oddawany, [cargo→aquilo] jest trzymany do celu, [depot:nauvis] zaopatruje inne platformy na swoich orbitach.

[mod-setting-name]
shm-orbital-logistics-enabled=Włącz Orbital Logistics

[mod-setting-description]
shm-orbital-logistics-enabled=Po wyłączeniu mod usuwa swoje sekcje ze wszystkich hubów i ponownie włącza sekcje ładunku. Wyłącz przed usunięciem moda.
