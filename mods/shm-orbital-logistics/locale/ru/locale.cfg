[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=Склады и грузы с назначением для космических платформ поверх ванильных передач между платформами 2.1. Отметьте группу запросов прямо в панели хаба как свой запас, груз для выбранных планет или склад для выбранных орбит: запас никому не отдаётся, груз держится до точки назначения, склад снабжает другие платформы на своих орбитах. Линии снабжения держат один список предметов на всю цепочку складов, челноков и грузовых площадок.

