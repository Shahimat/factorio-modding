[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=Склады и грузы с назначением для космических платформ поверх ванильных передач между платформами 2.1. Отметьте группы запросов в панели хаба как свой запас, груз для выбранных планет или склад для выбранных орбит. Запас никому не отдаётся, груз держится до точки назначения, склад снабжает платформы на своих орбитах. Держите источник запроса склада на «Планете»: «Платформы» и «Все» платформам не отдают. Линии снабжения держат один список предметов на цепочку складов, челноков и грузовых площадок.

[mod-setting-name]
shm-orbital-logistics-debug=Режим отладки
shm-orbital-logistics-enabled=Включить Orbital Logistics

[mod-setting-description]
shm-orbital-logistics-debug=Только в отладочной сборке: включает демо-команду /shm-orbital-demo. В релизе её нет.
shm-orbital-logistics-enabled=При выключении мод убирает свои служебные группы со всех хабов и включает обратно группы груза. Выключите перед удалением мода.

