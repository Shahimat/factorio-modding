[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=Склады и грузы космических платформ поверх ванильных передач между платформами. Метка в имени логистической группы: [reserve] никогда не отдаётся, [cargo→aquilo] держится до точки назначения, [depot:nauvis] снабжает другие платформы на своих орбитах.

[mod-setting-name]
shm-orbital-logistics-enabled=Включить Orbital Logistics

[mod-setting-description]
shm-orbital-logistics-enabled=При выключении мод убирает свои секции со всех хабов и включает обратно секции груза. Выключите перед удалением мода.
