[tips-and-tricks-item-name]
shm-orbital-logistics=Orbital Logistics

[tips-and-tricks-item-description]
shm-orbital-logistics=Склады и грузы с назначением для космических платформ поверх передач между платформами 2.1.\n\n• Возят, как обычно, ракеты и платформы.\n• Мод только решает, может ли [entity=space-platform-hub] отдать предмет на орбите, где стоит.\n• Всё настраивается в панели под окном хаба.\n• Блок «Отдача на этой орбите» в панели показывает по каждой группе с меткой, держит она предметы или отдаёт, и исключения.\n\n[font=default-large-bold]Назначение групп[/font]\nГруппа — блок запросов в окне хаба, тот, что добавляется кнопкой «Добавить группу». Назначение группы — метка в её имени:\n\n• [font=default-bold][reserve][/font] — свой запас, никому не отдаётся.\n• [font=default-bold][cargo→aquilo][/font] — груз для [planet=aquilo], по пути не отдаётся.\n• [font=default-bold][depot:nauvis][/font] — склад над [planet=nauvis].\n\nЧтобы поставить метку, выберите в панели назначение и места и нажмите «Применить». Метка действует на все хабы с этой группой. Группа без метки работает как обычно.\n\nВ блоке «Отдача на этой орбите»: [img=utility/status_working] отдаёт, [img=utility/status_yellow] держит, [img=utility/status_blue] выключена до отлёта, [img=utility/status_inactive] склад добирает привезённый груз, [img=utility/warning_icon] источник запроса склада не даёт отдать или сбросить.\n\n[font=default-large-bold]Склады и транзит[/font]\nСклад [font=default-bold][depot:…][/font]:\n\n• набивается с планеты как обычно;\n• отдаёт другим платформам на своих орбитах;\n• на чужих орбитах держит предметы.\n\nЕсли на его орбиту прилетел груз для неё, склад сначала добирает его с платформ до своего запроса и только потом раздаёт. Пока на орбите есть привезённый груз, отдают его, а не склад.\n\n\n\n[font=default-large-bold]Источники запросов склада[/font]\nСклад, который снабжает другие платформы, должен запрашивать с источником «Планета». Если склад не отдаёт, сначала проверьте источник запроса и «Раздачу другим платформам».\n\n• «Планета» наполняет склад с планеты и не мешает отдаче платформам.\n• «Платформы» или «Все» блокирует отдачу: склад никогда не отдаст такие предметы платформам на орбите, даже с набранным запросом. Сброс это не затрагивает.\n• Импорт с планеты, над которой стоит склад (с «Планетой» или «Всеми»), блокирует сброс на неё: чтобы снабжать планету под складом, поставьте источник «Платформы» или импорт с другой планеты.\n\nПанель предупреждает об обеих ловушках и помечает такие предметы в «Отдаче на этой орбите».\n\n[font=default-large-bold]Груз и сбор[/font]\nГруз [font=default-bold][cargo→…][/font]:\n\n• не отдаётся по пути — ни платформам, ни планетам;\n• отдаётся только над выбранными планетами;\n• без выбранных планет — как обычно, по запросу.\n\n[font=default-bold]Сбор[/font]: оставьте «Импорт с» пустым и поставьте большое количество — платформа наберёт на каждой орбите. На точке назначения мод снимает у группы галочку, чтобы груз можно было отдать, и возвращает её при отлёте. В панели такая группа подписана «(выключена до отлёта)».\n\n[font=default-large-bold]Линии снабжения[/font]\nЛиния снабжения — один список предметов для всей цепочки: склад, челноки, склад над другой планетой, [entity=cargo-landing-pad].\n\n• Открыть: кнопка «Линии снабжения…» в панели или /shm-orbital-lines.\n• Подключите хабы и площадки из панелей у их окон.\n• Задайте каждому роль, места и множитель и нажмите «Применить».\n\nПравка списка доходит до всех участников, у каждого остаётся свой множитель.\n\n[font=default-large-bold]Служебная группа мода[/font]\nНа хабах с метками мод держит свою группу [font=default-bold]⚙ Orbital Logistics — auto #…[/font] с нулевыми фильтрами — так он запрещает отдачу защищённых предметов.\n\n• Не правьте и не удаляйте её: пока мод что-то держит на хабе, она вернётся сама.\n• Когда держать нечего, мод убирает её — и с хаба, и из списка групп.\n• Перед удалением мода выключите «Включить Orbital Logistics» в настройках карты — мод уберёт свои группы и вернёт галочки группам груза.
