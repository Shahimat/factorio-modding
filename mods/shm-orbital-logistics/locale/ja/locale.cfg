[tips-and-tricks-item-name]
shm-orbital-logistics=Orbital Logistics

[tips-and-tricks-item-description]
shm-orbital-logistics=2.1 のプラットフォーム間転送の上で、宇宙プラットフォームに倉庫と目的地付き貨物を追加します。\n\n• 運ぶのはいつもどおりロケットとプラットフォームです。\n• MODは[entity=space-platform-hub]が今いる軌道でアイテムを渡してよいかだけを判断します。\n• 設定はすべてハブウィンドウ下のパネルで行います。\n• パネルの「この軌道での受け渡し」ブロックは、タグ付きセクションごとに保持か渡すかと例外を表示します。\n\n[font=default-large-bold]セクションの用途[/font]\nセクションはハブウィンドウの要求ブロックで、「セクションを追加」で追加するものです。用途はグループ名のタグです：\n\n• [font=default-bold][reserve][/font]——自分用の備蓄、決して渡さない。\n• [font=default-bold][cargo→aquilo][/font]——[planet=aquilo]行きの貨物、途中では保持。\n• [font=default-bold][depot:nauvis][/font]——[planet=nauvis]上空の倉庫。\n\nパネルで用途と場所を選び「適用」を押します。そのグループを持つすべてのハブに適用されます。タグのないセクションは通常どおり動作します。\n\n「この軌道での受け渡し」では：[img=utility/status_working] 渡す、[img=utility/status_yellow] 保持、[img=utility/status_blue] 出発までオフ、[img=utility/status_inactive] 倉庫が運ばれた貨物を受け取り中。\n\n[font=default-large-bold]倉庫と中継[/font]\n倉庫 [font=default-bold][depot:…][/font]：\n\n• 通常どおり惑星から補充される；\n• 自分の軌道で他のプラットフォームに渡す；\n• 他の軌道ではアイテムを保持する。\n\nその軌道向けの貨物が届くと、倉庫はまず自分の要求量まで受け取り、その後配ります。運ばれた貨物が軌道にある間は、その貨物が先に渡されます。\n\n[font=default-large-bold]貨物と収集[/font]\n貨物 [font=default-bold][cargo→…][/font]：\n\n• 途中で渡されない——プラットフォームにも惑星にも；\n• 選んだ惑星の上空でのみ渡される；\n• 惑星を選ばなければ通常どおり要求に応じて。\n\n[font=default-bold]収集[/font]：「配送元」を空にして大きな数量を設定すると、プラットフォームは各軌道で集めます。目的地ではMODがグループのチェックを外して貨物を渡せるようにし、出発時に戻します。 パネルではそのセクションに「（出発までオフ）」と表示されます。\n\n[font=default-large-bold]供給ライン[/font]\n供給ラインはチェーン全体のアイテム一覧です：倉庫、シャトル、別の惑星上空の倉庫、[entity=cargo-landing-pad]。\n\n• 開く：パネルの「供給ライン…」か /shm-orbital-lines。\n• ハブと着陸パッドをウィンドウ横のパネルから接続。\n• 各参加者の役割・場所・係数を設定し「適用」。\n\n一覧の変更はすべての参加者に届き、係数はそれぞれ維持されます。\n\n[font=default-large-bold]MOD専用のグループ[/font]\nタグのあるハブには、MODが数量ゼロのフィルターの専用グループ [font=default-bold]⚙ Orbital Logistics — auto #…[/font] を置きます——これで保護されたアイテムの受け渡しを止めます。\n\n• 編集や削除はしないでください：MODが何かを保持している間は自動で戻ります。\n• 保持するものがなくなると、MODがハブからもグループ一覧からも削除します。\n• MODを削除する前に、マップ設定で「Orbital Logistics を有効化」をオフに：MODが自分のグループを削除し、貨物セクションのチェックを戻します。
