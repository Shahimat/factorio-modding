shm-orbital-logistics-debug=デバッグモード
shm-orbital-logistics-panel-position=Orbital Logistics パネルの位置
shm-orbital-logistics-enabled=Orbital Logistics を有効化

[mod-setting-description]
shm-orbital-logistics-debug=デバッグビルドのみ：デモコマンド /shm-orbital-demo を有効にします。リリースにはありません。
shm-orbital-logistics-panel-position=ハブウィンドウの横で Orbital Logistics パネルを置く場所。下と上では各ブロックが横に並びます。
shm-orbital-logistics-enabled=オフにすると、MODはすべてのハブから自分のセクションを削除し、貨物セクションを再び有効にします。MODを削除する前にオフにしてください。

