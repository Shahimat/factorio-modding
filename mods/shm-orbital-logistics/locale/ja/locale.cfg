[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=バニラ 2.1 のプラットフォーム間転送の上で、宇宙プラットフォームに倉庫と目的地付き貨物を追加します。ハブのパネルで要求セクションを自分用の備蓄、選んだ惑星行きの貨物、選んだ軌道の倉庫として指定できます：備蓄は決して渡さず、貨物は目的地まで保持し、倉庫は自分の軌道で他のプラットフォームに供給します。供給ラインは倉庫・シャトル・着陸パッドのチェーン全体で一つのアイテム一覧を保ちます。

