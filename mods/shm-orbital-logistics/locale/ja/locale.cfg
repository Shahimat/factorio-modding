[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=バニラのプラットフォーム間転送の上で動く、宇宙プラットフォームの倉庫と貨物。物流グループ名にタグを付けます：[reserve] は決して渡さない、[cargo→aquilo] は目的地まで保持、[depot:nauvis] は自分の軌道で他のプラットフォームに供給。

[mod-setting-name]
shm-orbital-logistics-enabled=Orbital Logistics を有効化

[mod-setting-description]
shm-orbital-logistics-enabled=オフにすると、MODはすべてのハブから自分のセクションを削除し、貨物セクションを再び有効にします。MODを削除する前にオフにしてください。
