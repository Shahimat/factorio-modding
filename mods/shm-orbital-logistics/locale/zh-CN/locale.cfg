[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=在原版 2.1 平台间传输之上，为太空平台提供仓库和有目的地的货物。直接在枢纽面板中将请求编组标为自用储备、运往所选行星的货物或所选轨道的仓库：储备永不外送，货物保留到目的地，仓库在其轨道上供应其他平台。供应线为整条由仓库、穿梭平台和着陆台组成的链保持一份物品清单。

