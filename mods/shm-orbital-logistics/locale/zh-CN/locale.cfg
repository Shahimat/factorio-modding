[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=在原版平台间传输之上，为太空平台提供仓库与货物。在物流组名称中加标记：[reserve] 永不外送，[cargo→aquilo] 保留到目的地，[depot:nauvis] 在其轨道上供应其他平台。

[mod-setting-name]
shm-orbital-logistics-enabled=启用 Orbital Logistics

[mod-setting-description]
shm-orbital-logistics-enabled=关闭后，模组会从所有枢纽移除自己的分区，并重新启用货物分区。请在移除模组前关闭。
