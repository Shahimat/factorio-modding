[tips-and-tricks-item-name]
shm-orbital-logistics=Orbital Logistics

[tips-and-tricks-item-description]
shm-orbital-logistics=在 2.1 平台间传输之上，为太空平台提供仓库和有目的地的货物。\n\n• 运输照常由火箭和平台完成。\n• 模组只决定[entity=space-platform-hub]能否在当前轨道交出物品。\n• 一切都在枢纽窗口下方的面板中设置。\n• 面板中的「本轨道的交出」区块按每个带标记的编组显示其保留还是交出，以及例外。\n\n[font=default-large-bold]编组用途[/font]\n编组是枢纽窗口中的请求块，即用「添加编组」添加的那个。其用途是组名中的标记：\n\n• [font=default-bold][reserve][/font]——自用储备，永不外送。\n• [font=default-bold][cargo→aquilo][/font]——运往[planet=aquilo]的货物，途中保留。\n• [font=default-bold][depot:nauvis][/font]——[planet=nauvis]上空的仓库。\n\n在面板中选择用途和地点，点击「应用」。标记对使用该组的所有枢纽生效。没有标记的编组照常工作。\n\n「本轨道的交出」中：[img=utility/status_working] 交出，[img=utility/status_yellow] 保留，[img=utility/status_blue] 离开前关闭，[img=utility/status_inactive] 仓库补入运来的货物，[img=utility/warning_icon] 仓库请求来源阻碍交出或投放。\n\n[font=default-large-bold]仓库与中转[/font]\n仓库 [font=default-bold][depot:…][/font]：\n\n• 照常从行星补货；\n• 在其轨道上供给其他平台；\n• 在其他轨道上保留物品。\n\n运往其轨道的货物到达时，仓库先补到自己的请求量，再分发。只要轨道上有运来的货物，就先交出这些货物。\n\n\n\n[font=default-large-bold]仓库请求来源[/font]\n供给其他平台的仓库必须以「行星」作为请求来源。如果仓库不交出物品，请先检查请求来源和向其他平台供货的开关。\n\n• 「行星」从行星补入仓库，且不阻碍交给平台。\n• 「平台」或「全部」会阻碍交出：即使请求已满，仓库也永远不会把这类物品交给轨道上的平台。投放不受影响。\n• 从仓库所在行星导入（来源「行星」或「全部」）会阻碍向其投放：要补给下方行星，请使用来源「平台」或从其他行星导入。\n\n面板会对这两种陷阱发出警告，并在「本轨道的交出」中标记这些物品。\n\n[font=default-large-bold]货物与收集[/font]\n货物 [font=default-bold][cargo→…][/font]：\n\n• 途中不交出——既不给平台也不给行星；\n• 只在所选行星上空交出；\n• 不选行星时照常按需交出。\n\n[font=default-bold]收集[/font]：将「引进来源」留空并设置大数量——平台会在每个轨道收集。在目的地，模组取消勾选该编组以便交出货物，离开时重新勾选。 面板中此类编组标有「（离开前关闭）」。\n\n[font=default-large-bold]供应线[/font]\n供应线是整条链的一份物品清单：仓库、穿梭平台、另一颗行星上空的仓库、[entity=cargo-landing-pad]。\n\n• 打开：面板中的「供应线…」或 /shm-orbital-lines。\n• 从各自窗口旁的面板连接枢纽和着陆台。\n• 为每个参与者设置角色、地点和系数，点击「应用」。\n\n清单的修改会到达所有参与者，各自保留自己的系数。\n\n[font=default-large-bold]模组的专用编组[/font]\n在有标记的枢纽上，模组保留其编组 [font=default-bold]⚙ Orbital Logistics — auto #…[/font]，过滤数量为零——借此阻止交出受保护的物品。\n\n• 请勿修改或删除：只要模组还在保留物品，它会自动回来。\n• 没有需要保留的物品时，模组会将其移除，包括从编组列表中移除。\n• 移除模组前，请在地图设置中关闭「启用 Orbital Logistics」：模组会移除其编组并重新勾选货物编组。
