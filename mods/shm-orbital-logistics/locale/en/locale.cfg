[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=Depots and cargo with a destination for space platforms, on top of the vanilla 2.1 platform-to-platform transfers. Mark a request group as reserve, cargo for chosen planets or a depot for chosen orbits right in the hub panel: reserve is never given away, cargo is held until its destination, a depot serves other platforms in its orbits. Supply lines keep one item list for a whole chain of depots, shuttles and landing pads.

[mod-setting-name]
shm-orbital-logistics-debug=Debug mode
shm-orbital-logistics-panel-position=Orbital Logistics panel position
shm-orbital-logistics-enabled=Enable Orbital Logistics

[mod-setting-description]
shm-orbital-logistics-debug=Debug build only: enables the /shm-orbital-demo demo command. Absent from releases.
shm-orbital-logistics-panel-position=Where the Orbital Logistics panel sits next to the hub window. Below and above, its blocks go in a row.
shm-orbital-logistics-enabled=When turned off, the mod removes its sections from all hubs and turns cargo sections back on. Turn it off before removing the mod.

