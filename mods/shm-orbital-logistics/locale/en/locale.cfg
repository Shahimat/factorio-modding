[tips-and-tricks-item-name]
shm-orbital-logistics=Orbital Logistics

[tips-and-tricks-item-description]
shm-orbital-logistics=Depots and cargo with a destination for space platforms, on top of the platform-to-platform transfers of 2.1.\n\n• Rockets and platforms move everything, as usual.\n• The mod only decides whether a [entity=space-platform-hub] may give an item away in the orbit it is in.\n• Everything is set up in the panel below the hub window.\n• The «Giving in this orbit» block in the panel shows, for every tagged group, whether it holds its items or gives them, and the exceptions.\n\n[font=default-large-bold]Group purposes[/font]\nA group is a request block in the hub window — the one added with «Add section». Its purpose is a tag in the group name:\n\n• [font=default-bold][reserve][/font] — own supply, never given away.\n• [font=default-bold][cargo→aquilo][/font] — cargo for [planet=aquilo], held on the way.\n• [font=default-bold][depot:nauvis][/font] — a depot over [planet=nauvis].\n\nTo set a tag, pick a purpose and places in the panel and press «Apply». The tag applies to every hub with that group. A group without a tag works as usual.\n\nIn «Giving in this orbit»: [img=utility/status_working] gives, [img=utility/status_yellow] holds, [img=utility/status_blue] turned off until departure, [img=utility/status_inactive] a depot takes brought cargo.\n\n[font=default-large-bold]Depots and transit[/font]\nA depot [font=default-bold][depot:…][/font]:\n\n• is filled from the planet as usual;\n• gives to other platforms in its orbits;\n• holds its items in other orbits.\n\nWhen cargo for its orbit arrives on another platform, the depot first takes it, up to its own request, and then gives it out. While brought cargo is in the orbit, that cargo is given first.\n\n[font=default-large-bold]Cargo and collecting[/font]\nCargo [font=default-bold][cargo→…][/font]:\n\n• is not given on the way — neither to platforms nor to planets;\n• is given only over the chosen planets;\n• with no planets chosen, works as usual, on request.\n\n[font=default-bold]Collecting[/font]: leave «Import from» empty and set a large amount. The platform picks items up in every orbit. At the destination the mod unticks the group so the cargo can be given, and ticks it back on departure. Such a group is marked «(off until departure)» in the panel.\n\n[font=default-large-bold]Supply lines[/font]\nA supply line is one list of items for a whole chain: a depot, shuttles, a depot over another planet, a [entity=cargo-landing-pad].\n\n• Open: «Supply lines…» in the panel or /shm-orbital-lines.\n• Attach hubs and landing pads from the panels next to their windows.\n• Set each participant's role, places and factor, then press «Apply».\n\nA change to the list reaches every participant; each keeps its own factor.\n\n[font=default-large-bold]The mod's own group[/font]\nOn hubs with tags the mod keeps its own group [font=default-bold]⚙ Orbital Logistics — auto #…[/font] with zero filters. That is how it blocks giving protected items.\n\n• Do not edit or remove it — it comes back by itself while the mod holds something on the hub.\n• When there is nothing to hold, the mod removes it, also from the group list.\n• Before removing the mod, turn off «Enable Orbital Logistics» in the map settings: the mod removes its groups and ticks cargo groups back on.
