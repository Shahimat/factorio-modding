[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=Space platform depots and cargo on top of vanilla platform-to-platform transfers. Tag a logistic group in its name: [reserve] is never given away, [cargo→aquilo] is held until its destination, [depot:nauvis] serves other platforms in its orbits.

[mod-setting-name]
shm-orbital-logistics-enabled=Enable Orbital Logistics

[mod-setting-description]
shm-orbital-logistics-enabled=When turned off, the mod removes its sections from all hubs and turns cargo sections back on. Turn it off before removing the mod.
