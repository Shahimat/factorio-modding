[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=Dépôts et cargaisons avec destination pour les plateformes spatiales, par-dessus les transferts vanilla entre plateformes de la 2.1. Marquez une section de demandes directement dans le panneau du hub comme réserve, cargaison pour des planètes choisies ou dépôt pour des orbites choisies : la réserve n'est jamais cédée, la cargaison est gardée jusqu'à destination, un dépôt approvisionne les autres plateformes sur ses orbites. Les lignes d'approvisionnement gardent une seule liste d'objets pour toute une chaîne de dépôts, navettes et aires d'atterrissage.

