[tips-and-tricks-item-name]
shm-orbital-logistics=Orbital Logistics

[tips-and-tricks-item-description]
shm-orbital-logistics=Dépôts et cargaisons avec destination pour les plateformes spatiales, par-dessus les transferts entre plateformes de la 2.1.\n\n• Comme d'habitude, ce sont les fusées et les plateformes qui transportent.\n• Le mod décide seulement si un [entity=space-platform-hub] peut céder un objet sur l'orbite où il se trouve.\n• Tout se règle dans le panneau sous la fenêtre du hub.\n• Le bloc « Dons sur cette orbite » du panneau montre, pour chaque section balisée, si elle garde ou cède, et les exceptions.\n\n[font=default-large-bold]Rôle des sections[/font]\nUne section est un bloc de demandes de la fenêtre du hub — celui ajouté avec « Ajouter une section ». Son rôle est une balise dans le nom du groupe :\n\n• [font=default-bold][reserve][/font] — réserve propre, jamais cédée.\n• [font=default-bold][cargo→aquilo][/font] — cargaison pour [planet=aquilo], gardée en route.\n• [font=default-bold][depot:nauvis][/font] — dépôt au-dessus de [planet=nauvis].\n\nChoisissez le rôle et les lieux dans le panneau, puis « Appliquer ». La balise vaut pour tous les hubs de ce groupe. Sans balise, une section fonctionne comme d'habitude.\n\nDans « Dons sur cette orbite » : [img=utility/status_working] cède, [img=utility/status_yellow] garde, [img=utility/status_blue] coupée jusqu'au départ, [img=utility/status_inactive] le dépôt prend la cargaison apportée.\n\n[font=default-large-bold]Dépôts et transit[/font]\nUn dépôt [font=default-bold][depot:…][/font] :\n\n• est rempli depuis la planète comme d'habitude ;\n• cède aux autres plateformes sur ses orbites ;\n• garde ses objets sur les autres orbites.\n\nQuand une cargaison pour son orbite arrive, le dépôt la prend d'abord jusqu'à sa propre demande, puis la distribue. Tant qu'une cargaison apportée est sur l'orbite, elle est cédée en premier.\n\n[font=default-large-bold]Cargaison et collecte[/font]\nUne cargaison [font=default-bold][cargo→…][/font] :\n\n• n'est pas cédée en route — ni aux plateformes ni aux planètes ;\n• n'est cédée qu'au-dessus des planètes choisies ;\n• sans planète choisie, fonctionne comme d'habitude, sur demande.\n\n[font=default-bold]Collecte[/font] : laissez « Importer depuis » vide avec une grande quantité — la plateforme ramasse sur chaque orbite. À destination, le mod décoche le groupe pour que la cargaison soit cédée, et le recoche au départ. Dans le panneau, une telle section porte « (coupée jusqu'au départ) ».\n\n[font=default-large-bold]Lignes d'approvisionnement[/font]\nUne ligne d'approvisionnement est une liste d'objets pour toute la chaîne : dépôt, navettes, dépôt au-dessus d'une autre planète, [entity=cargo-landing-pad].\n\n• Ouvrir : « Lignes d'approvisionnement… » dans le panneau ou /shm-orbital-lines.\n• Rattachez hubs et aires depuis les panneaux à côté de leurs fenêtres.\n• Choisissez pour chacun rôle, lieux et coefficient, puis « Appliquer ».\n\nUn changement de la liste atteint tous les participants ; chacun garde son coefficient.\n\n[font=default-large-bold]Groupe propre du mod[/font]\nSur les hubs balisés, le mod garde son groupe [font=default-bold]⚙ Orbital Logistics — auto #…[/font] aux filtres nuls — c'est ainsi qu'il bloque le don des objets protégés.\n\n• Ne le modifiez pas et ne le supprimez pas : tant que le mod garde quelque chose, il revient seul.\n• Quand il n'y a rien à garder, le mod le retire, y compris de la liste des groupes.\n• Avant de retirer le mod, désactivez « Activer Orbital Logistics » dans les paramètres de la carte : le mod retire ses groupes et recoche les sections de cargaison.
