[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=Dépôts et cargaisons des plateformes spatiales par-dessus les transferts vanilla entre plateformes. Balise dans le nom d'un groupe logistique : [reserve] n'est jamais cédé, [cargo→aquilo] est gardé jusqu'à sa destination, [depot:nauvis] approvisionne les autres plateformes sur ses orbites.

[mod-setting-name]
shm-orbital-logistics-enabled=Activer Orbital Logistics

[mod-setting-description]
shm-orbital-logistics-enabled=Une fois désactivé, le mod retire ses sections de tous les hubs et réactive les sections de cargaison. À désactiver avant de retirer le mod.
