shm-orbital-logistics-debug=Mode débogage
shm-orbital-logistics-panel-position=Position du panneau Orbital Logistics
shm-orbital-logistics-enabled=Activer Orbital Logistics

[mod-setting-description]
shm-orbital-logistics-debug=Version de débogage uniquement : active la commande de démo /shm-orbital-demo. Absent des versions publiées.
shm-orbital-logistics-panel-position=Où se place le panneau Orbital Logistics près de la fenêtre du hub. En bas et en haut, ses blocs sont en ligne.
shm-orbital-logistics-enabled=Une fois désactivé, le mod retire ses sections de tous les hubs et réactive les sections de cargaison. À désactiver avant de retirer le mod.

