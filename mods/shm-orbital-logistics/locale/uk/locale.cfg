[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=Склади й вантажі з призначенням для космічних платформ поверх ванільних передач між платформами 2.1. Позначте розділ запитів прямо в панелі хаба як власний запас, вантаж для вибраних планет або склад для вибраних орбіт: запас нікому не віддається, вантаж тримається до місця призначення, склад постачає інші платформи на своїх орбітах. Лінії постачання тримають один список предметів на весь ланцюжок складів, човників і вантажних майданчиків.

