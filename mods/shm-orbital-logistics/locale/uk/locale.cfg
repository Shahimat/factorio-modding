[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=Склади й вантажі космічних платформ поверх ванільних передач між платформами. Мітка в назві логістичної групи: [reserve] ніколи не віддається, [cargo→aquilo] тримається до місця призначення, [depot:nauvis] постачає інші платформи на своїх орбітах.

[mod-setting-name]
shm-orbital-logistics-enabled=Увімкнути Orbital Logistics

[mod-setting-description]
shm-orbital-logistics-enabled=Після вимкнення мод прибирає свої секції з усіх хабів і знову вмикає секції вантажу. Вимкніть перед видаленням мода.
