[tips-and-tricks-item-name]
shm-orbital-logistics=Orbital Logistics

[tips-and-tricks-item-description]
shm-orbital-logistics=Склади й вантажі з призначенням для космічних платформ поверх передач між платформами 2.1.\n\n• Возять, як завжди, ракети й платформи.\n• Мод лише вирішує, чи може [entity=space-platform-hub] віддати предмет на орбіті, де стоїть.\n• Усе налаштовується в панелі під вікном хаба.\n• Блок «Віддача на цій орбіті» у панелі показує для кожного розділу з міткою, чи він тримає предмети, чи віддає, і винятки.\n\n[font=default-large-bold]Призначення розділів[/font]\nРозділ — блок запитів у вікні хаба, той, що додається кнопкою «Додати розділ». Призначення — мітка в назві його групи:\n\n• [font=default-bold][reserve][/font] — власний запас, нікому не віддається.\n• [font=default-bold][cargo→aquilo][/font] — вантаж для [planet=aquilo], дорогою не віддається.\n• [font=default-bold][depot:nauvis][/font] — склад над [planet=nauvis].\n\nЩоб поставити мітку, виберіть у панелі призначення й місця та натисніть «Застосувати». Мітка діє на всі хаби з цією групою. Розділ без мітки працює як звичайно.\n\nУ блоці «Віддача на цій орбіті»: [img=utility/status_working] віддає, [img=utility/status_yellow] тримає, [img=utility/status_blue] вимкнено до відльоту, [img=utility/status_inactive] склад добирає привезений вантаж, [img=utility/warning_icon] джерело запиту складу не дає віддати чи скинути.\n\n[font=default-large-bold]Склади й транзит[/font]\nСклад [font=default-bold][depot:…][/font]:\n\n• наповнюється з планети як звичайно;\n• віддає іншим платформам на своїх орбітах;\n• на чужих орбітах тримає предмети.\n\nЯкщо на його орбіту прилетів вантаж для неї, склад спершу добирає його з платформ до свого запиту й лише потім роздає. Поки на орбіті є привезений вантаж, віддають його, а не склад.\n\n\n\n[font=default-large-bold]Джерела запитів складу[/font]\nСлідкуйте за джерелом запиту складу: якщо склад постачає інші платформи, лишайте його на «Планеті».\n\n• «Планета» наповнює склад з планети й не заважає скиданню на планету під складом.\n• «Платформи» або «Усі» блокує віддачу: склад ніколи не віддасть такі предмети платформам на орбіті, навіть із набраним запитом. Скидання це не зачіпає.\n• Імпорт з планети, над якою стоїть склад (з «Планетою» або «Усіма»), блокує скидання на неї: щоб постачати планету під складом, поставте джерело «Платформи» або імпорт з іншої планети.\n\nПанель попереджає про обидві пастки й позначає такі предмети у «Віддача на цій орбіті».\n\n[font=default-large-bold]Вантаж і збір[/font]\nВантаж [font=default-bold][cargo→…][/font]:\n\n• не віддається дорогою — ні платформам, ні планетам;\n• віддається лише над вибраними планетами;\n• без вибраних планет — як звичайно, на запит.\n\n[font=default-bold]Збір[/font]: залиште «Імпортувати з» порожнім і поставте велику кількість — платформа набере на кожній орбіті. У місці призначення мод знімає з розділу галочку, щоб вантаж можна було віддати, і повертає її при відльоті. У панелі такий розділ підписаний «(вимкнено до відльоту)».\n\n[font=default-large-bold]Лінії постачання[/font]\nЛінія постачання — один список предметів для всього ланцюжка: склад, човники, склад над іншою планетою, [entity=cargo-landing-pad].\n\n• Відкрити: кнопка «Лінії постачання…» у панелі або /shm-orbital-lines.\n• Підключіть хаби й майданчики з панелей біля їхніх вікон.\n• Задайте кожному роль, місця й множник і натисніть «Застосувати».\n\nЗміна списку доходить до всіх учасників, у кожного лишається свій множник.\n\n[font=default-large-bold]Службовий розділ мода[/font]\nНа хабах із мітками мод тримає свою групу [font=default-bold]⚙ Orbital Logistics — auto #…[/font] з нульовими фільтрами — так він забороняє віддачу захищених предметів.\n\n• Не змінюйте й не видаляйте її: поки мод щось тримає на хабі, вона повернеться сама.\n• Коли тримати нічого, мод прибирає її — і з хаба, і зі списку груп.\n• Перед видаленням мода вимкніть «Увімкнути Orbital Logistics» у налаштуваннях мапи — мод прибере свої групи й поверне галочки розділам вантажу.
