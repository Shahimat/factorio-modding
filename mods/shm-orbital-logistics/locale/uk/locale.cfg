shm-orbital-logistics-panel-position=Де панель Orbital Logistics стоїть біля вікна хаба. Знизу й зверху її блоки йдуть у ряд.
shm-orbital-logistics-enabled=Після вимкнення мод прибирає свої службові розділи з усіх хабів і знову вмикає розділи вантажу. Вимкніть перед видаленням мода.

