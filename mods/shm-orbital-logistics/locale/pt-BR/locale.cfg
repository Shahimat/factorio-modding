[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=Depósitos e carga de plataformas espaciais sobre as transferências vanilla entre plataformas. Marcação no nome de um grupo logístico: [reserve] nunca é entregue, [cargo→aquilo] fica retido até o destino, [depot:nauvis] abastece outras plataformas em suas órbitas.

[mod-setting-name]
shm-orbital-logistics-enabled=Ativar Orbital Logistics

[mod-setting-description]
shm-orbital-logistics-enabled=Ao desativar, o mod remove suas seções de todos os hubs e reativa as seções de carga. Desative antes de remover o mod.
