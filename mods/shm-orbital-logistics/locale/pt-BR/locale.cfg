[tips-and-tricks-item-name]
shm-orbital-logistics=Orbital Logistics

[tips-and-tricks-item-description]
shm-orbital-logistics=Depósitos e carga com destino para plataformas espaciais, sobre as transferências entre plataformas da 2.1.\n\n• Como sempre, quem transporta são foguetes e plataformas.\n• O mod só decide se um [entity=space-platform-hub] pode entregar um item na órbita em que está.\n• Tudo é configurado no painel abaixo da janela do hub.\n• O bloco «Entrega nesta órbita» no painel mostra, para cada seção marcada, se ela retém ou entrega, e as exceções.\n\n[font=default-large-bold]Função das seções[/font]\nUma seção é um bloco de pedidos na janela do hub — o adicionado com «Adicionar seção». Sua função é uma marcação no nome do grupo:\n\n• [font=default-bold][reserve][/font] — reserva própria, nunca entregue.\n• [font=default-bold][cargo→aquilo][/font] — carga para [planet=aquilo], retida no caminho.\n• [font=default-bold][depot:nauvis][/font] — depósito sobre [planet=nauvis].\n\nEscolha função e locais no painel e clique em «Aplicar». A marcação vale para todos os hubs com esse grupo. Sem marcação, a seção funciona normalmente.\n\nEm «Entrega nesta órbita»: [img=utility/status_working] entrega, [img=utility/status_yellow] retém, [img=utility/status_blue] desligada até partir, [img=utility/status_inactive] o depósito busca a carga trazida.\n\n[font=default-large-bold]Depósitos e trânsito[/font]\nUm depósito [font=default-bold][depot:…][/font]:\n\n• é abastecido pelo planeta normalmente;\n• entrega a outras plataformas em suas órbitas;\n• guarda seus itens nas outras órbitas.\n\nQuando chega carga para sua órbita, o depósito primeiro a busca até o próprio pedido e depois distribui. Enquanto houver carga trazida na órbita, ela é entregue primeiro.\n\n[font=default-large-bold]Carga e coleta[/font]\nA carga [font=default-bold][cargo→…][/font]:\n\n• não é entregue no caminho — nem a plataformas nem a planetas;\n• só é entregue sobre os planetas escolhidos;\n• sem planetas escolhidos, normalmente, sob demanda.\n\n[font=default-bold]Coleta[/font]: deixe «Importar de» vazio e use uma quantidade grande — a plataforma coleta em cada órbita. No destino o mod desmarca o grupo para a carga poder ser entregue e marca de novo na partida. No painel essa seção aparece como «(desligada até partir)».\n\n[font=default-large-bold]Linhas de suprimento[/font]\nUma linha de suprimento é uma lista de itens para toda a cadeia: depósito, naves, depósito sobre outro planeta, [entity=cargo-landing-pad].\n\n• Abrir: «Linhas de suprimento…» no painel ou /shm-orbital-lines.\n• Conecte hubs e plataformas pelos painéis ao lado das janelas deles.\n• Defina para cada um função, locais e coeficiente e clique em «Aplicar».\n\nUma mudança na lista chega a todos; cada um mantém seu coeficiente.\n\n[font=default-large-bold]Grupo próprio do mod[/font]\nNos hubs com marcações o mod mantém seu grupo [font=default-bold]⚙ Orbital Logistics — auto #…[/font] com filtros zerados — é assim que bloqueia a entrega de itens protegidos.\n\n• Não o edite nem o remova: enquanto o mod retém algo, ele volta sozinho.\n• Quando não há nada a reter, o mod o remove, inclusive da lista de grupos.\n• Antes de remover o mod, desligue «Ativar Orbital Logistics» nas configurações do mapa: o mod remove seus grupos e marca de novo as seções de carga.
