[mod-setting-description]
shm-orbital-logistics-debug=Só na versão de depuração: ativa o comando de demo /shm-orbital-demo. Ausente nas versões publicadas.
shm-orbital-logistics-panel-position=Onde o painel do Orbital Logistics fica junto à janela do hub. Embaixo e em cima, os blocos ficam em linha.
shm-orbital-logistics-enabled=Ao desativar, o mod remove suas seções de todos os hubs e reativa as seções de carga. Desative antes de remover o mod.

