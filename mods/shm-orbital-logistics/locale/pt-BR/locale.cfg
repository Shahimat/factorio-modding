[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=Depósitos e carga com destino para plataformas espaciais, sobre as transferências vanilla entre plataformas da 2.1. Marque uma seção de pedidos direto no painel do hub como reserva, carga para planetas escolhidos ou depósito para órbitas escolhidas: a reserva nunca é entregue, a carga fica retida até o destino e um depósito abastece outras plataformas em suas órbitas. Linhas de suprimento mantêm uma única lista de itens para toda uma cadeia de depósitos, naves e plataformas de pouso.

