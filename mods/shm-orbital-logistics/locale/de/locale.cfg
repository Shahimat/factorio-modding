[tips-and-tricks-item-name]
shm-orbital-logistics=Orbital Logistics

[tips-and-tricks-item-description]
shm-orbital-logistics=Depots und Fracht mit Ziel für Weltraumplattformen, aufbauend auf den Übertragungen zwischen Plattformen aus 2.1.\n\n• Transportiert wird wie gewohnt von Raketen und Plattformen.\n• Die Mod entscheidet nur, ob ein Hub einen Gegenstand im aktuellen Orbit abgeben darf.\n• Alles wird im Feld unter dem Fenster des [entity=space-platform-hub] eingestellt.\n• Der Block «Abgabe in diesem Orbit» im Feld zeigt für jeden markierten Abschnitt, ob er hält oder abgibt, und die Ausnahmen.\n\n[font=default-large-bold]Zweck von Abschnitten[/font]\nEin Abschnitt ist ein Anfrageblock im Hub-Fenster – hinzugefügt mit «Abschnitt hinzufügen». Sein Zweck ist eine Markierung im Gruppennamen:\n\n• [font=default-bold][reserve][/font] – eigene Reserve, wird nie abgegeben.\n• [font=default-bold][cargo→aquilo][/font] – Fracht für [planet=aquilo], unterwegs gesperrt.\n• [font=default-bold][depot:nauvis][/font] – Depot über [planet=nauvis].\n\nIm Feld Zweck und Orte wählen und «Anwenden» drücken. Die Markierung gilt für alle Hubs mit dieser Gruppe. Ohne Markierung funktioniert ein Abschnitt wie gewohnt.\n\nIn «Abgabe in diesem Orbit»: [img=utility/status_working] gibt ab, [img=utility/status_yellow] hält, [img=utility/status_blue] bis zum Abflug aus, [img=utility/status_inactive] Depot holt gebrachte Fracht.\n\n[font=default-large-bold]Depots und Transit[/font]\nEin Depot [font=default-bold][depot:…][/font]:\n\n• wird wie gewohnt vom Planeten befüllt;\n• gibt in seinen Orbits an andere Plattformen ab;\n• behält in anderen Orbits alles.\n\nKommt Fracht für seinen Orbit an, holt das Depot sie zuerst bis zu seiner eigenen Anfrage und verteilt sie dann. Solange gebrachte Fracht im Orbit ist, wird sie zuerst abgegeben.\n\n[font=default-large-bold]Fracht und Sammeln[/font]\nFracht [font=default-bold][cargo→…][/font]:\n\n• wird unterwegs nicht abgegeben – weder an Plattformen noch an Planeten;\n• wird nur über den gewählten Planeten abgegeben;\n• ohne gewählte Planeten wie gewohnt auf Anfrage.\n\n[font=default-bold]Sammeln[/font]: «Importieren von» leer lassen und eine große Menge setzen – die Plattform sammelt in jedem Orbit. Am Ziel nimmt die Mod den Haken der Gruppe heraus, damit die Fracht abgegeben werden kann, und setzt ihn beim Abflug wieder. Im Feld ist so ein Abschnitt mit «(aus bis zum Abflug)» markiert.\n\n[font=default-large-bold]Versorgungslinien[/font]\nEine Versorgungslinie ist eine Liste von Gegenständen für die ganze Kette: Depot, Shuttles, Depot über einem anderen Planeten, [entity=cargo-landing-pad].\n\n• Öffnen: «Versorgungslinien…» im Feld oder /shm-orbital-lines.\n• Hubs und Landeplätze über die Felder an ihren Fenstern anschließen.\n• Für jeden Rolle, Orte und Faktor setzen und «Anwenden» drücken.\n\nEine Änderung der Liste erreicht alle Teilnehmer, jeder behält seinen Faktor.\n\n[font=default-large-bold]Eigene Gruppe der Mod[/font]\nAuf Hubs mit Markierungen hält die Mod ihre Gruppe [font=default-bold]⚙ Orbital Logistics — auto #…[/font] mit Null-Filtern – so sperrt sie die Abgabe geschützter Gegenstände.\n\n• Nicht bearbeiten oder entfernen – solange die Mod etwas hält, kommt sie von selbst zurück.\n• Gibt es nichts zu halten, entfernt die Mod sie, auch aus der Gruppenliste.\n• Vor dem Entfernen der Mod «Orbital Logistics aktivieren» in den Karteneinstellungen ausschalten: die Mod entfernt ihre Gruppen und setzt die Haken der Frachtabschnitte zurück.
