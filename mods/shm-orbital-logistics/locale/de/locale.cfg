[mod-name]
shm-orbital-logistics=Orbital Logistics

[mod-description]
shm-orbital-logistics=Depots und Fracht für Weltraumplattformen auf Basis der Vanilla-Übertragungen zwischen Plattformen. Markierung im Namen einer Logistikgruppe: [reserve] wird nie abgegeben, [cargo→aquilo] wird bis zum Zielort gehalten, [depot:nauvis] versorgt andere Plattformen in seinen Orbits.

[mod-setting-name]
shm-orbital-logistics-enabled=Orbital Logistics aktivieren

[mod-setting-description]
shm-orbital-logistics-enabled=Beim Ausschalten entfernt die Mod ihre Abschnitte von allen Hubs und schaltet Frachtabschnitte wieder ein. Vor dem Entfernen der Mod ausschalten.
