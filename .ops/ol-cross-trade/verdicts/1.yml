items:
  - key: cross-trade-two-planets-one-shuttle
    status: pass
    evidence: >
      mods/shm-orbital-logistics/tests/ingame/core.lua:341-418 (тест
      «встречный обмен двух планет одним челноком: грузы доходят до площадок»).
      Один челнок с двумя секциями [cargo→vulcanus] и [cargo→nauvis]; склады
      наполнены скриптом depot_a.insert/depot_b.insert (без ракет, как в демо).
      Проверки: плиты взяты именно со склада A (assert lows[1] <= 300);
      медь дошла до площадки Нависа (f.pad(f.PLANET) >= 50), плиты до площадки
      Вулкана (f.pad(f.OTHER_PLANET) >= 50); финальные состояния складов
      закреплены (depot_a == 150, depot_b == 100). Не всегда-зелёный: каждый
      wait имеет assert(reached, ...) с текущими значениями.
  - key: depot-proxy-transit-exact-then-self
    status: pass
    evidence: >
      core.lua:374-378 и 392-396 — «ровно до цели» проверяется двумя
      независимыми ассертами на каждый склад: settled = f.count +
      f.incoming <= цели (верхняя граница) и arrived/f.count >= цели
      (нижняя) — вместе дают ровно. Излишек у челнока закреплён
      (f.count(shuttle) == 50 при цели 150 и 200 в челноке). После
      опустошения: склад A сам отдаёт (f.count(shuttle) == 200) и сам
      сбрасывает на площадку (depot_a == 150, depot_b == 100), мусорные
      слоты пусты (f.trash == 0) — перекупа транзитом нет.
  - key: arrived-cargo-depot-collectors-invariants
    status: pass
    evidence: >
      core.lua:420-477 (тест «прибывший груз, склад ниже цели и два
      сборщика: итоги без перекачки»). Итоговые состояния: settled <= 200,
      сборщики >= 50; затем окно тишины на полный круг (fixture.watch с
      f.track): tracker.lowest >= 200 (склад не отдал привезённое),
      склад == 200, челнок == 0 (нет перекачки назад), сборщики == 50,
      мусор и площадка пусты. Порядок доставок не ассертится — done_when
      только по итоговым количествам, что соответствует crit.
  - key: v04d-depot-platforms-import-own-planet-drops
    status: pass
    evidence: >
      Оба теста держат привозное на складе с from='platforms' +
      import_from своей планеты (core.lua:345-352, 357-365, 431-433).
      Сброс на свою площадку закреплён: склад A (platforms+import_from
      nauvis) отдаёт медь на f.pad(f.PLANET) >= 50 (core.lua:399-409).
      Платформам не отдаёт: f.count(shuttle, COPPER) == 0 после возврата
      (core.lua:411-412) и tracker.lowest >= 200 во втором тесте —
      склад не отдал ни челноку, ни сборщикам.
