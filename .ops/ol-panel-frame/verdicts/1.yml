  - key: crit-6
    status: pass
    evidence: tests/ingame/gui.lua — 4 новых it(): «каркас при 12+ группах» (12 секций, maximal_height == cap на bottom/top/right, обе прокрутки не выше потолка), «Отдача при 12 складах с исключениями» (12 строк now-depot-here + 12 now-depot-no-give, прокрутка в потолке), «блоки сворачиваются по отдельности» (итог 2/1 по caption, клик разворачивает, независимость блоков, переоткрытие), «пустой блок линий — одна кнопка» (хаб и площадка, превращение в полный)
    reason: >-
      Ассерты осмысленные и по содержимому: счётчики локализованных строк,
      чтение аргументов локали из caption, сравнение итога с числом
