    evidence: storage.panel_block_collapsed[player_index][key]; control.lua — on_init и on_configuration_changed досоздают поле; panel.lua block_collapsed() читает в build(); refresh_all → find_named не находит контейнеры свёрнутого блока — fill_now/fill_warnings пропускаются; on_click 'shm_ol_block_toggle'/'shm_ol_block_summary' переключает состояние и перестраивает; gui-тест: независимое сворачивание, переоткрытие окна сохраняет состояние
    reason: >-
      Состояние per player в storage рядом с panel_collapsed, переживает
      переоткрытие и сохранение/загрузку (storage сериализуется), init и
