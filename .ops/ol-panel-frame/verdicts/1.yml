      per-second. Разворачивание по клику подтверждено тестом.
  - key: crit-4
    status: pass
    evidence: «Отдача» — итог из now_data() (те же данные, что у fill_now после рефактора); «Группы» — section_rows() с условием «section.is_manual and not controller.is_service(...)» — дословно тем же, по которому add_sections рендерит строки; «Линии» — #member; gui-тест сверяет итог с числом отрендеренных строк (shm_ol_apply_*), а не с константой
    reason: >-
      Числа считаются по реальному содержимому: условие итога «Групп»
      совпадает с условием рендера строк, «Отдача» считается из общих с
