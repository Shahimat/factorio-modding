items:
  - key: crit-1
    status: pass
    evidence: mods/shm-orbital-logistics/runtime/panel.lua — height_cap() (display_resolution.height / display_scale * 0.8, panel.HEIGHT_SHARE экспортирован); в build() «if cap then frame.style.maximal_height = cap; frame.style.vertically_squashable = true end» — без ветки по положению, применяется и при bottom/top; блок-контейнеры и scroll_pane помечены vertically_stretchable/squashable, у каждой прокрутки свой maximal_height
    reason: >-
      Потолок считается от player.display_resolution с учётом display_scale и
      ставится на рамку во всех четырёх положениях (широких и боковых) —
      условие wide влияет только на maximal_width и раскладку, не на
      потолок. Доведение до контента — через squashable-цепочку
      рамка → блок → scroll-pane. В gui-тесте потолок ассертится на bottom,
      top и right.
  - key: crit-2
    status: pass
    evidence: panel.lua, build(): shm_ol_scroll_sections (внутри — flow shm_ol_warnings с предупреждениями + add_sections), shm_ol_scroll_now (fill_now), shm_ol_scroll_lines (add_lines) — все scroll-pane с direction = 'vertical'
    reason: >-
      Каждый из трёх блоков живёт в собственном вертикальном scroll-pane;
      предупреждения «Групп» внутри прокрутки блока секций.
  - key: crit-3
