  - key: crit-5
    status: pass
    evidence: panel.lua build(): при «#member == 0 and #lines.list(force) == 0» — единственная кнопка shm_ol_open_lines, без заголовка и прокрутки; ключ lines-none удалён; паритет проверен judge'ом: во всех 11 локалях по 90 ключей, отсортированные множества идентичны en, lines-none нигде нет; gui-тест ассертит отсутствие заголовка/прокрутки/lines-none у хаба и площадки и появление полного блока после создания линии
    reason: >-
