id: advanced-belt-tiers-follow-settings
kind: behavior
namespace: mods
entities: [advanced-belts]
title: Тиры лент после турбо создаются со скоростью и дальностью из настроек
scenarios:
  - given: включены Space Age и мод с настройками по умолчанию
    when: игра загружается
    then: >-
      есть ленты, подземки и сплиттеры тиров «Превосходный», «Ультра»,
      «Гипер», «Абсолютный» со скоростью 90 / 105 / 135 / 150 предм./с и
      дальностью подземки 15 / 19 / 23 / 27, у каждого тира своя технология
  - given: игрок выставил тиру другую скорость из списка и другую дальность
    when: игра загружается
    then: лента, подземка, сплиттер и лоадер тира идут с этой скоростью, подземка — с этой дальностью
  - given: исследована технология тира
    when: игрок открывает меню крафта
    then: >-
      рецепты ленты, подземки и сплиттера тира доступны в сборочном автомате
      и в литейке на любой поверхности, ингредиенты — лента предыдущего тира,
      ресурсы планеты тира и лубрикант
  - given: исследования тиров открыты
    when: игрок смотрит их в дереве исследований
    then: >-
      они называются «Превосходная логистика», «Ультра-логистика»,
      «Гипер-логистика», «Абсолютная логистика»
  - given: технология тира «Абсолютный»
    when: игрок смотрит её в дереве исследований
    then: среди колб есть прометиевая, среди пререквизитов — технология прометиевой науки
  - given: игрок держит планировщик улучшений
    when: применяет его к турбо-ленте, подземке и сплиттеру
    then: >-
      они меняются на тир «Превосходный», тот — на «Ультра» и далее по
      порядку; с Krastorio 2 турбо улучшается в ленту K2 — K2 грузится позже и
      перезаписывает это поле, а цепочка внутри тиров мода остаётся своей
  - given: включён Krastorio 2
    when: игра загружается
    then: ошибок нет, ленты K2 и тиры мода существуют рядом, у каждой линейки своя цепочка улучшений
verified: true
verified_at: 2026-10-25
verified_note: >-
  Factorio 2.1.23, Space Age, AAI Loaders 0.3.0. Тестами в игре
  (`tests/ingame/prototypes.lua`) в прогонах с AAI, без AAI, с зондом и с
  K2 Spaced Out 2.0.19: наличие, скорости, дальности 15 / 19 / 23 / 27,
  категории и отсутствие условий поверхности у рецептов, сборка из
  предыдущего тира, технологии и прометиевая наука, цепочка улучшений,
  отсутствие ошибок рядом с K2. Сценарий 2 — чтение настроек тем же кодом,
  что и значений по умолчанию, плюс Lua-тест слияния и прогон зонда с другой
  скоростью тира. Имена технологий из сценария 7 — ключи локали, текст
  проверен владельцем в игре до переименования, новый — глазами не смотрен.
