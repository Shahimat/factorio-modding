id: aai-loader-price-divided-in-expensive-mode
kind: behavior
namespace: mods
entities: [advanced-belts]
title: Делитель цены уменьшает рецепты лоадеров AAI только в режиме expensive
scenarios:
  - given: AAI Loaders в режиме `expensive`, делитель 5
    when: игра загружается
    then: >-
      у всех рецептов лоадеров AAI — самого AAI, мода и других модов —
      количество каждого ингредиента поделено на 5 с округлением вверх,
      минимум 1; лоадер предыдущего тира в ингредиентах остаётся как был
  - given: тот же режим и делитель
    when: игрок перерабатывает лоадер AAI
    then: переработка отдаёт четверть уже поделённых ингредиентов, а не исходных
  - given: AAI Loaders в режиме `lubricated`
    when: игра загружается
    then: рецепты лоадеров AAI не меняются при любом делителе
  - given: делитель 1
    when: игра загружается
    then: рецепты лоадеров AAI такие же, как без мода
verified: true
verified_at: 2026-10-25
verified_note: >-
  Factorio 2.1.23, Space Age, AAI Loaders 0.3.0. Сценарии
  1–3 — тестами в игре: зонд переводит AAI в `expensive`, у турбо-лоадера
  AAI вольфрам 300 → 60, у лоадера «Превосходный» гольмий 300 → 60,
  предыдущий лоадер остаётся 1, переработка турбо-лоадера отдаёт 15
  вольфрама; в `lubricated` рецепт AAI не тронут. Сценарий 4 — Lua-тестом
  `tests/price.test.lua`.
