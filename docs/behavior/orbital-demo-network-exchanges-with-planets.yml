id: orbital-demo-network-exchanges-with-planets
kind: behavior
namespace: mods
entities: [orbital-logistics]
title: Отладочная сеть обменивается грузом с пятью планетами настоящими ракетами и капсулами
summary: "Dev-only network создаёт пять планетарных узлов, склады и челноки; реальные отправления, приём, повторный запуск и безопасная очистка проверяются в игре."
scenarios:
  - given: рабочая отладочная сборка, Space Age, администратор тестовой карты без площадок своей силы на пяти планетах, исследования не требуются
    when: выполняется /shm-orbital-demo network
    then: >-
      создаются пять орбитальных складов, пять двусторонних челноков и по
      планетарному узлу с фильтрами площадки, автоматическим силосом, роботами,
      источниками и приёмником; Аквило получает обогрев и дополнительные зарядные
      робопорты, Фульгора — молниезащиту; включаются необходимые разрешения,
      но технологии не исследуются и бонусы роботов не меняются
  - given: первичный груз отсутствует в хабах и появляется только в планетарных infinity-провайдерах
    when: мир работает и челноки выполняют штатные расписания с учебным ускорением тяги
    then: >-
      каждая планета отправляет не менее двух настоящих ракет, последующие
      ракеты собираются из компонентов, поднятый груз доходит до склада;
      все челноки посещают обе остановки, каждая площадка получает импорт
      настоящими капсулами и разгружается настоящим манипулятором в infinity sink
  - given: сеть уже построена
    when: администратор повторяет network
    then: ссылки на сцену и число объектов не меняются
  - given: на одной из планет уже есть площадка своей силы
    when: запрашивается создание новой сети
    then: создание отклоняется до изменения чужих объектов и их фильтров
  - given: сеть и посторонняя постройка, платформа с похожим именем и участник одной из её групп
    when: выполняется network-clear
    then: >-
      свои объекты, ракеты, капсулы и метки удаляются по сохранённым ссылкам;
      чужие объекты и используемая ими группа сохраняются; повторная очистка
      ничего не меняет; грунт, поверхности и разрешения силы не откатываются
  - given: обычный игрок без прав администратора
    when: запрашивается network, network-clear или общая clear
    then: создание и удаление демо-сети запрещены
  - given: исходная сила с демо-сетью сливается с другой
    when: приходит on_forces_merging, пока исходная сила ещё действительна
    then: сеть убирается до уничтожения индекса силы, а посторонние постройки переходят новой силе
check: npm run test:ingame -w shm-orbital-logistics -- 'планетарная демо'
verified: true
verified_at: 2026-11-14
verified_note: >-
  Factorio 2.1.24 mac-arm64: три профильных теста прошли headless и с графикой
  на свежей силе без исследований; число изученных технологий не меняется.
  Проверены повторные настоящие подъёмы ракет, приём в инвентари всех пяти
  площадок, разгрузка с учётом новых доставок, полёты и обе остановки каждого
  челнока, точная очистка, чужие объекты/общая группа и слияние сил.
  Свежие снимки всех пяти узлов просмотрены, включая зарядные порты Аквило.
  GUI-тест admin-защиты network-clear и общей clear прошёл; создание network
  защищено той же проверкой обработчика. Полный GUI-набор имеет пять
  независимо воспроизведённых старых падений: entity orbital-logistics,
  gui_test_status. Демо с обычным качеством не закрывает полный K-01 ×5.
manuals: [run-orbital-demo]
