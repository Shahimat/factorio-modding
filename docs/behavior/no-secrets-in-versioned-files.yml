id: no-secrets-in-versioned-files
kind: behavior
namespace: platform
entities: [repo-toolchain]
title: В версионируемые файлы не попадает ничего чувствительного
scenarios:
  - given: репозиторий публичный
    when: запускается `npm run check-secrets`
    then: >-
      сканируется ровно то множество файлов, которое попадёт в git —
      `git ls-files` плюс неигнорируемые untracked, — и находок нет
  - given: API-ключ мод-портала
    when: он нужен инструментам
    then: >-
      значение живёт только в `.env.local` вне git либо в хранилище ключей
      системы (Keychain на macOS, Secret Service на Linux), а в
      репозитории лежит `.env.example` без значений
  - given: '`.gitignore` репозитория'
    when: проверяется командой `git check-ignore`
    then: >-
      `.env`, `.env.local`, `secrets/`, `*.key`, `player-data.json`, `dist/` и
      `node_modules/` скрыты, а `.env.example` не скрыт
  - given: файл с секретом под контролем git
    when: прогоняется проверка
    then: >-
      находка выдаётся с кодом возврата 1 — для литерального токена после
      `Bearer`, присваивания секретного поля, известных префиксов токенов,
      логина с паролем в URL, адреса e-mail вне белого списка, длинной
      hex- или base64-строки вне поля хеша, абсолютного пути с именем
      пользователя и запрещённого имени файла
  - given: контрольные суммы и публичные адреса поддержки Wube
    when: прогоняется проверка
    then: >-
      они не считаются находками — `sync.index_sha`, `synced_sha`, поля
      `integrity` в `package-lock.json`, `support@factorio.com` и
      `factorio@factorio.com` проходят
  - given: находка в любом файле репозитория
    when: запущен `npm run check`
    then: >-
      весь конвейер проверки завершается кодом 1, а не только печатает
      сообщение — у сканера нет исключений ни для одного файла, включая
      собственные тесты
verified: true
verified_at: 2026-10-04
verified_note: >-
  Прогнано 2026-10-04 в обе стороны. Положительный прогон: на 72 файлах
  репозитория ноль находок, `git check-ignore` подтвердил и скрытые пути, и
  незакрытый `.env.example`. Отрицательный прогон на временных пробах
  (удалены): поймано девять заготовленных утечек плюс запрещённое имя файла,
  при нуле ложных срабатываний на настоящих файлах. Отдельно проверено, что
  подложенный токен в новом файле роняет весь `npm run check` с кодом 1, а
  после уборки код снова 0. По ходу отладки найдены и закрыты три дефекта
  правил: граница слова не давала поймать `..._API_KEY=`, порог hex в 32
  символа пропускал 30-символьный `service-token` Factorio, а слеш в алфавите
  base64 ловил файловые пути и `integrity`.

  Уточнение реализации по статическому чтению `tools/lib/secret-scan.ts`
  2026-11-12: исключения длинных hex/base64 относятся к конкретному
  вхождению, не всей строке. `isHashFieldValue` распознаёт только само
  значение поля хеша; соседние значения продолжают сканироваться.
  `isPublicCommit` разрешает только 40hex commit-сегмент публичного HTTPS
  raw-URL upstream `raw.githubusercontent.com/Shahimat/ai-prompts/`, не
  query или другие значения URL. `checksumOffset` разрешает в Markdown
  только ведущую отдельную 64hex checksum-колонку с label `SHA`, `SHA256`
  или `SHA-256` на текущей или двух предыдущих строках. В блоке без языка
  либо с `text` контекст label перед открытием продолжается до закрытия блока;
  произвольные assignments исключения не получают. Остальные правила,
  включая присваивания секретов, известные токены и приватные пути,
  действуют и на строках с разрешённой checksum. Границы исключений и
  соседние находки закреплены в `tools/lib/secret-scan.test.ts`
  (28 существующих тестов, в том числе на неверные URL/колонки, query,
  выход из блока и соседние hex/base64/token/private-home).
