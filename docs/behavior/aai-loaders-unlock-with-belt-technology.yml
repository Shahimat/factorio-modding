id: aai-loaders-unlock-with-belt-technology
kind: behavior
namespace: mods
entities: [advanced-belts]
title: По флажку лоадеры AAI открываются технологиями своих лент
scenarios:
  - given: AAI Loaders и мод, флажок «лоадеры без отдельных технологий» выключен (по умолчанию)
    when: игра загружается
    then: у лоадеров AAI свои технологии, как в AAI Loaders без мода
  - given: флажок включён
    when: игрок исследует технологию ленты — ванильную логистику, турбо-логистику или логистику тира мода
    then: вместе с лентой открывается рецепт лоадера AAI той же скорости
  - given: флажок включён
    when: игрок смотрит дерево исследований
    then: >-
      отдельных технологий лоадеров AAI в нём нет, а технологии, которые
      требовали технологию лоадера, требуют технологию его ленты
  - given: флажок включён, лоадер другого мода с лентой, которую открывает технология того мода
    when: игра загружается
    then: лоадер открывается той технологией — лента находится по рецепту лоадера, а не по имени
verified: true
verified_at: 2026-10-25
verified_note: >-
  Factorio 2.1.23, Space Age, AAI Loaders 0.3.0. Сценарий 1 —
  тестом в игре в прогоне с AAI без флажка. Сценарии 2 и 3 — тестами в игре
  с зондом, который включает флажок: жёлтый, синий и турбо-лоадеры AAI и
  лоадеры тиров открываются технологиями своих лент, технологии лоадеров
  спрятаны, ни одна видимая технология не требует спрятанную. Сценарий 4 и
  поиск ленты по скорости и через подземку — Lua-тестами
  `tests/unlocks.test.lua`.
