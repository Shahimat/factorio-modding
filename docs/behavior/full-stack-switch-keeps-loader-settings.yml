id: full-stack-switch-keeps-loader-settings
kind: behavior
namespace: mods
entities: [advanced-belts]
title: Переключение режима полной стопки не теряет настройки лоадера
scenarios:
  - given: открыто окно лоадера
    when: игрок щёлкает переключатель «Сразу / Полная стопка» в панели справа
    then: режим меняется, окно остаётся открытым, переключатель показывает новый режим
  - given: открыто окно призрака лоадера
    when: игрок щёлкает переключатель в панели справа
    then: призрак меняет режим, окно остаётся открытым на нём, переключатель показывает новый режим
  - given: открыто окно призрака лоадера
    when: призрак достраивают — робот или игрок
    then: окно переходит на построенный лоадер, панель режима на месте и показывает его режим
  - given: курсор над лоадером в пределах досягаемости
    when: игрок жмёт `SHIFT + M`
    then: режим меняется, над лоадером всплывает текст с новым режимом
  - given: лоадер с направлением, типом (вход или выход), фильтрами, размером стопки, проводами и условием сети, повреждённый, с предметами на ленте
    when: режим переключается
    then: все перечисленные настройки, здоровье и предметы те же, что до переключения
  - given: лоадер AAI в режиме `lubricated` с лубрикантом
    when: режим переключается
    then: лоадер продолжает работать, лубрикант не теряется, лишних скрытых труб в мире не остаётся
  - given: лоадер в любом режиме
    when: игрок копирует его в чертёж и строит, или копирует настройки на другой лоадер того же вида
    then: построенный лоадер и приёмник получают режим источника; приёмником может быть и призрак
  - given: призрак лоадера в режиме, отличном от режима по умолчанию
    when: игрок строит на нём предмет лоадера из руки
    then: построенный лоадер в режиме призрака, у лоадера AAI в режиме `lubricated` одна труба; если окно призрака было открыто, оно открыто на построенном
  - given: курсор над призраком лоадера, на любом расстоянии
    when: игрок жмёт `SHIFT + M`
    then: призрак меняет режим, его направление, тип, фильтры, стопка, провода, условие сети и метки те же
  - given: курсор над чужим лоадером
    when: игрок жмёт `SHIFT + M`
    then: ничего не меняется
verified: true
verified_at: 2026-10-27
verified_note: >-
  2026-10-27 добавлены призраки: тестами в игре (Factorio 2.1.23, Space
  Age, AAI Loaders 0.3.0; `switch.lua` и `gui.lua` в прогоне с графикой)
  проверены замена призрака с переносом настроек, панель с
  `ghost_mode = 'both'`, щелчок и клавиша на призраке, пересборка панели
  при достройке, постройка из руки поверх призрака другого режима с одной
  трубой AAI. Владелец в игре проверил то, что скрипт не видит: панель
  «Стопка на ленте» нарисована у окна призрака погрузчика и остаётся после
  достройки. Прежняя проверка 2026-10-25:
  Factorio 2.1.23, Space Age, AAI Loaders 0.3.0. Сценарии 3–6 — тестами в
  игре (`tests/ingame/switch.lua`): перенос направления, типа, фильтров,
  стопки, проводов, условия сети, здоровья и качества (без предметов на
  ленте самого лоадера), лубрикант и одна труба после замены лоадера AAI,
  чертёж, вставка настроек, отказ на призраке и чужом лоадере. Сценарии 1
  и 2 — владелец в игре: панель «Стопка на ленте» у окна погрузчика видна и
  переключает режим, `SHIFT + M` над погрузчиком переключает его.
