id: orbital-supply-line-syncs-participants
kind: behavior
namespace: mods
entities: [orbital-logistics]
title: Линия снабжения держит у участников свои группы, правка шапки доходит до всех
scenarios:
  - given: линия с 2000 редких железных плит; склад ×5, два челнока-груза ×1 и ×0.5, грузовая площадка ×0.5
    when: линия синхронизируется
    then: склад в группе `<линия> · nauvis/planet [depot:nauvis]`, оба челнока в одной группе `<линия> · nauvis/platforms [cargo→aquilo]`, площадка в `<линия> · pad`, у каждого свой множитель (K-17, K-21)
  - given: та же линия
    when: в шапке редкое меняется на легендарное и 2000 на 3000, добавляется медь
    then: фильтры обновлены у всех участников, множители остались свои (K-15)
  - given: на хабе ручная секция
    when: хаб подключается к линии
    then: ручная секция не тронута, у хаба ровно одна секция линии (K-16)
  - given: участник меняет роль
    when: линия синхронизируется
    then: он переходит в другую группу, старая группа удалена
  - given: линия с двумя участниками
    when: один отключается, потом линия удаляется
    then: секции линии сняты, групп линии нет
  - given: создаётся линия с пустым именем, с « · » или с занятым именем
    when: игрок жмёт «Создать»
    then: отказ; переименование линии переносит её группы на новое имя
  - given: окно линий
    when: игрок создаёт линию, подключает хаб и площадку из панели, выбирает предмет, задаёт количество, роль, места и множители и жмёт «Применить»
    then: участники получают свои группы и множители
verified: true
verified_at: 2026-10-27
verified_note: >-
  Factorio 2.1.23, Space Age. Сценарии 1–6 — тесты в игре
  `tests/ingame/lines.lua`, сценарий 7 — тест с графикой `tests/ingame/gui.lua`.
