id: logistic-mode-available-on-any-building
kind: behavior
namespace: mods
entities: [logistic-buildings]
title: Логистический режим включается на любом подходящем здании без кода под конкретный мод
scenarios:
  - given: здание из чужого мода с инвентарём ингредиентов и выбором рецепта
    when: игрок открывает его штатное окно
    then: >-
      переключатель логистического режима доступен, а тип здания определён по
      типу и свойствам прототипа (наличие топки, инвентаря патронов,
      допустимые категории рецептов), а не по имени
  - given: мод Cerys с башнями на твёрдом топливе
    when: игрок включает режим на такой башне
    then: >-
      башня подхватывается по наличию топки и заправляется выбранным топливом,
      кода под Cerys в моде нет
  - given: силе игрока ещё не открыт рецепт предмета, ставящего сундук пассивного снабжения
    when: игрок открывает панель здания
    then: >-
      режим недоступен, строка состояния — «режим недоступен: не открыты
      сундуки»; режимы выдачи появляются с открытием рецепта пассивного
      сундука, а запросы и активный выход — с открытием рецептов сундуков
      запроса и активного снабжения
  - given: имя сущности внесено в список исключённых зданий в настройках запуска
    when: игрок открывает её панель
    then: переключатель режима недоступен, скрытые сундуки не создаются
  - given: чистая Factorio 2.0 без единого DLC
    when: мод загружается
    then: >-
      загрузка проходит без ошибок, учёт ведётся по паре «предмет + качество» с
      единственным «обычным» качеством, отдельной ветки кода под отсутствие
      Quality нет
  - given: здание в логистическом режиме на поверхности без логистических сетей (космическая платформа)
    when: скрипт навещает здание
    then: >-
      мод молча ничего не делает, ошибок в логе нет, строка состояния — «нет
      логистической сети»
verified: false
verified_at: null
verified_note: >-
  Поведение выведено из ТЗ `specs/03102026_spec_logistic_buildings.md`
  (разделы 2.2, 4.3, 4.4) при планировании программы 2026-10-04. Кода мода
  ещё нет. Проверяется интеграционным стендом в игре и пруфами подцелей
  `lb-core` и `lb-compat-release`.
