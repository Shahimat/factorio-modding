id: tools-covered-by-unit-tests
kind: behavior
namespace: platform
entities: [repo-toolchain]
title: Логика покрыта юнит-тестами своего скоупа, тесты входят в проверку
scenarios:
  - given: репозиторий со свежим `npm ci`
    when: запускается `npm test`
    then: >-
      встроенный раннер Node находит тесты по glob `tools/**/*.test.ts` и все
      проходят; внешних зависимостей для тестов не требуется, и в `mods/`
      прогон не заходит
  - given: '`npm run check`'
    when: он запускается
    then: >-
      `npm test` выполняется в нём до проверок секретов, документации и модов,
      и падение теста останавливает всю проверку
  - given: модуль с логикой проверки в `tools/lib/`
    when: смотрим на его набор тестов
    then: >-
      есть положительный случай, по тесту на каждое правило модуля и явная
      проверка границы между ошибкой и замечанием
  - given: логика, смешанная с чтением файлов или вызовом git
    when: она нуждается в тестах
    then: >-
      чистая часть вынесена в отдельную функцию, а I/O остаётся тонкой
      обёрткой — так сделано для `parseChangelog`, `checkInfoJsonText` и
      `tools/lib/secret-scan.ts`
  - given: тест, которому нужна файловая система
    when: он выполняется
    then: >-
      работает во временном каталоге из `node:os.tmpdir()`, удаляет его в
      `finally` и не обращается ни к сети, ни к мод-порталу
  - given: пакет мода с тестами в `tests/*.test.lua`
    when: запускается `npm run check:mod -- <mod-key>`
    then: >-
      харнесс исполняет тесты только этого мода, модули мода доступны через
      `require` по обычным именам, а заглушки игрового API — через
      `require('stubs.factorio')`
  - given: пакет мода без единого файла `*.test.lua`
    when: по нему запускается прогон тестов
    then: >-
      это ошибка с кодом возврата 1, а не пустой зелёный прогон — иначе
      забытые тесты выглядели бы как успех
  - given: файл теста с синтаксической ошибкой либо упавший интерпретатор
    when: прогон выполняется
    then: >-
      незагрузившийся файл считается упавшим тестом, а вывод без итоговой
      строки `TOTAL` даёт отдельную находку со первой строкой stderr
  - given: исходник мода с конструкцией, которой нет в Lua 5.2
    when: запускается `npm run validate`
    then: >-
      находка с идентификатором правила и номером строки; та же конструкция
      внутри строкового литерала или комментария находкой не считается
  - given: мод-щуп в `poc/`, куда `validate` не ходит
    when: запускается `npm run check-lua -- <скоуп>`
    then: >-
      диалект проверен по тому же набору правил; скоуп задаётся именем (с
      приставкой `shm-` или без), путём либо `--all`, а без скоупа команда
      отказывается работать с кодом возврата 1
  - given: тесты мода и его `package.json`
    when: собирается zip релиза
    then: >-
      `tests/`, `*.test.lua` и `package.json` в архив не попадают — игроку
      они не нужны
  - given: тесту нужна фикстура, похожая на секрет
    when: она заводится
    then: >-
      хранится в исходнике сломанной и собирается в рантайме, а исключения
      для файла в сканере не появляется — иначе в правиле `secrets` возникла
      бы дыра
verified: true
verified_at: 2026-10-04
verified_note: >-
  `npm test` 2026-10-04: 107 тестов, все проходят, 0 внешних зависимостей.
  Покрыты `problems`, `changelog` (parseChangelog), `info-json`
  (checkInfoJsonText), `secret-scan`, `docs-model`, `packages`,
  `lua-dialect`, `lua-test-runner`, `dod`, `pack-filter`. Три найденных
  ранее дефекта правил сканера закрыты регрессионными тестами с пояснением
  в комментарии. Проверено и то, что раннер не находит `.ts` обходом
  каталога и требует glob. Сценарии про моды сняты на временном пакете
  `mods/shm-smoke`, удалённом после прогона: `npm test -w shm-smoke` и
  `npm run check:mod -- smoke` зелёные, `require` модулей мода и
  `require('stubs.factorio')` работают, пакет без тестов даёт код
  возврата 1, файл с синтаксической ошибкой считается упавшим тестом,
  `npm run validate` ловит `//`, `&` и глобальный `unpack`, а в
  `dist/shm-smoke_0.1.0.zip` не попали ни `tests/`, ни `package.json`.
  Проверку блока `dod` сняли на временных `program--smoke` и
  `goal--smoke-sub`. `npm run check-lua` проверен на временном
  `poc/shm-logistic-probe`: находки по имени без приставки, по пути и через
  `--all`, код возврата 1 без скоупа и на неизвестном имени, при этом
  `npm run validate` щуп не видит — всё удалено после прогона. Пробел: `check-docs-layers` и `check-docs-context`
  работают от константы `REPO_ROOT` и юнит-тестами не покрыты, см.
  convention `testing`, раздел «Известный пробел».
