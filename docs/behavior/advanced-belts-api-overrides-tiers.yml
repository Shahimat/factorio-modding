id: advanced-belts-api-overrides-tiers
kind: behavior
namespace: mods
entities: [advanced-belts]
title: Другой мод перенастраивает тиры через API ShmAdvancedBelts
scenarios:
  - given: мод с зависимостью `? shm-advanced-belts` в своём `data.lua` задаёт тиру скорость, цвет, ингредиенты рецептов и технологию
    when: игра загружается
    then: тир создан с этими значениями, настройка скорости этого тира игроком игнорируется
  - given: тот же мод выключает тир через API
    when: игра загружается
    then: тир не создан, цепочка сшита, как при выключении настройкой
  - given: мод передаёт в API неизвестный ключ тира или скорость не из шага движка
    when: игра загружается
    then: неизвестный ключ — ошибка загрузки с понятным текстом; скорость округляется до ближайшего шага 1,875 предм./с
  - given: мод изменил рецепт тира через API
    when: игрок перерабатывает ленту этого тира
    then: переработка отдаёт ингредиенты изменённого рецепта
verified: true
verified_at: 2026-10-25
verified_note: >-
  Factorio 2.1.23, Space Age, AAI Loaders 0.3.0. Сценарии 1, 2 и 4 —
  тестами в игре с зондом `tests/ingame/probe/`: «Гипер» со скоростью 120,
  рецептом и количеством колб из API, переработка по новому рецепту,
  «Абсолютный» выключен через `set_enabled`. Сценарий 3 — Lua-тестами
  `tests/api.test.lua` и `tests/tiers.test.lua`.
