id: building-settings-survive-blueprint-and-copy
kind: behavior
namespace: mods
entities: [logistic-buildings]
title: Настройки режима переживают чертёж и штатное копирование настроек
scenarios:
  - given: настроенное здание в логистическом режиме
    when: игрок снимает с него чертёж
    then: режим и все настройки мода сохраняются в тегах сущности чертежа
  - given: чертёж с такими зданиями
    when: участок строится дронами
    then: >-
      здания поднимаются сразу в логистическом режиме с теми же настройками,
      ручной донастройки не требуется
  - given: два однотипных здания, одно настроено
    when: игрок делает Shift + ПКМ на настроенном и Shift + ЛКМ на втором
    then: >-
      переносятся и ванильные настройки, и все настройки мода — режим,
      источники ингредиентов, пороги и партии, режимы выхода, выбранные
      топливо, патроны, семена и способ их доставки
  - given: настройки копируются между зданиями разных типов
    when: игрок применяет вставку
    then: переносится только применимое к целевому зданию, ошибок в логе нет
  - given: игрок ставит новое здание вручную
    when: здание построено
    then: оно в обычном режиме — логистический режим сам не включается
verified: false
verified_at: null
verified_note: >-
  Поведение выведено из ТЗ `specs/03102026_spec_logistic_buildings.md`
  (раздел 7.4) при планировании программы 2026-10-04. Проверяется
  интеграционным стендом и пруфом подцели `lb-panel` (сценарии приёмки
  «копирование» и «чертёж»).
