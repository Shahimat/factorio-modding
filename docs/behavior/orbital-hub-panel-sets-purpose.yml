id: orbital-hub-panel-sets-purpose
kind: behavior
namespace: mods
entities: [orbital-logistics]
title: Панель у окна хаба ставит назначение секции и показывает состояние предметов
scenarios:
  - given: на хабе секция без группы и секция группы `Test plates`
    when: игрок выбирает в панели «Свой запас» для первой и «Склад» с местом `Nauvis` для второй и жмёт «Применить»
    then: первая получает группу `<платформа> #<номер> [reserve]` со своими фильтрами, вторая — `Test plates [depot:nauvis]` у всех хабов группы
  - given: секция `Test plates [depot:nauvis]`
    when: игрок выбирает «Без назначения» и жмёт «Применить»
    then: метка снята, имя группы — `Test plates`
  - given: на хабе над Наувисом секции `[reserve]`, `[depot:nauvis]`, `[depot:vulcanus]` и группа без метки, флаг раздачи выключен
    when: игрок открывает хаб
    then: >-
      в «Отдача на этой орбите» ровно три строки — «держит: свой запас», «раздаёт
      платформам на этой орбите», «держит: работает над Вулканом»; группы без
      метки там нет; красное предупреждение про выключенную раздачу, после
      включения флага его нет
  - given: над Наувисом челнок с `[cargo→nauvis]` и гольмием, склад `[depot:nauvis]` с нехваткой гольмия
    when: игрок открывает склад, затем челнок
    then: >-
      у склада исключение «склад добирает привезённый груз», у челнока —
      «отдаёт: это точка назначения»
  - given: хаб участвует в линии снабжения
    when: игрок открывает хаб
    then: поля секции линии в панели выключены с подсказкой, что ею управляет окно линий
  - given: хаб открыт, панель построена
    when: игрок добавляет в окне хаба новую группу
    then: не позже чем через секунду она появляется в панели
  - given: над Фульгорой хаб с группой `[cargo→fulgora]` с пустым «импорт из»
    when: мод выключает её на точке назначения и игрок открывает хаб
    then: группа в панели подписана «(выключена до отлёта)» с подсказкой, почему снята галочка
  - given: настройки игрока по умолчанию
    when: игрок открывает хаб
    then: панель стоит под окном, её блоки — в ряд; после смены настройки на «справа» — справа и столбиком
  - given: группа с новым именем уже есть
    when: игрок применяет метку, дающую это имя
    then: секция не переводится, игрок видит сообщение — чужая группа не затирается
  - given: строка секции с меткой раскрыта, у секции есть предметы
    when: игрок раскрывает детали группы
    then: >-
      по каждому предмету показаны «есть / свой запас / груз / склад /
      в пути / можно отдать» и фраза решателя, почему предмет ведёт себя
      так («запрашивается на Аквило, раздаётся на Аквило, включая
      платформы», «стоит: вне назначения»); у секции без метки —
      «без метки: работает как обычно»
  - given: в строке секции выбраны новое назначение и места
    when: игрок ещё не жмёт «Применить»
    then: >-
      в деталях строки — предпросмотр «будет: <фраза нового назначения>»;
      после применения фраза соответствует факту
  - given: у хаба много исключений разных типов состояния
    when: игрок смотрит «Отдача на этой орбите»
    then: >-
      исключения агрегированы по типам состояния — по строке на тип с
      иконками предметов, «+N ещё» и тултипом со всеми предметами, а не
      по строке на предмет
  - given: на хабе несколько секций с одним именем группы
    when: игрок открывает панель
    then: >-
      вместо N одинаковых строк — одна с « ×N»; правки из строки
      применяются секции-представителю (первой активной); после
      переименования строки расходятся по новым именам
  - given: секция выключена игроком, ещё одна группа без фильтров
    when: игрок смотрит статусы строк
    then: >-
      статусы честные: «выключена» для снятой игроком и «пустая группа»
      для группы без фильтров не путаются с «выключена до отлёта»
      (её ставит мод); счётчики в статусах — «(фильтров: N)»
verified: false
verified_at: null
verified_note: >-
  Семантика расширена раундом orbital-02 — детали предметов, предпросмотр
  «будет: …», агрегация исключений, ×N и честные статусы; прежний
  verified относился к старой редакции панели. Gui-прогон раунда PASS
  (23 теста; тикеты ol-panel-item-details и ol-panel-content, вердикты
  run 2 и run 1), но живого осмотра панели глазами не было — проверить
  по manual `test-orbital-manually` перед 1.0.0.
