id: toolchain-builds-under-strict-ts
kind: behavior
namespace: platform
entities: [repo-toolchain]
title: Инструменты собираются TypeScript в strict-режиме без ослаблений
scenarios:
  - given: репозиторий со свежим `npm ci`
    when: запускается проверка типов инструментов
    then: компиляция проходит без ошибок и без предупреждений
  - given: каталог пакета мода в `mods/`
    when: npm разрешает workspaces корневого `package.json`
    then: >-
      каталог виден как workspace-пакет, его зависимости ставятся из корня, а
      собственного `node_modules` у пакета не появляется
  - given: '`tsconfig.json` инструментов'
    when: проверяются опции компилятора
    then: >-
      `strict` включён, отдельные флаги строгости не отключены, а подавления
      через `@ts-ignore` / `@ts-expect-error` / `any` отсутствуют
  - given: Lua-исходники модов
    when: запускается сборка инструментов
    then: >-
      Lua не компилируется и не транспилируется — инструменты только читают и
      упаковывают его как данные
  - given: инструмент в `tools/*.ts`
    when: он запускается через npm-скрипт
    then: >-
      Node исполняет TypeScript напрямую через встроенное type stripping, без
      промежуточной сборки и без каталога с артефактами компиляции
verified: false
verified_at: null
verified_note: >-
  Три сценария из четырёх закрыты 2026-10-03: `npm run typecheck`
  (tsc --noEmit) прошёл с кодом 0, `tsc --listFiles` подтвердил охват всех
  файлов `tools/`; в `tsconfig.json` включены strict и дополнительные флаги
  строгости, ни один не отключён, `grep` по `tools/` не находит
  `@ts-ignore`, `@ts-expect-error` и явных `any`; Lua в сборку не входит,
  `include` ограничен `tools/**/*.ts`, и инструменты исполняются как `.ts`
  напрямую без промежуточной сборки. Сценарий про npm-workspaces проверять
  не на чем: ни одного пакета мода в `mods/` ещё нет. Переподтвердить после
  заведения первого мода.
