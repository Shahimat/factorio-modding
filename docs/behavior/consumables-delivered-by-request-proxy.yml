id: consumables-delivered-by-request-proxy
kind: behavior
namespace: mods
entities: [logistic-buildings]
title: Топливо, патроны и семена доставляются призраком запроса, способ доставки переключается без потерь
scenarios:
  - given: котёл с выбранным видом топлива и способом доставки «строительные дроны»
    when: сумма «лежит в топке + уже заказано призраком» падает ниже порога
    then: >-
      мод дозаказывает до размера партии строками призрака запроса, скрытых
      сундуков у здания не появляется, предметы кладут строительные дроны
  - given: на здании уже висит призрак запроса от игрока или из чертежа (например, на модули)
    when: мод добавляет свой заказ
    then: >-
      строки добавляются в существующий призрак, чужие строки не затираются, и
      второй призрак с теми же предметами не создаётся
  - given: реактор с отработанным топливом и без сундука активного снабжения
    when: скрипт обслуживает здание
    then: отработанное вывозится запросом на изъятие в том же призраке
  - given: биокамера с большим расходом, игрок переключает доставку топлива на логистических дронов
    when: переключение происходит на работающем здании
    then: >-
      мод снимает из призрака только свои невыполненные строки, при
      необходимости создаёт скрытый сундук запроса и заказывает топливо
      партиями; ничего не теряется и не заказывается дважды
  - given: то же здание переключается обратно на строительных дронов
    when: в скрытом сундуке остался запас топлива
    then: остаток догружается в здание либо уходит мусором, сундук удаляется, если больше не нужен
  - given: турель на патронах
    when: игрок ищет переключатель способа доставки
    then: переключателя нет — патроны всегда доставляются призраком запроса
  - given: здание стоит вне логистической зоны робопорта, но внутри строительной
    when: мод заказывает топливо призраком
    then: доставка выполняется, потому что зона строительных дронов больше логистической
verified: false
verified_at: null
verified_note: >-
  Поведение выведено из ТЗ `specs/03102026_spec_logistic_buildings.md`
