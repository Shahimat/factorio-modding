id: orbital-route-shows-schedule-loop
kind: behavior
namespace: mods
entities: [orbital-logistics]
title: Маршрут показывает полный цикл расписания и активную планету или стрелку
summary: "Все остановки в порядке расписания, включая повторы; на стоянке выделена планета, в пути — стрелка, возврат к первой остановке обозначен круговой стрелкой."
scenarios:
  - given: у платформы расписание из нескольких остановок, в том числе повторных
    when: игрок открывает обзор и платформа выполняет обычный цикл
    then: >-
      показаны все записи в неизменном порядке; между остановками — стрелки,
      после последней — круговая стрелка возврата к первой; повторы не объединяются
  - given: платформа стоит на планете из расписания, в том числе с паузой или ожидая отправления
    when: обзор обновляется
    then: >-
      одна соответствующая остановка выделена видимой оранжевой рамкой,
      стрелки неактивны; повторное посещение различается индексом записи
  - given: платформа выполняет последовательный рейс расписания
    when: она летит между остановками либо возвращается от последней к первой
    then: >-
      выделена одна стрелка соответствующего плеча, при замыкании — круговая;
      планеты не выделены, обратный рейс не определяется направлением прототипа связи
  - given: обзор наблюдал отправление длинного плеча через промежуточные планеты
    when: меняется текущая космическая связь, но назначение расписания прежнее
    then: подсветка остаётся у всего плеча расписания, а не у выдуманной остановки промежуточной связи
  - given: краткая стоянка и начало следующего рейса целиком проходят между секундными обновлениями
    when: движок сообщает события изменения состояния платформы
    then: >-
      история источника и подсветка обновляются на событиях без пересоздания
      элементов; старый departure не гасит правильную стрелку обратного рейса
  - given: игрок вручную пропустил остановку либо обзор впервые открыт посреди многозвенного рейса без известного источника
    when: фактическое плечо не удаётся однозначно сопоставить с последовательным циклом
    then: >-
      цикл остаётся виден, но стрелки не получают ложной подсветки;
      предшественник назначения не выдаётся за доказанный источник полёта
  - given: состав расписания и ширина окна не меняются
    when: платформа прилетает или улетает, игрок раскрывает карточку, проходит секундное обновление
    then: >-
      элементы маршрута сохраняют идентичность, порядок и размеры; меняется
      только оформление; длинное расписание переносится внутри ширины заголовка,
      круговая стрелка не уменьшается унаследованным масштабом utility-спрайта
  - given: расписания нет либо в нём одна остановка
    when: открывается обзор
    then: >-
      без расписания показано фактическое место или известный открытый перегон;
      одна остановка не изображает выдуманный полёт на себя
check: npm run test:ingame:gui -w shm-orbital-logistics -- --game-speed 100 -- 'маршрут:'
verified: true
verified_at: 2026-11-14
verified_note: >-
  Factorio 2.1.24 mac-arm64: шесть профильных GUI-регрессий прошли, включая
  реальные повторные рейсы A→B→A→B↶, ручной пропуск и перелёт Наувис→Аквило
  через промежуточную планету. Короткая стоянка и отлёт проверены в пределах
  одного 60-тактового интервала без явного refresh. Порядок и идентичность проверены, снимки
  стоянки, обычного и замыкающего плеча просмотрены. Нативный профиль проверяет
  статический цикл из трёх остановок настоящими кликами; финальный повтор PASS,
  оба PNG просмотрены, рамка планеты действительно видна. В сравнении с прежним
  неработающим стилем изменился только её квадрат 32×32, не геометрия заголовка.
  Реальные interrupts не проверялись. Полный GUI-набор имеет прежние падения,
  перечисленные в entity orbital-logistics/gui_test_status. Нативный повтор
  после подключения событий состояния также PASS.
