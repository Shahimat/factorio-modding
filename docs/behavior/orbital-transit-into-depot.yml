id: orbital-transit-into-depot
kind: behavior
namespace: mods
entities: [orbital-logistics]
title: Груз для орбиты склада сдаётся на склад, и склад раздаёт его дальше
scenarios:
  - given: над Нависом челнок с секцией `[cargo→nauvis]` и 200 гольмиевых плит, склад `[depot:nauvis]` на 100 гольмиевых плит с источником `planet`, у склада 0
    when: проходит контроллер
    then: в своей секции склада появляется фильтр гольмия `min = 0` с платформ над Нависом, без замка на этот предмет (K-06)
  - given: то же
    when: проходят передачи
    then: склад получает ровно 100 — не больше своей цели, — транзит снимается, и платформа, запросившая гольмий с платформ, его получает (K-06)
  - given: живая демо-сцена — челнок привозит 800 плит на Аквило каждый круг, склад `[depot:aquilo]` на 1000, потребитель расходует
    when: проходят три круга
    then: склад получает плиты, но с учётом «в пути» никогда не больше 1000
verified: true
verified_at: 2026-10-27
verified_note: >-
  Factorio 2.1.23, Space Age. Тесты в игре K-06 и «живая демо-сцена»
  (`tests/ingame/core.lua`) после исправления переполнения: раньше транзит
  запрашивал недостающее сверху и склад набирал 1225 при цели 1000.
