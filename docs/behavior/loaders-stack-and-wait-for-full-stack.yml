id: loaders-stack-and-wait-for-full-stack
kind: behavior
namespace: mods
entities: [advanced-belts]
title: Лоадеры кладут стопки на ленту и по умолчанию ждут полную стопку
scenarios:
  - given: включён флажок стака, у силы есть бонус стопки на ленте
    when: лоадер любого мода выгружает предметы из сундука на ленту
    then: он кладёт стопки, размер стопки меняется в окне лоадера
  - given: лоадер в режиме «Полная стопка», стопка ленты 4, в сундуке 3 предмета
    when: проходят тики
    then: лоадер ничего не выкладывает; когда предметов становится 4, выкладывает стопку из 4
  - given: лоадер в режиме «Сразу», то же
    when: проходят тики
    then: лоадер выкладывает сколько есть, как без мода
  - given: флажок стака выключен
    when: игра загружается
    then: >-
      мод не меняет стак лоадеров, у лоадеров AAI работает его собственная
      настройка стака
  - given: механика ожидания полной стопки выключена в настройках
    when: игра загружается
    then: копий-вариантов лоадеров нет, переключателя и клавиши нет, лоадеры ведут себя как без неё
verified: true
verified_at: 2026-10-25
verified_note: >-
  Factorio 2.1.23, Space Age, AAI Loaders 0.3.0. Сценарии 1–3 —
  тестами в игре: у всех `loader-1x1` максимум стопки и настраиваемый
  размер, лоадер «Полная стопка» при бонусе стопки 3 не кладёт 3 предмета и
  кладёт стопку из 4, копия «Сразу» кладёт 3. Сценарии 4 и 5 — чтением
  `data-final-fixes.lua` и `control.lua`: стак и копии создаются только при
  включённых флажках, переключатель регистрируется только при включённой
  механике; Lua-тесты `tests/variants.test.lua`.
