id: orbital-reserve-never-given
kind: behavior
namespace: mods
entities: [orbital-logistics]
title: Свой запас не отдаётся ни другим платформам, ни планете
scenarios:
  - given: на хабе секция `[reserve]` на 500 плит с источником `planet`, в хабе 500 плит, флаг раздачи включён
    when: другая платформа на орбите запрашивает плиты с платформ, а площадка планеты — с орбиты
    then: хаб не отдаёт ни одной плиты (K-07)
  - given: у одного предмета секции `[reserve]` на 200 и `[depot:nauvis]` на 300, в хабе 500, платформа над Нависом
    when: платформа запрашивает 300, потом другая — ещё 100
    then: первая получает 300, вторая ничего, в хабе всё время не меньше 200 (K-08)
  - given: у предмета есть и защищённая часть, и часть, которую можно отдать
    when: одна отдача, выбранная ванилью, больше открытой части
    then: >-
      отдача может зайти в защищённую часть: предмет закрывается замком,
      только когда содержимого не больше защищённой части. Это известное
      ограничение мягкой защиты, а не ошибка
verified: true
verified_at: 2026-10-27
verified_note: >-
  Factorio 2.1.23, Space Age. Сценарии 1–2 — тесты в игре K-07 и K-08
  (`tests/ingame/core.lua`). Сценарий 3 описывает ограничение и проверен
  Lua-тестом решателя: граница открытия по содержимому
  (`tests/resolver.test.lua`).
