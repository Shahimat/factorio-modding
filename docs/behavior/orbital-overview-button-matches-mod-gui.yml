id: orbital-overview-button-matches-mod-gui
kind: behavior
namespace: mods
entities: [orbital-logistics]
title: Кнопка обзора стоит в общей рамке mod-gui и сопоставима с Helmod
summary: "Кнопка Orbital использует общую рамку mod-gui и собственный стиль по образцу Helmod; старая кнопка переносится без дублей и повреждения соседей."
scenarios:
  - given: игрок с рабочим Orbital Logistics
    when: создаётся или обновляется кнопка обзора
    then: >-
      собственная sprite-button находится в mod_gui_inner_frame общей верхней
      рамки, сохраняет значок и локализованную подсказку; размеры и отступы
      соответствуют принятому образцу Helmod 2.3.6, зависимости от Helmod нет
  - given: старая отдельная кнопка в gui.top либо существующая кнопка с прежними runtime-размерами
    when: ensure_button или очередной refresh_all обслуживает игрока даже без открытого обзора
    then: >-
      старая собственная кнопка исчезает, целевая исправляется на месте;
      повторные вызовы не создают дублей, соседние элементы общей рамки сохранены
  - given: кнопка уже перенесена в mod-gui
    when: выполняется нативный UI-сценарий orbital
    then: настоящий клик исходной кнопки открывает обзор и дальнейшие клики по карточке работают
check: npm run test:ui:orbital
verified: true
verified_at: 2026-11-14
verified_note: >-
  Factorio 2.1.24 mac-arm64: native orbital PASS, проверены родитель,
  собственный стиль, размеры 37×37, отсутствие старой кнопки и три реальных
  production-owned GUI-события. Crop кнопки с рамкой просмотрен.
  FactorioTest-проверки открытия/закрытия окна, переноса старой кнопки,
  ремонта размеров и сохранности соседа — PASS. Один native-прогон отклонён
  из-за пустого кадра всей simulation, повтор без правок — PASS;
  ограничение описано в entity ui-test-engine. Образец размеров и ванильных
  графических наборов сверён с локально установленным Helmod 2.3.6;
  его runtime или ассеты в мод не включены.
