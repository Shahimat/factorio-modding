id: superior-inserters-wait-for-full-hand
kind: behavior
namespace: mods
entities: [k2-full-hand-switcher]
title: Превосходные манипуляторы K2 по умолчанию ждут полную руку
scenarios:
  - given: включены Krastorio2, K2 Spaced Out и мод
    when: игрок ставит превосходный (обычный или длинный) манипулятор с ленты на ленту при редком потоке
    then: манипулятор держит руку, пока не наберёт полный размер руки, и только потом выкладывает стопку на ленту
  - given: превосходный манипулятор в режиме «Сразу»
    when: поток тот же
    then: манипулятор выкладывает сколько успел взять, как в K2 без мода
  - given: превосходный манипулятор в режиме «Полная рука», предмет в руке испортился
    when: рука ждёт заполнения
    then: манипулятор выкладывает испорченную стопку, а не встаёт навсегда
  - given: включён Krastorio2 без K2 Spaced Out
    when: игра загружается
    then: ошибок нет, манипулятор ждёт полную массовую руку, стопки на ленте не превышают одного предмета
verified: false
verified_at: null
verified_note: >-
  В игре 2026-10-25: Factorio 2.1.23 (Steam, mac-arm64), Krastorio2 2.1.4, K2 Spaced Out 2.0.19, Space Age, ChangeInserterDropLane 1.3.0, изолированный каталог модов; проверял владелец. Подтверждены сценарии 1–2: ожидание полной руки при редком
  потоке и выкладка сразу после переключения. Не проверены сценарий 3
  (испортившийся предмет в руке) и сценарий 4 (без K2 Spaced Out).
