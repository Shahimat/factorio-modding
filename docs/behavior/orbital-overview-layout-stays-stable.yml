id: orbital-overview-layout-stays-stable
kind: behavior
namespace: mods
entities: [orbital-logistics]
title: Раскрытие карточек не добавляет отступы и не сдвигает геометрию обзора
summary: "Обычное раскрытие меняет высоту карточки, но не положение окна, ширину viewport и колонок; лишних рамок, padding и горизонтального scroll нет."
scenarios:
  - given: обзор платформ с обычным раскрытием карточек, в списке есть длинные предупреждения и группы
    when: игрок раскрывает и сворачивает карточку
    then: >-
      высота карточки и положение карточек ниже меняются намеренно; окно,
      заголовок раскрываемой карточки и ширины колонок не сдвигаются;
      активация прокрутки не добавляет рамку или padding, горизонтальная
      прокрутка не появляется, место под нужную вертикальную полосу зарезервировано
  - given: внутри карточки раскрыты детали группы, рядом есть другие блоки
    when: игрок сворачивает и разворачивает соседний блок либо обзор обновляется
    then: >-
      меняется только содержимое выбранного блока; его обёртка и соседние
      поля сохраняют идентичность и ширину, раскрытые чужие детали не сбрасываются
  - given: обычное либо суженное при открытом хабе окно, длинные подписи и несколько выбранных планет
    when: строятся группы, подробности предметов и предупреждения
    then: >-
      содержимое укладывается в явный бюджет колонки, длинный текст переносится
      или сокращается с полной подсказкой, выбранные места переносятся строками;
      горизонтальная полоса не заменяется обрезанием выходящих за бюджет контролов
  - given: таблица исключений содержит строки с разным количеством иконок
    when: показываются состояния предметов
    then: >-
      все строки используют общие ширины колонок иконок и текста; максимумы
      разных строк не складываются в переполнение соседнего блока
  - given: сохранение содержит открытый обзор прежней рабочей копии с тем же номером пакета
    when: выполняется refresh_all
    then: >-
      раскладка обновляется однократно по версии GUI без пересоздания окна
      и заголовков карточек; дальнейшие обновления не повторяют миграцию
check: npm run test:ui:orbital
verified: true
verified_at: 2026-11-14
verified_note: >-
  Factorio 2.1.24 mac-arm64: native PASS с настоящими кликами и PNG;
  координаты кнопки имени совпали до раскрытия, в раскрытой карточке и после
  сворачивания. До исправления та же проверка показала сдвиг на 8 GUI-пикселей
  по обеим осям. Три FactorioTest GUI-регрессии PASS: десять платформ с
  предупреждениями, ширины 560/760/1200 с пятью выбранными планетами,
  общие колонки разных строк исключений. Проверены сохранность соседних
  блоков/деталей и однократный ремонт прежнего открытого GUI. Снимки просмотрены;
  бюджет дополнительно покрыт чистыми Lua-тестами. Владелец 2026-11-14
  подтвердил в обычной игре исправление отступов. Полный GUI-набор не зелёный;
  актуальные ограничения — в entity orbital-logistics/gui_test_status.
