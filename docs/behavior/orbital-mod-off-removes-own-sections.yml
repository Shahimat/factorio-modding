id: orbital-mod-off-removes-own-sections
kind: behavior
namespace: mods
entities: [orbital-logistics]
title: Выключение мода снимает всё, что он поставил на хабы
scenarios:
  - given: над Фульгорой хаб с секцией `[reserve]` и секцией `[cargo→fulgora]` с источником `all`; мод поставил замок и выключил секцию сбора
    when: настройка карты `shm-orbital-logistics-enabled` выключается
    then: своя секция мода снята, секция сбора снова включена, контроллер больше ничего не делает
  - given: настройка снова включена
    when: проходит контроллер
    then: замки и выключения возвращаются по текущей орбите
verified: true
verified_at: 2026-10-27
verified_note: >-
  Factorio 2.1.23, Space Age. Тест в игре «выключение мода…»
  (`tests/ingame/core.lua`): событие смены настройки, выставленной
  скриптом, приходит, и контроллер снимает всё сам. Сценарий 2 виден там же:
  после включения контроллер снова выключает секцию сбора.
