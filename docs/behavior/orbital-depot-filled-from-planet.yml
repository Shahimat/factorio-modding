id: orbital-depot-filled-from-planet
kind: behavior
namespace: mods
entities: [orbital-logistics]
title: Склад наполняется с планеты ракетами по ванили, с множителем секции
scenarios:
  - given: на складе над Нависом секция `[depot:nauvis]` с фильтром 2000 легендарных плит, множитель секции ×5, источник `planet`; на Нависе силос с автоматическими запросами и плиты в сети
    when: проходит время
    then: ракеты поднимают на склад 10 000 плит, и склад раздаёт их платформам на орбите (K-01)
  - given: качество в фильтре группы склада меняется с редкого на легендарное
    when: проходит время
    then: старые предметы ведут себя по ванили, мод в это не вмешивается (K-18)
verified: false
verified_at: null
verified_note: >-
  Полный K-01 с 10 000 легендарных плит ×5 и смена качества K-18 не проверены.
  2026-11-14 tests/ingame/network.lua подтвердил обычное качество: настоящие
  повторные ракеты, силосы с роботами, наполнение складов и приём на площадках
  пяти планет; это behavior orbital-demo-network-exchanges-with-planets,
  не подтверждение всех требований этого файла. Полная приёмка — manual
  test-orbital-manually на своей карте.
