id: robot-capacity-override-is-name-agnostic
kind: behavior
namespace: mods
entities: [logistic-buildings]
title: Переопределение вместимости дронов работает по всем прототипам и технологиям, без имён
scenarios:
  - given: 'переопределение логистических дронов включено, база 1, множитель 25'
    when: отрабатывает последняя стадия данных
    then: >-
      все прототипы логистических дронов, включая дроны чужих модов, получают
      вместимость 25, и каждый бонус исследований тоже умножается — в
      ванильной игре рост с 25 до 100 после всех исследований
  - given: переопределение выключено в настройках запуска
    when: мод загружается
    then: ни прототипы дронов, ни технологии вместимости не изменяются вообще
  - given: 'настройка «оставить исследования вместимости» выключена'
    when: мод убирает эффект вместимости из технологий
    then: >-
      эффект снимается со всех технологий, где он есть; технология, оставшаяся
      без эффектов, скрывается, а зависящие от неё перевешиваются на её
      предпосылки, чтобы не сломать дерево чужих модов
  - given: переопределение строительных дронов выключено (значение по умолчанию)
    when: мод загружается
    then: вместимость строительных дронов остаётся ванильной, логистических — переопределённой
verified: false
verified_at: null
verified_note: >-
  Поведение выведено из ТЗ `specs/03102026_spec_logistic_buildings.md`
  (раздел 8.3) при планировании программы 2026-10-04. Формула вместимости
  покрывается Lua-тестом, фактические значения прототипов — пруфом подцели
  `lb-robot-capacity`, целостность дерева технологий — запуском с Krastorio 2.
