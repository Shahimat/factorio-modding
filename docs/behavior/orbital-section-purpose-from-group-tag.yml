id: orbital-section-purpose-from-group-tag
kind: behavior
namespace: mods
entities: [orbital-logistics]
title: Назначение секции хаба задаётся меткой в имени ванильной группы, без метки — ваниль
scenarios:
  - given: группа с именем `Fuel [reserve]`, `Plates [cargo→aquilo]`, `Ores [cargo -> vulcanus, aquilo]` или `Plates [depot:nauvis]`
    when: мод разбирает имя группы
    then: секция получает назначение свой запас, груз с назначением или склад; регистр, пробелы и вид стрелки не важны
  - given: имя группы с чужими скобками, например `[item=iron-plate] Plates [depot:nauvis] [reserve]`
    when: мод разбирает имя
    then: чужие скобки пропускаются, действует первая узнанная метка
  - given: на хабе только секции без меток
    when: проходит контроллер
    then: мод не добавляет на хаб ни одной секции и ничего не меняет — платформа ведёт себя ровно как в 2.1 (K-19)
  - given: на хабе секция `[reserve]`
    when: проходит контроллер
    then: >-
      мод ставит замок в служебную группу `⚙ Orbital Logistics — auto
      #<индекс платформы>`; назначенная вручную на другой хаб, она там
      снимается; когда метки нет, служебная группа уходит и с хаба, и из
      списка групп
  - given: группа с именем-«только метка», например `[reserve]`
    when: игрок снимает метку в панели
    then: >-
      имя не может стать пустым — группа переименовывается в fallback
      `<платформа> #<N>`; если такое имя занято, панель показывает
      «Группа или линия с таким именем уже есть» и секция не переводится
  - given: строка секции «Груз» без выбранных мест
    when: игрок жмёт «Применить»
    then: >-
      no-op — имя группы не меняется, даже если текущее имя `[cargo]`;
      другие назначения применяются как раньше
verified: true
verified_at: 2026-11-04
verified_note: >-
  Factorio 2.1.23, Space Age. Сценарии 1–2 — Lua-тесты `tests/tags.test.lua`,
  сценарий 3 — тест в игре K-19, сценарий 4 — тест «служебная группа…»
  (`tests/ingame/core.lua`); сценарии 5–6 — gui-тест ol-tag-tools 23/23
  и тесты `tests/ingame/groups.lua` (вердикт run 1, тикет ol-tag-tools).
  Прогон в игре раунда orbital-02 зелёный.
