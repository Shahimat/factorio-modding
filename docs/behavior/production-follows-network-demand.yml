id: production-follows-network-demand
kind: behavior
namespace: mods
entities: [logistic-buildings]
title: Здание производит, только пока запас в сети меньше цели
scenarios:
  - given: запас продукта в сети не меньше цели по нему
    when: здание в логистическом режиме просыпается
    then: здание уходит в сон и не производит, пока пересчёт целей его не разбудит
  - given: буферный сундук с запросом на 500 шестерёнок и пустая сеть
    when: пересчитываются цели сети
    then: >-
      запрос буферного сундука входит в цель целиком, производители шестерёнок
      будятся и держат в сети запас 500 штук
  - given: обычный сундук запроса просит 100 предметов, 60 уже лежит, 20 везут дроны
    when: пересчитываются цели сети
    then: >-
      в цель идёт только недостающее — 20; иначе после доставки запас снова
      оказался бы ниже цели и сеть произвела бы лишнюю партию
  - given: скрытый сундук запроса самого мода
    when: скрипт обходит точки запроса сети
    then: >-
      сундук пропускается, его спрос берётся из собственного реестра мода и
      обновляется мгновенно при выставлении и снятии заказа, а не ждёт
      очередного пересчёта
  - given: мод создал призрак запроса на топливо, часть строк не выполнена
    when: пересчитываются цели сети
    then: >-
      недостающее по своим призракам входит в цель, а чужие призраки запроса и
      призраки строительства на производство не влияют
  - given: сборщик с рецептом редкого качества
    when: скрытый сундук выставляет запрос на ингредиенты
    then: >-
      запрашивается то же качество, что выбрано в рецепте; для запроса с
      условием («редкое и выше») запасом считается сумма подходящих качеств и
      работают все производители, чьё качество подходит
  - given: здание с флагом «работа по избытку» и выбранным отслеживаемым ингредиентом
    when: этого ингредиента в сети больше заданного порога
    then: >-
      здание работает, но его запрос на отслеживаемый ингредиент в цель сети не
      входит — производители этого предмета от утилизатора не просыпаются;
      запросы на прочие ингредиенты учитываются как обычно
  - given: игрок вручную меняет запрос сундука или правит логистическую группу
    when: приходит событие смены запроса
    then: сеть помечается «пересчитать вне очереди», не дожидаясь своих 5–10 секунд
verified: false
verified_at: null
verified_note: >-
  Поведение выведено из ТЗ `specs/03102026_spec_logistic_buildings.md`
  (раздел 5) при планировании программы 2026-10-04. Чистая часть расчёта цели
  и запаса покрывается Lua-тестами подцели `lb-core`, работа в сети —
  интеграционным стендом и пруфом сценария приёмки «цепочка под заказ».
