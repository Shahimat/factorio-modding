id: hidden-chests-follow-building-lifecycle
kind: behavior
namespace: mods
entities: [logistic-buildings]
title: Скрытые сундуки живут ровно столько, сколько здание, и ни один предмет не пропадает
scenarios:
  - given: здание появляется любым способом — игроком, дроном, скриптом чужого мода, клонированием
    when: приходит соответствующее событие постройки
    then: >-
      заводится запись о здании, и создаются только те скрытые сундуки,
      которые нужны текущим настройкам; у соседних зданий ничего не меняется
  - given: здание в логистическом режиме со скрытыми сундуками
    when: его сносит игрок или строительный дрон
    then: >-
      содержимое сундуков кладётся в буферный инвентарь события и возвращается
      вместе со зданием, сами сундуки удаляются, сирот не остаётся
  - given: то же здание
    when: оно гибнет от урона
    then: содержимое скрытых сундуков высыпается на землю
  - given: игрок выключает логистический режим на здании
    when: режим снят
    then: >-
      содержимое сундуков переходит этому игроку, не поместившееся высыпается
      на землю, сундуки удаляются
  - given: в здании и сундуке запроса остались ингредиенты старого рецепта, старое топливо или испорченные предметы
    when: скрипт навещает здание
    then: >-
      мусор уходит через сундук активного снабжения на склад, а у зданий без
      скрытых сундуков (турели, котлы, реакторы) — запросом на изъятие в
      призраке запроса
  - given: после смены набора модов рецепт, предмет или сущность из настроек здания исчезли
    when: игра загружается и срабатывает `on_configuration_changed`
    then: настройки этого здания сбрасываются без ошибки в логе
  - given: игрок собирается удалить мод из сохранения
    when: он выполняет консольную команду «выгрузить всё»
    then: >-
      содержимое всех скрытых сундуков переносится в здания, не поместившееся
      кладётся на землю, после чего мод можно удалять без потери предметов
  - given: двое игроков в мультиплеере на одной карте, игра запущена в «тяжёлом режиме»
    when: здания в логистическом режиме работают, сохранение перезагружается
    then: >-
      рассинхрона нет — всё состояние мода живёт в сохранении, данных только в
      памяти одного клиента нет
verified: false
verified_at: null
verified_note: >-
  Поведение выведено из ТЗ `specs/03102026_spec_logistic_buildings.md`
  (раздел 9) при планировании программы 2026-10-04. По обсуждениям аналогов
  это самое дефектное место, поэтому сценарии закрываются интеграционным
  стендом подцели `lb-core`, а мультиплеер — ручным пруфом подцели
  `lb-compat-release`.
