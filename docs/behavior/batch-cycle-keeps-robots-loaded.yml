id: batch-cycle-keeps-robots-loaded
kind: behavior
namespace: mods
entities: [logistic-buildings]
title: Заказ и отгрузка идут партиями по будильнику, дроны летают полными
scenarios:
  - given: запас ингредиентов в здании и его скрытом сундуке упал ниже порога дозаказа
    when: скрипт навещает здание
    then: >-
      выставляется запрос на партию за вычетом имеющегося; пока запас выше
      порога, запросы нулевые, и дроны не возят по паре предметов
  - given: пришла часть заказанной партии, которой хватает на целые крафты
    when: скрипт навещает здание
    then: ингредиенты загружаются сразу, здание не ждёт прихода партии целиком
  - given: во входные слоты загружена порция на много крафтов
    when: скрипт рассчитывает окончание по времени крафта и скорости машины
    then: ставится будильник на расчётный тик, до него здание не навещается
  - given: будильник сработал, но здание стояло без энергии и состояние не изменилось
    when: скрипт читает фактическое состояние здания и сундуков
    then: >-
      расчёт не принимается на веру, а интервал до следующего пробуждения
      удваивается, до потолка 30 секунд
  - given: в выходном слоте накопилась партия отгрузки
    when: скрипт навещает здание
    then: >-
      продукт перекладывается в сундук снабжения; при смене рецепта,
      выключении режима и сносе остаток выгружается принудительно, даже если
      партия не набралась
  - given: турель на патронах или сельскохозяйственная башня
    when: планируется следующая проверка
    then: >-
      вместо будильника используется медленный опрос раз в 10–20 секунд —
      расход патронов и момент сбора урожая непредсказуемы
verified: false
verified_at: null
verified_note: >-
  Поведение выведено из ТЗ `specs/03102026_spec_logistic_buildings.md`
  (раздел 6) при планировании программы 2026-10-04. Расчёт партии, порога и
  планировщик будильников покрываются Lua-тестами подцели `lb-core`;
  фактическая загрузка дронов — пруф сценария приёмки «полные рейсы».
