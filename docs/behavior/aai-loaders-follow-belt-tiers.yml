id: aai-loaders-follow-belt-tiers
kind: behavior
namespace: mods
entities: [advanced-belts]
title: При AAI Loaders у каждого включённого тира есть свой лоадер
scenarios:
  - given: включены AAI Loaders и мод
    when: игра загружается
    then: >-
      у каждого включённого тира есть лоадер `aai-shm-<тир>-loader` со
      скоростью тира, своей технологией и рецептом из ленты тира, лоадера
      предыдущего тира и ресурсов планеты
  - given: AAI Loaders в режиме `lubricated`
    when: лоадер тира стоит
    then: без лубриканта он не работает, с лубрикантом — работает, как лоадеры самого AAI
  - given: игрок держит планировщик улучшений
    when: применяет его к турбо-лоадеру AAI
    then: >-
      тот меняется на лоадер тира «Превосходный» и далее по порядку; с
      Krastorio 2 турбо-лоадер улучшается в лоадер K2, цепочка лоадеров
      тиров остаётся своей
  - given: AAI Loaders не установлен
    when: игра загружается
    then: ошибок нет, лоадеров тиров нет, ленты, подземки и сплиттеры есть
verified: true
verified_at: 2026-10-25
verified_note: >-
  Factorio 2.1.23, Space Age, AAI Loaders 0.3.0. Тестами в игре
  (`tests/ingame/loaders.lua`) в прогонах с AAI в режимах `lubricated` и
  `expensive`, без AAI и с K2 Spaced Out: лоадеры тиров, их скорость,
  рецепты, технологии, цепочка улучшений, лоадер без лубриканта стоит, с
  лубрикантом работает.
