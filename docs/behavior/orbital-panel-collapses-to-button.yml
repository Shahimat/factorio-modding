id: orbital-panel-collapses-to-button
kind: behavior
namespace: mods
entities: [orbital-logistics]
title: Панель у окна хаба и площадки сворачивается целиком и по блокам, имеет потолок высоты, состояние помнит на игрока
scenarios:
  - given: развёрнутая панель у окна хаба или площадки
    when: игрок жмёт кнопку «свернуть» — первый элемент развёрнутой панели
    then: >-
      панель перестраивается в мини-окошко с заголовком „Orbital Logistics“
      и кнопкой разворачивания на том же краю окна; клик по кнопке
      разворачивает панель обратно
  - given: развёрнутая панель
    when: игрок сворачивает один из блоков — «Группы», «Отдача на этой орбите» или «Линии снабжения»
    then: >-
      блок схлопывается в заголовок с итогом по реальному содержимому —
      «Секции: N», «Отдача: групп N, исключений N», «Линии снабжения:
      участников N»; клик по заголовку разворачивает блок обратно
  - given: блок свёрнут
    when: игрок переоткрывает окно, сохраняет и загружает игру, `refresh_all` обновляет панели
    then: >-
      свёрнутость блока — per player, `storage.panel_block_collapsed`
      (init и migration в `control.lua`), переживает переоткрытие и
      сохранение; свёрнутый блок обновлениями не перестраивается,
      разворачивание строит его заново
  - given: содержимое панели выше 0.8 высоты экрана
    when: панель строится в любом из четырёх положений
    then: >-
      рамка получает потолок 0.8 `display_resolution` (с учётом
      `display_scale`) и по вертикали доводится до контента; каждый из
      трёх блоков живёт в своём scroll-pane с собственной прокруткой
  - given: хаб не участвует в линиях снабжения
    when: игрок открывает панель
    then: блок линий — одна кнопка «Линии снабжения…», без заголовка и прокрутки
  - given: панель свёрнута
    when: игрок меняет настройку `shm-orbital-logistics-panel-position` на другой край окна
    then: кнопка стоит на выбранном краю — настройка действует на свёрнутый и развёрнутый вид
  - given: панель свёрнута
    when: игрок переоткрывает окно хаба или площадки, сохраняет и загружает игру
    then: >-
      окна открываются снова свёрнутыми — состояние per player,
      `storage.panel_collapsed` (init/migration в `control.lua`)
  - given: панель свёрнута
    when: проходит секунда и `refresh_all` обновляет панели открытых окон
    then: свёрнутый вид не перестраивается; разворачивание строит полную панель заново
check: npm run test:ingame:gui -w shm-orbital-logistics
verified: false
verified_at: null
verified_note: >-
  Семантика расширена раундом orbital-02 — блоки со сворачиванием и
  итогами, потолок высоты, scroll-pane; прежний verified относился к
  старой редакции. Gui-прогон ol-panel-frame — 13 PASS (вердикт run 1);
  глазами панель не осмотрена — проверить по manual
  `test-orbital-manually` перед 1.0.0.
