id: full-hand-mode-survives-blueprint-and-paste
kind: behavior
namespace: mods
entities: [k2-full-hand-switcher]
title: Режим полной руки переживает чертёж и копирование настроек
scenarios:
  - given: манипуляторы в обоих режимах
    when: их снимают в чертёж и строят по нему
    then: каждый построенный манипулятор в том же режиме, что в чертеже; строится он из обычного предмета превосходного манипулятора
  - given: призрак манипулятора в режиме «Сразу» (из чертежа или переключённый)
    when: игрок строит на нём обычный предмет превосходного манипулятора из руки
    then: построенный манипулятор в режиме «Сразу»; если окно призрака было открыто, оно открыто на построенном
  - given: манипуляторы в обоих режимах
    when: игрок копирует их (`CTRL + C`) и вставляет (`CTRL + V`)
    then: каждый вставленный манипулятор в том же режиме, что скопированный
  - given: два превосходных манипулятора в разных режимах
    when: игрок копирует настройки с одного на другой (`SHIFT + ПКМ` → `SHIFT + ЛКМ`)
    then: приёмник получает режим источника вместе со штатно переносимыми настройками; приёмником может быть и призрак
  - given: манипулятор в режиме «Сразу»
    when: его разбирают
    then: игрок получает обычный предмет превосходного манипулятора, отдельного предмета у режима нет
verified: true
verified_at: 2026-10-27
verified_note: >-
  2026-10-27 тестами в игре (Factorio 2.1.23, K2 2.1.4, K2SO 2.0.19,
  `gui.lua`, `switch.lua`): постройка из руки поверх призрака «Сразу»
  даёт «Сразу» и открытое окно на нём, вставка настроек на призрак. Прежняя
  проверка 2026-10-25: Factorio 2.1.23, Krastorio2 2.1.4, Space Age, ChangeInserterDropLane 1.3.0. Тестами в игре (`tests/ingame/blueprint.lua`, `switch.lua`,
  `gui.lua`): чертёж в обе стороны, вставка настроек игроком через
  событие, разборка варианта «Сразу». `CTRL + C` → `CTRL + V` проверил
  владелец вручную — это тот же механизм чертежа.
