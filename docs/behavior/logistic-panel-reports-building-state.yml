id: logistic-panel-reports-building-state
kind: behavior
namespace: mods
entities: [logistic-buildings]
title: Панель здания объясняет, почему здание стоит, и даёт все настройки режима
scenarios:
  - given: здание поддерживает логистический режим
    when: игрок открывает его штатное окно
    then: >-
      панель мода появляется сбоку, прикреплённая к штатному окну, отдельного
      окна не открывается, а состав панели соответствует типу здания
  - given: здание в режиме встало, потому что выходной слот заполнен
    when: игрок смотрит строку состояния
    then: >-
      видит «стоит: выход заполнен (предмет X)»; остальные состояния набора —
      «спит: нет спроса», «ждёт доставку», «работает», «стоит: ждёт внешний
      ингредиент (предмет X)», «нет логистической сети», «режим недоступен: не
      открыты сундуки»
  - given: печь в логистическом режиме
    when: игрок открывает панель
    then: >-
      в ней есть поле «что производить» со списком рецептов из категорий этой
      печи — без выбранного рецепта мод не знает, что запрашивать
  - given: здание переведено в логистический режим
    when: игрок смотрит на него на карте
    then: поверх спрайта отрисован небольшой значок из готовых спрайтов игры, своей графики мод не добавляет
  - given: игра запущена на русском или английском языке
    when: открывается панель и строка состояния
    then: все надписи локализованы, непереведённых ключей не остаётся
verified: false
verified_at: null
verified_note: >-
  Поведение выведено из ТЗ `specs/03102026_spec_logistic_buildings.md`
  (раздел 7) при планировании программы 2026-10-04. Клики по интерфейсу не
  автоматизируются (convention `testing`): обработчики вызываются напрямую с
  подставленным событием, внешний вид — пруф подцели `lb-panel`.
