id: orbital-controller-fits-tick-budget
kind: behavior
namespace: mods
entities: [orbital-logistics]
title: Контроллер укладывается в бюджет тика на нагрузке поздней игры
scenarios:
  - given: 40 платформ на одной орбите, по 4 секции на 40 фильтров, две с метками, две без
    when: контроллер обходит их порциями
    then: порция стоит около 1 мс раз в 10 тиков, в среднем ~0,12 мс на тик; полный проход — около 4 мс
  - given: хаб без меток и без следа мода
    when: идёт проход
    then: читаются только орбита и имена групп его секций
verified: true
verified_at: 2026-10-27
verified_note: >-
  Factorio 2.1.23, машина владельца. Замер V-10 — `tests/ingame/perf.lua`
  пишет в лог `[PERF]`: полный проход 4,3 мс (до кеша фильтров — 16,6 мс),
  порция 1,1 мс. Тест бюджет не проверяет — время зависит от машины,
  сценарий подтверждается чтением лога. Сценарий 2 — чтением кода
  `runtime/controller.lua` (фазы `survey` и `fill`).
