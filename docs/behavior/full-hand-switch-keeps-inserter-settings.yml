id: full-hand-switch-keeps-inserter-settings
kind: behavior
namespace: mods
entities: [k2-full-hand-switcher]
title: Переключение режима полной руки не теряет настройки манипулятора
scenarios:
  - given: открыто окно превосходного манипулятора
    when: игрок щёлкает переключатель «Сразу / Полная рука» в панели справа
    then: режим меняется, окно остаётся открытым, переключатель показывает новый режим
  - given: открыто окно призрака превосходного манипулятора
    when: игрок щёлкает переключатель в панели справа
    then: призрак меняет режим, окно остаётся открытым на нём, переключатель показывает новый режим
  - given: открыто окно призрака превосходного манипулятора
    when: призрак достраивают — робот или игрок
    then: окно переходит на построенный манипулятор, панель режима на месте и показывает его режим
  - given: курсор над превосходным манипулятором в пределах досягаемости
    when: игрок жмёт `SHIFT + M`
    then: режим меняется, над манипулятором всплывает текст с новым режимом
  - given: манипулятор с фильтрами, режимом фильтра, приоритетом порченого, ограничением размера стака, проводами и условием сети, со сменённой полосой выкладки (ChangeInserterDropLane), повреждённый и с предметами в руке
    when: режим переключается
    then: все перечисленные настройки, здоровье и предметы в руке те же, что до переключения
  - given: включён ChangeInserterDropLane
    when: игрок открывает превосходный манипулятор
    then: панель режима стоит справа под панелью полосы выкладки
  - given: курсор над призраком превосходного манипулятора, на любом расстоянии
    when: игрок жмёт `SHIFT + M`
    then: призрак меняет режим, его фильтры, провода, условие сети, полоса выкладки и метки те же
  - given: курсор над чужим, вражеским или недосягаемым манипулятором
    when: игрок жмёт `SHIFT + M`
    then: ничего не меняется
  - given: игрок впервые построил превосходный манипулятор
    when: открывает «Подсказки» → «Манипуляторы»
    then: там есть подсказка о режиме полной руки с клавишей переключения
verified: true
verified_at: 2026-10-27
verified_note: >-
  2026-10-27 добавлены призраки: тестами в игре (Factorio 2.1.23, K2 2.1.4,
  K2SO 2.0.19) проверены замена призрака с переносом настроек, панель с
  `ghost_mode = 'both'` у окна призрака, щелчок и клавиша на призраке,
  пересборка панели при достройке скриптом и игроком. Владелец в игре
  проверил то, что скрипт не видит: панель «Режим выкладки» нарисована у
  окна призрака под панелью полосы выгрузки и остаётся после достройки.
  Прежняя проверка 2026-10-25:
  Factorio 2.1.23, Krastorio2 2.1.4, Space Age, ChangeInserterDropLane 1.3.0. Тестами в игре (`tests/ingame/switch.lua`, `gui.lua` в прогоне с
  графикой): переключение панелью и клавишей, перенос всех настроек из
  сценария 3, отказ на призраке, чужом, вражеском и недосягаемом
  манипуляторе. Вручную владелец проверил то, что скрипт не видит:
  положение панели под панелью Change Inserter Drop Lane, всплывающий
  текст и подсказку в разделе «Манипуляторы».
