id: changelog-parses-in-game
kind: behavior
namespace: delivery
entities: [mod-package]
title: changelog.txt парсится игрой без ошибок в логе
scenarios:
  - given: мод с `changelog.txt` включён в игре
    when: открывается changelog мода в браузере модов
    then: >-
      история версий отображается по секциям и категориям, а в лог-файле
      пользовательского каталога нет ошибок парсинга changelog
  - given: секция версии в `changelog.txt`
    when: проверяется её разметка
    then: >-
      разделитель — ровно 99 дефисов, следующая строка непустая и начинается с
      `Version: ` (с пробелом после двоеточия), необязательная строка даты
      начинается с `Date: `
  - given: категория и записи внутри секции
    when: проверяется отступ
    then: >-
      категория — ровно два пробела и двоеточие на конце строки, запись — ровно
      четыре пробела, дефис и пробел, продолжение многострочной записи — ровно
      шесть пробелов
  - given: файл `changelog.txt`
    when: проверяется на мусор
    then: >-
      нет табов, нет пробелов в конце строк, нет двух секций с одной версией,
      нет точных дублей записей внутри одной категории одной версии
  - given: версия в секции changelog
    when: сверяется с `info.json`
    then: верхняя секция changelog соответствует полю `version` релиза
verified: false
verified_at: null
verified_note: >-
  Сценарии про разметку, отступы и мусор (2–5) закрыты инструментом
  `npm run validate` 2026-10-03: на сломанной фикстуре он поймал короткий
  разделитель, пустую строку после него, неверный отступ категории, запись до
  категории, табуляцию и расхождение версии с info.json; на корректной
  фикстуре прошёл без находок. Первый сценарий — отображение в браузере модов
  и отсутствие ошибок в лог-файле — остаётся непроверенным: игра с 2026-10-04
  установлена, но своего мода ещё нет. Закрывается ручным прогоном по manual
  `test-mod-locally`, шаг 6.
