id: disabled-tier-is-bridged
kind: behavior
namespace: mods
entities: [advanced-belts]
title: Выключенный тир не создаётся, а цепочка сшивается через него
scenarios:
  - given: в настройках выключен тир «Ультра»
    when: игра загружается
    then: >-
      ни ленты, ни подземки, ни сплиттера, ни лоадера, ни технологии этого
      тира нет; рецепты, технология и улучшение тира «Гипер» ссылаются на
      «Превосходный»
  - given: выключены тиры «Превосходный» и «Ультра»
    when: игра загружается
    then: тир «Гипер» собирается из турбо и улучшается из турбо, его технология требует `turbo-transport-belt`
  - given: другой мод в `settings-updates` зафиксировал настройку тира через `forced_value = false` и спрятал её
    when: игра загружается
    then: тир выключен, а в настройках мода игрок этот флажок не видит
  - given: выключены все четыре тира
    when: игра загружается
    then: ошибок нет, мод даёт только стак и ожидание полной стопки для лоадеров
verified: true
verified_at: 2026-10-25
verified_note: >-
  Factorio 2.1.23, Space Age, AAI Loaders 0.3.0. Сценарии 1 и 3 — тестами в
  игре с зондом: «Ультра» выключен через `forced_value` в его
  `settings-updates`, «Гипер» собирается и улучшается из «Превосходного».
  Сценарии 2 и 4 — Lua-тестами сшивки (`tests/tiers.test.lua`); сборщик
  прототипов тот же, что в прогонах в игре. Что флажок не виден игроку —
  следствие `hidden = true`, глазами не проверялось.
