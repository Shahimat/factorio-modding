id: orbital-cargo-held-outside-destination
kind: behavior
namespace: mods
entities: [orbital-logistics]
title: Груз с назначением держится вне назначения и отдаётся на нём
scenarios:
  - given: на хабе над Нависом секция `[cargo→aquilo]` на 500 плит, в хабе 500
    when: платформа над Нависом запрашивает плиты с платформ, площадка Нависа — с орбиты
    then: хаб не отдаёт ни одной плиты (K-03)
  - given: та же платформа переставлена на орбиту Аквило
    when: платформа над Аквило запрашивает плиты с платформ
    then: хаб отдаёт (K-03)
  - given: секция `[cargo→nauvis,aquilo]` на 500 плит, платформа над Нависом
    when: платформа над Нависом запрашивает все 500
    then: получает все 500 — квот между планетами назначения нет (K-04)
  - given: секция `[cargo]` с `import_from` другой планеты
    when: площадка планеты под платформой запрашивает предмет
    then: хаб сбрасывает его по-ванильному (K-05)
  - given: секция `[cargo→fulgora]` с источником `all` и пустым `import_from` на 50 000, над Нависом другая платформа раздаёт 300 плит, площадка Нависа просит плиты
    when: проходят передачи над Нависом, затем платформа переставлена на Фульгору, затем обратно
    then: >-
      над Нависом хаб набирает 300 и ничего не сбрасывает; над Фульгорой
      секция выключена на этом хабе, и хаб отдаёт запросившей платформе;
      после ухода секция снова включена (K-13)
  - given: секция сбора выключена модом над Фульгорой, игрок удаляет секцию выше неё
    when: платформа улетает
    then: секция сбора снова включена — мод узнаёт её по имени группы, а не по номеру
  - given: платформа в пути (`space_location == nil`)
    when: проходит контроллер
    then: груз с назначением закрыт замком — Lua-тест решателя
verified: true
verified_at: 2026-10-27
verified_note: >-
  Factorio 2.1.23, Space Age. Сценарии 1–5 — тесты в игре K-03, K-04, K-05,
  K-13 (`tests/ingame/core.lua`), сценарий 6 — тест «выключенная секция
  груза после правки игрока» там же, сценарий 7 — `tests/resolver.test.lua`.
