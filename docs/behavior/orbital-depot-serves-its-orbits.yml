id: orbital-depot-serves-its-orbits
kind: behavior
namespace: mods
entities: [orbital-logistics]
title: Склад раздаёт на своих орбитах, держит вне их и уступает привезённому грузу
scenarios:
  - given: на хабе над Нависом секция `[depot:nauvis]` на 500 плит с источником `planet`, в хабе 500
    when: другая платформа запрашивает 50 с платформ
    then: склад отдаёт (K-02)
  - given: секция `[depot]`, платформа над Вулканом
    when: платформа над Вулканом запрашивает с платформ
    then: склад отдаёт — `[depot]` работает на любой орбите (K-09)
  - given: секция `[depot:nauvis]`, платформа над Вулканом
    when: платформа над Вулканом запрашивает с платформ
    then: склад ничего не отдаёт (K-10)
  - given: два склада `[depot:nauvis]` над Нависом, один полон, другой пуст, оба запрашивают с `planet`
    when: проходят передачи
    then: склады не перекачивают предмет друг другу (K-11)
  - given: над Нависом склад с 500 плит и челнок с секцией `[cargo→nauvis]` и 500 плит
    when: платформа запрашивает 50 с платформ
    then: отдаёт челнок, склад остаётся при 500 (K-12)
  - given: секция `[depot:nauvis]` с `min = max = 100`, в хабе 500
    when: проходит время
    then: излишек уходит по-ванильному, в хабе остаётся не больше 100 (K-14)
verified: true
verified_at: 2026-10-27
verified_note: >-
  Factorio 2.1.23, Space Age. Все сценарии — тесты в игре K-02, K-09, K-10,
  K-11, K-12, K-14 (`tests/ingame/core.lua`).
