id: mod-script-fits-tick-budget
kind: behavior
namespace: mods
entities: [logistic-buildings]
title: Скрипт мода укладывается в тиковый бюджет на базе из 10 000 зданий
scenarios:
  - given: тестовая карта с 10 000 зданий в логистическом режиме
    when: игра прогоняется без графики в режиме `--benchmark`
    then: среднее время скрипта мода остаётся меньше 1 мс на тик
  - given: все здания в режиме спят, спроса в сети нет
    when: идут тики
    then: >-
      затраты близки к нулю: обхода всех зданий каждый тик нет, здания
      навещаются только по будильникам, а интервал простаивающего здания
      растёт до потолка
  - given: на карте много логистических сетей
    when: приходит очередь пересчёта целей
    then: работа размазывается по тикам равными порциями, одиночного пика на одном тике нет
  - given: сотни турелей и сельскохозяйственных башен на медленном опросе
    when: идёт опрос
    then: порции опроса разложены по тикам, а проверка спроса делается по предметам сети, а не по зданиям
verified: false
verified_at: null
verified_note: >-
  Поведение выведено из ТЗ `specs/03102026_spec_logistic_buildings.md`
  (раздел 10) при планировании программы 2026-10-04; ориентир 10 000 зданий
  подтверждён владельцем 2026-10-04 как единственный (критерий приёмки 14
  называл «несколько тысяч»). Проверяется headless-замером, пруф подцели
  `lb-compat-release`.
