id: mod-name-carries-author-prefix
kind: behavior
namespace: mods
entities: [mod-package]
title: Каждый мод несёт авторскую приписку shm- и проходит ограничения портала
scenarios:
  - given: в репозитории заводится новый мод
    when: создаётся `mods/<dir>/info.json`
    then: >-
      поле `name` равно `shm-<mod-key>`, имя каталога совпадает с `name`,
      `title` начинается с `Shahimat: `, `author` равен `Shahimat`
  - given: поле `name` мода
    when: проверяется против ограничений мод-портала
    then: >-
      длина строго больше 3 и строго меньше 50 символов, символы только из
      набора латиница / цифры / `-` / `_`
  - given: мод определяет прототипы, записи локали или группы
    when: выбираются их внутренние имена
    then: имена префиксованы `shm-` независимо от имени самого мода
  - given: мод уже опубликован на портале
    when: возникает желание переименовать его
    then: >-
      имя не меняется — вместо переименования заводится новый мод, старый
      остаётся доступен под прежним именем
verified: false
verified_at: null
verified_note: >-
  Сценарии 1–3 закрыты инструментом `npm run validate` 2026-10-03: на
  фикстуре с чужим префиксом, недопустимым символом в `name`, несовпадением
  имени каталога, чужим `title` и чужим `author` он выдал по ошибке на
  каждое нарушение; на корректной фикстуре прошёл чисто. Своих модов в
  репозитории ещё нет, поэтому фактического соблюдения проверять не на чем.
  Сценарий 4 (не переименовывать после публикации) непроверяем до первой
  публикации на портале — это политика, а не состояние.
