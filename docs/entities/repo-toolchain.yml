id: repo-toolchain
kind: entity
namespace: platform
version: "1"
title: Монорепозиторий и инструментальный контур
summary: |
  npm-workspaces монорепозиторий. Исходники модов — Lua (без транспиляции).
  Инструменты сборки, валидации и публикации — TypeScript в strict-режиме,
  запускаются через npm-скрипты корня.

structure:
  mods/: пакеты модов, один каталог на мод, он же npm-workspace
  tools/: TypeScript-инструменты (валидация, упаковка, публикация)
  tools/lua/: харнесс и заглушки для Lua-тестов модов — единственный Lua в tools/
  specs/: входящие ТЗ автора, см. convention spec-intake
  plans/: согласованные планы итераций в HTML, см. convention spec-program
  poc/: моды-прототипы для проверки допущений спеки, вне mods/, см. convention spec-program
  docs/: слои manual и домен
  context/: слой агента
  .work/: пруфы и раунды ревью, вне git, см. convention spec-program

language_split:
  mod_sources: lua
  tooling: typescript
  rationale: |
    Вся официальная документация, примеры и отладочный тулинг Factorio — на
    Lua; транспиляция (TypeScriptToLua + typed-factorio) добавляет слой,
    который ломается на обновлениях API. При этом npm всё равно нужен под
    упаковку и публикацию, поэтому инструменты пишем на TypeScript.

    Единственный Lua внутри `tools/` — харнесс и заглушки в `tools/lua/`:
    тесты мода исполняет тот же язык, что и игра, иначе они не проверяли бы
    настоящий код. Обнаружение файлов и разбор результата при этом остались
    в TypeScript, см. convention `testing`.

typescript_requirements:
  strict: true
  note: |
    `strict: true` обязателен. Ослаблять отдельные флаги строгости в
    `tsconfig.json` нельзя — вместо этого правится код инструмента.

runtime:
  node: ">=22.6.0"
  typescript_execution: |
    Node исполняет `.ts` напрямую через встроенное type stripping, отдельной
    сборки нет. Поэтому в `tsconfig.json` включён `erasableSyntaxOnly`: enum,
    namespace и parameter properties запрещены, иначе Node упадёт. `tsc`
    используется только как `--noEmit` для проверки типов.
  external_cli:
    zip: нужен для сборки архива релиза; на macOS и типовых Linux есть из коробки
    jq: нужен страховочному hook, см. manual setup-safety-hooks
    lua: |
      нужен для Lua-тестов модов (`npm run check:mod`). Локально 5.5, в игре
      патченный 5.2; формул `lua@5.2` / `lua@5.3` в Homebrew нет. Бинарь
      переопределяется переменной `LUA_BIN`. Разницу диалектов ловит
      `tools/lib/lua-dialect.ts`, граница гарантии — convention `testing`.

tools_implemented:
  npm-scripts: |
    typecheck, test, test:mod, test:lua:all, check-secrets, check-docs,
    check-lua, validate, pack, check, check:mod. Скоупы разделены
    сознательно: `check` не заходит в моды, `check:mod -- <mod-key>`
    проверяет один мод, `check-lua -- <скоуп>` требует явный скоуп —
    convention `testing`, раздел «Скоупы запуска».
  tools/check-secrets.ts: |
    Защита публичного репозитория от утечек, convention `secrets`.
    Сканирует множество `git ls-files` + неигнорируемые untracked, то есть
    ровно то, что попадёт в git. Образцы — в `tools/lib/secret-rules.ts`,
    там же белый список публичных адресов Wube и правило, по которому
    контрольные суммы не считаются секретами. Отдельно проверяет через
    `git check-ignore`, что `.gitignore` действительно скрывает `.env*`,
    `secrets/`, `*.key` и `player-data.json`, но не `.env.example`.
  tools/check-docs.ts: |
    Машинно проверяемая часть чек-листа из convention `consistency`:
    двусторонние ссылки entity ↔ behavior, имя файла против `id`/`key`,
    механика verified, полнота сценариев, ссылки на manuals и conventions,
    покрытие `context/index.yml` в обе стороны, регистрация файлов `specs/`,
    полнота блока `sync`, manifest'ы модулей, структура целей
    (индекс против файлов, осиротевшие зависимости, циклы, приоритет против
    зависимости, дубли задач, секции приоритетов, длина строк), ссылка
    подцели на существующую программу, полнота блока `dod`, размеры
    namespace. Часть «проверяется только головой» из convention не
    заменяет.
  tools/lib/conventions.ts: |
    Единственное место с числовыми и строковыми значениями конвенций —
    префикс, лимиты длин, дорожки версий, длина разделителя changelog,
    распознаваемые категории, исключения упаковки.
  tools/lib/info-json.ts: |
    Сверка info.json с ограничениями портала и convention `mod-naming`:
    префикс `shm-`, длина `name`, допустимые символы, совпадение имени
    каталога с `name`, формат `version` и `factorio_version`, префикс
    `title`, значение `author`, разбор строк `dependencies`.
  tools/lib/changelog.ts: |
    Построчный разбор changelog.txt по требованиям парсера игры: ровно 99
    дефисов в разделителе, непустая строка `Version: ` после него,
    единственный `Date: ` в секции, отступы 2 / 4 / 6 пробелов, запрет табов
    и trailing spaces, дубли версий и дубли строк записей внутри категории.
  tools/lib/validate-mod.ts: |
    Полная проверка пакета: info.json, changelog.txt, сверка верхней секции
    changelog с `version`, наличие и размер `thumbnail.png`, наличие
    `LICENSE`, диалект всех `*.lua` пакета.
  tools/lib/lua-dialect.ts: |
    Запрет конструкций, которых нет в Lua 5.2: `//`, побитовые операторы,
    целочисленный math, `table.move`, `string.pack`, utf8, `<const>` и
    `<close>`, `coroutine.close`, а также убранные в 5.2 `setfenv`,
    `getfenv`, `loadstring` и глобальный `unpack`. Строки и комментарии
    гасятся с сохранением номеров строк, поэтому `|` внутри строки находкой
    не считается.
  tools/lib/lua-test-runner.ts: |
    Разбор вывода харнесса и правила находок. Отдельно проверяет, что
    прогон дошёл до итоговой строки: молчаливое падение интерпретатора
    иначе выглядело бы как успех.
  tools/lib/lua-tests.ts: |
    Обнаружение `*.test.lua` в пакете мода и запуск `tools/lua/run.lua`.
    Отсутствие тестов — ошибка, а не «нечего делать».
  tools/lib/dod.ts: |
    Проверка блока `dod` в программах и подцелях: обязательные поля пункта,
    набор `kind`, уникальность `id`, ссылка на существующий behavior и
    требование хотя бы одного машинного пункта у подцели. Правила —
    convention `spec-program`.
  tools/lua/harness.lua: |
    `describe` / `it` / сравнения с глубоким обходом таблиц. Тесты
    исполняются сразу при объявлении; падение внутри `it` становится
    записью, а не остановкой прогона.
  tools/lua/run.lua: |
    Ставит корень мода в `package.path`, выполняет файлы тестов, печатает
    собственный формат `TEST ok|fail` + `TOTAL`. Файл, который не
    загрузился, считается упавшим тестом.
  tools/lua/stubs/factorio.lua: |
    Минимальные заглушки `defines`, `script`, `storage`, `game`.
    Расширяются по факту появления кода, который не изолируется обёрткой.
  tools/lua-test.ts: Lua-тесты по скоупу — мод, список модов либо `--all`
  tools/check-mod.ts: один мод целиком — его Lua-тесты плюс валидация пакета
  tools/check-lua.ts: |
    Линт диалекта по явному скоупу: имя (ищется в `mods/` и `poc/`, с
    приставкой `shm-` и без), путь к любому каталогу либо `--all`. Нужен
    прежде всего для прототипов в `poc/`, куда `validate` не ходит. В
    `npm run check` не входит: скоуп задаётся осознанно.
  tools/validate.ts: |
    Отчёт по всем модам либо по перечисленным в аргументах, код возврата 1
    при ошибках
  tools/pack.ts: |
    Сборка `dist/{name}_{version}.zip` через staging-каталог: одна папка
    верхнего уровня, `info.json` в её корне, исключение `node_modules`,
    `.git`, `dist`, `.DS_Store` и вложенных `*.zip`. Отказывается собирать
    пакет с ошибками валидации.

tools_planned:
  link-local: симлинк пакета мода в каталог модов локальной игры

editor_tooling:
  vscode_extensions:
    justarandomgeek.factoriomod-debug: |
      Factorio Modding Tool Kit (FMTK), MIT. Официального расширения от Wube
      не существует; это де-факто стандарт экосистемы, опирающийся на
      встроенный в игру LuaDebugAdapter.
    tangzx.emmylua: |
      Language server для Lua. FMTK отдаёт ему сгенерированные определения
      API под установленную версию игры. В старых версиях FMTK интеграция
      шла через sumneko.lua — перешли на EmmyLua.
  rejected:
    svizzini.factorio-lua-api-autocomplete: |
      Не нужен при связке FMTK + EmmyLua: определения API генерирует FMTK.
  overlap_with_own_tools: |
    FMTK умеет Package, Upload и Details, то есть покрывает всё, что
    планировалось в собственном инструменте `publish`, включая хранение
    API-ключа в Keychain. Свой `publish` поэтому не пишем. Собственные
    `validate` и `pack` остаются: FMTK не знает про приставку `shm-`,
    префикс `title`, обязательный `LICENSE` и сверку верхней секции
    changelog с версией релиза.
  forbidden: |
    Команда FMTK `Publish` — всё-в-одном: сама делает git commit, ставит тег
    и пушит в upstream. Это нарушает правило проекта, что git-операции
    выполняет владелец руками. Пользуемся только Package / Upload / Details;
    если `Publish` всё же нужен — выставляются `package.no_git_tag` и
    `package.no_git_push` в `info.json`. Подробности — manual
    `setup-dev-environment`, раздел «Чего в FMTK делать нельзя».

features_enabled:
  - npm-workspaces
  - strict-typescript-tooling
  - native-node-ts-execution
features_disabled:
  - typescript-to-lua-transpile
  - ci-publish-pipeline
note_on_features: |
  Проверка и упаковка модов описаны в `tools_implemented`, а их ожидаемое
  поведение живёт в behaviors сущностей `mod-package` и `mod-portal` — здесь
  не дублируется.

dev_dependencies:
  typescript: проверка типов через `tsc --noEmit`
  "@types/node": типы встроенных модулей Node
  yaml: |
    Разбор YAML для `check-docs`; в Node парсера YAML нет. Только
    devDependency, в zip мода не попадает.

external_deps_considered:
  typed-factorio: отклонён вместе с транспиляцией, см. language_split
  create-typed-factorio: отклонён, последний релиз три года назад

manuals:
  - setup-dev-environment
  - test-mod-locally
  - setup-safety-hooks
behaviors:
  - toolchain-builds-under-strict-ts
  - no-secrets-in-versioned-files
  - tools-covered-by-unit-tests
conventions:
  - spec-intake
  - spec-program
  - secrets
  - testing
