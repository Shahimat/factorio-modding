id: repo-toolchain
kind: entity
namespace: platform
version: "1"
title: Монорепозиторий и инструментальный контур
summary: "npm-workspaces монорепозиторий: моды на Lua без транспиляции, инструменты сборки, валидации и публикации — TypeScript в strict-режиме."

structure:
  mods/: пакеты модов, один каталог на мод, он же npm-workspace
  tools/: TypeScript-инструменты (валидация, упаковка, публикация)
  tools/lua/: харнесс и заглушки для Lua-тестов модов — единственный Lua в tools/
  ui-test-engine/: отдельный нативный движок графических UI-тестов, entity ui-test-engine
  specs/: входящие ТЗ автора по convention spec-intake
  plans/: согласованные планы итераций в HTML по convention spec-program
  poc/: моды-прототипы для проверки допущений спеки, вне mods/, по convention spec-program
  docs/: канон manual и домена — entities и behavior
  context/: открытый слой агента — реквизиты, workflow, conventions, индекс
  context/views/: YAML-очередь целей и программ, не история прогресса
  .work/: пруфы, раунды ревью и рабочий каталог стенда, вне git, по convention spec-program
  factorio-test.json: конфиг стенда тестов внутри игры, читается и обёрткой, и CLI
  .npmrc: |
    публичный реестр npm, задан явно и версионируется. Глобальный `~/.npmrc`
    может указывать на внутренний корпоративный реестр, и тогда
    `npm install` записывает его адреса в `package-lock.json` — внутренняя
    инфраструктура в публичном репозитории, convention `secrets`

language_split:
  mod_sources: lua
  tooling: typescript
  rationale: |
    Вся официальная документация, примеры и отладочный тулинг Factorio — на
    Lua; транспиляция (TypeScriptToLua + typed-factorio) добавляет слой,
    который ломается на обновлениях API. При этом npm всё равно нужен под
    упаковку и публикацию, поэтому инструменты пишем на TypeScript.

    Единственный Lua внутри `tools/` — харнесс и заглушки в `tools/lua/`:
    тесты мода исполняет тот же язык, что и игра, иначе они не проверяли бы
    настоящий код. Обнаружение файлов и разбор результата при этом остались
    в TypeScript по convention `testing`.

agent_protection:
  settings: opencode.jsonc
  owner: владелец проектных настроек
  mechanism: native policies OpenCode; независимые запреты сохраняются при смене контракта
  limitations: |
    В прежних наблюдениях прямые edit/patch в известные memory-пути получали
    отказ, запись в проектные документы проходила, а shell-перенаправление
    записало синтетический маркер. Это не полная изоляция shell, MCP/API или
    кода плагинов; symlink, подкаталоги и соответствующие каналы не подтверждены.
    Отдельные сервер, HOME/XDG и тестовые MCP для прежних проб не были
    подготовлены. Эти ограничения не разрешают параллельное хранилище знания.
  evidence: >-
    Наблюдения сессии перехода на v2 от 2026-11-11: прямые синтетические пробы
    с проверкой наличия или отсутствия маркера чтением назначения. Это источник
    перечисленных ограничений, не новая техническая приёмка защиты.

typescript_requirements:
  strict: true
  note: |
    `strict: true` обязателен. Ослаблять отдельные флаги строгости в
    `tsconfig.json` нельзя — вместо этого правится код инструмента.

runtime:
  node: ">=24"
  typescript_execution: |
    Node исполняет `.ts` напрямую через встроенное type stripping, отдельной
    сборки нет. Поэтому в `tsconfig.json` включён `erasableSyntaxOnly`: enum,
    namespace и parameter properties запрещены, иначе Node упадёт. `tsc`
    используется только как `--noEmit` для проверки типов.
  external_cli:
    zip: нужен для сборки архива релиза; на macOS и типовых Linux есть из коробки
    jq: чтение имени аккаунта из player-data.json в manual setup-dev-environment
    lua: |
      нужен для Lua-тестов модов (`npm run check:mod`). В игре патченный
      5.2. Тесты берут `lua5.2` из `PATH`, если он есть (пакет `lua52` в
      Arch Linux), иначе `lua` — на macOS это 5.5 из Homebrew, формул
      `lua@5.2` / `lua@5.3` там нет. Выбор перебивает переменная `LUA_BIN`. Разницу диалектов ловит
      `tools/lib/lua-dialect.ts`, граница гарантии — convention `testing`.
    factorio: |
      сама игра нужна стенду тестов внутри игры (`npm run test:ingame`):
      прогон идёт headless тем же бинарём, что и обычная игра. Путь
      определяется автоматически (Steam-бандл, `/Applications`, типовые
      установки Linux, все библиотеки Steam из `libraryfolders.vdf`) и
      переопределяется переменной `FACTORIO_BIN` — по той же причине, что
      `LUA_BIN`: абсолютный путь с именем пользователя в версионируемые
      файлы попасть не может, convention `secrets`.

tools_implemented:
  npm-scripts: |
    typecheck, test, test:mod, test:lua:all, test:ingame, test:ui:poc, test:ui:orbital, check-secrets,
    check-docs, check-lua, validate, pack, recolor-sprites, orbital-art,
    publish:mod, check, check:mod. Скоупы разделены
    сознательно: `check` не заходит в моды, `check:mod -- <mod-key>`
    проверяет один мод, `check-lua -- <скоуп>` требует явный скоуп —
    convention `testing`, раздел «Скоупы запуска». `test:ingame` запускает
    игру и в `npm run check` тоже не входит. `publish:mod -- <mod-key>`
    публикует готовый `dist/<name>_<version>.zip` на портал одной командой,
    ключ берёт из окружения или `.env.local`/`.env` в корне.
  tools/check-secrets.ts: |
    Защита публичного репозитория от утечек, convention `secrets`.
    Сканирует множество `git ls-files` + неигнорируемые untracked, то есть
    ровно то, что попадёт в git. Образцы и публичные адреса Wube — в
    `tools/lib/secret-rules.ts`; контекстные исключения — в `secret-scan.ts`.
    Кроме явно обозначенных hash/integrity значений разрешены 40hex commit-pin
    в HTTPS raw URL upstream Shahimat/ai-prompts и ведущая отдельная 64hex
    SHA-256-колонка в Markdown с явной маркировкой. Это исключения конкретного
    checksum-значения, не всей строки или блока: соседние токены, другие
    hex/base64 и приватные пути продолжают проверяться. Исключений для всего
    каталога или файла нет; узкие случаи покрыты регрессиями `secret-scan.test.ts`.
    Отдельно проверяет через
    `git check-ignore`, что `.gitignore` действительно скрывает `.env*`,
    `secrets/`, `*.key` и `player-data.json`, но не `.env.example`.
  tools/check-docs.ts: |
    Машинно проверяемая часть чек-листа из convention `consistency`:
    двусторонние ссылки entity ↔ behavior, имя файла против `id`/`key`,
    механика verified, полнота сценариев, ссылки на manuals и conventions,
    покрытие `context/index.yml` по entities/behaviors/conventions/manuals,
    полнота блока `sync`, manifest'ы модулей, размеры namespace.
    `tools/lib/check-docs-navigation.ts` проверяет структуру views: индекс
    против файлов, key/file/status/kind, принадлежность подцели программе,
    четыре секции tasks с непустыми строками, существование depends_on и
    отсутствие циклов. Семантика приоритетов/интентов, дубли работы и полнота
    критериев dod в description требуют ручной проверки по goal-consistency
    и spec-program; checker их не доказывает. Регистрацию ТЗ и соответствие
    критериев approved-плану агент сверяет отдельно. Часть «проверяется
    только головой» из convention инструмент не заменяет.
  tools/lib/conventions.ts: |
    Единственное место с числовыми и строковыми значениями конвенций —
    префикс, лимиты длин, дорожки версий, длина разделителя changelog,
    распознаваемые категории, исключения упаковки.
  tools/lib/info-json.ts: |
    Сверка info.json с ограничениями портала и convention `mod-naming`:
    префикс `shm-`, длина `name`, допустимые символы, совпадение имени
    каталога с `name`, формат `version` и `factorio_version`, префикс
    `title`, значение `author`, разбор строк `dependencies`.
  tools/lib/changelog.ts: |
    Построчный разбор changelog.txt по требованиям парсера игры: ровно 99
    дефисов в разделителе, непустая строка `Version: ` после него,
    единственный `Date: ` в секции, отступы 2 / 4 / 6 пробелов, запрет табов
    и trailing spaces, дубли версий и дубли строк записей внутри категории.
  tools/lib/validate-mod.ts: |
    Полная проверка пакета: info.json, changelog.txt, сверка верхней секции
    changelog с `version`, наличие и размер `thumbnail.png`, наличие
    `LICENSE`, диалект всех `*.lua` пакета.
  tools/lib/lua-dialect.ts: |
    Запрет конструкций, которых нет в Lua 5.2: `//`, побитовые операторы,
    целочисленный math, `table.move`, `string.pack`, utf8, `<const>` и
    `<close>`, `coroutine.close`, а также убранные в 5.2 `setfenv`,
    `getfenv`, `loadstring` и глобальный `unpack`. Строки и комментарии
    гасятся с сохранением номеров строк, поэтому `|` внутри строки находкой
    не считается.
  tools/lib/lua-test-runner.ts: |
    Разбор вывода харнесса и правила находок. Отдельно проверяет, что
    прогон дошёл до итоговой строки: молчаливое падение интерпретатора
    иначе выглядело бы как успех.
  tools/lib/lua-tests.ts: |
    Обнаружение `*.test.lua` в пакете мода и запуск `tools/lua/run.lua`.
    Отсутствие тестов — ошибка, а не «нечего делать».
  tools/lua/harness.lua: |
    `describe` / `it` / сравнения с глубоким обходом таблиц. Тесты
    исполняются сразу при объявлении; падение внутри `it` становится
    записью, а не остановкой прогона.
  tools/lua/run.lua: |
    Ставит корень мода в `package.path`, выполняет файлы тестов, печатает
    собственный формат `TEST ok|fail` + `TOTAL`. Файл, который не
    загрузился, считается упавшим тестом.
  tools/lua/stubs/factorio.lua: |
    Минимальные заглушки `defines`, `script`, `storage`, `game`.
    Расширяются по факту появления кода, который не изолируется обёрткой.
  tools/ingame-test.ts: |
    Стенд тестов внутри игры: готовит `config.ini` под раскладку
    установленной игры, затем запускает `factorio-test run`, пробрасывая
    аргументы и код возврата. Код возврата важен сам по себе: падение
    сценария обязано валить команду, иначе зелёный прогон ничего не значит.
  ui-test-engine/: |
    Дополнительный графический контур с нативным вводом через LuaSimulation,
    не save-based FactorioTest и не замена ему. Устройство, команды и ограничения —
    docs/entities/ui-test-engine.yml; unit-тесты входят в npm test,
    TypeScript — в общий strict typecheck, графические прогоны — отдельно
    test:ui:poc и test:ui:orbital.
  tools/lib/game-install.ts: |
    Поиск установленной игры для всех инструментов, которым она нужна
    (`test:ingame`, `recolor-sprites`, `orbital-art`): бинарь, каталог её
    данных и креды из Steam Cloud. Здесь — чтение файловой системы, правила
    выбора — в `ingame-config.ts`.
  tools/lib/ingame-config.ts: |
    Чистая часть стенда: кандидаты на бинарь игры (с учётом `FACTORIO_BIN`
    и библиотек Steam), разбор `libraryfolders.vdf` и `player-data.json`,
    подбор `read-data` по факту наличия пакета `base` и
    решение, нужно ли перезаписывать `config.ini`. Нужна потому, что
    `factorio-test-cli` пишет в конфиг раскладку Linux-сборки
    (`__PATH__executable__/../../data`), а в macOS-бандле данные лежат в
    `factorio.app/Contents/data`, то есть на уровень выше, — игра отвечает
    «there is no package core» и прогон не стартует. Существующий конфиг CLI
    не перезаписывает, поэтому достаточно положить верный файл заранее.
    Язык в генерируемом профиле задаётся явно: пустой locale вызвал у
    графической 2.1.24 ошибку ROOT.sound до загрузки модов, хотя headless
    запускал тот же профиль. needsRewrite также чинит прежнее пустое значение,
    но сохраняет явно выбранный язык. Личный профиль игры не затрагивается.
  tools/lua-test.ts: Lua-тесты по скоупу — мод, список модов либо `--all`
  tools/check-mod.ts: один мод целиком — его Lua-тесты плюс валидация пакета
  tools/check-lua.ts: |
    Линт диалекта по явному скоупу: имя (ищется в `mods/` и `poc/`, с
    приставкой `shm-` и без), путь к любому каталогу либо `--all`. Нужен
    прежде всего для прототипов в `poc/`, куда `validate` не ходит. В
    `npm run check` не входит: скоуп задаётся осознанно.
  tools/validate.ts: |
    Отчёт по всем модам либо по перечисленным в аргументах, код возврата 1
    при ошибках
  tools/pack.ts: |
    Сборка `dist/{name}_{version}.zip` через staging-каталог: одна папка
    верхнего уровня, `info.json` в её корне, исключение `node_modules`,
    `.git`, `dist`, `.DS_Store` и вложенных `*.zip`. Отказывается собирать
    пакет с ошибками валидации.
  tools/recolor-sprites.ts: |
    Графика тиров `shm-advanced-belts`: из ванильных спрайтов турбо-лент
    установленной игры вырезает маски цвета (`tools/lib/recolor.ts`) и
    кладёт их в `graphics/` мода, плюс собирает `thumbnail.png`. Игру ищет
    так же, как `test:ingame` (`FACTORIO_BIN`). Что перекрашивается и куда —
    `tools/lib/recolor-jobs.ts`. Запускается руками, когда меняются маски
    или цвета; результат версионируется.
  tools/orbital-art.ts: |
    Картинки `shm-orbital-logistics`: `thumbnail.png` и картинка пути
    Наувис → Вулкан для «Советов и подсказок» из иконок установленной игры.
    Рисование — чистые функции `tools/lib/orbital-art.ts` с тестами
    (масштабирование по площади, дуга со сглаживанием и пунктиром,
    наконечник стрелки), наложение — `place` из `tools/lib/recolor.ts`. Игру
    ищет так же, как `test:ingame`. Запускается руками; результат
    версионируется.

ingame_test_stand:
  framework: |
    FactorioTest — мод `factorio-test` (GlassBricks, MIT) плюс CLI
    `factorio-test-cli` в `devDependencies`. Выбран 2026-10-06 по двум
    условиям convention `testing`: линия релизов `3.1.x` идёт под
    `factorio_version 2.1` (тогда выбор шёл ещё и по линии `3.0.x` под 2.0,
    снятой вместе с поддержкой 2.0), headless — режим по умолчанию. Третье
    условие тоже выполнено: в `dependencies` тестируемого мода фреймворк не
    прописывается.
  how_to_run: |
    `npm run test:ingame` — обёртка `tools/ingame-test.ts`, конфиг
    `factorio-test.json` в корне (прототип в `poc/`). Аргументы
    пробрасываются: `npm run test:ingame -- -v`,
    `npm run test:ingame -- "<lua-паттерн>"`, другой конфиг —
    `-c <путь>`. Рабочий каталог (моды стенда, сейвы, `config.ini`,
    `player-data.json`) — `.work/ingame-stand/`, вне git: там оказываются
    креды мод-портала. Креды нужны CLI один раз, чтобы скачать мод
    `factorio-test`. Steam-сборка под Linux держит `player-data.json` в
    Steam Cloud, где CLI его не ищет, поэтому обёртка при незаданных
    `FACTORIO_USERNAME` / `FACTORIO_TOKEN` берёт их оттуда и передаёт
    процессу CLI только через окружение, manual `setup-dev-environment`,
    шаг 12.
  per_mod_config: |
    Мод со своими тестами держит конфиг в `mods/<name>/tests/ingame/`
    (каталог `tests/` вырезается упаковкой) и npm-скрипты в своём
    `package.json`: `npm run test:ingame -w <name>` и варианты. CLI считает
    относительные пути конфига от его каталога и там же держит
    `factorio-test.lock.json` — один на каталог: все конфиги и профили
    каталога пишут в него набор модов последнего прогона, поэтому основной
    профиль прогоняется последним. Профили без отдельного конфига —
    переопределением из командной строки, например `--mods space-age` вместо
    списка из конфига.

    Свой вспомогательный мод (зонд, который фиксирует стартовые настройки
    или вызывает API тестируемого мода) кладётся симлинком в `mods/`
    каталога данных стенда и называется в `--mods`: симлинк CLI считает
    модом пользователя и с портала его не тянет. Пример —
    `test:ingame:probe` у `shm-advanced-belts`.
    Тяжёлые зависимости (K2 и его ассеты) не обязательно качать: CLI
    берёт моды, уже лежащие в каталоге модов стенда, в том числе ссылки на
    zip из каталога модов игры.
  graphics_runs: |
    Тесты, которым нужен живой игрок (интерфейс, `player.selected`,
    вставка настроек игроком), помечаются тегом `gui` и идут отдельным
    прогоном с `-g` и `tagWhitelist: ["gui"]`; в прогоне без графики игрока
    нет, там `tagBlacklist: ["gui"]`. Без `--watch` CLI в режиме с графикой
    ждёт, пока игру закроют руками, — обёртка ловит строку
    `Test run finished: …`, закрывает CLI вместе с игрой одним сигналом
    группе процессов и возвращает код по итогу.
  steam: |
    Игра запускается из каталога данных стенда, куда обёртка кладёт
    `steam_appid.txt` (427520): Steam-сборка без него перезапускает себя
    через Steam и теряет аргументы. Поэтому CLI получает путь к конфигу
    абсолютным.
  release_isolation: |
    Фреймворк остаётся dev-зависимостью. В пакете мода от него есть только
    условный блок в конце `control.lua`:
    `if script.active_mods['factorio-test'] then require('__factorio-test__/init')({...}) end`.
    Без мода стенда ветка не исполняется, в `dependencies` он не попадает, а
    сами файлы тестов вырезаются упаковкой (`PACK_EXCLUDED_SUFFIXES`,
    `tests/`).
  rejected:
    funit: |
      Мод `funit` (jfletcher94, LGPLv3). Оба условия формально закрывает —
      `0.5.3` под 2.0, `1.0.0` под 2.1, прогон в CI возможен, — но своего
      запускающего инструмента нет: тесты живут в кастомном сценарии, отчёт
      пишется JSON-файлом в `script-output`, а запуск игры и разбор отчёта
      пришлось бы писать нам. Это половина «минимального своего стенда» из
      запасного пути convention `testing`, только с чужим ядром.
    factestio: |
      Требует Lua 5.2.x на `PATH` — которого в проекте принципиально нет
      (локально 5.5, формул `lua@5.2` в Homebrew не существует;
      граница проверки — convention `testing`), плюс LuaRocks и bash-обвязку. Лицензии в
      репозитории нет вовсе, поддержка 2.0 и 2.1 не заявлена, последняя
      правка — сентябрь 2026.
    own_stand: |
      Минимальный свой стенд (тестовый сценарий плюс консольная команда) —
      запасной путь на случай, если ни один фреймворк не пройдёт условия.
      Не понадобился.

tools_planned:
  link-local: симлинк пакета мода в каталог модов локальной игры

editor_tooling:
  vscode_extensions:
    justarandomgeek.factoriomod-debug: |
      Factorio Modding Tool Kit (FMTK), MIT. Официального расширения от Wube
      не существует; это де-факто стандарт экосистемы, опирающийся на
      встроенный в игру LuaDebugAdapter.
    tangzx.emmylua: |
      Language server для Lua. FMTK отдаёт ему сгенерированные определения
      API под установленную версию игры. В старых версиях FMTK интеграция
      шла через sumneko.lua — перешли на EmmyLua.
  rejected:
    svizzini.factorio-lua-api-autocomplete: |
      Не нужен при связке FMTK + EmmyLua: определения API генерирует FMTK.
  overlap_with_own_tools: |
    FMTK умеет Package, Upload и Details, включая хранение API-ключа в
    Keychain. Релиз с 2026-11-03 публикует свой `publish:mod` (поле
    `tools_implemented.npm-scripts`): решение «свой publish не пишем»
    пересмотрено после запрета /tmp-скриптов. Package и правка страницы
    мода остаются за FMTK и руками. Собственные `validate` и `pack`
    остаются: FMTK не знает про приставку `shm-`, префикс `title`,
    обязательный `LICENSE` и сверку верхней секции changelog с версией
    релиза.
  forbidden: |
    Команда FMTK `Publish` — всё-в-одном: сама делает git commit, ставит тег
    и пушит в upstream. Это нарушает правило проекта, что git-операции
    выполняет владелец руками. Пользуемся только Package / Upload / Details;
    если `Publish` всё же нужен — выставляются `package.no_git_tag` и
    `package.no_git_push` в `info.json`. Подробности — manual
    `setup-dev-environment`, раздел «Чего в FMTK делать нельзя».

features_enabled:
  - npm-workspaces
  - strict-typescript-tooling
  - native-node-ts-execution
features_disabled:
  - typescript-to-lua-transpile
  - ci-publish-pipeline
note_on_features: |
  Проверка и упаковка модов описаны в `tools_implemented`, а их ожидаемое
  поведение живёт в behaviors сущностей `mod-package` и `mod-portal` — здесь
  не дублируется.

dev_dependencies:
  typescript: проверка типов через `tsc --noEmit`
  "@types/node": типы встроенных модулей Node
  yaml: |
    Разбор YAML для `check-docs`; в Node парсера YAML нет. Только
    devDependency, в zip мода не попадает.
  pngjs: |
    Чтение и запись PNG для `recolor-sprites` и `orbital-art`, MIT, без нативных модулей.
    Выбран владельцем 2026-10-25 вместо разового Python-скрипта вне
    репозитория: порождение графики воспроизводимо и покрыто тестами. Только
    devDependency, в zip мода не попадает.
  factorio-test-cli: |
    Запуск стенда тестов внутри игры, MIT. Единственная внешняя зависимость
    с собственным деревом (7 прямых пакетов): правило нулевых зависимостей
    относится к Node-тестам инструментов, а своего раннера в игре нет вовсе —
    convention `testing`, раздел «Интеграционные тесты в игре». Моды стенда
    тянет с мод-портала, креды берёт из залогиненной установки игры либо из
    `FACTORIO_USERNAME` / `FACTORIO_TOKEN`.

external_deps_considered:
  typed-factorio: отклонён вместе с транспиляцией по решению language_split
  create-typed-factorio: отклонён, последний релиз три года назад

