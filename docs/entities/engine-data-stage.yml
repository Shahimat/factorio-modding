id: engine-data-stage
kind: entity
namespace: engine
version: "1"
title: Стадии настроек и данных — фиксация чужих настроек, сохранённые значения, переработка в 2.1
summary: |
  Факты о стадиях `settings*` и `data*`, выясненные при разработке
  shm-advanced-belts: где документация молчит или формулирует неочевидно.

facts:
  - claim: |
      `forced_value` есть только у булевой настройки (`bool-setting`). У
      строковой и числовой поле молча игнорируется — без ошибки, настройка
      остаётся со своим значением. Чужой мод фиксирует такую настройку в
      `settings-updates`: `default_value` плюс `allowed_values` из одного
      значения плюс `hidden = true`.
    checked_on: 2.1.23, 2026-10-25 — тест в игре, `aai-loaders-mode` через `forced_value` остался `lubricated`, через `allowed_values` стал `expensive`
  - claim: |
      В 2.1 рецепты переработки порождает отдельный базовый мод `recycler`
      в своём `data-updates` — раньше `data-updates` любого стороннего мода,
      потому что базовые моды грузятся первыми. Рецепт, созданный позже
      (в `data-updates` или `data-final-fixes`), остаётся без переработки,
      а изменённый позже — с переработкой по старым ингредиентам. Пересобрать
      можно библиотекой `require('__recycler__.recycling')`
      (`generate_recycling_recipe`), но она добавляет в технологию
      `recycling` новое открытие рядом со старым: старый рецепт переработки
      и его открытие надо удалить до вызова.
    checked_on: 2.1.23, 2026-10-25 — `recycler/data-updates.lua` и `recycling.lua` 2.1.23, тесты в игре shm-advanced-belts
  - claim: |
      `mod-settings.dat` хранит значения стартовых настроек, в том числе
      равные значению по умолчанию. Новое `default_value` в следующей версии
      мода у игрока, уже запускавшего прежнюю, не применяется — остаётся
      сохранённое старое. Значения по умолчанию надо выбирать до релиза, а
      на стенде тестов после их смены удалять `mods/mod-settings.dat`.
      Наблюдение владельца, отдельно не проверялось: после запуска игры без
      мода (симлинк удалён, мод поставлен с портала заново) настройки
      сбросились к новым значениям по умолчанию — видимо, настройки
      отсутствующего мода игра при запуске забывает.
    checked_on: 2.1.23, 2026-10-25 — стенд shm-advanced-belts, дальность по умолчанию 13 → 15 осталась 13 до удаления файла

  - claim: |
      `pcall(require, '<модуль>')` на стадии настроек (`settings.lua`) ловит
      отсутствующий файл мода и возвращает `false`, загрузка продолжается.
      Этим можно заводить настройку только при наличии файла — например,
      отладочную настройку в рабочей копии, которой нет в zip релиза.
    checked_on: 2.1.23, 2026-10-30 — мод orbital-logistics, временная проверка в `settings.lua` на стенде тестов
  - claim: |
      Строка локали понимает `\n` как перенос строки, а
      `[font=default-bold]` и `[font=default-large-bold]` — как жирный шрифт
      и крупный жирный; `[img=space-location/<имя>]` рисует иконку места.
      Это работает и в описании подсказки (`tips-and-tricks-item-description`).
      У `tips-and-tricks-item` есть поле `image` — картинка над текстом.
      Окно растягивает её на всю ширину своей области независимо от числа
      пикселей, высоту берёт по пропорциям: 320×128 заняла почти всё окно
      крупными пикселями. Размер на экране задают пропорции — широкий
      низкий холст с прозрачным полем. Ещё есть поле `tag` — rich text перед именем
      в списке; иконка маршрута между планетами —
      `[img=space-connection/<имя>]`.
    checked_on: 2.1.23, 2026-10-30 — мод orbital-logistics, страница «Советов и подсказок»; вид глазами — владелец

behaviors: []
