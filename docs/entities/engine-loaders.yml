id: engine-loaders
kind: entity
namespace: engine
version: "1"
title: Лоадеры — режим полной стопки только в прототипе, что переносит fast_replace скриптом
summary: |
  Факты о лоадерах, выясненные тестами в игре при разработке
  shm-advanced-belts. Пара к `engine-inserters`: механика та же, поля другие.

facts:
  - claim: |
      Ожидание полной стопки (`LoaderPrototype::wait_for_full_stack`)
      задаётся только в прототипе. В `LuaEntity` его нет, в
      `LuaEntityPrototype` оно только читается
      (`loader_wait_for_full_stack`) — режим конкретного лоадера меняется
      только заменой на другой прототип.
    checked_on: 2.1.23, 2026-10-25 — `runtime-api.json` 2.1.23 и тесты shm-advanced-belts
  - claim: |
      `LuaSurface.create_entity{fast_replace = true}` на месте лоадера
      (`loader-1x1`) переносит провода сети и условие включения
      (`LuaLoaderControlBehavior`) без участия скрипта. Тип (вход или
      выход), фильтры, режим фильтра, переопределение размера стопки и
      здоровье скрипт снимает до замены и восстанавливает после; тип
      передаётся и в саму замену полем `type`.
    checked_on: 2.1.23, 2026-10-25 — тест в игре, сравнение до и после замены
  - claim: |
      Сущность, созданная скриптом без `raise_built = true`, не вызывает
      событий постройки у других модов. Для лоадеров AAI Loaders это значит
      «нет трубы с лубрикантом и нет учёта»: лоадер работает без лубриканта.
      Скрипт, который ставит или заменяет чужие лоадеры, объявляет постройку
      сам, а снос — `script.raise_script_destroy` до замены.
    checked_on: 2.1.23, 2026-10-25 — тест в игре с AAI Loaders 0.3.0

behaviors: []
