id: engine-ghosts
kind: entity
namespace: engine
version: "1"
title: Призраки сущностей — окно, достройка, замена скриптом
summary: |
  Факты о призраках (`entity-ghost`), выясненные тестами в игре, когда
  переключатели режима манипуляторов и лоадеров учились работать на
  призраках. Документация на эти вопросы молчит или отвечает только полем
  без пояснений.

facts:
  - claim: |
      Относительная панель (`player.gui.relative`) по умолчанию не видна на
      окне призрака: `GuiAnchor.ghost_mode` по умолчанию `only_real`. Для
      панели и у сущности, и у её призрака нужен `ghost_mode = 'both'`.
      `on_gui_opened` на окне призрака приходит с самим призраком,
      `gui_type` — `entity`.
    checked_on: 2.1.23, 2026-10-27 — `runtime-api.json` 2.1.23 и тест в игре с живым игроком
  - claim: |
      Когда призрак с открытым окном достраивается (роботом, игроком из
      руки поверх призрака того же прототипа, `revive` скриптом),
      `player.opened` переходит на построенную сущность без нового
      `on_gui_opened`. Панель, построенная для призрака, сама не
      обновляется — её пересобирают по событиям постройки.
    checked_on: "2.1.23, 2026-10-27 — тест в игре: робот, `build_from_cursor`, `revive` с `raise_revive`"
  - claim: |
      Игрок, ставящий предмет поверх призрака другого прототипа, который
      строится этим же предметом (`placeable_by`), получает `place_result`
      предмета, а не прототип призрака; окно призрака при этом
      закрывается. Роботы же оживляют призрак в его собственном прототипе.
      Сохранить прототип призрака можно только скриптом: запомнить
      призрак в `on_pre_build` и заменить построенное в `on_built_entity`.
    checked_on: 2.1.23, 2026-10-27 — тест в игре, превосходный манипулятор K2 и его скрытая копия
  - claim: |
      `LuaSurface.create_entity{name = 'entity-ghost', inner_name = ...,
      fast_replace = true}` поверх призрака заменяет его на месте. Сами
      переносятся направление, качество, фильтры и их режим, приоритет
      порченого, размер стака, точка выкладки, провода сети и условие
      включения. Теряются `tags`, `last_user`, `insert_plan` и у
      манипулятора выбор полосы захвата (`pickup_from_left_lane`): их надо
      снимать до замены. Окно призрака у игрока закрывается. У призрака нет
      здоровья (`health` = nil) и руки (`held_stack` — ошибка).
    checked_on: 2.1.23, 2026-10-27 — тест в игре, сравнение до и после замены у манипулятора и лоадера AAI

behaviors: []
