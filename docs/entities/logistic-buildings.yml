id: logistic-buildings
kind: entity
namespace: mods
version: "1"
title: Мод «Логистические здания» — shm-logistic-buildings
spec: specs/03102026_spec_logistic_buildings.md
summary: |
  Мод даёт любому зданию логистический режим: здание само становится
  участником логистической сети и обменивается предметами с дронами напрямую,
  без связки «сундук запроса → манипулятор → здание → манипулятор → сундук
  снабжения». Три отличия от аналогов (Logistic Assembling Machine, Logistic
  Machines): режим включается на существующем здании, а не заводится отдельными
  прототипами; здание работает только пока в сети есть неудовлетворённый спрос
  на его продукцию; заказ и отгрузка идут партиями, чтобы дроны летали полными.

package:
  name: shm-logistic-buildings
  dir: mods/shm-logistic-buildings/
  title: "Shahimat: Logistic Buildings"
  factorio_version: |
    "2.0" на основной дорожке; релиз под 2.1 выпускается из той же кодовой
    базы вторым потоком — convention `factorio-version-track`.
  dependencies:
    - base
  feature_flags: |
    Ни одного. Мод обязан грузиться на чистой игре без DLC, а качество
    учитывается всегда: в движке оно существует и без Quality (одно,
    «обычное»), поэтому отдельной ветки кода под игру без DLC нет.
  locale:
    - ru
    - en
  portal_name: |
    Имя свободно: `GET mods.factorio.com/api/mods/shm-logistic-buildings` и то
    же имя без приставки отдали `404 Mod not found` (curl, анонимно,
    2026-10-04). Перед первой публикацией проверка повторяется — manual
    `publish-new-mod`, шаг 1: имя могли занять, а после публикации оно
    неизменяемо.

compatibility_rule: |
  Главное правило: **ничего не определять по именам прототипов**. Здания,
  дроны, технологии, топливо, патроны, колбы, семена находятся по типу
  прототипа и его свойствам (наличие топки, инвентаря патронов, допустимые
  категории рецептов и топлива). Тогда содержимое чужих модов подхватывается
  само, без кода под конкретный мод.

  Целевой набор проверки совместимости: Space Age, Quality, Elevated Rails,
  Krastorio 2, пак планет (владелец назвал «PlanetsLite»; предположительно
  `kry-planet-mods-lite`), в частности Cerys — её башни на твёрдом топливе
  обязаны подхватываться по наличию топки.

  Каждая поверхность имеет свои логистические сети, учёт ведётся отдельно по
  каждой сети. На поверхностях без дронов (космические платформы) режим
  молча ничего не делает.

scope:
  included:
    - производящие машины (сборочные, печи, химзаводы, литейные, биокамеры и прочие того же класса)
    - лаборатории — только запрос колб
    - буры с твёрдым продуктом — только выдача
    - заправка твёрдым топливом любых зданий с топкой, включая котлы, реакторы и нагревательные башни
    - турели на патронах — за флагом настройки, по умолчанию выключено
    - сельскохозяйственная башня — за флагом, по умолчанию выключено
    - ракетная шахта — за флагом, по умолчанию выключено
    - настройки вместимости дронов
    - производство по спросу, пакетный заказ и отгрузка, режим «работа по избытку»
  excluded:
    - транспорт (машины, танки, локомотивы, паукотроны)
    - перевозка жидкостей дронами — жидкости идут по трубам, как в ваниле
    - нефтяные вышки и любые буры с жидким продуктом
    - груз ракеты — остаётся ванильной механике
    - отдельная технология и отдельные «логистические версии» зданий
    - собственная графика — значок берётся из готовых спрайтов игры

building_types:
  producer: |
    Машины с выбором рецепта. Полная модель входов и выходов: запрос
    ингредиентов, отгрузка продуктов, топливо.
  furnace: |
    Рецепт выбирается игрой автоматически, поэтому в панели есть поле «что
    производить»: без известного рецепта нечего запрашивать. Список — рецепты
    из категорий этой печи.
  lab: |
    Только запрос колб текущего исследования из тех, что принимает
    лаборатория. Набор обновляется по событиям смены исследования; нет
    исследования — нет запросов.
  mining_drill: |
    Только выдача. Скрытый сундук назначается буру целью сброса, бур сам
    встаёт при заполнении — скрипт в работе не участвует. По умолчанию выход
    пассивный, размер буфера задаётся ограничением слотов сундука.
  burner_only: |
    Котлы, реакторы, нагревательные башни. Только топливо. По умолчанию
    скрытых сундуков нет: топливо привозят строительные дроны по призраку
    запроса, отработанное вывозится запросом на изъятие.
  turret: |
    Турели на патронах и артиллерия. Скрытых сундуков нет, патроны всегда идут
    призраком запроса. Расход непредсказуем, поэтому медленный опрос вместо
    будильника. За флагом настройки.
  agricultural_tower: |
    Семена на вход, урожай на выход. Вид семян выбирает игрок; семена
    запрашиваются, только пока есть спрос на урожай (продукт определяется по
    растению, которое вырастает из семени). Урожай скрипт перекладывает в
    сундук снабжения. Медленный опрос. За флагом настройки.
  rocket_silo: |
    Только запрос ингредиентов деталей ракеты, рецепт фиксированный. Проверки
    спроса нет: шахта сама перестаёт потреблять, когда ракета собрана. Груз
    ракеты мод не трогает; появившийся в шахте результат (игра без Space Age)
    отгружается как продукт. За флагом настройки.
  note: |
    Тип определяется по свойствам прототипа, не по имени. Питательные вещества
    биокамеры для движка — обычное топливо, отдельной логики не требуют.

io_model:
  solid_ingredient: из сети (по умолчанию) либо внешний — приносит манипулятор игрока
  fluid: всегда внешние, по трубам
  fuel: из сети либо внешнее; внешнее, пока игрок не выбрал вид топлива
  ammo: из сети либо внешние; внешние, пока игрок не выбрал вид патронов
  seed: из сети либо внешние; внешние, пока игрок не выбрал вид семян
  main_product: пассивное снабжение (по умолчанию) / активное / локально
  other_products: те же три, по умолчанию активное
  off_quality_product: те же три, по умолчанию активное
  note: |
    Внешний вход мод не запрашивает и не учитывает в расчёте запаса. Локальный
    выход остаётся в выходном слоте здания, мод его не трогает. Принесённый
    манипулятором ингредиент безвреден: скрипт видит предмет в машине и
    заказывает меньше. Гибриды штатны в обе стороны — всё из сети с выдачей на
    конвейер и наоборот.

hidden_chests:
  prototypes:
    - сундук запроса
    - сундук пассивного снабжения
    - сундук активного снабжения
  requirements:
    - около 50 слотов — чтобы помещалась партия по всем ингредиентам и топливо
    - без коллизии, иначе внешние манипуляторы наводятся на сундук вместо здания
    - не выделяются мышью, не попадают в чертежи, планы сноса и замены
    - не цель для врагов, неразрушимы, скрыты из списков
    - у сундука запроса включено «запрашивать из буферных сундуков»
  creation: |
    Создаются в центре здания только когда нужны, и удаляются, когда перестают
    быть нужны. Сундук запроса — если из сети идёт хотя бы один ингредиент или
    колбы, а также если топливо или семена переведены на логистических дронов.
    Сундук активного снабжения нужен ещё и как выход для мусора, в том числе
    при локальном выходе, если есть сундук запроса. При смене режима продукта
    содержимое переносится между сундуками.

availability: |
  Своей технологии нет. Доступность выводится из открытости рецептов ванильных
  логистических сундуков, а не из имён технологий: открыт рецепт предмета,
  ставящего сундук пассивного снабжения → доступны режимы выдачи; открыты
  рецепты сундуков запроса и активного снабжения → доступны запросы и активный
  выход. В оверхолах имена технологий меняются, а проверка открытости рецепта
  работает везде.

request_proxy: |
  Расходники, которые в здании только убывают, доставляются ванильным
  «призраком запроса предмета» (`item-request-proxy`), который выполняют
  **строительные** дроны. Патроны — всегда так; топливо и семена — по
  переключателю в панели здания (по умолчанию строительные дроны, альтернатива
  — логистические через скрытый сундук). Ингредиенты рецептов и колбы — всегда
  логистические дроны.

  Мод дозаказывает по формуле «лежит в инвентаре + уже заказано призраком < порог
  → добрать до партии», добавляет свои строки в уже существующий призрак, не
  затирая чужие, и второй призрак с теми же предметами не создаёт. Отработанное
  топливо у зданий без сундука активного снабжения вывозится запросом на
  изъятие в том же призраке.

  Границы: зона строительных дронов больше логистической, поэтому турели и
  котлы на краю базы обслуживаются там, куда логистические дроны не долетают;
  доставить может и личный робопорт игрока. При вместимости 1–4 предмета
  большой расход превращается в десятки рейсов — тогда топливо и семена
  переводятся на логистических дронов.

demand_model: |
  Для каждой логистической сети и каждой пары «предмет + качество» считаются
  запас и цель; производитель работает, пока хотя бы по одному его продукту
  запас < цель.

  Запас — сколько предмета доступно в сети: сундуки снабжения, хранения и
  буферные. Цель — сумма по точкам запроса сети: буферные сундуки считаются
  запросом целиком, остальные точки — только недостающим
  (`max(0, запрос − уже лежит − везут дроны)`), скрытые сундуки самого мода —
  недостающим по текущему заказу партии, призраки запроса мода — недостающим по
  ним количеством. Разница в счёте не произвольна: содержимое буферного сундука
  входит в запас сети, а содержимое сундука запроса — нет, и счёт «целиком»
  заставил бы произвести лишнюю партию.

  Список точек запроса берётся у самой сети, свой реестр чужих сундуков не
  ведётся. Цели пересчитываются раз в 5–10 секунд с размазыванием по тикам;
  скрытые сундуки мода при обходе пропускаются, их спрос берётся из
  собственного реестра и обновляется мгновенно. Событие ручной смены запроса
  помечает сеть «пересчитать вне очереди».

  Качество: точный запрос считается по своему качеству; запрос с условием
  («редкое и выше», «любое») — суммой подходящих качеств, и работают все
  производители, чьё качество подходит. Скрытый сундук запрашивает ингредиенты
  того же качества, что выбрано в рецепте.

  Режим «работа по избытку» (флаг в панели) меняет условие запуска: здание
  работает, пока выбранного ингредиента в сети больше порога. Его запросы на
  отслеживаемый ингредиент в цели сети не входят — иначе утилизатор заставлял
  бы производить то, что уничтожает; запросы на прочие ингредиенты
  учитываются как обычно.

batch_cycle:
  states:
    sleep: спроса нет, здание будит пересчёт целей сети
    order: на скрытом сундуке выставлены запросы на партию; только здесь сундук опрашивается, раз в 1–2 секунды с ростом интервала до 10
    load: ингредиенты перекладываются в здание, сколько помещается; ставится будильник на расчётное окончание порции
    work: по будильнику отгрузить готовое, загрузить следующую порцию, дозаправить, при запасе ниже порога и наличии спроса дозаказать
  hysteresis: |
    На здание заданы порог дозаказа и партия заказа в крафтах. Запрос
    выставляется при падении запаса (сундук + здание) ниже порога и равен
    партии за вычетом имеющегося; между заказами запросы нулевые.
  shipment: |
    Продукт копится в выходном слоте и перекладывается в сундук снабжения,
    когда набралась партия отгрузки (по каждому продукту; не больше, чем
    вмещает выходной слот). При смене рецепта, выключении режима и сносе
    остаток выгружается принудительно.
  actual_state_rule: |
    Расчёт будильника — прогноз, а не гарантия: здание может стоять без
    энергии, ждать внешний ингредиент, упереться в полный выход. При каждом
    пробуждении читается фактическое состояние здания и сундуков; если ничего
    не изменилось, интервал удваивается до потолка 30 секунд. Турели и
    сельскохозяйственные башни вместо будильника опрашиваются раз в 10–20
    секунд — их расход непредсказуем.
  defaults:
    order_batch: столько крафтов, сколько помещается во входные слоты за одну загрузку
    order_threshold: 25% партии заказа
    shipment_batch: стак продукта (для стака 1 — одна штука)
    science_batch: один стак
    fuel: партия и порог из настроек карты — один стак, порог 25%
    ammo: партия и порог из настроек карты — один стак, порог 50%
    seeds: один стак, порог 25%
    drill_buffer: 10 слотов
  defaults_note: |
    Все значения переопределяются в панели здания. Числа взяты из ТЗ как
    стартовые и корректируются по результатам тестов.

panel: |
  Панель прикрепляется сбоку к штатному окну здания через `anchor`, отдельного
  окна нет. У всех типов — переключатель режима и строка состояния. Дальше по
  типу: у производящих машин список твёрдых ингредиентов с галочкой «из сети»,
  порог и партия заказа, список продуктов с режимом выхода и партией отгрузки,
  флаг «работа по избытку» с выбором ингредиента и порогом, у печей — выбор
  рецепта; у зданий с топкой — вид топлива, источник, способ доставки, порог и
  партия; у лабораторий — партия колб; у буров — режим выхода и размер буфера;
  у турелей — вид патронов, порог и партия; у башни — семена, способ доставки,
  пороги и выход; у шахты — порог и партия.

  Строка состояния обязана объяснять простой: «спит: нет спроса», «ждёт
  доставку», «работает», «стоит: выход заполнен (предмет X)», «стоит: ждёт
  внешний ингредиент (предмет X)», «нет логистической сети», «режим
  недоступен: не открыты сундуки».

  Здание в режиме помечается небольшим значком поверх спрайта из готовых
  спрайтов игры (например, значков логистических сундуков).

settings:
  startup:
    override-logistic-robot-capacity: включено — применять настройки вместимости к логистическим дронам
    override-construction-robot-capacity: выключено — то же для строительных
    base-capacity: 1 — вместимость дрона без исследований
    capacity-multiplier: 25 — множитель базы и каждого бонуса исследований
    keep-capacity-research: включено — иначе эффект вместимости из технологий убирается
    enable-turrets: выключено
    enable-refuelling: включено
    enable-agricultural-tower: выключено
    enable-rocket-silo: выключено
    excluded-entities: пусто — список имён сущностей, где режим недоступен
  runtime_global:
    fuel-batch: 1 стак
    fuel-threshold: 25% партии
    ammo-batch: 1 стак
    ammo-threshold: 50% партии
  note: |
    Настройки карты — значения по умолчанию для всех зданий; здание со своим
    значением в панели использует своё. Изменение подхватывается сразу, без
    перезапуска, по `on_runtime_mod_setting_changed`. Имена ключей здесь
    приведены по смыслу; фактические получают префикс `shm-`, см. convention
    `mod-naming`.

robot_capacity: |
  Вместимость считается как (база + бонусы исследований) × множитель: в
  ванильной игре при значениях по умолчанию рост с 25 до 100. Правки делаются
  на последней стадии данных по всем прототипам дронов и всем технологиям с
  эффектом вместимости, без привязки к именам, — так подхватываются дроны и
  технологии чужих модов. При выключенном переопределении мод дронов не
  трогает вообще. Технология, оставшаяся пустой после удаления эффекта,
  скрывается, а зависящие от неё перевешиваются на её предпосылки, иначе
  ломается дерево у других модов. В описании настроек указывается, что база и
  множитель перемножаются и что дрон не несёт больше одного стака.

lifecycle: |
  Скрытые сундуки и запись о здании создаются и удаляются при всех способах
  появления и исчезновения: постройка игроком, дронами, скриптом чужого мода,
  клонирование, снос игроком и дронами, гибель, удаление скриптом. По
  обсуждениям аналогов именно здесь у них было больше всего ошибок —
  пропадающие сундуки у соседних зданий и настройки, не переносящиеся при
  копировании.

  Предметы не пропадают: при сносе содержимое возвращается вместе со зданием,
  при гибели высыпается на землю, при выключении режима переходит игроку, а не
  поместившееся — на землю. Мусор (остатки старого рецепта, старое топливо и
  патроны, испорченное, отработанное топливо) уходит через сундук активного
  снабжения на склад, а у зданий без сундуков — запросом на изъятие в
  призраке.

  Исчезнувшие после смены набора модов рецепты, предметы и сущности сбрасывают
  настройки здания без ошибки. Для удаления мода нужна консольная команда
  «выгрузить всё»: содержимое скрытых сундуков переносится в здания, остаток —
  на землю.

  Чертежи и копирование: режим и все настройки сохраняются в тегах сущности и
  восстанавливаются при постройке, в том числе дронами; штатное копирование
  (Shift + ПКМ / Shift + ЛКМ) переносит настройки мода вместе с ванильными, при
  вставке между разными типами — только применимое. Новое здание, поставленное
  вручную, в обычном режиме.

  Мультиплеер: всё состояние живёт в сохранении, данных, существующих только в
  памяти одного клиента и влияющих на игру, нет — иначе рассинхрон.

performance_budget: |
  Ориентир: 10 000 зданий в логистическом режиме — меньше 1 мс на тик в
  среднем. Обхода всех зданий каждый тик нет: здания навещаются по
  будильникам, разложенным по тикам; пересчёт целей сетей и медленный опрос
  турелей размазываются равными порциями; спящие здания почти ничего не стоят;
  проверка спроса делается по предметам сети, а не по зданиям.

version_compat_layer: |
  Все обращения к API, различающиеся между 2.0 и 2.1, проходят через один
  файл-прослойку. Код не ветвится по версии игры внутри релиза — дорожки
  различаются полем `factorio_version`, convention `factorio-version-track`.
  Список изменений API 2.1 берётся из официальной документации
  (lua-api.factorio.com), а не из неофициальных гайдов.

testing: |
  Три уровня, см. convention `testing`. Чистая логика (расчёт партии, порога и
  дозаказа; цель и запас по набору запросов, включая условия по качеству;
  планировщик будильников и рост интервала; формула вместимости дронов; выбор
  механизма доставки) — Lua-тесты пакета, `npm test -w shm-logistic-buildings`.
  Поведение в рантайме — интеграционный стенд внутри игры на готовом
  фреймворке сообщества (FactorioTest, FUnit, factestio), который работает на
  обеих дорожках и запускается без графики. Замер нагрузки и дымовой тест —
  headless-прогон игры (`--benchmark`). Клики по интерфейсу, мультиплеер и
  внешний вид не автоматизируются: обработчики панели вызываются напрямую с
  подставленным событием, рассинхрон ловится вручную в «тяжёлом режиме»
  (`/toggle-heavy-mode`).

future_ideas: |
  Записаны в ТЗ, раздел 14, чтобы архитектура им не мешала; сейчас не делаются:
  тара для жидкостей (скрытые тарные копии рецептов на стадии данных),
  комплект переоборудования как плата за включение режима, нефтяные вышки
  после тары.

