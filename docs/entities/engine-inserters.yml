id: engine-inserters
kind: entity
namespace: engine
version: "1"
title: Манипуляторы — режимы руки, стопки на ленте, замена скриптом
summary: |
  Факты о манипуляторах, выясненные тестами в игре при разработке
  shm-k2-superior-inserters-full-hand-switcher. Документация на эти вопросы
  либо молчит, либо отвечает неочевидно.

facts:
  - claim: |
      Ожидание полной руки (`wait_for_full_hand`), выкладка испорченной руки
      и подбор под стопку ленты задаются только в прототипе. В `LuaEntity`
      их нет — режим конкретного манипулятора меняется только заменой на
      другой прототип.
    checked_on: 2.1.23, 2026-10-25 — `runtime-api.json` 2.1.23 и мод выше
  - claim: |
      Высота стопки, которую манипулятор кладёт на ленту, —
      `1 + LuaForce.belt_stack_size_bonus`, но не больше
      `max_belt_stack_size` прототипа. На карте без исследования
      вместимости конвейера манипулятор с `max_belt_stack_size = 4` кладёт
      по одному предмету, хотя рука вмещает больше.
    checked_on: 2.1.23, 2026-10-25 — тест в игре, рука 5, бонус 0 → стопки по 1; бонус 3 → стопки по 4
  - claim: |
      Без исследований и бонусов рука массового манипулятора может вмещать
      один предмет; тогда «ждать полную руку» неотличимо от «выкладывать
      сразу». Тесту на режим руки нужен `bulk_inserter_capacity_bonus` > 0.
    checked_on: 2.1.23, 2026-10-25 — тест в игре, превосходный манипулятор K2 без K2 Spaced Out
  - claim: |
      `LuaSurface.create_entity{fast_replace = true}` на месте манипулятора
      переносит провода сети и `LuaInserterControlBehavior` (включение по
      условию, само условие) без участия скрипта. Предмет в руке при
      `spill = false` и без `player` удаляется — его надо восстанавливать
      самому.
    checked_on: 2.1.23, 2026-10-25 — тест в игре, перенос проверен сравнением до и после
  - claim: |
      `defines.inventory.furnace_source` в 2.1 нет — входной инвентарь печи
      и сборочной машины теперь `defines.inventory.crafter_input`.
    checked_on: 2.1.23, 2026-10-25 — стенд прототипа logistic-buildings после перевода на 2.1

behaviors: []
