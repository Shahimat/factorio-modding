id: engine-space-platforms
kind: entity
namespace: engine
version: "1"
title: Космические платформы — передачи между платформами и сброс на планету
summary: |
  Факты о ванильной логистике платформ 2.1: когда хаб отдаёт предмет другой
  платформе на той же орбите и когда сбрасывает его на планету. Выяснены
  прототипом `poc/shm-orbital-logistics-probe/` к ТЗ мода Orbital Logistics.
  Документация описывает только поля (`request_from`,
  `providing_to_other_platforms`), но не правила отдачи. Сообщения на форуме
  о «блокировке при двух запросах» неточны: блокирует источник запроса, а не
  число запросов.

facts:
  - claim: |
      Хаб с включённым `providing_to_other_platforms` отдаёт предмет
      платформе, запросившей его с источником `platforms`, если на этот
      предмет у самого хаба нет запросов. Отдаёт он и тогда, когда все его
      запросы на предмет идут с источником `planet`, в том числе с
      `import_from` другой планеты и при нескольких таких запросах.
      Собственный запрос `planet` при этом не защищён: хаб отдаёт даже то,
      что сам запросил, и уходит в дефицит (запрошено 500, есть 500 —
      отдал 50).
    checked_on: 2.1.23, 2026-10-27 — прототип orbital-logistics, тесты в игре V-00, V-01a, V-01d, V-02a, V-03a
  - claim: |
      Любой запрос хаба на предмет с источником `platforms` или `all`
      запрещает отдавать этот предмет другим платформам: даже рядом с
      запросом `planet` и даже когда запрос уже набран. То же даёт пустой
      `import_from` («из всех локаций») с источником `all` и запросы,
      выставленные сетью. Запросы сети живут в секции типа
      `circuit_controlled` с источником `all` и пустым `import_from`.
    checked_on: 2.1.23, 2026-10-27 — прототип orbital-logistics, тесты в игре V-01b, V-01c, V-01e, V-02b, V-02c, V-09
  - claim: |
      Выключенный `providing_to_other_platforms` запрещает только отдачу
      другим платформам. Сброс на планету по запросу грузовой площадки идёт
      и с выключенным флагом: с хаба без запросов и с хаба, где на предмет
      стоит запрос с `import_from` другой планеты.
    checked_on: 2.1.23, 2026-10-27 — прототип orbital-logistics, тесты в игре V-00b, V-04a…c, V-06c
  - claim: |
      Запрос хаба с `import_from` текущей планеты запрещает сброс этого
      предмета на неё при источнике `planet` или `all`, но не при
      источнике `platforms`. Защита сразу и от платформ, и от планеты — это
      запрос с `import_from` текущей орбиты и источником `all`. Выключенная
      секция (`active = false`) не защищает ни от кого: для логистики
      запроса нет.
    checked_on: 2.1.23, 2026-10-27 — прототип orbital-logistics, тесты в игре V-04d, V-06a, V-06b, V-06d, V-06e (V-06d в изоляции)
  - claim: |
      Фильтр с `min = 0`, источником `all` и пустым `import_from` ничего не
      запрашивает, но запрещает отдачу предмета и другим платформам, и
      планете — на любой орбите и даже рядом с запросом с `import_from`
      другой планеты, который сам по себе сброс разрешает. С `import_from`
      другой орбиты такой фильтр от платформ не защищает. Запросы одного
      предмета из разных секций складываются (60 + 40 → 100).
    checked_on: 2.1.23, 2026-10-27 — прототип orbital-logistics, тесты в игре V-11a…e, V-12 (каждый в изоляции)
  - claim: |
      Дефицит предмета ваниль считает по сумме всех его запросов на хабе. Если
      хоть один фильтр предмета разрешает платформы (`platforms` или `all`),
      с платформ орбиты, указанной в `import_from` запросов, добирается весь
      дефицит предмета, а не только количество этого фильтра. Склад с
      запросом 1000 с планеты и 700 в хабе: с фильтром `platforms` на 300
      добирает до 1300, на 100 — до 1100, с фильтром `min = 0` — ровно до
      1000. Так же действует замок (`min = 0`, `all`, пустой `import_from`):
      рядом с запросом с `import_from` текущей орбиты хаб добирает с её
      платформ, а рядом с запросом с другой планеты — нет.
    checked_on: 2.1.23, 2026-10-27 — прототип orbital-logistics, тесты в игре V-15a…g (каждый в изоляции)
  - claim: |
      `active` у секции с ванильной logistic group — свой у каждой сущности:
      выключение секции группы на одном хабе не выключает её на другом, в
      отличие от полей фильтров.
    checked_on: 2.1.23, 2026-10-27 — прототип orbital-logistics, тест в игре V-13
  - claim: |
      Секция с ванильной logistic group отдаёт так же, как секция без группы.
      `get_slot` возвращает `request_from = nil`, когда стоит значение по
      умолчанию `planet`, и с группой, и без неё. Второй `set_slot` с тем же
      предметом и качеством в той же секции молча не применяется: в секции
      остаётся один фильтр.
    checked_on: 2.1.23, 2026-10-27 — прототип orbital-logistics, тесты в игре V-14a, b; второй фильтр — первый прогон сценария K-06 мода
  - claim: |
      Количество сверх `max` запроса хаб переносит в мусорные слоты
      (`hub_trash`) и сбрасывает на планету, не дожидаясь запроса площадки.
      Платформа, удалённая скриптом (`LuaSpacePlatform::destroy`), удаляется
      не сразу и успевает досбросить мусор и отдать предметы.
    checked_on: 2.1.23, 2026-10-27 — прототип orbital-logistics, тест в игре V-03b и утечка груза между тестами
  - claim: |
      Смену `request_from` у фильтра ваниль подхватывает за тик: груз
      появляется в `targeted_items_deliver` получателя на следующем тике.
      Передача между платформами одной орбиты занимает ~920–945 тиков от
      запроса до прибытия, сброс на площадку — ~1190 тиков.
    checked_on: 2.1.23, 2026-10-27 — прототип orbital-logistics, тесты в игре V-00, V-04a, V-05
  - claim: |
      В ванильной logistic group общие все поля фильтров, включая
      `request_from` и `import_from`: правка `set_slot` на одной сущности
      сразу видна у всех секций этой группы. `multiplier` у каждой секции
      свой.
    checked_on: 2.1.23, 2026-10-27 — прототип orbital-logistics, тест в игре V-07
  - claim: |
      `create_cargo_pod()` на хабе создаёт pod, а запись
      `cargo_pod_destination = {type = defines.cargo_destination.station,
      station = <хаб другой платформы той же орбиты>}` его запускает. Груз
      кладётся в `defines.inventory.cargo_unit` pod'а и сразу считается в
      `targeted_items_deliver` получателя, а летит столько же, сколько
      ванильный (~945 тиков).
    checked_on: 2.1.23, 2026-10-27 — прототип orbital-logistics, тест в игре V-08
  - claim: |
      Платформа, созданная `LuaForce::create_space_platform` с
      `apply_starter_pack()`, стоит на орбите без расписания (`no_schedule`)
      и полноценно участвует в передачах. Этого хватает для тестов логистики:
      перелёты не нужны.
    checked_on: 2.1.23, 2026-10-27 — прототип orbital-logistics, все тесты в игре

behaviors: []
