id: orbital-logistics
kind: entity
namespace: mods
version: "1"
title: Мод Orbital Logistics — shm-orbital-logistics
spec: specs/27102026_spec_orbital_logistics.md
spec_note: |
  ТЗ упрощённое, подготовлено агентом по диалогу с владельцем и положено в
  `specs/` по его поручению 2026-10-27. Программа, план итерации и DoD не
  заводились: механизм ещё оттачивается, мод идёт тикетами. Первый —
  прототип `poc/shm-orbital-logistics-probe/`, второй — ядро версии 0 с
  метками в именах групп, третий — замер нагрузки V-10, панель хаба и
  линии снабжения.
summary: "Склады и грузы платформ поверх ванильных передач 2.1: назначение секции — метка в имени logistic group, контроллер решает и выражает решение ванильными средствами."

package:
  name: shm-orbital-logistics
  dir: mods/shm-orbital-logistics/
  title: Orbital Logistics
  version: 0.1.1
  version_planned: "1.0.0"
  version_note: |
    Решение владельца 2026-11-04: целевая версия раунда orbital-02 —
    1.0.0, выход из беты. Раунд из 12 тикетов смержен в main (последний
    `49bfab1`); `version` остаётся 0.1.1 до релиза. Перед релизом —
    ручной прогон по manual `test-orbital-manually`.
  factorio_version: '"2.1"'
  dependencies:
    - base >= 2.1.0
  feature_flags: [space_travel_required]
  dependencies_note: |
    Жёсткой зависимости от `space-age` нет: мод работает с платформами
    любого мода, где есть космические путешествия, флага достаточно.
    Сценарии в игре идут с Space Age: им нужны его планеты и стартовый
    набор платформы.
  locale: Базовый набор языков, convention `localization`.
  portal: |
    Опубликован 2026-10-30, релиз 0.1.0; релиз 0.1.1 (сворачивание панели
    по фидбеку игрока) — 2026-11-03 —
    https://mods.factorio.com/mod/shm-orbital-logistics.
    Версия 0.x: наполнение склада ракетами с настоящего силоса (K-01) ещё
    не проверено, а в обычной игре мод почти не гонялся. Лицензия
    `default_mit`, категория `utilities`, теги `logistics` и
    `transportation`, описание — README пакета, summary — `description` из
    `info.json`, `source_url` — репозиторий. Картинка мода —
    `thumbnail.png`, раздел `art`.

tags:
  where: имя ванильной logistic group секции, первая узнанная метка в квадратных скобках
  list:
    - "`[reserve]` — свой запас"
    - "`[cargo]` — ванильный груз, как без метки"
    - "`[cargo→a]`, `[cargo→a,b]` (или `->`) — груз с назначением"
    - "`[depot:a]`, `[depot:a,b]` — склад на своих орбитах"
    - "`[depot]`, `[depot:*]` — склад на любой орбите, где стоит"
  note: |
    Регистр и пробелы не важны, имена мест — внутренние (`nauvis`,
    `aquilo`). Чужие скобки вроде `[item=iron-plate]` пропускаются. Метка
    общая для всех хабов группы, потому что группа общая. Разбор —
    `logic/tags.lua`.

controller:
  pass: |
    Платформы обходятся порциями: раз в 10 тиков — платформы с индексом,
    дающим нужный остаток от деления на 6, полный круг — раз в секунду.
    Платформа, сменившая состояние (`on_space_platform_changed_state`:
    прилёт, отлёт), обрабатывается сразу и одна. Полный проход по всем
    (`controller.pass`) — для тестов, `remote`, смены настройки и правок из
    панели. Платформа в пути решается как стоящая нигде: груз и склады
    закрыты. Платформы, ждущие удаления, пропускаются.
  phases: |
    Первая фаза дешёвая: орбита и имена групп секций; разбор метки
    запоминается по имени группы. Хаб без меток и без следа мода дальше не
    читается. Фильтры, содержимое и «в пути» читаются только у хабов с
    метками или следом мода и у хабов на орбитах, где работает склад: там
    по фильтрам секций без метки ищется ванильный груз для транзита.
  orbit_state: |
    `storage.orbit[индекс платформы] = { where, offered, depot }` —
    последнее известное по хабу, нужное соседям по орбите: где стоит, какой
    груз отдаёт и есть ли склад. Порция видит соседей не из своей порции по
    этой записи — с запаздыванием не больше секунды.
  cache: |
    Фильтры секций кешируются в `storage.cache`: секции с группой — по имени
    группы (все хабы группы делят фильтры), без группы — по хабу и индексу
    с проверкой числа фильтров. Сброс — событием
    `on_entity_logistic_slot_changed` (поля `entity`, `section`) и по сроку:
    каждая запись перечитывается раз в 10 проходов, вразнобой. Кеш в
    `storage`, а не в локальной переменной, — чтобы в мультиплеере он был у
    всех одинаковым.
  budget: |
    Замер V-10 (`tests/ingame/perf.lua`, Factorio 2.1.23, машина владельца):
    40 платформ на одной орбите, по 4 секции на 40 фильтров, две с метками
    (`[reserve]`, `[depot:nauvis]`), две без. Без кеша проход стоил 16,6 мс,
    чтение фильтров — ~15 из них; с кешем — 4,3 мс на полный проход и
    1,1 мс на порцию, то есть ~0,12 мс на тик в среднем.
  lock: |
    Своя секция мода без группы на хабе. На каждый защищаемый предмет —
    фильтр `min = 0`, источник `all`, пустой `import_from`. Он ничего не
    запрашивает, но запрещает отдачу и платформам, и планете на любой
    орбите (entity `engine-space-platforms`). Под замком: свой запас, склад
    вне своих орбит, груз вне назначения, склад на своей орбите, пока там
    есть привезённый груз с этим предметом (груз отдаётся раньше склада).
  partial: |
    Если у предмета есть и защищённая часть, и часть, которую можно
    отдавать, предмет открыт, пока содержимого больше защищённой части.
    Защита мягкая: размер одной отдачи выбирает ваниль.
  transit: |
    Склад на своей орбите, которому не хватает предмета (с учётом «в
    пути»), пока на орбите у другого хаба есть груз с ним для этой орбиты:
    в своей секции фильтр `min = 0` с источником `platforms` и `import_from`
    текущей орбиты. Количества у него нет: ваниль добирает с платформ весь
    дефицит предмета по сумме запросов склада, то есть ровно до его цели.
    Первая версия запрашивала недостающее количество сверху и переполняла
    склад на эту величину (1225 при цели 1000 в живой демо-сцене). Замок на
    этот предмет тогда не ставится: два фильтра на один предмет в одной
    секции ваниль не принимает, а фильтр с платформ и так запрещает отдачу.
    Грузом для орбиты считается и ванильный груз без метки: `import_from`
    другой планеты, источник `planet`.
  lock_side_effect: |
    Замок разрешает платформы, поэтому хаб под замком добирает дефицит
    предмета с платформ орбиты, указанной в `import_from` его запросов:
    свой запас и погрузка груза над своей орбитой подтягиваются со складов.
    На чужих орбитах добора нет (entity `engine-space-platforms`).
  release: |
    Секция груза на точке назначения, у которой собственный запрос идёт с
    источником `platforms` или `all` (сбор «из всех локаций»), выключается
    на этом хабе (`active` у каждого хаба свой) и включается, когда
    платформа уходит. Включаются только выключения мода: при первом
    выключении группы `write_release` запоминает, какие секции были
    уже сняты игроком (`owned_off`), — их отлёт не возвращает, ручная
    галочка переживает цикл отлёта и прилёта при сохранной памятке.
    Учёт позиционный внутри группы: удаление секции выше группы его не
    ломает, но изменение числа секций самой удерживаемой группы сбрасывает
    `owned_off`. Тогда на отлёте включаются все её выключенные секции,
    включая снятые игроком. Тот же fallback действует при снятии уже
    записанного `released` из старого сохранения без `owned_off`; отдельной
    миграции для этого нет. Источник — статическое чтение `write_release`
    в `runtime/controller.lua`, 2026-11-12, без нового игрового прогона.
  cleanup: |
    Зачистка storage от мёртвых записей: `sweep()` оставляет в
    `storage.orbit`, `storage.platforms` и `storage.cache.hubs` только
    живые платформы и unit_number хабов — вызывается в начале
    `controller.pass()` и раз в круг в `slice`; `migrate()` подчищает то
    же сразу после обновления модов. Кеши по имени группы (`parsed`,
    `storage.cache.groups`) чистит `prune_groups()` раз в круг по окну
    `seen_groups` — запись исчезнувшей группы живёт не дольше круга
    (~1 c). Игрок удаляет секции и группы без события, которое мод
    слышит, поэтому зачистка по проходу, без тяжёлых обходов.
  own_section: |
    Служебная секция мода живёт в своей группе с уникальным на платформу
    именем `⚙ Orbital Logistics — auto #<индекс платформы>`: в окне хаба
    она подписана, а не выглядит безымянной секцией с нулевыми фильтрами,
    которая пугала владельца, и не становится общей с другими хабами. Имя —
    данные карты, а не текст интерфейса, поэтому английское. Мод узнаёт
    свою секцию по этому имени. Чужую служебную группу, назначенную игроком
    на другой хаб, и лишние копии своей мод снимает. Когда держать нечего,
    секция удаляется, а группа — из списка групп силы, чтобы список не
    засорялся. Скрыть секцию в окне хаба API не позволяет. До этого
    служебная секция была без группы и узнавалась по совпадению с
    записанным содержимым; такие секции снимает `controller.migrate`.
  storage: |
    `storage.platforms[индекс платформы] = { own, written, released, service }`:
    индекс служебной секции, её записанные фильтры, выключенные секции груза —
    по имени группы. Первая версия помнила их по номеру секции, и после
    того как игрок удалял секцию выше, выключенная секция не включалась
    обратно; сохранения с номерами переводит `controller.migrate` в
    `on_configuration_changed`.

groups: |
  Смена метки — перевод секции на новое имя группы (`runtime/groups.lua`):
  API не умеет переименовывать группу, поэтому все её участники получают
  новое имя, а старая группа удаляется. Фильтры и множители сохраняются,
  метка меняется у всех хабов группы. Секция без группы получает имя
  `<платформа> #<номер секции>` с меткой. Имя, занятое другой группой, не
  затирается — иначе секция взяла бы её фильтры.
  Если имя состояло только из снятой метки, `groups.name_for` также даёт
  fallback `<платформа> #<номер секции>` вместо пустого имени; коллизия
  fallback обрабатывается как занятое имя, без затирания чужой группы.
  В текущем модальном окне выбор «Груз» без мест — no-op: имя не меняется,
  даже если `[cargo]` уже есть. У строки «Свой запас» нет пикера мест;
  при смене её назначения на «Склад» пустой список мест даёт `[depot]`,
  склад на любой орбите. Источник — статическое чтение `runtime/groups.lua`
  (`name_for`, `rename`) и `runtime/overview_gui.lua` (`apply_purpose`),
  2026-11-12; это не новая визуальная приёмка интерфейса.

overview_button: |
  Штатная кнопка обзора живёт в общей рамке mod-gui, как кнопка Helmod.
  Сохраняется собственный значок; зависимость от Helmod не нужна.
  Канон размеров/отступов и идемпотентный перенос старой кнопки из gui.top —
  overview.ensure_button в runtime/overview_gui.lua, оформление ванильными
  графическими наборами — shm_ol_mod_button в data.lua.
  ensure_button вызывается и при секундном refresh_all для подключённых
  игроков: рабочая копия до релиза сохраняет номер, поэтому одной миграции
  on_configuration_changed недостаточно. Общие рамки и соседние кнопки
  не удаляются. Проверка — behavior orbital-overview-button-matches-mod-gui.

overview_layout: |
  Уточнение владельца 2026-11-14: обычное раскрытие сохраняется — высота
  карточки и положение карточек ниже меняются намеренно. Непредусмотренных
  сдвигов окна, заголовков и ширин колонок, активируемых отступов и рамок нет.
  Viewport — naked_scroll_pane, горизонтальная прокрутка запрещена, место
  под вертикальную полосу зарезервировано до её появления, extra padding
  при активации обнулён. Нужная вертикальная прокрутка остаётся; штатное
  ограничение позиции после уменьшения общего содержимого не отключается.

  Канон бюджета ширины и констант — logic/overview_layout.lua. Renderer явно
  задаёт используемые отступы; из ширины окна вычитаются рамка, gutter,
  padding карточки, разделители и интервалы. Предупреждения, подписи, детали,
  поля назначения и выбор мест ограничены своей колонкой, а не независимым
  широким минимумом. Места переносятся таблицей без изменения родителей
  кнопок; узкая колонка переносит поля под имя. Таблица исключений использует
  общий бюджет колонок для всех строк, даже с разным числом иконок.

  Переключение блока обновляет только этот блок и сохраняет соседние поля
  и раскрытые детали. При намеренном сужении обзора рядом с открытым хабом
  бюджет пересчитывается. Открытый GUI из прежнего сохранения исправляется
  однократно по layout_version в tags окна: номер пакета до релиза не меняется.
  Поведение и проверка — orbital-overview-layout-stays-stable.

overview_route: |
  Полная петля ванильного расписания: иконки всех остановок в исходном порядке,
  стрелки между ними и круговая стрелка последняя→первая. Повторные посещения
  не объединяются; список не вращается за платформой. Чтение — из снимка
  platform.schedule.records/current, не ipairs(platform.schedule). Временные
  записи снимка не отфильтровываются, чтобы не сдвигать индексы назначения;
  определения неактивных interrupts не разворачиваются в маршрут.

  Канон модели — logic/overview_route.lua; геометрии — logic/overview_layout.lua.
  runtime/overview_gui.lua отделяет состав от подсветки: при прежних остановках
  и числе колонок сохраняются те же элементы. На стоянке одна планета имеет
  видимую оранжевую рамку, в полёте одна стрелка активна, планеты не выделены.
  Круговая стрелка — utility/reset_white с явным масштабом и растяжением
  изображения до фиксированного виджета: унаследованный scale=0.5 не делает
  её визуально вдвое меньше обычной. Варианты отличаются только цветом.
  Рамка планеты задана через поддерживаемые *_graphical_set; прежние
  *_sprite в button_style не давали видимой рамки, хотя имя стиля читалось верно.

  Длинные циклы переносятся таблицей пар «планета + исходящая стрелка» в
  остатке ширины заголовка. При намеренном сужении рядом с хабом число
  колонок пересчитывается. Без расписания остаётся фактическая орбита или
  известный перегон; одна остановка не получает фиктивную петлю на себя.

  current в пути определяет назначение, но сам по себе не доказывает вылет
  с предыдущей записи после ручного пропуска. Источник подтверждается текущей
  физической связью либо остановкой, наблюдавшейся этим обзором перед вылетом.
  История departure хранится в tags маршрута и сбрасывается при смене записей;
  on_space_platform_changed_state обновляет только маршрут изменившейся
  платформы у её зрителей: даже стоянка короче секундного refresh сохраняет
  источник следующего рейса. Контроллер по-прежнему получает то же событие первым.
  Глобального хранилища путешествий нет. При неоднозначности — цикл без
  активной стрелки, а не ложный рейс. В частности, первое открытие посреди
  многозвенного перелёта без известного источника может не выделить плечо;
  обычный длинный рейс после наблюдавшегося отправления подсветку сохраняет.
  Жизненный цикл interrupts и произвольное редактирование расписания в пути
  не объявлены проверенными. Контракт — orbital-route-shows-schedule-loop.

panel: |
  В `1ed26a3` относительную панель заменило модальное окно
  `runtime/overview_gui.lua`. Следующее описание прежней раскладки —
  историческое, не гарантия нынешнего GUI; сохраняющиеся свойства текущего
  окна перечислены в конце поля.
  Панель у окна хаба (`runtime/panel.lua`). Положение — настройка игрока
  `shm-orbital-logistics-panel-position` (runtime-per-user): под окном (по
  умолчанию), над, слева или справа. Под и над окном блоки панели идут в
  ряд, чтобы она была низкой, слева и справа — столбиком. Справа по
  умолчанию было неудобно: окно хаба широкое, а в редакторе рядом ещё и
  «Доп. настройки», и панель уезжала за край экрана.
  Панель (и у хаба, и у площадки) сворачивается: кнопка «свернуть» — первый
  элемент развёрнутой панели, клик перестраивает её в мини-окошко с
  заголовком „Orbital Logistics“ и кнопкой разворачивания на том же краю
  окна — настройка положения действует на оба вида, — клик по кнопке
  разворачивает обратно. Свёрнуто — per player, `storage.panel_collapsed`
  (init и migration в `control.lua`): переживает переоткрытие окна и
  сохранение/загрузку; пока свёрнуто, `on_gui_opened` строит свёрнутый вид,
  а `refresh_all` его не обновляет. Иконки `utility/collapse` и
  `utility/expand` — через `helpers.is_valid_sprite_path` с текстовым
  фолбэком, подсказки локализованы. Мотивация — фидбек игрока на
  мод-портале 2026-11-02: сворачивание, как у logistic-request-helper,
  чтобы панель не загромождала экран и не перекрывала соседние элементы.
  Состав панели — три блока, «Группы», «Отдача на этой орбите» и «Линии
  снабжения», каждый в своём scroll-pane с собственной прокруткой; рамка
  панели имеет потолок 0.8 `display_resolution` (с учётом `display_scale`)
  во всех положениях и по вертикали доводится до контента. Блоки
  сворачиваются по отдельности: заголовок с итогом по реальному
  содержимому («Секции: N», «Отдача: групп N, исключений N», «Линии
  снабжения: участников N»), клик разворачивает; свёрнутость блока —
  per player, `storage.panel_block_collapsed`, переживает переоткрытие
  окна, сохранение/загрузку и не перестраивается обновлениями; пустой
  блок линий — одна кнопка «Линии снабжения…». Состав блоков:
  - орбита платформы;
  - красное предупреждение, если раздача другим платформам выключена, а на
    хабе есть склад или груз с назначением;
  - по секции: назначение списком, места — выбором мест, «Применить» — ставит метку
    в имя группы и сразу проходит контроллером. Одноимённые секции — одна
    строка с « ×N», правки из неё применяются секции-представителю
    (первой активной), после переименования строки расходятся по новым
    именам. Строка разворачивается в детали предметов: «есть / свой запас /
    груз / склад / в пути / можно отдать» и фраза решателя, почему предмет
    ведёт себя так; до «Применить» — предпросмотр «будет: <фраза>»; у
    секции без метки — «без метки: работает как обычно». Секции линий
    снабжения — только для чтения, ими управляет окно линий; своя секция
    мода не показывается;
  - «Отдача на этой орбите» — строка на каждую секцию с меткой: иконка её первого
    предмета, имя группы и состояние на текущей орбите с ванильным
    значком статуса — цветной точкой, как у машин игры (зелёная — отдаёт,
    жёлтая — держит, синяя — выключена до отлёта): «держит: свой запас», «держит до <места>»,
    «отдаёт: это точка назначения», «раздаёт платформам на этой орбите»
    и т. д., с числом предметов. Статусы честные: «выключена» (снята
    игроком) и «пустая группа» не путаются с «выключена до отлёта»
    (снята модом); счётчики — «(фильтров: N)». Ниже — исключения: предметы,
    которые ведут себя не как их группа, — транзит на склад (серая точка;
    значки «пауза» и «импорт» тёмные и на тёмном фоне не видны),
    склад уступает привезённому грузу, остался только запас, отдаётся
    сверх запаса. Исключения агрегированы по типам состояния — строка на
    тип с иконками предметов, «+N ещё» и тултипом со всеми предметами.
    Секции без метки в этом блоке не показываются: мод их не трогает.
    Так блок остаётся коротким при сотне запросов — строк столько,
    сколько секций с меткой. Первые версии показывали каждый предмет и
    стали стеной иконок;
    Раз в секунду обновляется только «Отдача на этой орбите», чтобы не сбивать
    выбор в полях, а если группы хаба изменились (добавлены, убраны,
    переименованы, выключены), панель перестраивается целиком — по
    отпечатку групп в `tags` панели;
  - группа груза, выключенная модом на точке назначения, подписана
    «(выключена до отлёта)» с подсказкой, почему снята галочка;
  - линии, где хаб участвует, подключение к линии и кнопка окна линий.
  У окна грузовой площадки — только блок линий.

  В развёрнутой карточке текущего модального окна сохраняются предупреждения
  о ловушках источника склада: `platforms` / `all` мешают отдаче платформам,
  а `planet` / `all` с `import_from` текущей орбиты — сбросу на эту планету.
  Они перечитываются каждые 60 тиков, пока карточка открыта. Склад,
  снабжающий платформы, должен запрашивать с источником «Планета»;
  это не снимает отдельного
  ограничения на сброс при импорте с планеты под ним. Источник — статическое
  чтение `fill_warnings`, `depot_source_problems`, `refresh_all` в
  `runtime/overview_gui.lua`, `source_problems` в `logic/tags.lua` и
  обработчика `on_nth_tick(60)` в `control.lua`, 2026-11-12.
  Длинные тултипы исключений собираются вложенными `LocalisedString`,
  чтобы каждый узел укладывался в лимит 20 параметров: `items_tooltip`
  группирует листья и рекурсивно объединяет их. Это статически сверено
  по `runtime/overview_gui.lua` 2026-11-12, не новый тест лимита в игре.
  В старом отчёте `1ed26a3:.ops/ol-panel-item-details/reports/1.md`
  для Factorio 2.1.17 отмечены отсутствие категории `planet` в LuaPrototypes
  и риск буквального показа `[planet=…]` для непланеты вроде
  `solar-system-edge`. В нынешнем `runtime/overview_gui.lua:place_link`
  тег по-прежнему строится для любого известного `space_location`;
  визуальный fallback непланет после смены интерфейса не перепроверен.

terms: |
  Секцию ванильного окна хаба мод в интерфейсе называет так же, как игра на
  этом языке: по-русски «группа» (кнопка «Добавить группу»), по-украински
  «розділ», по-немецки «Abschnitt», по-китайски «编组», по-корейски «구역»,
  на остальных языках — «section» и её переводы игры. В документации
  проекта остаётся «секция».

tips: |
  Раздел «Orbital Logistics» в меню «Советы и подсказки» (`data.lua`) —
  одна страница, без подстраниц: описание мода и разделы с крупными
  жирными заголовками — назначение групп (со значками статуса), склады и
  транзит, груз и сбор, линии снабжения, служебная группа мода и удаление
  мода. Списки — строками с «•», переносы — `\n` в локали. Картинка
  страницы — `graphics/tips-route.png`. Игровые объекты в тексте —
  ссылками rich text (convention `localization`): планеты `[planet=…]`
  везде, хаб `[entity=space-platform-hub]` и грузовая площадка
  `[entity=cargo-landing-pad]` — при первом упоминании. В списке подсказок
  слева от названия — иконка ванильного маршрута Наувис — Вулкан
  (`tag = '[img=space-connection/nauvis-vulcanus]'`); маршрут объявляет
  Space Age, поэтому тег ставит `data-final-fixes.lua` только при наличии
  маршрута. Открыта сразу (`starting_status = unlocked`). Шесть отдельных
  подсказок владелец счёл бесполезной россыпью.

art: |
  `thumbnail.png` (144×144: три платформы по кругу, оранжевые стрелки по
  дуге от каждой к следующей) и `graphics/tips-route.png` (холст
  1600×320, рисунок 640×256 в центре на прозрачном поле: пунктирная дуга
  от склада-прокси на кольце орбиты Наувиса до склада на орбите Вулкана с
  челноком на вершине и стрелками на обоих концах — задумка мода: летящие
  платформы обмениваются со складами-прокси; склады — иконкой грузового
  отсека, челнок — хабом). Окно подсказок растягивает картинку на всю
  ширину области, а высоту берёт по пропорциям, поэтому размер на экране
  задают пропорции холста и поля, а не число пикселей: картинка 480×200 и
  320×128 занимала у владельца до 70 % экрана
  порождает `npm run orbital-art` (`tools/orbital-art.ts`, чистые функции —
  `tools/lib/orbital-art.ts` с тестами) из иконок установленной игры:
  иконки хаба платформы и картинок планет со звёздной карты. Производные
  от ассетов Wube — оговорка в `LICENSE` мода.

debug: |
  Отладочная сборка — рабочая копия с каталогом `tests/`. Метка
  `tests/debug.lua`: `settings.lua` пробует её `pcall(require, ...)` и
  только тогда заводит стартовую настройку `shm-orbital-logistics-debug`
  («Режим отладки», по умолчанию нет). Упаковка вырезает `tests/` из zip,
  поэтому в релизе нет ни настройки, ни отладочного кода. При включённой
  настройке `control.lua` подключает демо-команду `/shm-orbital-demo`
  (`tests/demo/commands.lua`) с шагом живой сцены на общем
  `on_nth_tick(60)`. Стенд тестов `factorio-test` тоже подключается только в
  отладочной сборке: иначе релиз у игрока с установленным `factorio-test`
  искал бы отсутствующие тесты.
  Наблюдатели событий ракет, грузовых капсул и слияния сил расширенного демо
  тоже загружаются только при debug_build; наличие самой команды по-прежнему
  требует включённой стартовой настройки. В тестовом стенде наблюдатели
  работают независимо от включения команды.

ui_test_adapter: |
  В рабочей копии с tests/ и активным shm-ui-test-engine подключается
  tests/ui/adapter.lua. Dev-only remote shm-orbital-ui-tests.prepare_player
  подготавливает storage и вызывает overview.ensure_button в sandbox мода:
  test player simulation не получил эту кнопку обычным путём.
  Адаптер не экспортирует обработчики кликов и не открывает/не сворачивает
  overview сам. Релиз не содержит tests/, а guard требует debug_build и engine.

places_picker: |
  Выбор мест (`runtime/places_picker.lua`) — без ввода имён и без ряда всех
  планет, которых у модов планет бывает очень много: выбранные места
  иконками (нажатие убирает) и кнопка «+» — стандартное окно выбора места
  игры с поиском (`choose-elem-button`, `elem_type = 'space-location'`).
  Одиночный выбор («откуда» в окне линий) — одна такая кнопка, пустая —
  «любое место». Выбор хранится в `tags` контейнера. Первая версия —
  ряд переключателей всех открытых планет — отвергнута владельцем.

lines: |
  Линии снабжения (`logic/lines.lua`, `runtime/lines.lua`, окно
  `runtime/lines_gui.lua`, команда `/shm-orbital-lines`). Линия — шапка из
  предметов с качеством и количеством и участники: хабы и грузовые
  площадки. У хаба — роль (получатель, склад, груз, свой запас), места,
  «откуда», источник и множитель; у площадки — только множитель.
  `storage.lines[индекс силы] = { next_id, by_id }`, участник хранит ссылку
  на сущность. Группа на каждое сочетание роли и источников, имя —
  `<линия> · <откуда>/<источник> <метка>`, у площадок — `<линия> · pad`.
  Синхронизация (`lines.sync`) держит у каждого участника ровно одну
  секцию линии с нужной группой и множителем, пишет фильтры шапки в одну
  секцию каждой группы (ваниль разносит их по участникам) и удаляет лишние
  группы линии. Ручные секции хаба не трогаются. Переименование и удаление
  линии снимают её секции и группы. Имя линии не может быть пустым и
  содержать « · ». Защита чужого: `strip` сносит только секции с точными
  именами известных групп — памятка `line.groups` плюс точные имена групп
  участников, совпадение префикса ничего не удаляет; группа с живым членом
  вне участников линии не удаляется вовсе (`has_foreign_members`).
  Эта защита проверяет владельца-сущность, а не принадлежность каждой
  секции: `owns_entity` сравнивает `member.owner` с сущностями участников.
  Две одноимённые секции на одном участнике не различаются как свои и
  чужие; защита не гарантирует сохранение имени группы у такой ручной
  секции при удалении группы. Источник — статическое чтение
  `owns_entity` / `has_foreign_members` / `delete_groups` в
  `runtime/lines.lua`, 2026-11-12; новый игровой прогон не проводился.

settings:
  - "`shm-orbital-logistics-enabled`, runtime-global, по умолчанию да: выключение снимает свои секции и включает секции груза — путь перед удалением мода"
  - "`shm-orbital-logistics-panel-position`, runtime-per-user, по умолчанию `bottom`: положение панели у окна хаба и площадки — `bottom`, `top`, `left`, `right`"

testing: |
  Lua-тесты логики — `npm test -w shm-orbital-logistics`: метки, решатель,
  своя секция, линии, связность демо-сети и бюджет геометрии обзора.
  Тесты в игре — `npm run test:ingame -w shm-orbital-logistics`
  (`tests/ingame/`, FactorioTest, Space Age): сценарии ядра K-02…K-20 из
  раздела 10 ТЗ, выключение мода, статическая и live-демо-сцены, замер V-10 (пишет в лог
  строки `[PERF]`, бюджет не проверяет: время зависит от машины),
  переименование групп и линии снабжения K-15…K-17, K-21. Интерфейс —
  `npm run test:ingame:gui -w shm-orbital-logistics`, прогон с графикой
  под тегом `gui`: панель хаба и площадки, окно линий. Прогоны раунда
  orbital-02: с графикой — 23/23 PASS, в игре — 44 passed (вердикты
  ol-panel-content, ol-tag-tools, ol-lines-safety). За раунд добавлены
  тесты: предупреждения источников склада, встречный обмен двух планет
  одним челноком и прибывший груз, детали предметов и предпросмотр,
  агрегация исключений и ×N, каркас панели (потолок, скроллы, блоки),
  защита strip/delete_groups линий, включение только своих выключений,
  зачистка storage, снятие меток и no-op «Груз» без мест. Ручной прогон
  перед релизом — manual `test-orbital-manually`. Хаб открывается из
  удалённого вида: окно сущности с другой поверхности иначе не открыть.
  В сценариях ядра платформы ставятся скриптом на орбиту и переставляются
  записью `space_location`, перелёты не нужны. Таймаут теста
  поднят до 5 минут игры: сценарии ждут несколько передач по ~950 тиков.
  Расширенное демо покрыто tests/ingame/network.lua: пустые хабы, настоящие
  повторные отправления ракет с пяти планет, содержимое всех площадок,
  нативные полёты, разгрузка, идемпотентность, чужие объекты и слияние сил.
  Сила создаётся без исследований; число изученных технологий после build
  не меняется. Наличие нового груза во время разгрузки учитывается через
  события доставок, а не ошибочным требованием чистого уменьшения остатка.
  Его длинный сценарий имеет собственный async-таймаут, не меняет общий бюджет.
  Нормальное качество в этой сцене не закрывает полный K-01 с легендарным
  качеством и множителем секции.

gui_test_status: |
  На Factorio 2.1.24 mac-arm64 2026-11-14 после исправления раскладки полный
  GUI-набор дал 24 PASS / 4 FAIL; три проверки геометрии и шесть маршрута прошли.
  На исходной версии до правок кнопки и демо (20ec00ce) независимый изолированный
  прогон дал 13 PASS / 5 FAIL. До исправления маршрута имена и стеки всех пяти
  падений совпадали, кроме сдвига строк. Проверки переноса кнопки и admin-защиты
  также прошли.
  Это не зелёная приёмка всего GUI; прежние результаты orbital-02 исторические.
  Падают tests/ingame/gui.lua:
  - сворачивание блоков: «Группы» не развернулись;
  - транзит на склад и детали груза: два LuaEntity doesn't contain key index;
  - агрегация исключений: нет сетки иконок исключений.
  Прежнее пятое падение маршрута ('records': table expected, got nil) устранено
  вместе с правильной формой расписания; оставшиеся четыре не входят в
  исправления кнопки, демо, раскладки и маршрута.

native_ui_testing: |
  npm run test:ui:orbital из корня или npm run test:ui -w shm-orbital-logistics
  запускает настоящий мод со Space Age в изолированном ui-test-engine.
  Три native клика открывают overview, разворачивают и сворачивают одну
  карточку платформы. Проверяются исходные GUI-цели и get_mod(), expanded,
  наличие контента, tooltip, native-координаты кнопки имени до/после раскрытия,
  стабильные настройки viewport и PNG. Отрицательная проба с --negative отключает
  только финальный переключатель и должна вернуть код 1.
  Нативное покрытие текущей карточки — behaviors orbital-card-collapses-by-native-input
  и orbital-overview-layout-stays-stable;
  устройство engine, локатора и image oracle — entity ui-test-engine.
  Старую относительную панель и весь набор GUI-тестов эта проверка не принимает.
  В той же сцене задан приостановленный цикл из трёх остановок: проверяются
  порядок, замыкающая стрелка, одна активная планета и сохранность элементов
  при настоящих кликах/обновлении. Реальные полёты, повторы, ручной пропуск и
  многозвенное плечо покрывает FactorioTest, не статическая native-сцена.

demo: |
  Демо-сцены для визуальной проверки владельцем — в отладочной сборке
  (раздел `debug`), команда `/shm-orbital-demo`:

  - без параметра — статическая сцена `tests/demo/scene.lua`: платформы
    `OL-01…OL-12`, по паре на сценарий, в чате — что на какой должно
    происходить; `check` — сверка итога (✔/✘ по каждой);
  - `live` — живая сцена `tests/demo/live.lua`: платформы `OLL-1…OLL-8`,
    челноки раз в 40 с переставляются на следующую остановку маршрута (это
    не настоящий полёт — двигателей и топлива нет), склад над Наувисом и
    сбор гольмия над Фульгорой пополняются скриптом вместо ракет,
    потребители расходуют груз медленнее подвоза; `status` — содержимое
    хабов;
  - `network` — расширенное демо с планетарной логистикой, поле `demo_network`;
  - платформы статической и live-сцен без турелей, поэтому раз в секунду хаб делается
    неуязвимым, астероиды убираются, фундамент чинится;
  - строки чата дублируются в лог игры с меткой `[OL-DEMO]`;
  - `clear` — убрать все сцены (администратор); хаб перед удалением обнуляется: платформа,
    удалённая скриптом, исчезает не сразу и до того ещё запрашивает и
    отдаёт.

  Раньше демо было отдельным dev-модом `shm-orbital-logistics-demo` со
  своим симлинком; владелец попросил флаг отладки в основном моде. Обе
  сцены и сама команда прогоняются тестом в игре (`core.lua`); network —
  отдельно в `tests/ingame/network.lua`.

demo_network: |
  Режим network существующей /shm-orbital-demo — только в рабочей отладочной
  сборке со Space Age, для администратора отдельной тестовой карты.
  Канон планет, экспортных предметов, плеч маршрутов и количеств —
  tests/demo/network_spec.lua. Сборка/жизненный цикл — tests/demo/network.lua,
  физические планетарные ячейки — tests/demo/planet_cell.lua.

  На пяти планетах создаются настоящие силосы с автоматическими запросами,
  площадки с фильтрами импорта, отдельные запитанные робосети, infinity-провайдеры
  экспортных товаров и источники компонентов ракет. Только первая ракета
  получает bootstrap частей; следующие строятся из компонентов, поданных
  манипуляторами. Площадки разгружаются манипуляторами в infinity-поглотители.
  У Аквило — лёд с бетонным покрытием, обогрев и дополнительные физические
  зарядные робопорты: узел работает с базовыми роботами без исследований
  скорости/ёмкости и без изменения бонусов силы. У Фульгоры — молниезащита.

  Пять орбитальных складов держат экспорт с источником planet и импорт с
  platforms. Пять челноков возят встречные грузы по штатным расписаниям;
  у каждого настоящий двигатель и infinity-топливо/окислитель, в пути скорость
  ускоряется скриптом. Первый вылет ждёт фактической загрузки со склада.
  В хабы и площадки скрипт не вставляет товар и не удаляет потребляемый груз;
  начальная вставка — только собственный запас ремонтных комплектов.
  Это демонстрация логистики, не производства топлива, защиты от астероидов
  или экономики ракет. Платформы защищены от повреждений средствами демо.

  До строительства проверяются существующие площадки своей силы на всех
  планетах; конфликт отклоняет команду, чужая площадка не перенастраивается.
  Участок ищется ограниченно, отдельно от существующих построек/робосетей;
  на зарезервированном пятне убираются только природные препятствия.
  Разрешения логистики и доступ к пяти планетам включаются без исследования
  всей силы. При частичной ошибке убираются уже зарегистрированные объекты.

  Повторный network не дублирует сцену. status показывает координаты, реальные
  отправления/доставки и положение челноков; на картах есть метки площадок.
  Счётчик ракет считает завершившие подъём rocket-launched pods, а не только
  приказ запуска. network-clear удаляет объекты, тела ракет, капсулы и метки
  по сохранённым ссылкам; похожие имена не дают права на удаление. Группы
  с посторонними участниками сохраняются. При соединении робосети с чужой
  её роботы не удаляются вслепую. Перед слиянием сил исходная сеть убирается.
  Грунт, созданные поверхности и разрешения силы очистка не откатывает.
  Другие платформы той же силы могут участвовать в ванильном обмене с демо.

  Запуск и ожидаемые результаты — manual run-orbital-demo; подтверждённый
  контракт — behavior orbital-demo-network-exchanges-with-planets.

remote_interface: |
  `remote.call('shm-orbital-logistics', 'pass')` — пройти контроллером
  сейчас. Нужен тому, кто ставит метки скриптом: без него ваниль может
  отдать груз за те до 60 тиков, что остаются до очередного прохода.

