id: ui-test-engine
kind: entity
namespace: platform
version: "1"
title: Движок нативных UI-тестов Factorio
summary: "UI test engine на TypeScript и Lua: нативный ввод, outer screenshots и JSON-отчёт; counter-PoC и реальная карточка Orbital Logistics."

scope: |
  Дополнительный графический контур, не замена FactorioTest. Проверяет ввод,
  зарегистрированный обработчик, состояние и видимый результат. Реализованы
  counter-PoC и сценарий рабочего shm-orbital-logistics: открыть обзор,
  развернуть и свернуть карточку платформы. Не произвольное сохранение и
  не проверка обычного lifecycle создания игрока. Factorio 2.1.24 mac-arm64;
  другие ОС не проверены, кроссплатформенность сейчас не требуется.

paths:
  ui-test-engine/src/cli.ts: точка входа команды
  ui-test-engine/src/runner.ts: изолированный профиль, моды, артефакты и итог
  ui-test-engine/src/options.ts: канон аргументов CLI и поддерживаемой дорожки игры
  ui-test-engine/src/profiles.ts: канон профилей, модов, viewport, маркеров, reference pane и ожидаемого протокола
  ui-test-engine/src/process.ts: потоки строк, watchdog и ограниченное ожидание завершения
  ui-test-engine/src/protocol.ts: канон native events, порядка событий и утверждений
  ui-test-engine/src/visual.ts: counter oracle и проверка заголовка/содержимого production GUI
  ui-test-engine/native/: runtime-драйвер и внешний сценарий screenshot host
  ui-test-engine/scenarios/counter.lua: setup, нативный locator и утверждения сценария
  ui-test-engine/scenarios/orbital.lua: платформа, три настоящих клика, чтение GUI-state и геометрии
  ui-test-engine/native/locator.lua: временный невидимый probe для адресации sprite-button
  mods/shm-orbital-logistics/tests/ui/adapter.lua: dev-only подготовка реальной стартовой кнопки мода
  ui-test-engine/fixtures/counter/: отдельный мод с настоящей кнопкой и on_gui_click
  tools/lib/game-install.ts: переиспользуемое обнаружение установленной игры
  package.json: npm-команды и включение unit-тестов в общий прогон
  tsconfig.json: включение движка в strict typecheck

execution: |
  Node создаёт новый каталог в .work/ui-test-engine/, копирует туда driver,
  выбранный сценарий и его моды из реестра профилей. Для orbital — настоящую
  рабочую копию мода и базовые моды установленного Space Age, без FactorioTest.
  Параметры генерируются отдельным Lua-модулем внутри
  каталога прогона; исходники не переписываются. Игра запускается через
  --load-scenario с отдельными config.ini, write-data и mod-directory.

  Обычный сценарий открывает entity-backed Factoriopedia entry.
  SimulationDefinition.mods загружает runtime-драйвер и выбранные моды.
  Counter setup строит fixture GUI. Orbital setup создаёт платформу и вызывает
  dev-only подготовку игрока в sandbox мода: его renderer создаёт настоящую
  стартовую кнопку. Обработчики ввода не импортируются и не вызываются напрямую.
  get_widget_position находит цель, move_cursor/mouse_click доставляют ввод.
  Драйвер наблюдает on_gui_click, проверяет имена реальных целей и get_mod(),
  а состояние читает из tags/GUI-дерева, не чужого storage.

  OUTER game делает before/after через take_screenshot(show_gui=true), ждёт
  screenshot writer и сообщает complete на следующем тике. Node проверяет
  протокол, состояние, декодируемость PNG и видимые маркеры, затем формирует
  report.json. Отсутствие complete, ошибка, таймаут или аварийный выход — FAIL.

sprite_locator: |
  В исходную sprite-button временно добавляется короткий label с нулевыми
  размерами, прозрачным цветом шрифта и ignored_by_interaction. Он даёт native
  позицию; событие получает исходная production-кнопка, что проверяется
  наблюдателем. Probe удаляется до снимков. Sprite, tooltip и размеры кнопки
  не меняются. Отрицательный сценарий отдельно отключает финальную кнопку.

orbital_images: |
  Стилями тестового профиля увеличиваются entity_button_frame, wide_entity_button
  и factoriopedia_contents_scroll_pane; production GUI не уменьшается.
  Два неподвижных '+' у краёв simulation калибруют координаты, но не кодируют
  состояние карточки. Геометрия окна приходит из настоящего GUI.

  Отдельный reference pane вне окна отрисовывает caption/style его заголовка.
  Маска шрифта должна найтись внутри production-заголовка на ОБОИХ PNG, не в
  reference pane. Проверяются стабильность полосы заголовка, изменение области
  содержимого ниже кнопки и её очистка до тёмного нейтрального GUI-фона.
  Прямоугольник, изменившийся без production-заголовка, не проходит.
  Это локальный семантический oracle, не OCR и не полный golden-image baseline.
  Сценарий также читает native-центр исходной текстовой кнопки имени платформы
  до раскрытия, в checkpoint и после сворачивания: GUI-state не заменяет
  проверку фактического положения. Настройки scroll-pane проверяются отдельно
  от изображения. Плотный список и узкие колонки покрывает обычный FactorioTest,
  не одна карточка этого нативного профиля.
  В orbital-сцене также проверяются статический цикл расписания, замыкающая
  стрелка и неизменность элементов маршрута при трёх нативных кликах.
  Подсветка реального полёта проверяется отдельными FactorioTest-сценариями.

commands:
  positive: npm run test:ui:poc
  negative: npm run test:ui:poc -- --negative
  orbital: npm run test:ui:orbital
  orbital_negative: npm run test:ui:orbital -- --negative
  orbital_workspace: npm run test:ui -w shm-orbital-logistics
  help: npm run test:ui:poc -- --help
  unit: node --test "ui-test-engine/src/**/*.test.ts"
  lua_dialect: npm run check-lua -- ./ui-test-engine
  note: |
    Положительный прогон возвращает 0. --negative отключает целевую кнопку, но сохраняет
    ожидания: обязан получиться FAIL и код 1, не инвертированный PASS.
    Игровой прогон требует графической сессии; в npm run check не входит.
    Unit-тесты и strict typecheck движка входят в общий check.

artifacts: |
  В каталоге прогона: report.json с проверками и native events, process.log,
  полные script-output/ui-test/before.png и after.png; при найденном GUI —
  before-ui.png и after-ui.png с диагностическим crop. Пропавший или
  недекодируемый PNG валит прогон. Профиль и артефакты игнорируются в .work/.

isolation: |
  Launcher не читает и не копирует личные моды, конфиг, сохранения и player-data.json.
  Креды портала и скачивание модов не нужны: game-install используется для
  бинаря и read-data, не для steamCloudCredentials. Steam app ID берётся из
  tools/lib/ingame-config.ts. На POSIX создаётся собственная process group:
  сигналы и эскалация относятся только к ней, не к существующей игре или Steam.
  Ожидание stdout/stderr ограничено даже при выходе родителя раньше потомка.
  Fixture не находится в mods/ и не упаковывается для портала.
  Orbital adapter находится в tests/ реального мода и вырезается pack;
  его подключение требует одновременно debug_build и активного UI engine.

limitations:
  - "Два профиля заданы кодом в profiles.ts, публичного API произвольных сценариев нет."
  - "Размеры host проверены на текущем профиле и ОС; это общие GUI-стили профиля, не универсальный API размера simulation."
  - "Capture привязан к outer ticks, ввод — к inner updates. Атомарной синхронизации миров нет: проверяются порядок событий, стабильное конечное состояние и пиксели."
  - >-
    На 2.1.24 mac-arm64 2026-11-14 один orbital-прогон потерял в after.png всю
    вложенную simulation, включая мир, маркеры, reference pane и production GUI,
    при корректных native событиях и состоянии. Image oracle правильно вернул
    FAIL; повтор без правок прошёл. Срок simulation не истёк, преждевременное
    завершение процесса не подтверждено; точный триггер и связь с таймерами
    не установлены. Успешный повтор не переименовывает исходный прогон в PASS.
  - "Orbital oracle предполагает стандартный тёмный GUI и калибруемый шрифт; не проверяет каждый текст, tooltip или весь layout."
  - "PNG использует реальный drawable; --window-size не обещает тот же размер на Retina. Координаты берутся native locator, не вычисляются по display_resolution test player."
  - "Hover, текст, клавиатура, другие виджеты и восстановление произвольного сохранения не проверены."
  - "Покрыта одна карточка Orbital; старый удалённый GUI, сохранение/загрузка, остальные окна и полный GUI-набор не объявляются проверенными."

engine_evidence: docs/entities/engine-ui-simulations.yml
features_enabled: [native-simulation-input, outer-game-screenshots, isolated-profile, json-report, semantic-png-checks, real-mod-gui, native-sprite-targets, title-image-oracle]
features_disabled: [desktop-automation, mcp, direct-handler-invocation, golden-image-regression]
behaviors: [ui-test-engine-native-poc, orbital-card-collapses-by-native-input]
conventions: [testing, verification, secrets, engine-facts]
