key: lb-request-proxy
program: logistic-buildings
plan_item: iter-01 §1.5
title: Расходники и призраки запроса
status: planned
why: |
  Так доставляются топливо, патроны и семена — без этого половина зданий
  остаётся вне мода.
description: |
  Сценарии стенда: создание призрака запроса с указанием слота, дописывание
  своих строк в чужой призрак, несколько призраков на одном здании, чтение
  невыполненного остатка, запрос на изъятие отработанного топлива, снятие
  своих строк на работающем здании.

  Навязчивость предупреждения «нечем выполнить» автоматикой не измеряется —
  она оценивается глазами в цели `lb-session-facts`.
tasks:
  blocker: []
  high:
    - 'сценарий создания призрака запроса скриптом с указанием инвентаря и слота → фаза feat'
    - 'сценарий дописывания своих строк в чужой призрак и поведения при нескольких призраках на здании → фаза feat'
    - 'сценарии чтения невыполненного остатка, запроса на изъятие и снятия своих строк → фаза feat'
  medium:
    - 'сборку плана вставки вынести чистой функцией и покрыть тестом → фаза test'
  low: []
dod:
  - id: d1
    what: сценарии написаны и проходят линтер Lua
    kind: check
    how: npm run check-lua -- poc/shm-logistic-buildings-probe
  - id: d2
    what: сценарии зелёные на стенде, чужие строки призрака при дописывании целы
    kind: check
    how: npm run test:ingame
  - id: d3
    what: сборка плана вставки для призрака покрыта тестом
    kind: unit
    how: node tools/lua-test.ts ./poc/shm-logistic-buildings-probe
depends_on:
  - lb-probe-frame
  - lb-ingame-stand
