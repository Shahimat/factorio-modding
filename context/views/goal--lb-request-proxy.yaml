key: lb-request-proxy
program: logistic-buildings
title: Расходники и призраки запроса
status: planned
why: Доставка топлива, патронов и семян нужна большинству зданий.
description: |
  plan_item: iter-01 §1.5; spec: specs/03102026_spec_logistic_buildings.md;
  plan: plans/logistic-buildings/iter-01.html.
  Тикет lb-request-proxy.
  Критерии по исходному порядку: crit — обязательный, warn — предупреждение.
  1. crit: призрак запроса создаётся скриптом с указанием инвентаря и слота — зелёный на стенде
  2. crit: свои строки дописываются в чужой призрак без порчи; несколько призраков на здании — зелёные на стенде
  3. crit: невыполненный остаток читается, запрос на изъятие и снятие своих строк работают — зелёные на стенде
  4. warn: сборка плана вставки — чистая функция с тестом: node tools/lua-test.ts ./poc/shm-logistic-buildings-probe
  Контекст проверки: изъятие отработанного топлива, снятие своих строк на работающем
  здании. Навязчивость «нечем выполнить» оценивается глазами в lb-session-facts.
  Общая проверка: npm run check-lua -- poc/shm-logistic-buildings-probe;
  npm run test:ingame — измеренный результат, чужие строки при дописывании целы.
  Чеклист feat: сценарии призрака/остатка/изъятия; чистая сборка плана с тестом —
  внутри тикета, warn не повышается до обязательного.
tasks:
  blocker: []
  high:
    - 'lb-request-proxy: проверить призраки запроса и доставку расходников → feat → после каркаса и стенда'
  medium: []
  low: []
depends_on:
  - lb-probe-frame
  - lb-ingame-stand
