key: lb-ingame-stand
program: logistic-buildings
plan_item: iter-01 §1.2
title: Стенд для тестов внутри игры
status: active
why: |
  Переводит проверки из ручных в автоматические: дальше ответы даёт прогон, а
  не глаза владельца. Он же окупает себя в следующих итерациях — ядро сразу
  пишется с тестами.
description: |
  Фреймворк выбирается из существующих (FactorioTest, FUnit, factestio) по
  двум условиям convention `testing`: работает на обеих дорожках 2.0 и 2.1,
  запускается без графики. Заводится команда запуска и демонстрационный
  сценарий, который создаёт сущности, проматывает тики и сверяет результат.

  Ни один не проходит условия — заводим минимальный свой стенд, это записано
  допущением плана и примерно удваивает объём цели.
tasks:
  blocker: []
  high:
    - 'сравнить FactorioTest, FUnit и factestio по двум условиям convention testing и выбрать → фаза chore → решение в entity repo-toolchain строкой'
    - 'подключить выбранный фреймворк как dev-зависимость и завести команду npm run test:ingame → фаза feat → зависит от выбора'
    - 'демонстрационный сценарий: создать сущности, промотать тики, сверить результат → фаза test → зависит от команды запуска'
  medium:
    - 'отразить стенд в entity repo-toolchain: как запускается, что не попадает в zip релиза → фаза docs'
  low: []
dod:
  - id: d1
    what: стенд запускается одной командой без графики и возвращает ненулевой код при падении сценария
    kind: check
    how: npm run test:ingame
  - id: d2
    what: демонстрационный сценарий зелёный — сущности созданы, тики промотаны, результат сверен
    kind: check
    how: npm run test:ingame
  - id: d3
    what: выбор фреймворка и отвергнутые альтернативы записаны в entity repo-toolchain
    kind: check
    how: npm run check-docs
depends_on: []
