  Тикет lb-ingame-stand — проверить/довести существующий стенд, не строить повторно.
  Реализация каркаса и стенда есть в 4ab2e47, полная независимая приёмка не найдена.
  Критерии по исходному порядку (crit — обязательный):
  1. crit: стенд запускается одной командой без графики и падает с ненулевым кодом — npm run test:ingame
  2. crit: демонстрационный сценарий зелёный: сущности созданы, тики промотаны, результат сверен
  3. crit: выбор фреймворка и отвергнутые альтернативы записаны в entity repo-toolchain — npm run check-docs
  Исторический контекст плана: сравнение FactorioTest/FUnit/factestio по запуску
  без графики и обеим дорожкам 2.0/2.1; если не подходит — минимальный свой стенд
  (допущение, ~двойной объём). Дорожка 2.0 — историческое условие, не возобновление
  поддержки: текущая цель проекта Factorio 2.1 из context/project.yml первична.
  Проверить npm run test:ingame (включая отрицательный сценарий) и npm run check-docs;
  описание команды и того, что не входит в zip релиза, — в entity repo-toolchain.
  Чеклист feat: проверить критерии, довести выявленные пробелы с тестами и описанием.
