key: lb-storage-chest
program: logistic-buildings
title: Хранилища зданий и невидимый сундук
status: planned
why: От результатов зависят размер партии и возможность спрятать сундук внутри здания.
description: |
  plan_item: iter-01 §1.3; spec: specs/03102026_spec_logistic_buildings.md;
  plan: plans/logistic-buildings/iter-01.html.
  Тикет lb-storage-chest.
  Критерии по исходному порядку: crit — обязательный, warn — предупреждение.
  1. crit: хранилище машины: предел загрузки за заход, порог остановки по выходу, испорченное — зелёные на стенде
  2. crit: невидимый сундук: дроны обслуживают, попадает в сеть, манипулятор рядом на 1×1, 2×2, 3×3 — зелёные на стенде
  3. crit: бур принимает невидимый сундук целью сброса — зелёный на стенде
  4. warn: разбор вывода сценариев в сводку — чистая функция с тестом: node tools/lua-test.ts ./poc/shm-logistic-buildings-probe
  Контекст проверки: сколько скрипт кладёт в машину за заход, при каком
  заполнении выхода она встаёт, что с испорченным. Сундук в центре здания.
  Создание/удаление сундуков по жизненному циклу здания — не здесь, а ядро iter-02.
  Общая проверка: npm run check-lua -- poc/shm-logistic-buildings-probe;
  npm run test:ingame — каждый сценарий печатает измеренное число или вердикт.
  Чеклист feat: сценарии хранилищ/сундука/бура; разбор вывода и тест — внутри тикета,
  без повышения warn до обязательного критерия.
tasks:
  blocker: []
  high:
    - 'lb-storage-chest: проверить хранилища зданий и невидимый сундук → feat → после каркаса и стенда'
  medium: []
  low: []
depends_on:
  - lb-probe-frame
  - lb-ingame-stand
