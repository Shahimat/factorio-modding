key: lb-storage-chest
program: logistic-buildings
plan_item: iter-01 §1.3
title: Хранилища зданий и невидимый сундук
status: planned
why: |
  От ответов этой проверки зависят размер партии и сама возможность прятать
  сундук внутри здания.
description: |
  Сценарии стенда по двум темам. Хранилища: сколько скрипт кладёт в машину за
  заход, при каком заполнении выхода машина встаёт, что с испорченным.
  Невидимый сундук в центре здания: обслуживается ли дронами, попадает ли в
  сеть, на что наводится манипулятор рядом у зданий 1×1, 2×2 и 3×3, принимает
  ли бур такой сундук целью сброса.

  Создание и удаление сундуков по жизненному циклу здания сюда не входит —
  это работа ядра в следующей итерации.
tasks:
  blocker: []
  high:
    - 'сценарии по хранилищу машины: предел загрузки за заход, порог остановки по выходу, инвентарь испорченного → фаза feat'
    - 'сценарии по невидимому сундуку: обслуживание дронами, попадание в сеть, манипулятор рядом на 1×1, 2×2, 3×3 → фаза feat'
    - 'сценарий назначения сундука целью сброса бура → фаза feat'
  medium:
    - 'разбор вывода сценариев в сводку вынести чистой функцией и покрыть тестом → фаза test'
  low: []
dod:
  - id: d1
    what: сценарии написаны и проходят линтер Lua
    kind: check
    how: npm run check-lua -- poc/shm-logistic-buildings-probe
  - id: d2
    what: сценарии зелёные на стенде, каждый печатает измеренное число или вердикт
    kind: check
    how: npm run test:ingame
  - id: d3
    what: разбор вывода в сводку покрыт тестом на подставленных данных
    kind: unit
    how: node tools/lua-test.ts ./poc/shm-logistic-buildings-probe
depends_on:
  - lb-probe-frame
  - lb-ingame-stand
