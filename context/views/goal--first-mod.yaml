key: first-mod
title: Первый мод по ТЗ автора
status: active
why: |
  Ради этого репозиторий и заведён: у автора есть готовое техническое задание
  на конкретный мод. ТЗ получено 2026-10-03, разбор ещё не делался.
spec: specs/03102026_spec_logistic_buildings.md
mod_key: logistic-buildings
mod_name: shm-logistic-buildings
description: |
  ТЗ лежит в `specs/`, 546 строк, решения по дизайну в нём уже приняты и
  снабжены причинами. Разбор по convention `spec-intake` ещё не делался —
  владелец отложил его до следующей сессии, чтобы читать документ с чистым
  контекстом. Ничего из ТЗ в слои пока не перенесено.

  Что известно из прочитанных рамок (разделы 1 и 2, остальное не читалось):
  замысел — логистический режим на любом здании вместо связки «сундук
  запроса → манипулятор → здание → манипулятор → сундук снабжения»;
  производство только под неудовлетворённый спрос сети; пакетный заказ и
  отгрузка. Жёсткая зависимость только от `base`, мод обязан работать на
  чистой игре; совместимость со Space Age, Quality, Elevated Rails,
  Krastorio 2 и модами планет — без определения чего-либо по именам
  прототипов. Нужны два релиза из одной кодовой базы под 2.0 и 2.1, сначала
  2.0, различия API — через один файл-прослойку. Это согласуется с
  conventions `factorio-version-track` и `licensing`, правок в них не
  требует.

  Имя мода: рабочее внутреннее имя в ТЗ — `logistic-buildings`, с приставкой
  выходит `shm-logistic-buildings`. ТЗ помечает название предварительным.
  Перед заведением имени проверить, что оно свободно на портале
  (`publish-new-mod.md`, шаг 1).

  Открытый вопрос: имя файла ТЗ не следует шаблону `<mod-key>.md` из
  convention `spec-intake`. Либо переименовать файл, либо ослабить
  convention, разрешив свободное имя с явным `mod_key` в
  `context/index.yml` (сейчас зарегистрировано именно так). Решение за
  владельцем.
tasks:
  blocker: []
  high:
    - 'разложить ТЗ по слоям: entity мода, behaviors с критериями приёмки, задачи в эту цель → spec-intake, раздел «Что из ТЗ куда раскладывается» → фаза docs → читать ТЗ целиком с чистого контекста'
    - 'решить судьбу имени файла ТЗ: переименовать под шаблон или ослабить convention spec-intake → фаза docs → нужно решение владельца'
    - 'завести пакет mods/shm-logistic-buildings/ с info.json, changelog.txt, thumbnail.png, LICENSE → фаза feat → зависит от раскладки ТЗ'
  medium:
    - 'реализовать поведение мода по behaviors → фаза feat → зависит от пакета мода'
    - 'прогнать мод в игре и снять verified с mod-loads-in-target-factorio и changelog-parses-in-game → test-mod-locally.md целиком → фаза docs → зависит от пакета мода'
    - 'опубликовать мод на портале → publish-new-mod.md целиком → фаза chore → зависит от локального прогона'
  low:
    - 'поставить клиент Factorio 2.1 из experimental и выпустить релиз во вторую дорожку → migrate-mod-to-2-1.md → фаза chore → нужен только когда мод заработает на 2.0'
depends_on:
  - toolchain
