key: lb-tower-silo-gui
program: logistic-buildings
plan_item: iter-01 §1.6
title: Башня, шахта и панель у окна здания
status: planned
why: |
  Три возможности, которые либо есть в API, либо выпадают из мода и делаются
  иначе.
description: |
  Сценарии стенда: хранилища семян и урожая сельскохозяйственной башни и
  определение продукта по семени; загрузка деталей ракеты и признак «ракета
  собрана»; пробная панель с привязкой к штатному окну для производящих
  машин, печей, лабораторий, буров, котлов, реакторов и турелей.

  Внешний вид панели проверяется глазами в `lb-session-facts`; здесь ответ
  бинарный — привязка для типа здания есть или нет.
tasks:
  blocker: []
  high:
    - 'сценарии сельскохозяйственной башни: хранилища семян и урожая, продукт по семени → фаза feat'
    - 'сценарии ракетной шахты: загрузка деталей скриптом, признак «ракета собрана» → фаза feat'
    - 'пробная панель с привязкой к штатному окну по каждому целевому типу здания → фаза feat'
  medium:
    - 'пропуск башни и шахты в сборке без Space Age и тест на это → фаза test'
  low: []
dod:
  - id: d1
    what: сценарии написаны и проходят линтер Lua
    kind: check
    how: npm run check-lua -- poc/shm-logistic-buildings-probe
  - id: d2
    what: сценарии зелёные на стенде, по каждому типу здания привязка панели даёт «есть» или «нет»
    kind: check
    how: npm run test:ingame
  - id: d3
    what: сборка без Space Age не роняет прототип — башня и шахта пропускаются
    kind: unit
    how: node tools/lua-test.ts ./poc/shm-logistic-buildings-probe
depends_on:
  - lb-probe-frame
  - lb-ingame-stand
