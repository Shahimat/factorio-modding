why: Довести незакрытую часть аудита storage без повторной реализации уже написанного.
description: |
  Тикет ol-storage-hygiene — проверить и довести, не переписывать вслепую.
  Реализация заявлена в коммите 6a855ba, но независимого verdict нет:
  тикет остаётся незакрытым.
  Критерии по исходному порядку (crit — обязательный):
  1. crit: storage.platforms, storage.cache.hubs и storage.orbit чистятся при удалении платформы или хаба
  2. crit: мёртвый tags.places удалён (вместе с использованием в тестах); lines_gui.read_fields не падает на nil-фрейме
  Чеклист fix: сопоставить существующую реализацию и тесты с обоими критериями,
  проверить удаление платформы/хаба и nil-фрейм; довести только найденные пробелы.
  Результаты исполнителя и старые зелёные прогоны не заменяют свежую проверку.
  Остальные шесть тикетов цели приняты и не возвращаются в очередь.
  Зависимости на завершённые ai-core-adapters/orbital-panel-redesign не добавляются.
