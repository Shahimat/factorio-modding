key: ui-test-engine
title: Нативные UI-тесты реальных модов
status: planned
why: |
  Проверять доступность GUI и отрисованный результат настоящего ввода,
  не заменяя действие вызовом обработчика и ручным просмотром каждого изменения.
description: |
  Оставшаяся работа платформы; текущее устройство и границы — entity
  ui-test-engine, не описание цели. Новую реализацию выбирать отдельным тикетом.

  Тикет ui-engine-scenarios: публичный контракт подключения профилей и явная готовность
  inner input / outer capture без зависимости от двух фиксированных таймеров.
  Готовность: новый профиль подключается через явный контракт, кадр подтверждён после
  состояния; непоместившийся GUI и несостоявшийся capture дают понятный FAIL.
  Чеклист: chore — конфиг, синхронизация и тесты; docs — контракт расширения и ограничения.

