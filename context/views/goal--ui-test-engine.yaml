key: ui-test-engine
title: Нативные UI-тесты реальных модов
status: planned
why: |
  Проверять доступность GUI и отрисованный результат настоящего ввода,
  не заменяя действие вызовом обработчика и ручным просмотром каждого изменения.
description: |
  Следующий объём после стартового PoC; текущее устройство и границы — entity
  ui-test-engine, не описание цели. Новую реализацию выбирать отдельным тикетом.

  Тикет ui-engine-scenarios: конфиг подключаемых модов/сценария и явная готовность
  inner input / outer capture без зависимости от двух фиксированных таймеров.
  Готовность: второй fixture запускается без правки ядра, кадр подтверждён после
  состояния; непоместившийся GUI и несостоявшийся capture дают понятный FAIL.
  Чеклист: chore — конфиг, синхронизация и тесты; docs — контракт расширения и ограничения.

  Тикет ui-engine-orbital: один нативный сценарий существующего Orbital Logistics.
  Готовность: загружен runtime реального мода, его GUI-кнопка нажата через движок,
  проверены состояние и PNG; неподдерживаемый viewport не обходится вызовом
  обработчика. Golden comparison и vision-модель пока не выбраны.
  Чеклист: chore — адаптер сценария и прогон; docs — проверенное покрытие поведения мода.
tasks:
  blocker: []
  high:
    - 'ui-engine-scenarios: конфиг сценариев и явная синхронизация native input/capture → chore → блокеров нет'
  medium:
    - 'ui-engine-orbital: один настоящий GUI-клик и PNG Orbital Logistics → chore → после ui-engine-scenarios'
  low: []
depends_on: []
