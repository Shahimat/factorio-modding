key: lb-network-requests
program: logistic-buildings
plan_item: iter-01 §1.4
title: Запросы логистической сети
status: planned
why: |
  На чтении чужих запросов стоит весь расчёт спроса.
description: |
  Сценарии стенда: точки запроса сети и их содержимое вместе с количеством
  «в пути», признак буферного сундука, попадают ли в список персонажи,
  приходит ли событие при ручной смене запроса и при правке логистической
  группы.

  Буферный сундук обязан отличаться от обычного: они считаются по-разному, и
  ошибка здесь даёт лишнюю партию на каждом уровне цепочки.
tasks:
  blocker: []
  high:
    - 'сценарий чтения точек запроса сети: запросы, содержимое, количество в пути → фаза feat'
    - 'сценарий различения буферного сундука и обычного, проверка попадания персонажей в список → фаза feat'
    - 'сценарий события смены запроса: вручную на сундуке и через правку логистической группы → фаза feat'
  medium:
    - 'разбор ответа сети в сводку вынести чистой функцией и покрыть тестом → фаза test'
  low: []
dod:
  - id: d1
    what: сценарии написаны и проходят линтер Lua
    kind: check
    how: npm run check-lua -- poc/shm-logistic-buildings-probe
  - id: d2
    what: сценарии зелёные на стенде, буферный сундук отличён от обычного, событие смены запроса поймано
    kind: check
    how: npm run test:ingame
  - id: d3
    what: разбор ответа сети в сводку покрыт тестом
    kind: unit
    how: node tools/lua-test.ts ./poc/shm-logistic-buildings-probe
depends_on:
  - lb-probe-frame
  - lb-ingame-stand
