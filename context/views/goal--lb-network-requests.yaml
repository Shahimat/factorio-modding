key: lb-network-requests
program: logistic-buildings
title: Запросы логистической сети
status: planned
why: На чтении чужих запросов стоит расчёт спроса; ошибка даёт лишнюю партию на каждом уровне цепочки.
description: |
  plan_item: iter-01 §1.4; spec: specs/03102026_spec_logistic_buildings.md;
  plan: plans/logistic-buildings/iter-01.html.
  Тикет lb-network-requests.
  Критерии по исходному порядку: crit — обязательный, warn — предупреждение.
  1. crit: точки запроса сети: запросы, содержимое, количество в пути — зелёные на стенде
  2. crit: буферный сундук отличён от обычного, персонажи в списке проверены — зелёные на стенде
  3. crit: событие смены запроса: вручную на сундуке и правкой логистической группы — поймано на стенде
  4. warn: разбор ответа сети в сводку — чистая функция с тестом: node tools/lua-test.ts ./poc/shm-logistic-buildings-probe
  Буферный сундук и обычный считаются по-разному. Общая проверка:
  npm run check-lua -- poc/shm-logistic-buildings-probe; npm run test:ingame —
  буферный сундук отличён, событие поймано, сценарии дают измеренный результат.
  Чеклист feat: сценарии чтения/различения/события; разбор сводки и тест — внутри
  тикета, warn не повышается до обязательного.
tasks:
