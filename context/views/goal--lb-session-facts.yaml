key: lb-session-facts
program: logistic-buildings
plan_item: iter-01 §1.7
title: Сеанс в игре и запись фактов
status: planned
why: |
  Закрывает то, что автоматика не видит, и превращает результаты прогона в
  факты, на которые опирается следующая итерация.
description: |
  Один прогон всего набора со Space Age. Глазами проверяется только то, чего
  стенд не отвечает: внешний вид пробной панели и навязчивость предупреждений
  о нехватке материалов при десятке пустых турелей.

  Дальше выясненное уходит в namespace `engine` по convention `engine-facts`:
  факт, версия игры, отличия 2.1 по официальной документации. По каждой
  непройденной проверке предлагается обход — выбор за владельцем, дизайн
  молча не меняется.
tasks:
  blocker: []
  high:
    - 'прогнать весь набор проверок в игре со Space Age и собрать вывод → фаза chore → прогон делает владелец'
    - 'разобрать вывод и записать факты в docs/entities/engine-*.yml и behaviors с версией игры → фаза docs → зависит от прогона'
    - 'выписать отличия 2.1 по официальной документации для проверенных вызовов → фаза docs'
  medium:
    - 'по каждой непройденной проверке предложить обход одним блоком владельцу → фаза docs → дизайн без решения владельца не меняем'
    - 'зарегистрировать новые engine-сущности в context/index.yml → фаза docs'
  low: []
dod:
  - id: d1
    what: весь набор проверок прогнан в игре со Space Age, вывод снят
    kind: manual
    how: >-
      что сделать — запустить карту со Space Age и прототипом, выполнить
      `/shm-probe all`, дождаться строки «готово»; что увидеть — по каждой
      проверке строку «имя — ок / нет — пояснение»; что сообщить — лог в
      .work/proofs/logistic-buildings/lb-session-facts/d1-probe-run.txt, а
      если прогон оборвался — на какой проверке
  - id: d2
    what: внешний вид панели и навязчивость предупреждений оценены глазами
    kind: manual
    how: >-
      что сделать — открыть сборочный автомат и печь, затем поставить десяток
      турелей без патронов в сети; что увидеть — пристыкована ли панель сбоку
      к штатному окну и сколько предупреждений о нехватке материалов; что
      сообщить — два скриншота и число предупреждений в
      .work/proofs/logistic-buildings/lb-session-facts/d2-gui-warnings.md
  - id: d3
    what: факты записаны в namespace engine с версией игры, ссылки entity ↔ behavior целы
    kind: check
    how: npm run check-docs
  - id: d4
    what: по каждой непройденной проверке зафиксирован предложенный обход
    kind: check
    how: сверка отчёта прогона с записанными фактами — непройденных проверок без обхода нет
depends_on:
  - lb-storage-chest
  - lb-network-requests
  - lb-request-proxy
  - lb-tower-silo-gui
