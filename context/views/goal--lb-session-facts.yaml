key: lb-session-facts
program: logistic-buildings
title: Сеанс в игре и запись фактов
status: planned
why: Проверить то, чего автоматика не видит, и сохранить результаты для следующей итерации.
description: |
  plan_item: iter-01 §1.7; spec: specs/03102026_spec_logistic_buildings.md;
  plan: plans/logistic-buildings/iter-01.html.
  Тикет lb-session-facts.
  Критерии по исходному порядку (crit — обязательный):
  1. crit: весь набор прогнан в игре со Space Age (/shm-probe all); лог прогона в .work/proofs/logistic-buildings/lb-session-facts/
  2. crit: панель и навязчивость предупреждений оценены глазами; скриншоты и число предупреждений — в пруф d2
  3. crit: факты записаны в namespace engine с версией игры, отличия 2.1 по официальной документации выписаны — npm run check-docs
  4. crit: по каждой непройденной проверке предложен обход одним блоком владельцу; сверб с отчётом прогона
  «Сверб» в критерии 4 означает сверку с отчётом прогона.
  Ручные процедуры:
  d1: что сделать — запустить карту со Space Age и прототипом, выполнить
  `/shm-probe all`, дождаться строки «готово»; что увидеть — по каждой
  проверке строку «имя — ок / нет — пояснение»; что сообщить — лог в
  .work/proofs/logistic-buildings/lb-session-facts/d1-probe-run.txt, а
  если прогон оборвался — на какой проверке.
  d2: что сделать — открыть сборочный автомат и печь, затем поставить десяток
  турелей без патронов в сети; что увидеть — пристыкована ли панель сбоку
  к штатному окну и сколько предупреждений о нехватке материалов; что
  сообщить — два скриншота и число предупреждений в
  .work/proofs/logistic-buildings/lb-session-facts/d2-gui-warnings.md.
  Проверки d3/d4: npm run check-docs; факты с версией игры, ссылки entity ↔ behavior
  целы; сверка отчёта прогона с записанными фактами — непройденных без обхода нет.
  Чеклист docs: собрать результаты прогона, записать факты по engine-facts,
  отличия 2.1 и обходы, зарегистрировать новые engine-сущности в context/index.yml.
  Прогон делает владелец; дизайн без его решения не меняется.
tasks:
  blocker: []
  high:
    - 'lb-session-facts: провести сеанс и записать факты engine с обходами → docs → после четырёх целей проверок; ручной прогон владельца'
  medium: []
  low: []
depends_on:
  - lb-storage-chest
  - lb-network-requests
  - lb-request-proxy
  - lb-tower-silo-gui
