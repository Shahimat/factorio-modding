name: factorio-modding
summary: |
  Монорепозиторий модов Factorio автора Shahimat. Модов несколько, каждый решает
  свою задачу; моды могут зависеть друг от друга. Исходники модов — Lua,
  инструменты сборки и публикации — TypeScript в strict-режиме под npm.

author:
  nickname: Shahimat
  mod_portal_account: Shahimat
  mod_name_prefix: shm-
  note: |
    Мод-портал игнорирует поле `author` из info.json и всегда показывает имя
    аккаунта загрузившего. Авторская приписка живёт в `name`, `title` и
    префиксах прототипов — см. convention `mod-naming`.

stack:
  - lua
  - typescript
  - node
  - npm-workspaces

reality: [this-repo]

target:
  factorio_stable: "2.1"
  note: |
    Единственная поддерживаемая версия — Factorio 2.1: на 2026-10-25
    `latest-releases` отдаёт stable и experimental `2.1.23`. Поддержка 2.0
    снята полностью 2026-10-25. Правила — convention `factorio-version-track`.

license:
  own_code: MIT
  mod_portal_enum: default_mit
  note: |
    MIT покрывает только собственный код и собственные ассеты. Производные от
    ассетов Wube остаются собственностью Wube. См. convention `licensing`.

namespaces:
  platform: репозиторий, npm-workspaces, инструменты сборки на TypeScript
  delivery: упаковка мода, мод-портал, релизы и публикация
  mods: сами моды и их внутреннее устройство
  engine: |
    особенности движка Factorio, подтверждённые прогоном в игре, — знание
    поверх отдельных модов, переиспользуемое следующими. Правила записи —
    convention `engine-facts`

paths:
  handoff: context/main.md
  index: context/index.yml
  workflow: context/workflow.md
  goals: context/views/goals.yaml
  mods: mods/
  tools: tools/
  specs: specs/
  plans: plans/
  poc: poc/

external:
  ai_prompts_upstream: https://github.com/Shahimat/ai-prompts
  ai_prompts_upstream_index: https://raw.githubusercontent.com/Shahimat/ai-prompts/main/prompts/index.yml
  mod_portal: https://mods.factorio.com/
  mod_portal_profile: https://mods.factorio.com/user/Shahimat
  api_keys: https://factorio.com/profile
  lua_api_stable: https://lua-api.factorio.com/stable/
  mod_structure_spec: https://lua-api.factorio.com/stable/auxiliary/mod-structure.html
  changelog_format_spec: https://lua-api.factorio.com/stable/auxiliary/changelog-format.html
  latest_releases_api: https://factorio.com/api/latest-releases
  terms_of_service: https://factorio.com/terms-of-service
  note: |
    Детальные release notes самой игры и обсуждения на форуме в проектный
    CHANGELOG.md не мигрируют — только ссылка здесь.

