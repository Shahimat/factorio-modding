key: localization
rule: |
  Мод, у которого есть хоть одна строка для игрока (имена прототипов,
  интерфейс, настройки, подсказки, сочетания клавиш), выходит сразу
  переведённым на базовый набор языков. Перевод — часть разработки фичи, а
  не отдельная задача «потом»: строка без перевода в релиз не уходит.

  ## Базовый набор языков

  Коды — имена каталогов `locale/<код>/`, как их понимает игра.

  | код   | язык                      |
  |-------|---------------------------|
  | en    | английский (опорный)      |
  | ru    | русский                   |
  | de    | немецкий                  |
  | fr    | французский               |
  | es-ES | испанский                 |
  | pt-BR | португальский (Бразилия)  |
  | pl    | польский                  |
  | uk    | украинский                |
  | zh-CN | китайский упрощённый      |
  | ja    | японский                  |
  | ko    | корейский                 |

  Откуда набор: замер по 91 моду в каталоге модов владельца (2026-10-25),
  сколько модов несут локаль на языке — en 69, ru 40, pl 33, zh-CN 30,
  de 29, fr 25, es-ES 20, uk 18, ja 17, ko 15, cs 12, pt-BR 11, дальше
  ≤ 9. В набор вошли языки, которые несёт не меньше 15 модов, плюс pt-BR —
  у Factorio одна из крупнейших аудиторий в Бразилии, а португальский иначе
  не покрыт ничем. cs — первый кандидат на расширение набора.

  ## Правила

  - `en` — опорный язык: ключи и смысл строк определяются по нему, игра
    подставляет его, когда перевода нет.
  - Каждый язык набора содержит **все** ключи `en`, не больше и не меньше.
    Недостающий ключ игра молча покажет по-английски, лишний — мусор,
    переживший переименование.
  - Перевод делает агент вместе с фичей. Ссылки на управление
    (`__CONTROL__…__`), иконки (`[entity=…]`) и параметры (`__1__`)
    переносятся без изменений.
  - Названия ванильных сущностей переводятся так, как их называет сама
    игра на этом языке (`data/core/locale/<код>/`, `data/base/locale/<код>/`).
    Для сущностей другого мода — как в его локали, если она есть.
  - Языки сверх набора принимаются, если их прислал носитель, и дальше
    ведутся по тем же правилам.
