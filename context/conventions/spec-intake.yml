key: spec-intake
rule: |
  `specs/` — каталог входящих ТЗ от автора. Это пятый артефакт помимо четырёх
  слоёв контракта; отклонение зафиксировано в `context/project.yml` →
  `deviations_from_contract`.

  ## Формат и размещение

  - Один файл на одно ТЗ, markdown, прямо в `specs/` без вложенных папок.
  - **Имя входящего файла задаёт автор, агент его не меняет.** Шаблона нет:
    документ принадлежит автору, и то, как он его назвал (дата постановки,
    своя формулировка), — часть его способа вести документы. Переименование
    ТЗ — такая же правка чужого артефакта, как правка текста.
  - Сопоставление ТЗ с модом держится не на имени файла, а на регистрации в
    `context/index.yml` → `specs`. Поля `path`, `mod_key` и `mod_name`
    обязательны; `mod_key` — та же часть имени, что в `shm-<mod-key>`.
    Без них ТЗ считается незарегистрированным.
  - **На выходе свободной формы нет.** Всё, что порождается по этому ТЗ,
    именуется строго по `<mod-key>`: `mods/shm-<mod-key>/`,
    `docs/entities/<mod-key>.yml`,
    `context/views/program--<mod-key>.yaml`, прототип `poc/shm-<mod-key>-probe/`.
    Свобода имени кончается на границе `specs/`.
  - Несколько документов по одному моду различаются записями в индексе с
    одинаковым `mod_key`; аспект поясняется в `one_liner` записи.

  ## Статус документа

  ТЗ — **входящее сырьё, не источник правды о «сейчас»**. Агент его не
  редактирует и не «улучшает»: правит только автор. Агент может задать
  вопросы по ТЗ и предложить правку текстом в диалоге.

  Противоречие ТЗ и реализованного кода не означает, что код неправ: ТЗ
  фиксирует требование на момент постановки. Расхождение поднимается автору
  явно, а не разрешается молча.

  ## Что из ТЗ куда раскладывается

  ТЗ читается один раз и раскладывается по слоям — дальше работа идёт по
  слоям, а не по ТЗ:

  - состав мода, его поля, зависимости, feature-флаги → `docs/entities/<id>.yml`;
  - ожидаемое поведение → `docs/behavior/<id>.yml` в виде `scenarios`
    given/when/then с `verified: false` до фактической проверки. Это
    долгоживущая правда: «так система работает всегда»;
  - критерии приёмки (DoD) → поле `dod` в `program--<key>.yaml` и в каждой
    подцели. Это краткоживущая формулировка «сделано достаточно, чтобы
    закрыть цель», она умирает вместе с целью. Отдельного слоя под DoD не
    заводим: в `docs/` он жил бы дольше, чем имеет смысл. Формат и виды
    проверок — convention `spec-program`;
  - ручные процедуры, которые ТЗ подразумевает → `docs/manuals/<name>.md`;
  - устойчивые договорённости → `context/conventions/<key>.yml`;
  - работа, которую надо сделать → сперва план итерации в
    `plans/<key>/iter-NN.html` на согласование владельцу, и только после
    `approved` — программа `context/views/program--<key>.yaml` с подцелями, с
    прогоном `goal-consistency` и верификацией плана. Правила — convention
    `spec-program`, разделы «План программы» и «Верификация плана»;
  - реквизиты и константы → `context/project.yml`.

  ## Ссылки

  Цель и entity, выведенные из ТЗ, ссылаются на файл спеки полем `spec:` со
  значением — путём от корня репозитория. Обратная ссылка из ТЗ не требуется:
  документ принадлежит автору и не обязан знать про слои.

  ## Как раскладывается

  Процедура раскладки — скилл `/plan-spec`. Руками тоже можно, но правила
  одни и те же: они живут в этой convention и в `spec-program`, а скилл
  только ведёт по ним.

  ## Критерий, что ТЗ разложено

  ТЗ считается разложенным, когда по нему заведены entity, behaviors с
  ожидаемым поведением, согласованный владельцем план первой итерации,
  программа со стадией и подцелями, у каждой подцели заполнен `dod`,
  верификация плана закрыта статусом `approved`, а в `context/index.yml` есть
  записи обо всём, что попало в слои. `dod` самой программы на этом этапе
  пуст — он появляется к стадии `review`, см. convention `spec-program`. До этого момента планирование по этому моду не
  считается завершённым. Сам файл спеки при этом остаётся в `specs/` навсегда
  как исходное требование.
