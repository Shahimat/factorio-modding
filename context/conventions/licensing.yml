key: licensing
rule: |
  Моды этого репозитория открытые. Лицензия на собственный код и собственные
  ассеты — **MIT**; на мод-портале выбирается enum-значение `default_mit`.

  ## Что покрывает MIT, а что нет

  MIT распространяется только на то, что принадлежит автору: Lua-код,
  TypeScript-инструменты, собственная графика, звуки, локали.

  MIT **не** распространяется на ассеты Factorio и производные от них. По
  Terms of Service Wube Software:

  - производные от ассетов Factorio разрешено включать и распространять в
    составе мода, но все права на них остаются у Wube, и Wube вправе
    потребовать их удаления;
  - распространение оригинальных ассетов вне необходимости для собственного
    мода запрещено;
  - любое коммерческое использование ассетов и исходников Factorio — только по
    отдельному письменному согласию Wube;
  - публикуя мод на портале, автор выдаёт Wube безотзывную бессрочную
    безвозмездную сублицензируемую лицензию на мод и его содержимое.

  Поэтому в `LICENSE` каждого мода и в корневом `LICENSE` обязателен явный
  абзац-оговорка про ассеты Wube. Без него лицензия формально обещает права на
  то, чем автор не владеет.

  ## Обязательные артефакты

  - корневой `LICENSE` — текст MIT + оговорка про ассеты;
  - `LICENSE` внутри каждого пакета мода (попадает в zip релиза);
  - `license: default_mit` при публикации через `init_publish` / `edit_details`;
  - `source_url` на репозиторий при публикации — у 98 из 150 популярных модов
    он указан, это норма экосистемы.

  ## Почему MIT, а не копилефт и не закрытая

  Замер по 150 самым скачиваемым модам под Factorio 2.0/2.1 (2026-10-03):
  MIT — 47, LGPLv3 — 11, GPLv3 — 5, BSD-3 и ISC — по 1; остальные ~80 —
  закрытые кастомные лицензии («Limited Distribution Only», CC BY-NC-ND 4.0,
  «Copyright, Redistribution, No editing»). Среди открытых MIT доминирует с
  большим отрывом. Закрытые лицензии берут преимущественно авторы крупных
  оверхолов ради защиты от перезаливки и чужих форков — для наших задач это
  не актуально.

  Портал принимает только один enum на мод, поэтому раздельная лицензия на
  код и на арт (например MIT + CC BY) потребовала бы кастомной лицензии через
  `custom_$ID` — сознательно не идём туда.
