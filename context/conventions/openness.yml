key: openness
rule: |
  **Принцип: открытость взаимодействия.** Совместная работа разработчиков и
  ИИ-агентов в проекте должна быть прозрачной, открытой и доступной. Никаких
  «потаённых» знаний и процессов, которые видит только один агент или один
  разработчик у себя локально. Всё, что влияет на то, как в проекте
  принимаются решения и правится код, лежит в репозитории и доступно к чтению
  любому участнику.

  Поэтому все устойчивые уточнения по этому проекту — договорённости,
  конвенции, реквизиты, ожидаемое поведение, ручные процедуры, крупные
  решения и вехи — записываются в проектную документацию репозитория:
  `docs/entities/`, `docs/behavior/`, `docs/manuals/`,
  `context/conventions/`, `context/project.yml`, `CHANGELOG.md`. Так они видны
  любому, кто открывает репозиторий, и переживают смену агента, пересборку
  окружения и очистку локальных настроек.

  **Команда «запомни» по умолчанию = правка проектной документации.** Когда
  автор говорит «запомни», «зафиксируй», «сохрани это» — это означает внести
  факт в соответствующий слой проектной документации, а не в memory агента и
  не в hooks. Каждый раз проговаривать «запомни и внеси в проектную
  документацию» избыточно — это дефолт. Если в редком случае имеется в виду
  именно memory или hooks — автор скажет это явно.

  Не переноси проектные уточнения в:

  - автоматическую memory агента, которая persists across conversations вне
    репозитория;
  - hooks и глобальные настройки инструментария (`~/.claude/settings.json`,
    глобальные `CLAUDE.md` вне репозитория и т.п.);
  - внутренние заметки, которые не увидит ни человек, ни второй агент,
    открывший проект.

  Memory и hooks — это личное, скрытое состояние инструмента у конкретного
  пользователя. Оно невидимо для других разработчиков, для другого агента на
  том же проекте и для ревьюера PR. Использовать их для проектных фактов —
  значит уводить часть процесса в тень, что ломает принцип открытости.
  Проектный факт живёт в репозитории и проходит ревью как код. Если возникает
  соблазн запомнить что-то «на будущее» — это сигнал, что нужно завести файл в
  проектной документации.

  **Граница допустимого в memory.** Персональный и эфемерный контекст — роль
  пользователя, ссылка на внешнюю систему, мета про конкретную сессию — в
  memory допустим. Но решение «это не проектный факт» принимается осознанно и
  сообщается пользователю, а не по умолчанию.

  **Техническая страховка.** Правило подкреплено пользовательским hook
  `~/.claude/hooks/block-memory-write-for-agent-operational-contract-v2.sh`,
  который блокирует запись в memory для проектов с этим `sync.contract.key`.
  Порядок настройки и проверки — manual `setup-safety-hooks`. Отсутствие hook
  работу не блокирует: основная защита — это правило и дисциплина агента.
