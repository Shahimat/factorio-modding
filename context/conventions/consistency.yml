key: consistency
summary: "Чек-лист внутренней непротиворечивости перед сохранением сущности: машинная часть — npm run check-docs, остальное — головой."
rule: |
  Перед тем как сохранить новую или изменённую сущность, проверь минимум
  следующие типовые противоречия.

  ## Проверяется машинно

  Формальные связи слоёв — `npm run check-docs`:

  - entity ссылается на несуществующую behavior или наоборот;
  - ссылка между entity и behavior односторонняя (указана с одной стороны,
    обратной нет);
  - behavior `verified: true`, но `verified_at` пусто;
  - behavior `verified: false`, но `verified_at` заполнен;
  - `verified_note` пуст — причина статуса всегда записывается;
  - сценарий behavior без полного набора `given` / `when` / `then`;
  - имя файла и `id` внутри YAML не совпадают (для conventions — `key`);
  - один и тот же `id` занят двумя файлами entities или двумя behaviors;
  - у entity, behavior или convention нет `summary` одной строкой —
    она нужна индексу (`oc3 context index`);
  - у convention пусто или отсутствует поле `rule`;
  - entity / behavior ссылается на несуществующий manual или convention;
  - у entity или behavior нет поля `namespace`, либо namespace не объявлен
    в `context/project.yml` → `namespaces`;
  - в одном namespace больше 7 entities или больше 100 behaviors — сигнал к
    дроблению; не блок, но поднимается в отчёте. Порог 100 — договорённость
    проекта: namespace `mods` общий для всех модов монорепозитория;
  - в `context/project.yml` неполон блок `sync` либо пуст или отсутствует
    блок `namespaces`;
  - `context/modules/<key>.yml`: файл из `provides.files` удалён.

  Свежесть и полнота `context/index.yml`, поля `id` / `namespace` /
  `summary` у слоёв и упоминание manual в entity проверяет
  `oc3 context check` после генерации `oc3 context index`.

  Очередь работы (`goals/*.expect.ts`) проверяют команды `oc3`: стадии и
  активный тикет — `oc3 goals status`, целостность правок тикета —
  `oc3 goals check`.

  ## Проверяется только головой

  Автоматике не поддаётся, проверяется агентом явно:

  - behavior `verified: true`, но код в связанной entity был изменён без
    пересмотра verified-статуса;
  - manual ссылается на удалённое или переименованное поле entity;
  - одна convention противоречит другой convention;
  - конфликт интентов между целями: одна создаёт сущность, другая её
    убирает, без явной последовательной связи;
  - фаза внесла изменение, попадающее под критерий `CHANGELOG.md`, но записи
    за этот период нет;
  - `sync.index_sha` совпал с индексом источника, но `synced_sha` отдельного
    источника разошёлся с тем, что в индексе — признак ручной правки.

  ## Что делать с находкой

  Если найдено противоречие — не сохраняй молча: явно перечисли конфликт,
  предложи вариант починки, дождись подтверждения, если исправление меняет
  уже согласованные решения.

  Деление на «машинно» и «головой» — не разрешение пропускать вторую часть.
  Зелёный `npm run check-docs` означает только, что формальные связи целы.
