key: factorio-version-track
rule: |
  Поле `factorio_version` в `info.json` указывает **ровно одну** мажорную
  версию игры (формат `number.number`, например `"2.1"`). Поддержка двух
  мажорных версий одним релизом невозможна — даже если мод фактически
  работает в новой версии, без правки поля игра его не возьмёт. Третье число
  (`"2.1.23"`) — портал отклонит релиз.

  ## Дорожка релизов

  Новые релизы идут в одну дорожку — **Factorio 2.1** (stable с 2.1.x,
  на 2026-10-23 — `2.1.23`). Дорожка **2.0 заморожена**: новых релизов в неё
  нет, выложенные остаются доступны на портале. Мод-портал хранит все релизы
  в одном списке, а игра сама подбирает последний релиз с подходящим
  `factorio_version`, поэтому игроки на 2.0 по-прежнему получают последний
  2.0-релиз.

  Версия самого мода **не привязана** к версии игры: она остаётся свободной
  для семантики изменений мода.

  Прототипы в `poc/`, начатые до перехода под 2.0, доживают на 2.0, пока на
  ней установлена игра владельца; перевод — manual `migrate-mod-to-2-1`.
  `validate` принимает оба значения: `2.0` остаётся известной версией, а не
  ошибкой.

  ## Правила ведения

  - Новый мод и новая фича пишутся против 2.1.
  - Код не ветвится по версии игры внутри одного релиза: `if` по версии не
    заводим.
  - Фичи, доступные только с Space Age, включаются через feature-флаги в
    `info.json` (`quality_required`, `rail_bridges_required`,
    `spoiling_required`, `freezing_required`, `segmented_units_required`,
    `expansion_shaders_required`, `space_travel_required`), а не через
    зависимость от мода `space-age`, если хватает флага.
  - Перед релизом актуальные номера версий игры берём из
    `https://factorio.com/api/latest-releases`, а не из памяти.

  ## Когда появится следующая мажорная версия

  Пока она experimental — по правилам, по которым до 2026-10-23 вели пару
  2.0 / 2.1: основная дорожка остаётся stable, вторая готовится по manual
  перевода. Когда она станет stable и этого захочет автор — текущая дорожка
  замораживается, `target` в `context/project.yml` переводится на новую
  версию, эта convention и manual `migrate-mod-to-2-1` переписываются, в
  `CHANGELOG.md` появляется запись о переходе.
