key: factorio-version-track
rule: |
  Поле `factorio_version` в `info.json` указывает **ровно одну** мажорную
  версию игры (формат `number.number`, например `"2.0"`). Поддержка двух
  мажорных версий одним релизом невозможна — даже если мод фактически
  работает в новой версии, без правки поля игра его не возьмёт. Третье число
  (`"2.0.77"`) — портал отклонит релиз.

  ## Две дорожки релизов

  Основная дорожка — **Factorio 2.0** (stable). Вторая, подготовленная —
  **2.1** (experimental). Мод-портал хранит все релизы в одном списке, а игра
  сама подбирает последний релиз с подходящим `factorio_version`. Поэтому
  дорожки ведутся как два потока релизов одного и того же мода, а не как два
  мода.

  Версия самого мода **не привязана** к версии игры: она остаётся свободной
  для семантики изменений мода. Различие дорожек выражается только полем
  `factorio_version` и ветками в репозитории.

  Так же устроен Krastorio2: релизы `2.0.19` (`factorio_version: 2.0`) и
  `2.1.1`…`2.1.3` (`factorio_version: 2.1`) выкладываются вперемешку.

  ## Правила ведения

  - Новая фича пишется против 2.0, если не требует API, появившегося в 2.1.
  - Код не ветвится по версии игры внутри одного релиза: `if` по версии не
    заводим, вместо этого выпускаем релиз в нужную дорожку.
  - Фичи, доступные только с Space Age, включаются через feature-флаги в
    `info.json` (`quality_required`, `rail_bridges_required`,
    `spoiling_required`, `freezing_required`, `segmented_units_required`,
    `expansion_shaders_required`, `space_travel_required`), а не через
    зависимость от мода `space-age`, если хватает флага.
  - Перед релизом актуальные номера версий игры берём из
    `https://factorio.com/api/latest-releases`, а не из памяти.

  ## Когда отказываемся от дорожки 2.0

  Когда 2.1 станет stable и этого захочет автор. Тогда:
  дорожка 2.0 замораживается (новые релизы в неё не идут, старые остаются
  доступны на портале), `target.factorio_stable` в `context/project.yml`
  переводится на `2.1`, эта convention упрощается до одной дорожки, в
  `CHANGELOG.md` появляется запись о переходе.
