key: testing
rule: |
  Каждый инструмент в `tools/` покрывается юнит-тестами. Это базовое правило
  проверки, а не опция: `npm test` входит в `npm run check`.

  Тестируемого кода в проекте два вида, и у них разные раннеры:

  - инструменты в `tools/` — TypeScript, встроенный `node:test`;
  - логика модов в `mods/<name>/` — Lua, собственный harness.

  Правила ниже про «что именно тестируем» и «чего не делаем» общие для
  обоих; различия — в разделах «Lua-тесты модов» и «Скоупы запуска».

  ## Чем тестируем

  Встроенный раннер Node: `node:test` + `node:assert/strict`. Внешних
  зависимостей для тестов нет и не вводим — Node исполняет `.ts` напрямую.

  Раннер не находит `.ts` при обходе каталога, поэтому запуск только через
  glob: `node --test "tools/**/*.test.ts"`. Это и есть `npm test`.

  ## Где лежат тесты

  Рядом с кодом: `tools/lib/<module>.test.ts` для `tools/lib/<module>.ts`.
  Отдельного каталога `test/` нет — так ближе к коду и виднее, у какого
  модуля тестов нет.

  Тесты мода — в его собственном пакете: `mods/<name>/tests/<module>.test.lua`.
  Здесь каталог отдельный, в отличие от `tools/`: файлы пакета уезжают в zip
  релиза, и тесты должны вырезаться упаковкой одним правилом, а не
  перечислением. `tests/` и `*.test.lua` входят в исключения `pack`.

  ## Что именно тестируем

  Чистую логику. Если в модуле логика смешана с чтением файлов, сетью или
  git — логика выносится в чистую функцию, а I/O остаётся тонкой обёрткой
  над ней. Такое разделение уже сделано для разбора `changelog.txt`
  (`parseChangelog`), проверки `info.json` (`checkInfoJsonText`) и сканера
  секретов (`tools/lib/secret-scan.ts`).

  Требования к набору тестов модуля:

  - положительный случай: корректный вход проходит без находок;
  - по тесту на каждое правило, которое модуль проверяет;
  - граница «ошибка против замечания» проверяется явно, через
    `countErrors`;
  - регрессии: найденный дефект правила закрывается тестом, в комментарии —
    в чём был дефект.

  Тесты не ходят в сеть и не обращаются к мод-порталу. Там, где нужна
  файловая система, используется временный каталог из `node:os.tmpdir()`,
  который удаляется в `finally`.

  ## Lua-тесты модов

  Harness свой, без LuaRocks и внешних фреймворков — тот же принцип нулевых
  зависимостей, что у `node:test`. Устройство: обнаружение файлов и разбор
  результата живут в TypeScript (`tools/`), на стороне Lua остаётся
  минимальный модуль с `describe` / `it` / сравнением значений и заглушки
  игрового API. Так `language_split` из entity `repo-toolchain` не
  нарушается: Lua только там, где его требует рантайм.

  Тестируется та же чистая логика. Код мода, который обращается к `game`,
  `script`, `storage`, `data` или `defines`, юнит-тестом не берётся —
  логика выносится в модуль без обращений к API, а точка входа мода остаётся
  тонкой обёрткой. Что не вынести — проверяется пруфом из игры, см.
  convention `spec-program`, вид пункта DoD `proof`.

  ## Скоупы запуска

  Моды множатся, и общий прогон «все тесты всех модов» в `npm run check`
  превратился бы в налог на любую правку в `tools/`. Поэтому запуски
  раздельные:

  - `npm test` — только `tools/**/*.test.ts`, в моды не заходит;
  - `npm test -w shm-<mod>` — Lua-тесты одного мода, через скрипт его
    собственного `package.json`;
  - `npm run check` — typecheck, тесты инструментов, `check-secrets`,
    `check-docs`, `validate`; по модам не рекурсирует;
  - `npm run check:mod -- <mod-key>` — всё по одному моду;
  - полный прогон по всем модам существует отдельной командой и вызывается
    осознанно (перед релизом, при ревью программы), в `npm run check` не
    входит.

  Пункт DoD с `kind: unit` указывает в `how` команду своего скоупа, а не
  общий прогон: ревьюер должен проверять цель, а не репозиторий целиком.

  ## Интеграционные тесты в игре

  Юнит-тестами закрывается только чистая логика. Поведение, которое живёт в
  рантайме игры (сундуки, дроны, события постройки и сноса), проверяется
  интеграционным стендом внутри самой игры: сценарий создаёт поверхность,
  ставит сущности, проматывает тики и сверяет результат.

  **Готовый фреймворк сообщества использовать можно и нужно, если
  подходящий есть.** Правило «внешних зависимостей для тестов не вводим»
  относится к Node-тестам инструментов: там внешний раннер вытеснял бы
  встроенный `node:test` без выигрыша. В игре своего раннера нет вообще, и
  писать его с нуля — недели работы вместо проверки дизайна.

  Условия к фреймворку:

  - работает на обеих дорожках, 2.0 и 2.1 (convention
    `factorio-version-track`);
  - запускается без графики, чтобы годился для дымового прогона и замера
    нагрузки;
  - остаётся dev-зависимостью: в zip релиза не попадает и в
    `dependencies` мода не прописывается.

  Ни один не проходит условия — тогда минимальный свой стенд: тестовый
  сценарий плюс консольная команда. Это запасной путь, не первый.

  ## Диалект Lua

  Factorio 2.0 исполняет патченный **Lua 5.2**. Локально доступны `lua` 5.5
  и `luajit` (5.1-совместимый); формул `lua@5.2` и `lua@5.3` в Homebrew нет,
  точного совпадения без сборки из исходников не получить.

  Решение: тесты гоняются на системном `lua`, а разницу версий ловит
  отдельная машинная проверка исходников модов. Она запрещает конструкции,
  которых в 5.2 нет: целочисленное деление `//`, битовые операторы
  `& | ~ >> <<`, `math.type`, `table.move`, `string.pack` / `unpack`,
  атрибуты `<const>` и `<close>`.

  Где она запускается:

  - пакеты в `mods/` — внутри `npm run validate`, то есть и в
    `npm run check`, автоматически;
  - любой каталог с Lua, включая прототипы в `poc/` — командой
    `npm run check-lua -- <скоуп>`. Скоуп обязателен: `--all` существует, но
    в `npm run check` не входит, чтобы проверка шла по тому, что реально в
    работе, а не по всему репозиторию.

  Гарантии это не даёт: зелёный тест на 5.5 не доказывает поведение на
  патченном 5.2, и патчи Wube не воспроизводимы локально вообще. Поэтому
  загрузка мода в игре остаётся обязательным пунктом DoD вида `proof` —
  линт диалекта её не заменяет.

  ## Фикстуры, похожие на секреты

  Тесты сканера секретов нуждаются в строках, которые выглядят как токены.
  Такие строки нельзя держать в файле литералами: файл версионируется, и его
  поймает `npm run check-secrets`.

  Исключение для файла в сканере **не заводим** — это была бы дыра в правиле
  `secrets`. Вместо этого фикстура хранится сломанной и собирается в рантайме
  функцией, убирающей маркер `·` (см. `tools/lib/secret-scan.test.ts`).
  Маркер ставится так, чтобы в исходнике не осталось ни совпадения с
  правилом, ни длинной строки: порог hex — 30 символов, base64 — 40.

  ## Чего не делаем

  Не гоняемся за процентом покрытия и не заводим его порог: цифра покрытия
  не отражает качество правил. Критерий — у каждого правила есть тест.

  Не тестируем точные тексты сообщений целиком — только устойчивый фрагмент
  или id правила в квадратных скобках. Иначе правка формулировки ломает
  тесты без причины.

  ## Известный пробел

  `tools/lib/check-docs-layers.ts` и `tools/lib/check-docs-context.ts`
  работают от константы `REPO_ROOT` и поэтому юнит-тестами не покрыты: их
  нельзя направить на тестовый каталог. Чтобы покрыть, нужно принимать корень
  параметром. Пробел зафиксирован задачей в цели `toolchain`; до её закрытия
  эти два модуля проверяются только фактическим прогоном
  `npm run check-docs` на самом репозитории.
