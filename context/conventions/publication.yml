key: publication
rule: |
  Всё, что уходит на мод-портал, уходит только после явного «да» владельца
  на конкретный текст и конкретное действие.

  ## Что считается публикацией

  Любой запрос, который меняет видимое на портале:

  - первая публикация мода (`init_publish` и загрузка);
  - новый релиз (`init_upload` и загрузка);
  - правка страницы (`edit_details`): описание, короткое описание, теги,
    категория, лицензия, ссылки;
  - скриншоты (`images/add`) и любые другие изменения листинга.

  ## Порядок

  1. Агент готовит всё локально: zip, README, короткое описание, теги.
  2. Показывает владельцу то, что уйдёт на портал, — тексты целиком, а не
     пересказ, и список запросов.
  3. Ждёт явного «да» именно на эту публикацию. Просьба поправить текст
     («давай учтём», «поправь описание») — разрешение править файлы, а не
     выкладывать: владелец может хотеть уточнить формулировку.
  4. Публикует и проверяет результат.

  Разрешение действует на одну публикацию. «Го публиковать» для релиза не
  распространяется на следующую правку страницы того же мода.

  ## Почему

  Портал публичный, страница мода видна сразу и кэшируется. Текст на ней —
  слова владельца перед игроками. 2026-10-25 агент выложил новое описание
  `shm-advanced-belts` на портал после просьбы лишь поправить текст, не
  показав его, — владелец зафиксировал это правилом.
