key: mod-naming
rule: |
  Все моды этого репозитория несут авторскую приписку `shm-` (от ника
  Shahimat).

  ## Где приписка обязательна

  - `info.json` → `name`: `shm-<mod-key>`, где `<mod-key>` — kebab-case,
    отражает суть мода. Пример: `shm-circuit-helper`.
  - `info.json` → `title`: человекочитаемое название **без ника** — ни
    `Shahimat`, ни `shm-` в нём нет. Мод для чужого мода называется от него:
    `Krastorio2: Superior Inserters Full Hand Switcher`. Ник в `title`
    отвергнут решением владельца 2026-10-25: игрок ищет мод по тому, что он
    делает, а автора портал и так показывает именем аккаунта.
  - `info.json` → `author`: `Shahimat`.
  - Имена прототипов, ключи локали, item/entity/recipe-группы: префикс
    `shm-`. Это защита от коллизий прототипов с чужими модами, обязательна
    независимо от имени мода.
  - Директория пакета в репозитории: `mods/shm-<mod-key>/`, имя совпадает с
    `name` из `info.json`.

  ## Форки чужих модов

  Форк — мод, повторяющий функции чужого опубликованного мода (переписанный
  с нуля или продолженный). Он **ника не несёт и в `name`**: игрок ищет его по
  исходному названию, а приписка автора выдавала бы форк за самостоятельный
  мод.

  - `name`: `<исходное name>-fork`, например `K2-fuels-fork`. Суффикс
    `-fork` — признак форка и для инструментов: `validate` по нему снимает
    требование `shm-`. Ограничения портала на `name` действуют как обычно;
    если исходное имя с суффиксом в них не влезает, сокращение согласуется
    с владельцем.
  - `title`: `<исходный title> fork`, например
    `Krastorio 2 Universal Vehicle Fuels fork`, без ника — как у всех модов.
  - `author`: `Shahimat`, как у всех модов — портал это поле всё равно не
    показывает, а в игре оно честно называет автора форка.
  - Собственные прототипы, ключи локали и группы форка префиксуются его
    `name` (`K2-fuels-fork-…`), а не `shm-`.
  - Каталог пакета: `mods/<name>/`, автор и лицензия оригинала — в README
    пакета и в entity мода.

  ## Почему именно `shm-`

  - Префикс, а не суффикс: на мод-портале имя начинается с хендла автора у
    840 модов против 116 с суффиксом (проверено по полному дампу портала
    2026-10-03). Живые примеры: `Kux-*`, `kj_*`, `Schall*`, `kry-*`, `BAL_*`.
  - Пространство свободно: ни одного мода с именем, начинающимся на `shm-`
    или `shm_`, на портале нет (проверено по полному дампу 2026-10-03);
    аккаунта/автора `CosmoNet` там тоже нет.
  - Соседство, о котором надо знать: автор `shm013` подписывает свои моды
    голым `shm` без разделителя (`shmlamps`, `shmfaststart`). Коллизии имён
    нет — дефис разводит префиксы, — но `shm` на портале уже не уникален как
    подпись. Поэтому дефис в префиксе обязателен.
  - Вариант `sht-` отвергнут: в английском читается как цензурированное
    ругательство, а портал международный.
  - Вариант `cosmonet-` отвергнут вместе с ником: автором на портале всё
    равно показывается имя аккаунта (`Shahimat`), две разные идентичности в
    одном моде путают.
  - `shm-` короткий (4 символа из лимита портала 49) и выводится из ника.

  ## Ограничения портала на `name`

  - Разрешены только латинские буквы, цифры, `-` и `_`.
  - Длина строго больше 3 и строго меньше 50 символов (игра допускает до 100,
    но портал откажет).
  - Имя уникально на весь портал и неизменяемо после первой публикации — его
    используют другие моды в `dependencies`.
  - Zip-файл релиза обязан называться `{name}_{version}.zip`.

  ## Когда менять

  Префикс считается неизменным с момента первой публикации любого мода на
  портале. До первой публикации — правится свободно; после — только заводом
  новых модов под новым префиксом, старые не переименовываются.
