key: spec-program
rule: |
  Работа по входящей спеке из `specs/` ведётся как **программа**: одна спека
  (один мод) — одна `context/views/program--<key>.yaml` с подцелями. Общее
  устройство программ и целей — convention `goals`; здесь только то, что
  добавляет работа по спеке: DoD, гранулярность согласования, пруфы, цикл
  ревью и восстановление контекста.

  Планирование программы по спеке — скилл `/plan-spec`, сверка заведённых
  целей с согласованным планом — `/verify-plan`, прогон ревью подцели —
  `/review`. Скиллы процедурны и ссылаются сюда; правда правил живёт здесь,
  не в них.

  ## DoD

  Поле `dod` есть у каждой подцели всегда, у программы — начиная со стадии
  `review` (стадии — convention `goals`). У программы это верхнеуровневые
  критерии приёмки мода, у подцели — критерии именно её куска работы.

  Почему у программы не сразу: приёмка мода формулируется, когда понятно, что
  получилось, а не когда мы ещё проверяем, позволяет ли движок задуманное.
  На стадиях `created`, `wip` и `blocked` `dod` программы пуст, и это норма.

  Формат пункта:

      dod:
        - id: d1
          what: логистический режим включается на любом здании с инвентарём
          kind: unit                 # unit | check | proof
          how: npm test -w shm-logistic-buildings → tests/logistic-mode.test.lua
          behavior: logistic-mode-works-on-any-building   # необязательно

  - `id` — короткий, уникален внутри файла, на него ссылаются ревью и имена
    файлов пруфов;
  - `what` — проверяемое утверждение, одна строка;
  - `kind` — вид проверки, и он же отвечает на вопрос «кто это делает»:
    - `unit` — юнит-тест (Lua-тест мода или TS-тест инструмента), см.
      convention `testing`. Делает агент, проверяется прогоном;
    - `check` — машинная проверка репозитория (`npm run check`,
      `npm run validate`, `check-docs`, `check-secrets`). Делает агент;
    - `manual` — **действие владельца**: запустить игру, посмотреть, сказать
      результат. В `how` обязательны три части, иначе пункт не заводится:
      что сделать, что должно быть видно, что сообщить. Формулировка
      «отчёт о проверке» без этих трёх частей — не пункт DoD, а пожелание;
    - `proof` — **файл от владельца** по конкретному пути в `.work/proofs/`:
      лог, скриншот, дамп. Обычно побочный продукт пункта `manual`; отдельным
      пунктом заводится, только когда артефакт нужен сам по себе.

    Если пункт требует и действия, и файла — это **один** пункт `manual`, а
    путь к файлу указывается в нём. Два пункта на одно действие владельца не
    плодим.
  - `how` — чем именно проверяется: команда, путь к тесту либо путь к файлу
    пруфа;
  - `behavior` — ссылка на `docs/behavior/<id>.yml`, если у критерия есть
    долгоживущий аналог.

  **Минимум один пункт с `kind: unit` или `kind: check` на цель.** Цель,
  которая целиком проверяется только глазами владельца, не заводится: её либо
  дробят, либо часть логики выносят в чистую функцию, которую можно
  проверить машинно.

  ## Стоимость ручного участия

  Время владельца — самый дорогой ресурс в этой работе, и `manual` его тратит.
  Поэтому ручные пункты **минимизируются и собираются в пачки**:

  - цепочка целей, каждая из которых упирается в наблюдение владельца, —
    признак плохой нарезки. Если наблюдение не блокирует следующую работу,
    оно переносится в конец;
  - несколько целей, которым нужен один и тот же прогон, закрываются **одним
    сеансом**: заводится отдельная цель «прогон и снятие результатов» с
    `manual`-пунктами, а остальные цели закрываются машинно (код написан,
    линт зелёный);
  - ориентир — не больше двух точек участия владельца на итерацию: короткая
    проверка, что оснастка вообще работает, и общий прогон в конце;
  - `manual` формулируется так, чтобы владелец не гадал: что запустить, что
    он должен увидеть и в каком виде сообщить результат.

  ## Почему DoD живёт в `views`, а не в слое `docs`

  DoD краткоживущий: он умирает вместе с целью, которая его породила.
  `docs/behavior/*.yml` — долгоживущая правда о том, как система должна себя
  вести и проверено ли это. Поэтому формулировка «сделано достаточно, чтобы
  закрыть цель» лежит в цели, а «так эта система работает всегда» — в
  behavior. Поле `behavior:` связывает их, когда связь есть; дублировать
  текст сценария в `dod` не нужно.

  ## План программы: точка согласования до файлов

  **Ни `program--<key>.yaml`, ни файлы подцелей не создаются, пока
  верхнеуровневый план не согласован владельцем.** Нарезка на цели, их `dod`,
  зависимости и порядок — решения владельца, а не агента: файлы в
  `context/views/` только фиксируют уже принятое. Агент, который сам нарезал
  и сам утвердил, лишает владельца единственной точки контроля над объёмом
  работы.

  Артефакт согласования — файл итерации: `plans/<key>/iter-NN.html`,
  нумерация с `01`.

  **План версионируется.** Он лежит в корне рядом со `specs/`, и это
  осознанный порядок чтения: спека — что хочет автор, план — как мы к этому
  идём, `context/views/` — что в работе прямо сейчас. Из этого следует два
  правила: на план распространяется convention `secrets` (репозиторий
  публичный — ни абсолютных путей с именем пользователя, ни ключей), и план
  попадает в диф, то есть ревьюер видит, что согласовывалось.

  Формат — HTML, а не markdown: план читает человек в браузере, и ему нужны
  таблицы, которые не разъезжаются, и схема порядка, нарисованная блоками, а
  не псевдографикой. Требования к файлу:

  - **работает офлайн**: стили внутри `<style>`, ни сети, ни внешних шрифтов,
    ни CDN. Единственный внешний файл — локальный рендерер диаграмм
    `plans/_assets/mermaid.min.js`, подключается относительным путём и
    открывается прямо с диска;
  - **машиночитаемая шапка** для верификации:
    `<meta name="plan-status" content="draft|approved">`,
    `plan-iteration`, `plan-program`, `plan-approved-at`. Та же информация
    дублируется видимым блоком вверху страницы — агент правит оба места;
  - **пункты пронумерованы и якорятся**: у каждой цели `id` вида
    `goal-3-2`, чтобы `plan_item` в файле подцели указывал на конкретный
    пункт;
  - **схемы рисуются на Mermaid**, не псевдографикой и не вёрсткой из div:
    исходник лежит в `<pre class="mermaid">`, рендерер превращает его в SVG
    при открытии. Рендерера нет — схема читается как исходник Mermaid, и
    остальной план от этого не страдает. Нет файла рендерера (каталог
    почистили, другая машина) — забрать одной командой:

        curl -fsSL https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js \
          -o plans/_assets/mermaid.min.js

    Почему локальная копия, а не CDN: план должен открываться без сети. Сам
    бандл в git не идёт — `plans/_assets/` закрыт `.gitignore`, иначе в
    публичном репозитории лежало бы 3,4 МБ чужого минифицированного кода;
  - без интерактива: ни сворачивания, ни вкладок. Прокрутка сверху вниз —
    единственный способ чтения.

  Вердикты верификации остаются markdown (`iter-NN--verify-MM.md`): их читает
  в первую очередь агент, и короткий текстовый файл там уместнее.

  ### Планирование итеративное, а не водопадом

  План **не покрывает мод целиком**. Он покрывает горизонт — отрезок до
  ближайшей **мажорной** точки знания. За горизонтом вместо целей идут вехи
  одной строкой, без `dod` и без файлов.

  Мажорная неизвестность — та, ответ на которую меняет подход: состав целей,
  архитектуру, способ проверки. Переигрывать её дорого, планировать поверх
  неё — гадать. Минорная — та, что правится локально и подход не ломает:
  значение по умолчанию, формат строки состояния, имя команды, выбор между
  двумя равнозначными реализациями. Минорная неизвестность горизонт **не**
  закрывает: планируем дальше, записав принятое допущение в плане явной
  строкой, чтобы потом было видно, что именно меняем.

  Проверка одна: «если ответ окажется обратным, мы правим цель или переписываем
  программу?». Переписываем — мажорная, горизонт здесь.

  Первая итерация любой программы обычно кончается там, где закрыты мажорные
  допущения о движке (PoC-цели) и их выводы перенесены в слой `engine`
  (convention `engine-facts`). Планировать ядро и интерфейс до того, как
  проверена механика, значит нарезать работу по догадкам.

  Итерация закрыта → по тому же кругу согласуется `iter-NN+1` с новым набором
  целей. Решённые цели предыдущей итерации к этому моменту удалены по общему
  жизненному циклу, и остаток файлов в `context/views/` и есть остаток работы.

  ### Состав файла итерации

  - **заголовок** — единственная видимая шапка:
    `<program-key>-<NN> - [ТЕГ] <название программы>`, например
    `logistic-buildings-01 - [PoC] Логистические здания`. Теги: `PoC` —
    механика ещё неизвестна, `MVP` — механика понятна и пишется, `feat` —
    новые возможности выпущенного мода, `fix` — исправления в нём.
    Подзаголовка нет;
  - **служебное — только в `<meta>`**: спека, программа, номер итерации,
    статус, дата согласования. На странице их не рисуем: до согласования
    статус до согласования всегда один и тот же, а после согласования его
    держит `stage` программы;
  - **цель итерации** — один короткий абзац сразу под заголовком: что
    конкретно делаем и чтобы что. Без объяснений, почему горизонт выбран так,
    и без пересказа процесса: владелец его знает, он его и утверждал;
  - **допущения** — только относящиеся к работе этой итерации, без вводных
    фраз. Нечего писать — раздела нет;
  - **критерии приёмки мода** в план попадают только тогда, когда итерация
    выводит программу в стадию `review`. В PoC- и промежуточных итерациях их
    нет: приёмка мода, написанная до проверки механики, — выдумка;
  - **схема порядка** — сразу после вводного абзаца, до разбора целей: она
    верхнеуровневая и отвечает на первый вопрос читателя «что за чем». Узлы
    кликабельны и ведут к описанию цели. Подписывать словами то, что видно на
    схеме, не нужно;
  - **разбиение по goals** — цели, закрываемые внутри горизонта. Это те самые
    подцели программы, просто в плане у них ещё нет ключей и файлов: пункт
    плана `§1.2` после согласования становится `goal--<key>.yaml`, один к
    одному. По каждой: короткое название, цель одним-двумя предложениями,
    границы (что входит и что сознательно не входит), критерии приёмки
    таблицей. Зависимости в карточке не дублируются — они на схеме;
  - **критерии в плане нумеруются по порядку** (1, 2, 3), колонка называется
    «№». В файле цели те же пункты получают `id` вида `d1`, `d2` — это
    служебное и владельцу не показывается;
  - **за горизонтом** — крупные вехи одной строкой, без `dod`: владелец видит
    путь целиком, но не принимает решений о том, чего мы ещё не знаем. Веха —
    это строка текста в плане, и только: ни файла, ни ключа, ни `dod`, ни
    задач. Станет целью — когда попадёт в горизонт следующей итерации;
  - **что требует владельца** — пруфы, решения, доступы;
  - **открытые вопросы** — на момент `approved` раздел пуст.

  ### Как план написан

  План читает человек, а не агент:

  - **без ссылок на разделы спеки и на внутренние ключи.** Нужное пояснение
    пишется прямо в плане своими словами. Владелец не должен открывать ТЗ,
    чтобы понять строку плана; если ему понадобится первоисточник — он
    спросит в диалоге;
  - **заголовок цели — короткое человеческое название**: «загрузка машин и
    выходные слоты», «режим на производящих машинах». Технические ключи целей
    (`goal--<key>.yaml`) агент назначает сам при заведении файлов, в плане их
    нет;
  - **соответствие план ↔ файл** фиксируется при заведении: у каждой подцели
    поле `plan_item: "iter-NN §2.3"`. По нему верификация сверяет файлы с
    планом, несмотря на отсутствие ключей в самом плане;
  - таблицы и списки вместо простыней; план — основание для решения об
    объёме, а не копия будущих YAML;
  - **без воды** — по общему правилу из `context/workflow.md`, раздел «Чего
    не пишем владельцу»: ни пересказа процесса, ни легенд к таблицам, ни
    подписей, повторяющих схему, ни оправданий уже принятого. Если абзац
    можно убрать и ничего не потерять — убирается;
  - **цель — мотивация в одну фразу**, подробности идут в «что делаем».
    Формулировка цели не обещает больше, чем закрывают критерии: если цель
    говорит «выяснить», а приёмка проверяет написанный код, цель
    переформулируется под то, что реально сдаётся.

  ### Гранулярность PoC-целей

  Одна PoC-цель — **один связный блок механики**, который проверяется своим
  набором модулей прототипа и своим отчётом: инвентари машин, сундуки в сети,
  точки запроса, призраки запроса, особые здания, интерфейс. «Проверить все
  допущения спеки» целью не бывает: такой отчёт нечем принять, и половина
  работы в нём невидима до самого конца.

  Прототип при этом остаётся один на программу (раздел «PoC»): подцели делят его
  модули, а не плодят пакеты. Модуль прототипа — просто файл `checks/<тема>.lua`
  внутри пакета прототипа, единица кода, а не единица планирования: подцель может
  принести один такой файл, может три.

  Перенос подтверждённого в слой `engine` — обязательный пункт `dod`
  **внутри итерации**, не «когда-нибудь потом». Где именно он стоит, зависит
  от того, в какой цели получен результат: цель сама отвечает на свой вопрос
  (прогон внутри неё) — её пункт; наблюдения собраны в одну точку ради
  экономии времени владельца (раздел «Стоимость ручного участия») — пункт той
  цели, где результат наконец получен.

  Чего не бывает: итерация закрыта, а знание осталось в `.work/` и `poc/` —
  они чистятся вместе с программой и унесут его с собой.

  ### Круг согласования

  Черновик → владелец правит и комментирует → агент дорабатывает → владелец
  говорит «согласовано». Только после явного «да» агент ставит
  `status: approved` и дату. Сам себе согласование агент не выписывает, и
  молчание согласием не считается.

  **Любое сообщение, которым агент отдаёт план — первый черновик, доработку
  после замечаний, перегенерацию — заканчивается командой открытия
  последней строкой:**

      open plans/<key>/iter-NN.html

  Путь в тексте сообщения этого не заменяет: его надо собирать глазами и
  набирать руками.

  **Вердикт верификации так не предлагается.** Это агентский артефакт: его
  находки агент закрывает сам, а владельцу в отчёте идут три-пять строк —
  статус и суть расхождения. Команда открытия для него не пишется, пока
  владелец не попросит сам.

  Правка уже согласованной итерации (новая цель, новый или снятый пункт
  `dod`, смена зависимостей) идёт тем же кругом: сначала план и новое
  «согласовано», потом файлы. Уточнение формулировки внутри согласованного
  пункта повторного круга не требует.

  ## Верификация плана

  После создания `program--<key>.yaml` и файлов подцелей их формально
  сверяет с планом **отдельный контекст** — тот, что не участвовал в
  планировании. Два пути запуска, процедура одна (скилл `/verify-plan`):

  - автоматически, подагентом, последним шагом скилла `/plan-spec`;
  - руками, скиллом `/verify-plan` в свежей сессии — для повторных прогонов
    после починки находок.

  Что проверяется:

  1. состав целей совпадает с целями **текущей итерации** плана — лишних
     целей нет, пропущенных нет, вехи «за горизонтом» в файлы не просочились;
  2. `dod` каждой цели соответствует согласованному: пункты не добавлены, не
     потеряны и не переформулированы в другой критерий; у каждой цели есть
     `plan_item` и он указывает на существующий пункт плана;
  3. `dod` программы не выходит за рамки согласованных критериев приёмки;
  4. горизонт закрыт: цели итерации доводят работу ровно до заявленного в
     шапке плана состояния — ни меньше, ни «заодно ещё вот это». Полнота
     `dod` программы на итерации не требуется: мод целиком закрывается за
     несколько итераций;
  5. зависимости, порядок и приоритеты соответствуют плану;
  6. формальные правила соблюдены — `goals`, `goal-consistency`,
     требование машинного пункта у подцели, зелёные `npm run check-docs` и
     `npm run check-secrets`.

  Вердикт — файл `.work/plan-review/<key>/iter-NN--verify-MM.md`, нумерация `MM` с
  `01` внутри итерации, статус `approved` либо `changes-requested`, разбор по
  шести пунктам выше и список расхождений с планом. Верификатор файлы не правит: чинит исполнитель и
  перезапускает прогон. **Пока вердикт не `approved`, подцели в работу не
  берутся.**

  ## Гранулярность работы и согласования

  Подцель программы выполняется **целиком, одним крупным обновлением**.
  Порядок работы внутри подцели прежний (`docs` → `fix` → `refactor` →
  `feat`): правило атомарности сохраняет смысл как дисциплина мышления —
  «заодно поправлю ещё вот это» по-прежнему означает отдельную задачу.
  Меняется только гранулярность согласования: точка согласования одна, на
  всю подцель, а не после каждой фазы. Отклонение от контракта зафиксировано
  в `context/project.yml` → `deviations_from_contract`, область — подцели
  программ из `specs/`.

  Ревью запускается **строго после того, как все фазы подцели пройдены, и
  строго после того, как изменения застейжены** (`git add`). Незастейженная
  работа ревью не подлежит: ревьюер смотрит `git diff --cached`, и всё, что
  осталось в рабочем дереве, для него не существует.

  ## Где что лежит

  Версионируется, виден в дифе:

      plans/<program-key>/iter-NN.html            план итерации
      plans/_assets/mermaid.min.js                рендерер схем, в git не идёт
                                                  (`.gitignore` → `plans/_assets/`)

  Вне git, рабочее пространство:

      .work/plan-review/<program-key>/iter-NN--verify-MM.md   верификация плана
      .work/proofs/<program-key>/<goal-key>/                  пруфы владельца
      .work/review/<goal-key>/round-NN.md                     раунды ревью

  Каталог целиком вне git (`.gitignore` → `.work/`), сокрытие дополнительно
  подтверждается `check-secrets` через `git check-ignore`. Это сознательно:
  в пруфы попадают скриншоты, логи игры и пути с именем пользователя, а
  репозиторий публичный — convention `secrets`.

  Срок жизни разный:

  - `.work/review/<goal-key>/` живёт до закрытия **подцели**;
  - `.work/proofs/<program-key>/` живёт до закрытия **программы** — пруфы
    могут понадобиться соседней подцели, пока программа не закончена;
  - `.work/plan-review/<program-key>/` живёт до закрытия **итерации**:
    вердикты — рабочий диалог исполнителя с верификатором, как раунды ревью.

  План в `plans/` под это правило не попадает: он версионируется и остаётся
  в репозитории как история — что согласовывалось на каждом горизонте и в
  каком порядке шла работа. Пока итерация идёт, план ещё и самое наглядное её
  описание: что за чем, что закрыто, что осталось — в одном файле, а не
  россыпью `goal--*.yaml`.

  Очистка — операция необратимая, выполняется только по явному «да»
  владельца в момент закрытия цели или программы, не автоматом.

  **Перед очисткой — перенос выводов.** Всё, что имеет ценность дольше
  цели, уходит в слои: найденный дефект правила → тест-регрессия, устойчивая
  договорённость → convention, подтверждённое поведение → `verified` в
  behavior, выясненная особенность игры → namespace `engine` по convention
  `engine-facts`, крупное решение → строка в `CHANGELOG.md`. Удалённый раунд
  ревью не восстановить, его содержимое в git не попадает.

  ## Пруфы

  Пруфы перечисляются в `dod` **заранее**, с конкретным путём файла, который
  владелец должен положить. Агент пруфы не выдумывает и не подменяет
  рассуждением: нет файла — пункт DoD в состоянии `fail`, а не
  «не проверяемо». Имя файла начинается с `id` пункта DoD, чтобы соответствие
  было однозначным: `d2-factorio-log.txt`.

  ## PoC: проверка допущений до реализации

  Спека может держаться на допущениях об игровом API, которые по документации
  не проверяются. Тогда первая итерация программы — PoC: мод-прототип, который эти
  допущения проверяет в живой игре, и отчёт по каждому. Целей в итерации
  несколько — по блокам механики, см. «Гранулярность PoC-целей».

  Перед нарезкой PoC читается namespace `engine`: допущение, уже
  подтверждённое на целевой мажорной версии игры, в прототип не идёт
  (`engine-facts`). Подтверждённое прототипом, наоборот, уезжает туда же —
  обязательным пунктом `dod` внутри итерации; где именно он стоит, см.
  «Гранулярность PoC-целей».

  Прототип живёт в `poc/<mod-name>/`, **не** в `mods/`:

      poc/shm-logistic-probe/
        info.json
        control.lua          точка входа, запуск проверок командой
        checks/<тема>.lua    одно допущение — один модуль
        README.md            какой пункт спеки чем проверяется

  Почему отдельный каталог: `listModDirs()` смотрит только в `mods/`, поэтому
  `validate`, `pack` и `check:mod` прототип не видят. Ему не нужны `LICENSE`,
  `changelog.txt` и `thumbnail.png`, и опубликовать его случайно нельзя.

  Один прототип на программу, а не каталог на допущение: игра грузит мод целиком, и
  дробление означало бы переключать моды в игре на каждую проверку. Приставка
  `shm-` сохраняется и здесь — прототип не публикуется, но его прототипы живут в
  общем пространстве имён игры, и коллизия с чужим модом сломала бы саму
  проверку.

  **Код прототипа версионируется**, в отличие от `.work/`. Причина: ревьюер судит о
  пункте DoD по `git diff --cached`, и без кода прототипа утверждение «допущение
  подтверждено» держалось бы на одном пруфе, который нельзя перепроверить.

  Проверки прототипа:

  - диалект Lua — `npm run check-lua -- poc/<mod-name>` (в `npm run validate`
    он не попадает, тот ходит только по `mods/`);
  - юнит-тесты чистой логики, если она в прототипе появилась —
    `node tools/lua-test.ts ./poc/<mod-name>`.

  **Срок жизни — до закрытия программы**, как у пруфов. Выводы к этому моменту
  уже перенесены в слои: подтверждённое допущение становится фактом в
  `docs/entities/*.yml`, требование к поведению — сценарием в
  `docs/behavior/*.yml`. Мёртвый код прототипа после этого только вводит в
  заблуждение следующий контекст. Удаление необратимо и делается по явному
  «да» владельца.

  ## Цикл ревью

  Ревьюер работает **в свежей сессии**: независимый контекст — смысл роли,
  иначе ревью наследует решения исполнителя. Запуск — `/review` без
  аргументов, цель ревьюер определяет сам по застейженному дифу,
  содержимому `.work/review/` и program-файлу.

  Раунд — файл `.work/review/<goal-key>/round-NN.md`, нумерация с `01`:

  - статус раунда: `approved` либо `changes-requested`;
  - по каждому пункту `dod` — `pass` / `fail` / `not-verifiable` с причиной;
  - блокирующие и неблокирующие замечания отдельными списками;
  - ответ исполнителя дописывается секцией в **тот же** файл, чтобы весь
    диалог раунда читался в одном месте.

  Ревьюер код не правит: он пишет вердикт и запускает проверки. Правки
  вносит исполнитель, после чего стейджит заново и раунд повторяется с
  номером `+1`. Подцель закрывается при статусе `approved`, причём
  неблокирующие замечания последнего раунда либо закрыты, либо осознанно
  переведены в задачи — молча не теряются.

  ## Вход в работу: как новый контекст понимает, что делать

  Состояние **выводится**, а не хранится отдельным полем: производное
  состояние не врёт и не требует синхронной правки. Алгоритм:

  0. Смотрим `plans/<key>/` — последнюю итерацию. Она в `draft` — работа
     в стадии согласования плана, целей не заводить. Она `approved`, а
     последний `iter-NN--verify-MM.md` в статусе `changes-requested` —
     сначала закрыть его находки. Целей итерации в `context/views/` не
     осталось вовсе — итерация пройдена, пора согласовывать следующую.
     Согласованный план итерации — быстрый ответ на «что дальше» и «где мы»:
     он живёт всю итерацию, и смотреть его дешевле, чем собирать картину из
     файлов целей. Правда при расхождении всё равно в `context/views/`: план
     фиксирует договорённость, цели — текущее состояние.
  1. `context/views/goals.yaml` — найти программу и её `subgoals`; порядок
     записи = приоритет.
  2. Верхняя подцель, у которой нет незакрытых `depends_on` и пустая секция
     `blocker`, — следующая в работу. Несколько таких подцелей без
     пересечения по файлам можно вести параллельно.
  3. Есть `.work/review/<goal-key>/` с последним раундом в статусе
     `changes-requested` — работа не новая: сначала закрыть замечания этого
     раунда.
  4. Непустой `git diff --cached` — подцель уже застейжена и ждёт ревью, а
     не доработки.
  5. `.work/proofs/<program-key>/<goal-key>/` показывает, какие пруфы уже
     сняты, а какие ещё ждут владельца.

  Решённая подцель по общему жизненному циклу из convention `goals`
  удаляется, поэтому остаток файлов подцелей и есть остаток работы по
  программе. Отдельного журнала прогресса не ведём: история — в git log.
