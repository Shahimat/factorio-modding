key: spec-program
summary: "Работа по спеке из specs/ ведётся программой в goals/: согласованный план итерации в plans/, PoC-прототип в poc/, пруфы и ревью в .work/."
rule: |
  Работа по входящей спеке из `specs/` ведётся как **программа**: одна спека
  (один мод) — одна `goals/program--<key>.expect.ts`, цели —
  `goals/<goal>.expect.ts`, работа внутри цели — тикеты
  `describe('ticket: …')`. Протоколы работы — skill `workflow`; планирование
  программы по спеке — скилл `/plan-spec`, сверка заведённых целей с планом —
  `/verify-plan`, ревью закрытой подцели — `/review`.

  ## Критерии тикета

  Критерий приёмки — пункт `crit` / `warn` внутри тикета; план на будущее —
  `crit.todo` / `it.todo`. Формулировка критерия — проверяемое утверждение
  одной строкой с указанием, чем проверяется:

  - машинная проверка — команда прямо в критерии: `npm run check-lua -- …`,
    `npm run test:ingame`, `npm run check-docs`;
  - действие владельца — что сделать, что должно быть видно, что сообщить и
    куда положить пруф. Формулировка «отчёт о проверке» без этих трёх частей —
    не критерий, а пожелание.

  **Минимум один машинный критерий на цель.** Цель, которая целиком
  проверяется только глазами владельца, не заводится: её либо дробят, либо
  часть логики выносят в чистую функцию, которую можно проверить машинно.

  **Стоимость ручного участия.** Время владельца — самый дорогой ресурс.
  Цепочка целей, каждая из которых упирается в наблюдение владельца, —
  признак плохой нарезки; наблюдения собираются в один сеанс в конце.
  Ориентир — не больше двух точек участия владельца на итерацию.

  Краткоживущее — в `goals/`: критерии умирают вместе с целью. Долгоживущее —
  в `docs/behavior/*.yml`: как система работает всегда и проверено ли. Связь
  критерия с behavior — ссылка в комментарии тикета, дублировать сценарий не
  нужно.

  ## План программы: точка согласования до файлов

  **Ни `goals/program--<key>.expect.ts`, ни файлы целей не создаются, пока
  верхнеуровневый план не согласован владельцем.** Нарезка на цели, их
  критерии, зависимости и порядок — решения владельца, а не агента: файлы в
  `goals/` только фиксируют уже принятое. Агент, который сам нарезал и сам
  утвердил, лишает владельца единственной точки контроля над объёмом работы.

  Артефакт согласования — файл итерации: `plans/<key>/iter-NN.html`,
  нумерация с `01`.

  **План версионируется.** Он лежит в корне рядом со `specs/`, и это
  осознанный порядок чтения: спека — что хочет автор, план — как мы к этому
  идём, `goals/` — что в работе прямо сейчас. На план распространяется
  convention `secrets`, и план попадает в диф — ревьюер видит, что
  согласовывалось.

  Формат — HTML, а не markdown: план читает человек в браузере. Требования к
  файлу:

  - **работает офлайн**: стили внутри `<style>`, ни сети, ни CDN.
    Единственный внешний файл — локальный рендерер диаграмм
    `plans/_assets/mermaid.min.js`, подключается относительным путём;
    рендерера нет — забрать:
      curl -fsSL https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js \
        -o plans/_assets/mermaid.min.js
    Бандл в git не идёт — `plans/_assets/` закрыт `.gitignore`;
  - **машиночитаемая шапка**: `<meta name="plan-status" content="draft|approved">`,
    `plan-iteration`, `plan-program`, `plan-approved-at`; та же информация —
    видимым блоком вверху страницы;
  - **пункты пронумерованы и якорятся**: `id` вида `goal-3-2`, чтобы
    `plan_item` в комментарии цели указывал на пункт;
  - **схемы на Mermaid**, исходник в `<pre class="mermaid">`; без рендерера
    схема читается как исходник;
  - без интерактива: ни сворачивания, ни вкладок.

  Вердикты верификации остаются markdown
  (`iter-NN--verify-MM.md`) — их читает агент.

  ### Планирование итеративное, а не водопадом

  План **не покрывает мод целиком** — только горизонт до ближайшей
  **мажорной** неизвестности; за горизонтом вехи одной строкой, без файлов.
  Мажорная неизвестность — та, ответ на которую меняет состав целей,
  архитектуру или способ проверки. Минорная правится локально и подход не
  ломает — она фиксируется допущением в плане и планирование продолжается.
  Проверка одна: «если ответ окажется обратным, мы правим цель или
  переписываем программу?». Переписываем — мажорная, горизонт здесь.

  Первая итерация обычно кончается там, где закрыты мажорные допущения о
  движке (PoC-цели) и их выводы перенесены в слой `engine` (convention
  `engine-facts`). Планировать ядро до проверки механики — нарезать работу
  по догадкам. Итерация закрыта → по тому же кругу согласуется `iter-NN+1`.

  ### Состав файла итерации

  - **заголовок** — единственная видимая шапка:
    `<program-key>-<NN> - [ТЕГ] <название>`. Теги: `PoC` — механика ещё
    неизвестна, `MVP` — механика понятна и пишется, `feat` — новые
    возможности выпущенного мода, `fix` — исправления в нём;
  - **служебное — только в `<meta>`**: спека, программа, номер итерации,
    статус, дата согласования;
  - **цель итерации** — один короткий абзац: что делаем и чтобы что;
  - **допущения** — только относящиеся к этой итерации; нечего писать —
    раздела нет;
  - **критерии приёмки мода** — только в итерации, выводящей программу на
    ревью; в PoC-итерациях их нет;
  - **схема порядка** — сразу после вводного абзаца, узлы ведут к целям;
  - **разбиение по целям** — короткое название, цель одним-двумя
    предложениями, границы, критерии приёмки таблицей с нумерацией «№»;
    зависимости — на схеме, в карточке не дублируются;
  - **за горизонтом** — вехи одной строкой, без файлов и критериев;
  - **что требует владельца** — пруфы, решения, доступы;
  - **открытые вопросы** — на момент `approved` раздел пуст.

  ### Как план написан

  План читает человек, а не агент:

  - **без ссылок на разделы спеки и внутренние ключи** — нужное пояснение
    пишется прямо в плане своими словами;
  - **заголовок цели — короткое человеческое название**; ключи
    `goals/<goal>.expect.ts` агент назначает при заведении файлов;
  - соответствие план ↔ файл фиксируется при заведении: в комментарии цели —
    `plan_item: iter-NN §2.3`;
  - таблицы и списки вместо простыней; **без воды** — ни пересказа процесса,
    ни легенд к таблицам, ни оправданий принятого;
  - **цель — мотивация в одну фразу**; формулировка не обещает больше, чем
    закрывают критерии.

  ### Гранулярность PoC-целей

  Одна PoC-цель — **один связный блок механики**, проверяемый своим набором
  модулей прототипа и своим отчётом. «Проверить все допущения спеки» целью
  не бывает. Прототип при этом один на программу: цели делят его модули
  (`checks/<тема>.lua`), а не плодят пакеты.

  Перенос подтверждённого в слой `engine` — обязательный критерий **внутри
  итерации**, не «когда-нибудь потом»: цель сама отвечает на свой вопрос —
  её критерий; наблюдения собраны в один сеанс — критерий той цели, где
  результат получен.

  Чего не бывает: итерация закрыта, а знание осталось в `.work/` и `poc/` —
  они чистятся вместе с программой и унесут его с собой.

  ### Круг согласования

  Черновик → владелец правит и комментирует → агент дорабатывает → владелец
  говорит «согласовано». Только после явного «да» агент ставит
  `status: approved` и дату. Сам себе согласование агент не выписывает, и
  молчание согласием не считается.

  **Любое сообщение, которым агент отдаёт план, заканчивается командой
  открытия последней строкой:**

      open plans/<key>/iter-NN.html

  Вердикт верификации так не отдаётся: это агентский артефакт, владельцу
  идут три-пять строк — статус и суть расхождения.

  Правка уже согласованной итерации (новая цель, новый или снятый критерий,
  смена зависимостей) идёт тем же кругом: сначала план и новое «согласовано»,
  потом файлы. Уточнение формулировки внутри согласованного пункта
  повторного круга не требует.

  ## Верификация плана

  После создания файлов программы и целей их формально сверяет с планом
  **отдельный контекст** — тот, что не участвовал в планировании. Два пути
  запуска, процедура одна (скилл `/verify-plan`): автоматически подагентом
  последним шагом `/plan-spec`, руками — в свежей сессии.

  Что проверяется:

  1. состав целей совпадает с целями **текущей итерации** плана — лишних
     нет, пропущенных нет, вехи «за горизонтом» в файлы не просочились;
  2. критерии каждой цели соответствуют согласованным: не добавлены, не
     потеряны, не переформулированы в другой критерий; у каждой цели есть
     `plan_item` и он указывает на существующий пункт плана;
  3. горизонт закрыт: цели итерации доводят работу ровно до заявленного в
     шапке плана состояния;
  4. зависимости и порядок соответствуют плану;
  5. формальные правила соблюдены — зелёные `npm run check-docs`,
     `npm run check-secrets`, `oc3 goals status` показывает ожидаемое.

  Вердикт — `.work/plan-review/<key>/iter-NN--verify-MM.md`, статус
  `approved` либо `changes-requested`, разбор по пунктам. Верификатор файлы
  не правит: чинит исполнитель и перезапускает прогон. **Пока вердикт не
  `approved`, цели в работу не берутся.**

  ## Гранулярность работы и согласования

  Цель выполняется **целиком, одним крупным обновлением**. Порядок работы
  внутри цели прежний (`docs` → `fix` → `refactor` → `feat`) — как
  дисциплина мышления; точка согласования одна, на всю цель. Область
  правила — цели программ, выросших из `specs/`; на остальную работу
  действует фазовый протокол skill `workflow`.

  Ревью запускается **строго после того, как все фазы цели пройдены, и
  строго после того, как изменения застейжены** (`git add`).

  ## Где что лежит

  Версионируется, виден в дифе:

      goals/*.expect.ts                     цели и программы
      plans/<program-key>/iter-NN.html      план итерации
      plans/_assets/mermaid.min.js          рендерер схем, в git не идёт

  Вне git, рабочее пространство:

      .ops/<ticket>/                        артефакты ролей контракта v3
      .work/plan-review/<program-key>/      верификация плана
      .work/proofs/<program-key>/<goal>/    пруфы владельца
      .work/review/<goal-key>/              раунды ревью
      .work/ingame-stand/                   рабочий каталог стенда тестов

  Каталог `.work/` целиком вне git (`.gitignore`), сокрытие подтверждается
  `check-secrets` через `git check-ignore`: в пруфы попадают скриншоты, логи
  игры и пути с именем пользователя, а репозиторий публичный — convention
  `secrets`. `.ops/operator/` и `.ops/locks/` — локальное состояние
  контракта, тоже вне git.

  Срок жизни:

  - `.work/review/<goal-key>/` — до закрытия цели;
  - `.work/proofs/<program-key>/` — до закрытия программы;
  - `.work/plan-review/<program-key>/` — до закрытия итерации;
  - `.work/ingame-stand/` — кэш: моды стенда, сейвы, `config.ini` и
    `player-data.json` с кредами портала. Удаляется в любой момент,
    восстанавливается `npm run test:ingame`. Именно из-за кредов он под
    `.work/`, а не в корне.

  План в `plans/` под это правило не попадает: он версионируется и остаётся
  как история — что согласовывалось на каждом горизонте.

  Очистка — операция необратимая, выполняется только по явному «да»
  владельца в момент закрытия цели или программы, не автоматом.

  **Перед очисткой — перенос выводов.** Всё, что имеет ценность дольше
  цели, уходит в слои: найденный дефект правила → тест-регрессия,
  устойчивая договорённость → convention, подтверждённое поведение →
  `verified` в behavior, особенность игры → namespace `engine` по
  convention `engine-facts`, крупное решение → строка в `CHANGELOG.md`.

  ## Пруфы

  Пруфы перечисляются в критериях **заранее**, с конкретным путём файла,
  который владелец должен положить. Агент пруфы не выдумывает и не подменяет
  рассуждением: нет файла — критерий не принят, а не «не проверяемо». Имя
  файла начинается с `id` пункта плана: `d2-factorio-log.txt`.

  ## PoC: проверка допущений до реализации

  Спека может держаться на допущениях об игровом API, которые по
  документации не проверяются. Тогда первая итерация программы — PoC:
  мод-прототип, проверяющий допущения в живой игре, и отчёт по каждому.

  Перед нарезкой PoC читается namespace `engine`: допущение, уже
  подтверждённое на целевой мажорной версии игры, в прототип не идёт.
  Подтверждённое прототипом — уезжает туда же обязательным критерием внутри
  итерации.

  Прототип живёт в `poc/<mod-name>/`, **не** в `mods/`:

      poc/shm-logistic-probe/
        info.json
        control.lua          точка входа, запуск проверок командой
        checks/<тема>.lua    одно допущение — один модуль
        README.md            какой пункт спеки чем проверяется

  Почему отдельный каталог: `listModDirs()` смотрит только в `mods/`,
  поэтому `validate`, `pack` и `check:mod` прототип не видят. Ему не нужны
  `LICENSE`, `changelog.txt` и `thumbnail.png`, и опубликовать его случайно
  нельзя. Приставка `shm-` сохраняется и здесь: прототипы живут в общем
  пространстве имён игры, коллизия с чужим модом сломала бы проверку.

  **Код прототипа версионируется**, в отличие от `.work/`: утверждение
  «допущение подтверждено» не должно держаться на одном пруфе, который
  нельзя перепроверить.

  Проверки прототипа:

  - диалект Lua — `npm run check-lua -- poc/<mod-name>`;
  - юнит-тесты чистой логики — `node tools/lua-test.ts ./poc/<mod-name>`.

  **Срок жизни — до закрытия программы**, как у пруфов. Выводы к этому
  моменту перенесены в слои. Мёртвый код прототипа после этого только
  вводит в заблуждение следующий контекст. Удаление необратимо и делается по
  явному «да» владельца.

  ## Цикл ревью

  Ревьюер работает **в свежей сессии**: независимый контекст — смысл роли.
  Запуск — `/review` без аргументов: цель ревьюер определяет сам по
  застейженному дифу, содержимому `.work/review/` и файлу программы.
  Кодовые тикеты вне спек-программ в контракте v3 проверяет judge — этот
  цикл для них не запускается.

  Раунд — файл `.work/review/<goal-key>/round-NN.md`, нумерация с `01`:

  - статус раунда: `approved` либо `changes-requested`;
  - по каждому критерию — `pass` / `fail` / `not-verifiable` с причиной;
  - блокирующие и неблокирующие замечания отдельными списками;
  - ответ исполнителя дописывается секцией в **тот же** файл.

  Ревьюер код не правит: он пишет вердикт и запускает проверки. Правки
  вносит исполнитель, после чего стейджит заново и раунд повторяется с
  номером `+1`. Цель закрывается при `approved`, причём неблокирующие
  замечания последнего раунда либо закрыты, либо осознанно переведены в
  задачи — молча не теряются.

  ## Вход в работу: как новый контекст понимает, что делать

  Состояние **выводится**, а не хранится отдельным полем. Алгоритм:

  0. Смотрим `plans/<key>/` — последнюю итерацию. Она в `draft` — работа
     в стадии согласования плана, целей не заводить. Она `approved`, а
     последний `iter-NN--verify-MM.md` в статусе `changes-requested` —
     сначала закрыть его находки.
  1. `oc3 goals status` — стадии целей и программ; порядок целей — порядок
     импортов в `goals/program--<key>.expect.ts`.
  2. Верхняя цель без незакрытых зависимостей — следующая в работу.
     Активный тикет один на цель; параллель — между целями.
  3. Есть `.work/review/<goal-key>/` с последним раундом в статусе
     `changes-requested` — работа не новая: сначала закрыть замечания.
  4. Непустой `git diff --cached` — цель застейжена и ждёт ревью, а не
     доработки.
  5. `.work/proofs/<program-key>/<goal>/` показывает, какие пруфы сняты, а
     какие ждут владельца.

  Решённая цель удаляется из программы и `goals/`, история — git. Отдельного
  журнала прогресса не ведём: `oc3 goals status` и git log.
