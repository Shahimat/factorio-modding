key: secrets
rule: |
  **Жёсткое правило. Репозиторий публичный. В версионируемые файлы не
  попадает ничего чувствительного и ничего приватного — никогда, ни в каком
  виде, ни «временно, потом уберу».**

  Правило сильнее удобства: если выбор между «удобно» и «не утечёт», всегда
  выигрывает второе. Нарушение не обсуждается и не откладывается на
  следующую фазу — исправляется немедленно.

  ## Что запрещено

  - API-ключи мод-портала и любые другие ключи, токены, пароли;
  - `service-token` из `player-data.json` и всё, что позволяет выдать себя
    за владельца аккаунта;
  - личные адреса e-mail, телефоны, любые персональные данные владельца и
    третьих лиц;
  - абсолютные пути с именем пользователя (`/Users/<имя>`, `/home/<имя>`) —
    в примерах используется `~` или `$HOME`;
  - приватные ключи любых форматов, содержимое `.env`, учётные данные
    реестров пакетов;
  - URL с встроенными токенами и подписанные ссылки.

  ## Что разрешено

  - публичные адреса поддержки Wube (`support@factorio.com`,
    `factorio@factorio.com`) — они опубликованы в справке Wube;
  - контрольные суммы: `sync.index_sha`, `sync.contract.synced_sha`, поля
    `integrity` в `package-lock.json`. Это хеши, а не секреты;
  - имя аккаунта `Shahimat` — публичное имя автора на мод-портале;
  - **имена** переменных окружения и полей (`FACTORIO_UPLOAD_API_KEY`,
    `service-token`) без значений.

  ## Секреты не передаются агенту

  Значения ключей и токенов агенту не сообщаются и ему не нужны. Диалог с
  агентом — тоже носитель: вставленный в чат секрет попадает в транскрипт
  сессии, то есть именно туда, от чего защищает это правило.

  Агент работает с секретами только по имени переменной. Если инструменту
  нужно значение — он читает его из окружения или из файла в рантайме, а не
  получает текстом.

  Конкретно:

  - **API-ключ мод-портала** — только `FACTORIO_UPLOAD_API_KEY` из
    `.env.local` либо Keychain. Значение агент не видит.
  - **`service-token` из `player-data.json`** — агенту не нужен вообще. Он
    требуется лишь для скачивания файлов модов с портала; мы моды пишем, а
    не скачиваем. Токен аутентифицирует владельца в мультиплеере и на
    портале — это пароль, а не идентификатор.
  - **Документация Factorio авторизации не требует.** `wiki.factorio.com`,
    `lua-api.factorio.com`, `mods.factorio.com/api/mods`,
    `factorio.com/api/latest-releases`, справка и условия Wube читаются
    анонимно. Проверено 2026-10-04: за всю сессию ни один запрос не упёрся в
    логин. Передавать токен «чтобы агент мог читать вики» не нужно.

  ## Где живут секреты

  Файл `.env.local` в корне, вне git. Шаблон без значений — `.env.example`,
  он версионируется. Подключается в оболочку:

  ```
  source .env.local
  ```

  Альтернатива для FMTK — Keychain macOS; расширение само предложит
  сохранить ключ при первом использовании.

  `.gitignore` обязан игнорировать `.env` и `.env.*`, кроме `.env.example`,
  а также `*.key`, `*.pem` и `secrets/`.

  ## Проверка

  `npm run check-secrets` (входит в `npm run check`) сканирует ровно то
  множество файлов, которое попадёт в git — `git ls-files` плюс
  неигнорируемые untracked, — и отдельно убеждается, что `.gitignore`
  действительно скрывает `.env.local`. Прогон обязателен перед любым
  действием, публикующим содержимое наружу.

  Проверка — страховка, а не разрешение. Она ловит известные образцы; новый
  вид секрета она не знает. Ответственность за правило остаётся на том, кто
  правит файлы.

  ## Если секрет всё-таки попал в файл

  1. Удалить значение из файла немедленно.
  2. Считать секрет скомпрометированным: отозвать и выпустить новый. Если
     значение попало в историю git, удаления из текущей версии
     недостаточно — история остаётся.
  3. Сообщить владельцу явно, не замалчивать.
