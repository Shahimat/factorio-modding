key: engine-facts
rule: |
  Особенности движка Factorio, выясненные прогоном в игре, живут в namespace
  `engine` и переживают мод, ради которого их выясняли.

  ## Зачем отдельный слой

  Проверка допущения стоит дорого: прототип, запущенная игра, время владельца.
  Результат такой проверки — знание не про наш мод, а про игру, и
  следующему моду он нужен ровно так же. Рабочие артефакты PoC умирают вместе
  с программой (`.work/` и `poc/` чистятся при её закрытии), поэтому
  подтверждённое знание переносится в долгосрочный слой до уборки, а не
  после.

  ## Где живёт

  - `docs/entities/engine-<тема>.yml` — факты по одной подсистеме API:
    логистическая сеть, инвентари машин, призраки запроса, стадия данных,
    интерфейс, события жизненного цикла;
  - `docs/behavior/engine-<тема>-<аспект>.yml` — то же знание в виде
    сценариев given/when/then, когда факт описывается поведением, а не
    значением. Ссылки entity ↔ behavior двусторонние, как везде.

  Тема — подсистема движка, не мод. Имя мода, из-за которого факт выяснили, в
  названия файлов не попадает.

  ## Что считается фактом

  Проверяемое утверждение **об игре**, а не о нашем моде:

  - факт: «скрипт кладёт в слот машины до полного стака, ограничение в два-три
    крафта — поведение манипулятора, а не инвентаря»;
  - не факт: «наш мод грузит партию на много крафтов» — это behavior мода, его
    место в namespace `mods`.

  Пересказ официальной документации сюда не пишем. Факт заводится, когда
  документация молчит, противоречит наблюдению или не отвечает на вопрос
  «а можно ли так».

  ## Версия игры обязательна

  У каждого факта фиксируется версия, на которой он проверен:

  - в entity — поле `checked_on` с версией игры и датой, рядом со способом
    проверки («прототип программы logistic-buildings, пункт плана 2.1»);
  - в behavior — штатная механика `verified` / `verified_at`, а в
    `verified_note` обязательны версия игры и чем проверено.

  Путь к файлу пруфа в факте не хранится: `.work/` эфемерен, а факт —
  долгосрочный. В факте остаётся суть наблюдения, достаточная, чтобы на неё
  опереться без перепроверки.

  ## Устаревание

  Смена мажорной версии игры обнуляет доверие: при переходе на дорожку 2.1
  затронутые behaviors получают `verified: false` с причиной «не
  перепроверено на 2.1». Патч-версии (2.0.77 → 2.0.78) доверие не обнуляют,
  но если наблюдение разошлось с записанным — правится факт, а не обходится
  код.

  Факт, опровергнутый новым прогоном, не удаляется молча: правится
  утверждение, в `verified_note` остаётся, что именно изменилось и с какой
  версии.

  ## Как используется

  Перед планированием PoC этот слой читается целиком по релевантным темам.
  Допущение, уже записанное фактом на целевой мажорной версии, в PoC не идёт:
  прототип проверяет только то, чего в слое нет. Это и есть вся экономия ради
  которой слой заведён.
