key: goals
rule: |
  `context/views/` — internal-очередь работы агента (аудитория: юзер + агент).
  Юзер про неё дословно как бы не знает: на вопрос о статусе — human-friendly
  отчёт. Работа живёт как **цели** и **программы**.

  ## Устройство

  - `context/views/goals.yaml` — индекс целей. Упорядоченный список;
    **порядок записи = приоритет цели** (сверху — важнее / раньше). Запись:
    `key`, `file` (`goal--<key>.yaml`), `status`, `one_liner`.
  - `context/views/goal--<key>.yaml` — одна цель. Поля:
    - `key` — совпадает с ключом в индексе;
    - `title` — человекочитаемое название;
    - `status` — `active` | `planned` | `paused` (`done` не бывает);
    - `why` — зачем цель, чью боль решает, откуда взялась;
    - `description` — детальное «что»: состав, архитектура, риски, открытые
      вопросы;
    - `tasks` — разбиение по приоритету: `blocker` / `high` / `medium` /
      `low`. Внутри секции **порядок задач = их приоритет** (сверху —
      берёмся первым). Формат задачи — одна строка:
      `суть → фаза-коммита (docs/fix/refactor/feat/...) → блокеры/зависимости`.
      Нумерации фаз (Phase A / M1 / …) нет — очередь задаёт положение в
      списке;
    - `depends_on` — список `key` других целей, от которых зависит эта.
      При добавлении зависимости — прогон `goal-consistency`;
    - `dod` — критерии приёмки цели, обязательны для подцелей программ по
      спеке. Формат, виды проверок и правило «минимум один машинный пункт» —
      convention `spec-program`. Цели вне программ могут обойтись без `dod`,
      если вся проверка выражена задачами.

  ## Статусы

  - `active` — работаем сейчас / есть незакрытые задачи в работе;
  - `planned` — согласована, но ещё не стартовала (ждёт предшественников);
  - `paused` — сознательно отложена.

  Статуса `done` нет: решённая цель в структуре не существует.

  ## Жизненный цикл

  Цель полностью решена → (1) запись в `CHANGELOG.md`, если решение подпадает
  под критерий журнала; (2) удалить `goal--<key>.yaml`; (3) вычеркнуть из
  `goals.yaml`; (4) для подцели программы — очистить её раунды ревью в
  `.work/review/<key>/`, предварительно перенеся устойчивые выводы в слои
  (`spec-program`). Очистка необратима и делается по явному «да» владельца.
  Файл цели — не журнал прогресса: отдельные закрытые задачи
  внутри живущей цели просто удаляются из секции, done-логи не копятся.
  История прогресса конкретной задачи — в git log или PR-описании, не в
  строке задачи.

  ## Программы

  Крупная инициатива с общей технологической базой и набором подцелей
  заводится как **программа**, а не одна цель.

  - `context/views/program--<key>.yaml` (`kind: program`) — поля как у цели.
    Её `tasks` — **платформенный слой**: общая для всех подцелей работа.
  - Подцель — обычный `goal--<key>.yaml` с полем `program: <key>`. Живёт
    своей жизнью. Нужна платформа — ставит у себя блокер-задачу «ждёт
    платформу программы», а не `depends_on` на отдельную подцель.
  - В `goals.yaml` программа — запись с `kind: program` и вложенным списком
    `subgoals`; **порядок подцелей = их приоритет**.
  - Подцели программ и цели вне программ — одно множество для
    `goal-consistency`.
  - Программа полностью решена → её файл и все файлы подцелей уходят по
    общему жизненному циклу, плюс очищается `.work/proofs/<key>/`.
  - Программа, выросшая из входящей спеки, подчиняется дополнительно
    convention `spec-program`: поле `dod`, одна точка согласования на
    подцель, пруфы и цикл ревью.

  ## Приоритеты задач

  - **`blocker`** — бросить всё и бежать чинить: текущая работа ставится на
    паузу, пока блокер не снят;
  - **`high`** — обязательно закрыть в ближайшие несколько дней;
  - **`medium`** — правка может подождать месяц и более;
  - **`low`** — правка может подождать год, не принципиально.

  Приоритет обязателен: задача без приоритета не заводится. Пустые секции
  остаются — делают структуру предсказуемой. Понижать / повышать приоритет
  можно сразу правкой файла; история — в git log. Порог длины строки задачи —
  ориентир ~200 символов; больше — сигнал вынести в отдельный manual / entity
  или разбить на строки.

  ## Куда попадает новая работа

  Любой согласованный план распределяется по существующим целям. Подходящей
  цели нет — предложить создать новую (не «подвесить в воздухе»). При
  создании цели и при уточнении плана существующей — обязательный прогон
  `goal-consistency`. Реализованную архитектуру («как сейчас работает») пишем
  в `docs/entities|behavior/*.yml`, conventions или manuals, не в цель: цель
  смотрит вперёд.

  ## Отчёт по статусу

  На вопрос о статусе не вываливай сырые `goal--*.yaml`: переведи в
  human-friendly формат (3–5 задач с явными ссылками на manual + пункт),
  скрой шум, добавь блок «блокеры» и одну строку «что делать первым».
