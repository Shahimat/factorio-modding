      advanced-belts-api-overrides-tiers: Другой мод перенастраивает тиры через API ShmAdvancedBelts
      batch-cycle-keeps-robots-loaded: Заказ и отгрузка идут партиями по будильнику, дроны летают полными
      building-settings-survive-blueprint-and-copy: Настройки режима переживают чертёж и штатное копирование настроек
