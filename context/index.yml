      disabled-tier-is-bridged: Выключенный тир не создаётся, а цепочка сшивается через него
      full-hand-mode-survives-blueprint-and-paste: Режим полной руки переживает чертёж и копирование настроек
      full-hand-switch-keeps-inserter-settings: Переключение режима полной руки не теряет настройки манипулятора
      full-stack-switch-keeps-loader-settings: Переключение режима полной стопки не теряет настройки лоадера
      hidden-chests-follow-building-lifecycle: Скрытые сундуки живут ровно столько, сколько здание, и ни один предмет не пропадает
      k2-fuels-burn-as-chemical: Топливо K2 горит везде, где принимается химическое топливо
      loaders-stack-and-wait-for-full-stack: Лоадеры кладут стопки на ленту и по умолчанию ждут полную стопку
      logistic-mode-available-on-any-building: Логистический режим включается на любом подходящем здании без кода под конкретный мод
      logistic-panel-reports-building-state: Панель здания объясняет, почему здание стоит, и даёт все настройки режима
      mod-loads-in-target-factorio: Мод загружается в целевой мажорной версии игры и не загружается в чужой
      mod-name-carries-author-prefix: Каждый мод несёт авторскую приписку shm- в name, форк — суффикс -fork, title без ника, и проходит ограничения портала
      mod-script-fits-tick-budget: Скрипт мода укладывается в тиковый бюджет на базе из 10 000 зданий
      orbital-cargo-held-outside-destination: Груз с назначением держится вне назначения и отдаётся на нём
      orbital-controller-fits-tick-budget: Контроллер укладывается в бюджет тика на нагрузке поздней игры
      orbital-depot-filled-from-planet: Склад наполняется с планеты ракетами по ванили, с множителем секции
      orbital-depot-serves-its-orbits: Склад раздаёт на своих орбитах, держит вне их и уступает привезённому грузу
      orbital-hub-panel-sets-purpose: Панель у окна хаба ставит назначение секции и показывает состояние предметов
      orbital-mod-off-removes-own-sections: Выключение мода снимает всё, что он поставил на хабы
      orbital-panel-collapses-to-button: Панель у окна хаба и площадки сворачивается целиком и по блокам, имеет потолок высоты, состояние помнит на игрока
      orbital-providing-flag-keeps-vanilla-meaning: Флаг «снабжать другие платформы» сохраняет ванильный смысл
      orbital-reserve-never-given: Свой запас не отдаётся ни другим платформам, ни планете
      orbital-section-purpose-from-group-tag: Назначение секции хаба задаётся меткой в имени ванильной группы, без метки — ваниль
      orbital-supply-line-syncs-participants: Линия снабжения держит у участников свои группы, правка шапки доходит до всех
      orbital-transit-into-depot: Груз для орбиты склада сдаётся на склад, и склад раздаёт его дальше
      production-follows-network-demand: Здание производит, только пока запас в сети меньше цели
      robot-capacity-override-is-name-agnostic: Переопределение вместимости дронов работает по всем прототипам и технологиям, без имён
      superior-inserters-wait-for-full-hand: Превосходные манипуляторы K2 по умолчанию ждут полную руку
      vehicles-run-on-chemical-fuel: Транспорт K2 снова ездит на ванильном топливе
    manuals:
