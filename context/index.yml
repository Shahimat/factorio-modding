# Ручная тонкая карта v2. Обновляется вместе со слоями, не генерируется ai.
paths:
  project: context/project.yml
  workflow: context/workflow.md
  handoff: context/main.md
  goals: context/views/goals.yaml
  conventions: context/conventions/
  entities: docs/entities/
  behavior: docs/behavior/
  manuals: docs/manuals/
  modules: context/modules/
modules: {}
skills:
  manuals:
    path: .agents/skills/manuals/SKILL.md
    trigger: Работа с manuals или вопрос «как сделать руками X».
  goals:
    path: .agents/skills/goals/SKILL.md
    trigger: Планирование, работа с YAML-очередью, статус или «что дальше».
  contract-setup:
    path: .agents/skills/contract-setup/SKILL.md
    trigger: Установка или миграция документации; для этого проекта — протокол v2.
  source-sync:
    path: .agents/skills/source-sync/SKILL.md
    trigger: Сверка источников, обновление контракта, подключение или отключение модулей; протокол v2.
conventions:
  consistency: "Чек-лист внутренней непротиворечивости перед сохранением сущности: машинная часть — npm run check-docs, остальное — головой."
  engine-facts: Особенности движка из живых прогонов живут в namespace engine с версией игры и переиспользуются следующими модами.
  factorio-version-track: Одна мажорная версия игры на релиз; проект поддерживает только Factorio 2.1.
  licensing: MIT на собственный код и ассеты; производные от ассетов Wube и чужих модов — по их лицензии, с оговоркой в LICENSE пакета.
  localization: Строка для игрока выходит сразу переведённой на базовый набор из 11 языков; перевод — часть фичи, а не задача «потом».
  mod-naming: Приписка shm- в name и прототипах, title без ника; форк — суффикс -fork вместо shm-; правила проверяет npm run validate.
  project-knowledge: "Существенное проектное знание — в переносимом каноне с одним владельцем каждого определения; memory не параллельный слой."
  publication: Любое видимое изменение на мод-портале — только после явного «да» владельца на показанный текст и действие.
  secrets: "Ничего чувствительного и приватного в версионируемых файлах: репозиторий публичный, утечка необратима."
  spec-intake: "specs/ — входящие ТЗ автора: имя файла авторское, сопоставление с модом по mod_key, раскладка по слоям после прочтения целиком."
  spec-program: "Работа по спеке: YAML-программа в context/views/, согласованный HTML-план, PoC в poc/, критерии и стадия в description, пруфы и ревью в .work/."
  testing: Инструменты tools/ и ui-test-engine/ покрыты node:test, логика модов — Lua-тестами своего harness; npm test входит в npm run check.
  verification: "verified меняется по семантике поведения и только по свежей проверке; перенос путей сам по себе его не сбрасывает."
namespaces:
  platform:
    description: репозиторий, npm-workspaces, инструменты сборки на TypeScript
    conventions: [consistency, secrets, testing, spec-intake, spec-program, verification, project-knowledge]
    entities:
      repo-toolchain: "npm-workspaces монорепозиторий: моды на Lua без транспиляции, инструменты сборки, валидации и публикации — TypeScript в strict-режиме."
      ui-test-engine: "UI test engine на TypeScript и Lua: нативный ввод, outer screenshots и JSON-отчёт; counter-PoC и реальная карточка Orbital Logistics."
    behaviors:
      no-secrets-in-versioned-files: В версионируемые файлы не попадает ничего чувствительного
      toolchain-builds-under-strict-ts: Инструменты собираются TypeScript в strict-режиме без ослаблений
      tools-covered-by-unit-tests: Логика покрыта юнит-тестами своего скоупа, тесты входят в проверку
      ui-test-engine-native-poc: "Counter PoC проходит только с native lifecycle, настоящим on_gui_click и видимым переходом PNG; disabled button, неполный протокол и ошибки не дают ложного PASS."
    manuals:
      setup-dev-environment: Развернуть окружение разработки мода
      test-mod-locally: Протестировать мод локально
  delivery:
    description: упаковка мода, мод-портал, релизы и публикация
    conventions: [licensing, publication, mod-naming]
    entities:
      mod-portal: "Единственный канал распространения модов: аккаунт factorio.com с купленной игрой, автор показывается именем аккаунта загрузившего."
    behaviors:
      changelog-parses-in-game: changelog.txt парсится игрой без ошибок в логе
      mod-zip-matches-portal-rules: Собранный zip соответствует требованиям портала к артефакту релиза
      release-published-via-api: Релиз уходит на портал через API двухшаговой загрузкой
    manuals:
      publish-new-mod: Опубликовать новый мод на портале
      release-mod: Выпустить новый релиз существующего мода
      setup-dev-environment: Развернуть окружение разработки мода
  mods:
    description: сами моды и их внутреннее устройство
    conventions: [localization]
    entities:
      advanced-belts: Четыре тира лент после турбо с лоадерами AAI, делителем цены в expensive, стаком и ожиданием полной стопки; тиры и API ShmAdvancedBelts настраиваются настройками мода.
      k2-fuels: "Форк K2-fuels под 2.1: категория kr-vehicle-fuel слита с chemical — транспорт ездит на ванильном топливе, топливо K2 горит в любой химической топке."
      k2-full-hand-switcher: Превосходные манипуляторы K2 по умолчанию ждут полную руку; режим переключается в окне манипулятора и клавишей SHIFT + M на каждом.
      logistic-buildings: "Логистический режим на любом здании без связки сундуков и манипуляторов: производство по спросу сети, заказ и отгрузка партиями, чтобы дроны летали полными."
      mod-package: Один мод — один каталог mods/shm-<mod-key>/, он же npm-workspace-пакет, он же содержимое zip-релиза; имя каталога совпадает с name из info.json.
      orbital-logistics: "Склады и грузы платформ поверх ванильных передач 2.1: назначение секции — метка в имени logistic group, контроллер решает и выражает решение ванильными средствами."
    behaviors:
      aai-loader-price-divided-in-expensive-mode: Делитель цены уменьшает рецепты лоадеров AAI только в режиме expensive
      aai-loaders-follow-belt-tiers: При AAI Loaders у каждого включённого тира есть свой лоадер
      aai-loaders-unlock-with-belt-technology: По флажку лоадеры AAI открываются технологиями своих лент
      advanced-belt-tiers-follow-settings: Тиры лент после турбо создаются со скоростью и дальностью из настроек
      advanced-belts-api-overrides-tiers: Другой мод перенастраивает тиры через API ShmAdvancedBelts
      batch-cycle-keeps-robots-loaded: Заказ и отгрузка идут партиями по будильнику, дроны летают полными
      building-settings-survive-blueprint-and-copy: Настройки режима переживают чертёж и штатное копирование настроек
      consumables-delivered-by-request-proxy: Топливо, патроны и семена доставляются призраком запроса, способ доставки переключается без потерь
      disabled-tier-is-bridged: Выключенный тир не создаётся, а цепочка сшивается через него
      full-hand-mode-survives-blueprint-and-paste: Режим полной руки переживает чертёж и копирование настроек
      full-hand-switch-keeps-inserter-settings: Переключение режима полной руки не теряет настройки манипулятора
      full-stack-switch-keeps-loader-settings: Переключение режима полной стопки не теряет настройки лоадера
      hidden-chests-follow-building-lifecycle: Скрытые сундуки живут ровно столько, сколько здание, и ни один предмет не пропадает
      k2-fuels-burn-as-chemical: Топливо K2 горит везде, где принимается химическое топливо
      loaders-stack-and-wait-for-full-stack: Лоадеры кладут стопки на ленту и по умолчанию ждут полную стопку
      logistic-mode-available-on-any-building: Логистический режим включается на любом подходящем здании без кода под конкретный мод
      logistic-panel-reports-building-state: Панель здания объясняет, почему здание стоит, и даёт все настройки режима
      mod-loads-in-target-factorio: Мод загружается в целевой мажорной версии игры и не загружается в чужой
      mod-name-carries-author-prefix: Каждый мод несёт авторскую приписку shm- в name, форк — суффикс -fork, title без ника, и проходит ограничения портала
      mod-script-fits-tick-budget: Скрипт мода укладывается в тиковый бюджет на базе из 10 000 зданий
      orbital-card-collapses-by-native-input: "Нативный сценарий Orbital открывает обзор, разворачивает и сворачивает реальную карточку; проверяет события, GUI-state, заголовок и исчезновение содержимого на PNG."
      orbital-cargo-held-outside-destination: Груз с назначением держится вне назначения и отдаётся на нём
      orbital-controller-fits-tick-budget: Контроллер укладывается в бюджет тика на нагрузке поздней игры
      orbital-demo-network-exchanges-with-planets: "Dev-only network создаёт пять планетарных узлов, склады и челноки; реальные отправления, приём, повторный запуск и безопасная очистка проверяются в игре."
      orbital-depot-filled-from-planet: Склад наполняется с планеты ракетами по ванили, с множителем секции
      orbital-depot-serves-its-orbits: Склад раздаёт на своих орбитах, держит вне их и уступает привезённому грузу
      orbital-hub-panel-sets-purpose: Панель у окна хаба ставит назначение секции и показывает состояние предметов
      orbital-mod-off-removes-own-sections: Выключение мода снимает всё, что он поставил на хабы
      orbital-overview-button-matches-mod-gui: "Кнопка Orbital использует общую рамку mod-gui и собственный стиль по образцу Helmod; старая кнопка переносится без дублей и повреждения соседей."
      orbital-overview-layout-stays-stable: "Обычное раскрытие меняет высоту карточки, но не положение окна, ширину viewport и колонок; лишних рамок, padding и горизонтального scroll нет."
      orbital-panel-collapses-to-button: Панель у окна хаба и площадки сворачивается целиком и по блокам, имеет потолок высоты, состояние помнит на игрока
      orbital-providing-flag-keeps-vanilla-meaning: Флаг «снабжать другие платформы» сохраняет ванильный смысл
      orbital-reserve-never-given: Свой запас не отдаётся ни другим платформам, ни планете
      orbital-route-shows-schedule-loop: "Все остановки в порядке расписания, включая повторы; на стоянке выделена планета, в пути — стрелка, возврат к первой остановке обозначен круговой стрелкой."
      orbital-section-purpose-from-group-tag: Назначение секции хаба задаётся меткой в имени ванильной группы, без метки — ваниль
      orbital-supply-line-syncs-participants: Линия снабжения держит у участников свои группы, правка шапки доходит до всех
      orbital-transit-into-depot: Груз для орбиты склада сдаётся на склад, и склад раздаёт его дальше
      production-follows-network-demand: Здание производит, только пока запас в сети меньше цели
      robot-capacity-override-is-name-agnostic: Переопределение вместимости дронов работает по всем прототипам и технологиям, без имён
      superior-inserters-wait-for-full-hand: Превосходные манипуляторы K2 по умолчанию ждут полную руку
      vehicles-run-on-chemical-fuel: Транспорт K2 снова ездит на ванильном топливе
    manuals:
      migrate-mod-to-2-1: Перевести мод на дорожку Factorio 2.1
      publish-new-mod: Опубликовать новый мод на портале
      release-mod: Выпустить новый релиз существующего мода
      run-orbital-demo: Запустить планетарную демо-сеть Orbital Logistics
      test-mod-locally: Протестировать мод локально
      test-orbital-manually: Прогнать Orbital Logistics руками перед релизом 1.0.0
  engine:
    description: особенности движка Factorio, подтверждённые прогоном в игре, переиспользуемые следующими модами
    conventions: [factorio-version-track, engine-facts]
    entities:
      engine-data-stage: "Факты о стадиях settings* и data*, выясненные при разработке shm-advanced-belts: где документация молчит или формулирует неочевидно."
      engine-ghosts: "Факты о призраках (entity-ghost) из тестов в игре: документация на эти вопросы молчит или отвечает только полем без пояснений."
      engine-inserters: Факты о манипуляторах из тестов в игре при разработке shm-k2-superior-inserters-full-hand-switcher.
      engine-loaders: Факты о лоадерах из тестов в игре при разработке shm-advanced-belts; пара к engine-inserters — механика та же, поля другие.
      engine-space-platforms: Факты о ванильной логистике платформ 2.1 — когда хаб отдаёт предмет другой платформе на орбите и когда сбрасывает на планету; выяснены прототипом к ТЗ Orbital Logistics.
      engine-ui-simulations: "Проверенные сочетания API: custom button находится native locator и получает on_gui_click; GUI simulation попадает в PNG через внешний Factoriopedia host."
specs:
  advanced-belts:
    path: specs/25102026_spec_advanced_belts.md
    mod_key: advanced-belts
    mod_name: shm-advanced-belts
    one_liner: Тиры лент и совместимые лоадеры.
  logistic-buildings:
    path: specs/03102026_spec_logistic_buildings.md
    mod_key: logistic-buildings
    mod_name: shm-logistic-buildings
    one_liner: Логистический режим зданий.
  orbital-logistics:
    path: specs/27102026_spec_orbital_logistics.md
    mod_key: orbital-logistics
    mod_name: shm-orbital-logistics
    one_liner: Склады и грузы космических платформ.
