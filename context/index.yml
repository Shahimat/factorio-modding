# Карта репозитория. Читается один раз перед задачей, чтобы точечно выбрать
# релевантные файлы вместо обхода каталогов. Обновляется в той же фазе, что
# создаёт / удаляет / переименовывает сущность.

namespaces:
  platform:
    entities:
      - id: repo-toolchain
        one_liner: монорепозиторий на npm-workspaces, Lua-исходники модов, инструменты на strict TypeScript
    behaviors:
      - id: toolchain-builds-under-strict-ts
        one_liner: инструменты компилируются TypeScript в strict-режиме без ослаблений и подавлений
      - id: no-secrets-in-versioned-files
        one_liner: в версионируемые файлы не попадает ничего чувствительного, репозиторий публичный
      - id: tools-covered-by-unit-tests
        one_liner: логика инструментов покрыта юнит-тестами, npm test входит в npm run check
    manuals:
      - id: setup-dev-environment
        one_liner: установка Factorio, каталог данных, API-ключи, Node, npm ci
      - id: setup-safety-hooks
        one_liner: hook, блокирующий запись проектных фактов в memory агента
    conventions:
      - key: spec-intake
        one_liner: правила обращения с входящими ТЗ в specs/ и их раскладки по слоям
      - key: testing
        one_liner: каждый инструмент покрыт юнит-тестами на встроенном раннере Node

  delivery:
    entities:
      - id: mod-portal
        one_liner: мод-портал как внешняя система — аккаунт, API-ключи, эндпоинты, коды ошибок, enum лицензий и категорий
    behaviors:
      - id: mod-zip-matches-portal-rules
        one_liner: имя и структура zip соответствуют требованиям портала к артефакту релиза
      - id: changelog-parses-in-game
        one_liner: changelog.txt парсится игрой без ошибок в логе
      - id: release-published-via-api
        one_liner: релиз уходит на портал двухшаговой загрузкой через публичный API
    manuals:
      - id: publish-new-mod
        one_liner: первая публикация мода — init_publish, лицензия, категория, правовые рамки
      - id: release-mod
        one_liner: новый релиз существующего мода, формат changelog.txt, правка страницы мода
    conventions:
      - key: licensing
        one_liner: MIT на своё + обязательная оговорка про ассеты Wube
      - key: factorio-version-track
        one_liner: две дорожки релизов 2.0 и 2.1, одна мажорная версия на релиз

  mods:
    entities:
      - id: mod-package
        one_liner: устройство пакета мода — состав файлов, поля info.json, зависимости, feature-флаги
      - id: logistic-buildings
        one_liner: мод shm-logistic-buildings — логистический режим на любом здании, состав, настройки, типы зданий
    behaviors:
      - id: mod-name-carries-author-prefix
        one_liner: каждый мод несёт приписку shm- и проходит ограничения портала на имя
      - id: mod-loads-in-target-factorio
        one_liner: мод грузится в целевой мажорной версии и не грузится в чужой
      - id: logistic-mode-available-on-any-building
        one_liner: режим включается на любом подходящем здании, тип определяется по свойствам прототипа
      - id: production-follows-network-demand
        one_liner: здание производит, только пока запас сети меньше цели по его продукту
      - id: batch-cycle-keeps-robots-loaded
        one_liner: заказ и отгрузка идут партиями по будильнику, с проверкой фактического состояния
      - id: consumables-delivered-by-request-proxy
        one_liner: топливо, патроны и семена возят строительные дроны по призраку запроса
      - id: hidden-chests-follow-building-lifecycle
        one_liner: скрытые сундуки живут столько же, сколько здание, предметы не пропадают
      - id: building-settings-survive-blueprint-and-copy
        one_liner: настройки режима переживают чертёж и штатное копирование настроек
      - id: logistic-panel-reports-building-state
        one_liner: панель у штатного окна объясняет простой и даёт все настройки режима
      - id: robot-capacity-override-is-name-agnostic
        one_liner: вместимость дронов переопределяется по всем прототипам и технологиям, без имён
      - id: mod-script-fits-tick-budget
        one_liner: на 10 000 зданий в режиме скрипт мода укладывается в 1 мс на тик
    manuals:
      - id: test-mod-locally
        one_liner: симлинк в каталог модов, запуск, флаги, чтение лога, изолированный профиль
      - id: migrate-mod-to-2-1
        one_liner: перевод мода на дорожку Factorio 2.1
    conventions:
      - key: mod-naming
        one_liner: префикс shm- в name, title, author и именах прототипов

base_conventions:
  - key: secrets
    one_liner: жёсткое правило — ничего чувствительного в версионируемых файлах, репозиторий публичный
  - key: consistency
    one_liner: чек-лист внутренней непротиворечивости перед сохранением сущности
  - key: openness
    one_liner: проектные факты живут в репозитории, не в memory агента и не в hooks
  - key: verification
    one_liner: механика verified / verified_at / verified_note
  - key: goals
    one_liner: устройство, статусы и жизненный цикл целей и программ
  - key: goal-consistency
    one_liner: кросс-целевая проверка непротиворечивости
  - key: spec-program
    one_liner: работа по спеке как программа — итерации плана с горизонтом, DoD, пруфы в .work/, цикл ревью и верификация плана
  - key: engine-facts
    one_liner: долгосрочный слой знаний о движке (namespace engine) — факты с версией игры, переиспользуются следующими модами

specs:
  - path: specs/03102026_spec_logistic_buildings.md
    mod_key: logistic-buildings
    mod_name: shm-logistic-buildings
    one_liner: >-
      ТЗ мода «Логистические здания»: логистический режим на любом здании,
      производство по спросу, пакетный заказ и отгрузка дронами. 546 строк,
      решения по дизайну уже приняты, причины приведены.
    note: >-
      Имя входящего файла авторское и не меняется; сопоставление с модом
      держится на `mod_key` — convention `spec-intake`. Разложено по слоям
      2026-10-04: entity `logistic-buildings`, девять behaviors namespace
      `mods`, программа `context/views/program--logistic-buildings.yaml`.

plans:
  - path: plans/logistic-buildings/iter-01.html
    program: logistic-buildings
    iteration: "01"
    tag: PoC
    status: approved
    one_liner: >-
      Итерация 01 программы «Логистические здания»: семь целей — прототип,
      стенд для тестов внутри игры, четыре блока проверок механик и сеанс со
      снятием фактов. Согласован 2026-10-04.

# Скиллы агента — процедуры, а не правила. Процедура целиком в `SKILL.md`:
# слой conventions описывает проект, а не поведение агента, и своего
# convention у скилла не бывает. По каким правилам ходит скилл — записано
# внутри него, карта этого не дублирует. Поля специально `name` / `path`, а не
# `id` / `key` — иначе `check-docs` будет искать для них файлы слоёв.
skills:
  - name: plan-spec
    path: .claude/skills/plan-spec/SKILL.md
    one_liner: разложить ТЗ по слоям, согласовать план программы с владельцем и только потом завести подцели с DoD
  - name: verify-plan
    path: .claude/skills/verify-plan/SKILL.md
    one_liner: сверить заведённые цели с согласованным планом и записать вердикт в .work/plan-review/
  - name: review
    path: .claude/skills/review/SKILL.md
    one_liner: проверить застейженную подцель против её DoD и записать раунд в .work/review/
  - name: closeout
    path: .claude/skills/closeout/SKILL.md
    one_liner: закрыть сессию без потери знания — вынос устойчивого в слои, остаток в context/main.md, зелёный check-secrets как условие завершения
  - name: startup
    path: .claude/skills/startup/SKILL.md
    one_liner: открыть сессию — разбор main.md по приоритету, быстрый локальный чек и сводка по состоянию проекта

modules: []
