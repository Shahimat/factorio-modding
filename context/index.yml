    entities:
      advanced-belts: Четыре тира лент после турбо с лоадерами AAI, делителем цены в expensive, стаком и ожиданием полной стопки; тиры и API ShmAdvancedBelts настраиваются настройками мода.
      k2-fuels: "Форк K2-fuels под 2.1: категория kr-vehicle-fuel слита с chemical — транспорт ездит на ванильном топливе, топливо K2 горит в любой химической топке."
