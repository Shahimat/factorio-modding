# Карта репозитория. Читается один раз перед задачей, чтобы точечно выбрать
# релевантные файлы вместо обхода каталогов. Обновляется в той же фазе, что
# создаёт / удаляет / переименовывает сущность.

namespaces:
  platform:
    entities:
      - id: repo-toolchain
        one_liner: монорепозиторий на npm-workspaces, Lua-исходники модов, инструменты на strict TypeScript
    behaviors:
      - id: toolchain-builds-under-strict-ts
        one_liner: инструменты компилируются TypeScript в strict-режиме без ослаблений и подавлений
      - id: no-secrets-in-versioned-files
        one_liner: в версионируемые файлы не попадает ничего чувствительного, репозиторий публичный
      - id: tools-covered-by-unit-tests
        one_liner: логика инструментов покрыта юнит-тестами, npm test входит в npm run check
    manuals:
      - id: setup-dev-environment
        one_liner: установка Factorio на macOS и Linux, каталог данных, API-ключи, Node, npm ci, первый прогон стенда
      - id: setup-safety-hooks
        one_liner: hook, блокирующий запись проектных фактов в memory агента
    conventions:
      - key: spec-intake
        one_liner: правила обращения с входящими ТЗ в specs/ и их раскладки по слоям
      - key: testing
        one_liner: каждый инструмент покрыт юнит-тестами на встроенном раннере Node

  engine:
    entities:
      - id: engine-inserters
        one_liner: манипуляторы — режим руки только в прототипе, стопки на ленте от бонуса силы, что переносит fast_replace скриптом
      - id: engine-loaders
        one_liner: лоадеры — режим полной стопки только в прототипе, что переносит fast_replace скриптом, raise_built для чужих компаньонов
      - id: engine-ghosts
        one_liner: призраки — панель у окна только с ghost_mode, достройка без on_gui_opened, ручная постройка берёт прототип предмета, что теряет замена призрака
      - id: engine-data-stage
        one_liner: стадии настроек и данных — forced_value только у булевых настроек, сохранённые значения переживают смену умолчаний, переработка в 2.1 порождается до data-updates модов
      - id: engine-space-platforms
        one_liner: платформы 2.1 — отдачу запрещает запрос с источником platforms/all, а не число запросов; флаг раздачи не влияет на сброс на планету; замок фильтром min 0; группы делят поля фильтров, но не active, переименование — переводом участников; дорогое чтение фильтров; cargo pod скриптом с хаба на хаб

  delivery:
    entities:
      - id: mod-portal
        one_liner: мод-портал как внешняя система — аккаунт, API-ключи, эндпоинты, коды ошибок, enum лицензий и категорий
    behaviors:
      - id: mod-zip-matches-portal-rules
        one_liner: имя и структура zip соответствуют требованиям портала к артефакту релиза
      - id: changelog-parses-in-game
        one_liner: changelog.txt парсится игрой без ошибок в логе
      - id: release-published-via-api
        one_liner: релиз уходит на портал двухшаговой загрузкой через публичный API
    manuals:
      - id: publish-new-mod
        one_liner: первая публикация мода — init_publish, лицензия, категория, правовые рамки
      - id: release-mod
        one_liner: новый релиз существующего мода, формат changelog.txt, правка страницы мода
    conventions:
      - key: licensing
        one_liner: MIT на своё + обязательная оговорка про ассеты Wube
      - key: factorio-version-track
        one_liner: поддерживается только Factorio 2.1, одна мажорная версия на релиз
      - key: publication
        one_liner: на мод-портал — только после явного «да» владельца на показанный текст и действие

  mods:
    entities:
      - id: mod-package
        one_liner: устройство пакета мода — состав файлов, поля info.json, зависимости, feature-флаги
      - id: logistic-buildings
        one_liner: мод shm-logistic-buildings — логистический режим на любом здании, состав, настройки, типы зданий
      - id: k2-fuels
        one_liner: мод K2-fuels-fork — форк K2-fuels, топливо K2 сливается с химическим, транспорт ездит на ванильном
      - id: k2-full-hand-switcher
        one_liner: мод shm-k2-superior-inserters-full-hand-switcher — превосходные манипуляторы K2 ждут полную руку, режим переключается на каждом
      - id: orbital-logistics
        one_liner: мод shm-orbital-logistics — склады и грузы платформ поверх ванильных передач 2.1, назначение секции меткой в имени группы, контроллер с замками и транзитом, панель хаба, линии снабжения
      - id: advanced-belts
        one_liner: мод shm-advanced-belts — четыре тира лент после турбо, лоадеры AAI к ним, делитель цены AAI, стак и полная стопка у лоадеров, API ShmAdvancedBelts
    behaviors:
      - id: mod-name-carries-author-prefix
        one_liner: каждый мод несёт приписку shm-, форк — суффикс -fork, и проходит ограничения портала на имя
      - id: mod-loads-in-target-factorio
        one_liner: мод грузится в целевой мажорной версии и не грузится в чужой
      - id: logistic-mode-available-on-any-building
        one_liner: режим включается на любом подходящем здании, тип определяется по свойствам прототипа
      - id: production-follows-network-demand
        one_liner: здание производит, только пока запас сети меньше цели по его продукту
      - id: batch-cycle-keeps-robots-loaded
        one_liner: заказ и отгрузка идут партиями по будильнику, с проверкой фактического состояния
      - id: consumables-delivered-by-request-proxy
        one_liner: топливо, патроны и семена возят строительные дроны по призраку запроса
      - id: hidden-chests-follow-building-lifecycle
        one_liner: скрытые сундуки живут столько же, сколько здание, предметы не пропадают
      - id: building-settings-survive-blueprint-and-copy
        one_liner: настройки режима переживают чертёж и штатное копирование настроек
      - id: logistic-panel-reports-building-state
        one_liner: панель у штатного окна объясняет простой и даёт все настройки режима
      - id: robot-capacity-override-is-name-agnostic
        one_liner: вместимость дронов переопределяется по всем прототипам и технологиям, без имён
      - id: mod-script-fits-tick-budget
        one_liner: на 10 000 зданий в режиме скрипт мода укладывается в 1 мс на тик
      - id: k2-fuels-burn-as-chemical
        one_liner: топливо K2 горит везде, где принимается химическое, без дублей категорий
      - id: vehicles-run-on-chemical-fuel
        one_liner: транспорт K2 и чужих модов снова ездит на ванильном топливе
      - id: superior-inserters-wait-for-full-hand
        one_liner: превосходные манипуляторы K2 по умолчанию ждут полную руку
      - id: full-hand-switch-keeps-inserter-settings
        one_liner: режим переключается панелью и SHIFT + M без потери настроек манипулятора
      - id: full-hand-mode-survives-blueprint-and-paste
        one_liner: режим полной руки переживает чертёж и копирование настроек
      - id: advanced-belt-tiers-follow-settings
        one_liner: тиры лент после турбо создаются со скоростью и дальностью из настроек
      - id: disabled-tier-is-bridged
        one_liner: выключенный тир не создаётся, рецепты, технологии и улучшения сшиваются через него
      - id: aai-loaders-follow-belt-tiers
        one_liner: при AAI Loaders у каждого включённого тира есть свой лоадер
      - id: aai-loader-price-divided-in-expensive-mode
        one_liner: делитель цены уменьшает рецепты лоадеров AAI только в режиме expensive, переработка следует за рецептом
      - id: loaders-stack-and-wait-for-full-stack
        one_liner: лоадеры любых модов кладут стопки на ленту и по умолчанию ждут полную стопку
      - id: full-stack-switch-keeps-loader-settings
        one_liner: режим полной стопки переключается панелью и SHIFT + M без потери настроек лоадера
      - id: advanced-belts-api-overrides-tiers
        one_liner: другой мод перенастраивает и выключает тиры через API ShmAdvancedBelts
      - id: aai-loaders-unlock-with-belt-technology
        one_liner: по флажку лоадеры AAI открываются технологиями своих лент, без отдельных технологий
      - id: orbital-section-purpose-from-group-tag
        one_liner: назначение секции хаба — метка в имени ванильной группы, без метки — ваниль и мод ничего не ставит
      - id: orbital-reserve-never-given
        one_liner: свой запас не отдаётся ни платформам, ни планете; при общей части со складом защита мягкая
      - id: orbital-cargo-held-outside-destination
        one_liner: груз с назначением держится вне назначения и в пути, отдаётся на нём; сбор «из всех локаций» выдаётся выключением секции
      - id: orbital-depot-serves-its-orbits
        one_liner: склад раздаёт на своих орбитах, держит вне их, не перекачивает в другой склад и уступает привезённому грузу
      - id: orbital-depot-filled-from-planet
        one_liner: склад наполняется ракетами с планеты по ванили с множителем секции
      - id: orbital-hub-panel-sets-purpose
        one_liner: панель у окна хаба ставит метку в имя группы, предупреждает про флаг раздачи и показывает замки и транзит
      - id: orbital-supply-line-syncs-participants
        one_liner: линия снабжения держит у участников свои группы и множители, правка шапки доходит до всех
      - id: orbital-controller-fits-tick-budget
        one_liner: контроллер обходит платформы порциями с кешем фильтров — ~1 мс на порцию при 40 платформах × 160 фильтров
      - id: orbital-transit-into-depot
        one_liner: груз для орбиты склада сдаётся на склад запросом с платформ на недостающее, потом склад раздаёт
      - id: orbital-providing-flag-keeps-vanilla-meaning
        one_liner: флаг «снабжать другие платформы» запрещает только отдачу платформам, мод его не трогает
      - id: orbital-mod-off-removes-own-sections
        one_liner: выключение настройки карты снимает свои секции мода и включает секции груза
    manuals:
      - id: test-mod-locally
        one_liner: симлинк в каталог модов, запуск, флаги, чтение лога, изолированный профиль
      - id: migrate-mod-to-2-1
        one_liner: перевод мода на дорожку Factorio 2.1
    conventions:
      - key: mod-naming
        one_liner: префикс shm- в name и именах прототипов, title без ника, у форков — суффикс -fork вместо shm-
      - key: localization
        one_liner: строки для игрока сразу переводятся на базовый набор из 11 языков

base_conventions:
  - key: secrets
    one_liner: жёсткое правило — ничего чувствительного в версионируемых файлах, репозиторий публичный
  - key: consistency
    one_liner: чек-лист внутренней непротиворечивости перед сохранением сущности
  - key: openness
    one_liner: проектные факты живут в репозитории, не в memory агента и не в hooks
  - key: verification
    one_liner: механика verified / verified_at / verified_note
  - key: goals
    one_liner: устройство, статусы и жизненный цикл целей и программ
  - key: goal-consistency
    one_liner: кросс-целевая проверка непротиворечивости
  - key: spec-program
    one_liner: работа по спеке как программа — итерации плана с горизонтом, DoD, пруфы в .work/, цикл ревью и верификация плана
  - key: engine-facts
    one_liner: долгосрочный слой знаний о движке (namespace engine) — факты с версией игры, переиспользуются следующими модами

specs:
  - path: specs/03102026_spec_logistic_buildings.md
    mod_key: logistic-buildings
    mod_name: shm-logistic-buildings
    one_liner: >-
      ТЗ мода «Логистические здания»: логистический режим на любом здании,
      производство по спросу, пакетный заказ и отгрузка дронами. 546 строк,
      решения по дизайну уже приняты, причины приведены.
    note: >-
      Имя входящего файла авторское и не меняется; сопоставление с модом
      держится на `mod_key` — convention `spec-intake`. Разложено по слоям
      2026-10-04: entity `logistic-buildings`, девять behaviors namespace
      `mods`, программа `context/views/program--logistic-buildings.yaml`.
  - path: specs/25102026_spec_advanced_belts.md
    mod_key: advanced-belts
    mod_name: shm-advanced-belts
    one_liner: >-
      ТЗ мода Advanced Belts: четыре тира лент после турбо, лоадеры AAI к
      ним, делитель цены AAI, стак и полная стопка у лоадеров, API для
      других модов.
    note: >-
      Подготовлено агентом по диалогу с владельцем и положено в `specs/` по
      его поручению 2026-10-25. Программа не заводилась — мод делается одним
      тикетом по решению владельца; разложено в entity `advanced-belts` и
      семь behaviors namespace `mods`.
  - path: specs/27102026_spec_orbital_logistics.md
    mod_key: orbital-logistics
    mod_name: shm-orbital-logistics
    one_liner: >-
      ТЗ мода Orbital Logistics: назначение у логистической секции хаба
      (свой запас / груз с назначением / склад), склады-прокси на орбите
      поверх ванильных передач 2.1, линии снабжения с коэффициентами.
      Упрощённое, с матрицей допущений для прототипа и сценариями K-01…K-21.
    note: >-
      Подготовлено агентом по диалогу с владельцем и положено в `specs/` по
      его поручению 2026-10-27. Программа не заводится: механизм ещё
      оттачивается, мод идёт тикетами — прототип, ядро версии 0, затем
      нагрузка, панель и линии; разложено в entity `orbital-logistics` и
      одиннадцать behaviors namespace `mods`.

plans:
  - path: plans/logistic-buildings/iter-01.html
    program: logistic-buildings
    iteration: "01"
    tag: PoC
    status: approved
    one_liner: >-
      Итерация 01 программы «Логистические здания»: семь целей — прототип,
      стенд для тестов внутри игры, четыре блока проверок механик и сеанс со
      снятием фактов. Согласован 2026-10-04.

# Скиллы агента — процедуры, а не правила. Процедура целиком в `SKILL.md`:
# слой conventions описывает проект, а не поведение агента, и своего
# convention у скилла не бывает. По каким правилам ходит скилл — записано
# внутри него, карта этого не дублирует. Поля специально `name` / `path`, а не
# `id` / `key` — иначе `check-docs` будет искать для них файлы слоёв.
skills:
  - name: plan-spec
    path: .claude/skills/plan-spec/SKILL.md
    one_liner: разложить ТЗ по слоям, согласовать план программы с владельцем и только потом завести подцели с DoD
  - name: verify-plan
    path: .claude/skills/verify-plan/SKILL.md
    one_liner: сверить заведённые цели с согласованным планом и записать вердикт в .work/plan-review/
  - name: review
    path: .claude/skills/review/SKILL.md
    one_liner: проверить застейженную подцель против её DoD и записать раунд в .work/review/
  - name: closeout
    path: .claude/skills/closeout/SKILL.md
    one_liner: закрыть сессию без потери знания — вынос устойчивого в слои, остаток в context/main.md, зелёный check-secrets как условие завершения
  - name: startup
    path: .claude/skills/startup/SKILL.md
    one_liner: открыть сессию — разбор main.md по приоритету, быстрый локальный чек и сводка по состоянию проекта

modules: []
